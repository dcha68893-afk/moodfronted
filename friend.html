<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Friends</title>
<script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script>
<style>
:root{--bg:var(--kyn-bg-root,#f7f9fc);--surface:var(--kyn-bg-panel,#fff);--input:var(--kyn-bg-input,#f1f5f9);--border:var(--kyn-border,#e2e8f0);--text:var(--kyn-text-primary,#0f172a);--muted:var(--kyn-text-muted,#64748b);--primary:var(--kyn-accent-secondary,#4f46e5);--danger:#dc2626;--success:#059669;--shadow:0 10px 35px rgba(15,23,42,.08)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial}button,input{font:inherit}.app{height:100%;max-width:1050px;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title h1{margin:0;font-size:25px}.title p{margin:4px 0 0;color:var(--muted)}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:inherit;outline:none}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}.tabs{display:flex;gap:7px;overflow:auto}.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:9px 13px;border-radius:12px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.count{font-size:11px;opacity:.8;margin-left:4px}.panel{flex:1;min-height:0;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{display:flex;align-items:center;gap:11px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow)}.avatar{width:50px;height:50px;border-radius:15px;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(135deg,#c7d2fe,#ddd6fe);color:#3730a3;font-weight:800;background-size:cover;background-position:center}.info{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle,.bio{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--border);background:var(--input);color:inherit;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.success{background:var(--success);border-color:var(--success);color:#fff}.btn.danger{color:var(--danger)}.status{padding:12px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20}.toast.show{display:block}@media(max-width:650px){.app{padding:12px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.card{padding:11px}.actions{max-width:125px}}
</style></head>
<body><main class="app">
<header class="top"><div class="title"><h1>Friends</h1><p>Find people, manage requests and stay connected.</p></div><button class="btn" id="refresh">↻ Refresh</button></header>
<form class="search" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Search by username or name…"><button class="btn primary">Search</button></form>
<nav class="tabs"><button class="tab active" data-tab="friends">Friends <span class="count" id="friendsCount"></span></button><button class="tab" data-tab="incoming">Requests <span class="count" id="incomingCount"></span></button><button class="tab" data-tab="outgoing">Sent <span class="count" id="outgoingCount"></span></button><button class="tab" data-tab="search">Search</button></nav>
<section class="panel" id="panel"><div class="status">Loading friends…</div></section>
</main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const S={tab:'friends',friends:[],incoming:[],outgoing:[],search:[],loading:false};
const $=id=>document.getElementById(id);
const base=()=>String(window.__getApiBase?.()||window.API_BASE_URL||'').replace(/\/$/,'');
const token=()=>window.__kynToken||window.__accessToken||window.AuthSessionManager?.getToken?.()||window.authToken||localStorage.getItem('authToken')||localStorage.getItem('accessToken')||localStorage.getItem('token')||'';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const h={...(opt.headers||{})},t=token();if(t)h.Authorization='Bearer '+t;if(opt.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(base()+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||`Request failed (${r.status})`);return d}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function avatar(u){const url=u?.avatar;return url?`style="background-image:url('${esc(url).replace(/'/g,'%27')}')"`:''}
function personCard(u,action='add'){const rel=u.relationship||{};let buttons='';if(action==='add'){if(rel.status==='accepted')buttons='<button class="btn success" disabled>Friends</button>';else if(rel.direction==='outgoing'&&rel.status==='pending')buttons='<button class="btn" disabled>Request sent</button>';else if(rel.direction==='incoming'&&rel.status==='pending')buttons='<button class="btn success" data-accept-user="'+u.id+'">Accept</button>';else buttons='<button class="btn primary" data-add="'+u.id+'">Add friend</button>'}return `<article class="card"><div class="avatar" ${avatar(u)}>${u.avatar?'':esc((u.displayName||u.username||'?')[0]).toUpperCase()}</div><div class="info"><div class="name">${esc(u.displayName||u.username)}</div><div class="handle">@${esc(u.username||'')}</div>${u.bio?`<div class="bio">${esc(u.bio)}</div>`:''}</div><div class="actions">${buttons}</div></article>`}
function friendCard(u){return `<article class="card"><div class="avatar" ${avatar(u)}>${u.avatar?'':esc((u.displayName||u.username||'?')[0]).toUpperCase()}</div><div class="info"><div class="name">${esc(u.displayName||u.username)}</div><div class="handle">@${esc(u.username||'')}</div></div><div class="actions"><button class="btn danger" data-remove="${u.id}">Remove</button></div></article>`}
function requestCard(r,incoming){const u=r.user;return `<article class="card"><div class="avatar" ${avatar(u)}>${u.avatar?'':esc((u.displayName||u.username||'?')[0]).toUpperCase()}</div><div class="info"><div class="name">${esc(u.displayName||u.username)}</div><div class="handle">@${esc(u.username||'')}</div></div><div class="actions">${incoming?`<button class="btn success" data-accept="${r.id}">Accept</button><button class="btn danger" data-reject="${r.id}">Decline</button>`:`<button class="btn danger" data-cancel="${r.id}">Cancel</button>`}</div></article>`}
function render(){let items=[];if(S.tab==='friends')items=S.friends.map(friendCard);if(S.tab==='incoming')items=S.incoming.map(r=>requestCard(r,true));if(S.tab==='outgoing')items=S.outgoing.map(r=>requestCard(r,false));if(S.tab==='search')items=S.search.map(u=>personCard(u));$('panel').innerHTML=items.length?`<div class="grid">${items.join('')}</div>`:`<div class="status">${S.tab==='friends'?'You have no friends yet. Search for someone to connect.':S.tab==='incoming'?'No pending requests.':S.tab==='outgoing'?'No sent requests.':'Search results will appear here.'}</div>`;$('friendsCount').textContent=S.friends.length||'';$('incomingCount').textContent=S.incoming.length||'';$('outgoingCount').textContent=S.outgoing.length||''}
async function loadLists(){S.loading=true;try{const [f,i,o]=await Promise.all([api('/friends'),api('/friends/requests/incoming'),api('/friends/requests/outgoing')]);S.friends=f.friends||[];S.incoming=i.requests||[];S.outgoing=o.requests||[];render()}catch(e){$('panel').innerHTML=`<div class="status">${esc(e.message)}</div>`}finally{S.loading=false}}
async function search(q){if(q.trim().length<2){S.search=[];S.tab='search';render();return}try{const d=await api('/friends/search?q='+encodeURIComponent(q.trim()));S.search=d.users||[];S.tab='search';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));render()}catch(e){toast(e.message)}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('searchInput').value)});$('refresh').onclick=loadLists;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('panel').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.add){await api('/friends/requests',{method:'POST',body:JSON.stringify({userId:Number(b.dataset.add)})});toast('Friend request sent');await loadLists();return}if(b.dataset.accept){await api('/friends/requests/'+b.dataset.accept+'/accept',{method:'POST'});toast('Request accepted');await loadLists();return}if(b.dataset.reject){await api('/friends/requests/'+b.dataset.reject+'/reject',{method:'POST'});toast('Request declined');await loadLists();return}if(b.dataset.cancel){await api('/friends/requests/'+b.dataset.cancel,{method:'DELETE'});toast('Request canceled');await loadLists();return}if(b.dataset.remove){if(!confirm('Remove this friend?'))return;await api('/friends/'+b.dataset.remove,{method:'DELETE'});toast('Friend removed');await loadLists()}}catch(e){toast(e.message)}});
loadLists();
})();
</script></body></html>
