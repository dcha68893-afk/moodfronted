<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends</title><script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script><script src="/js/settings-broadcast-listener.js"></script><script src="/js/necpa-session-resilience.js"></script><script src="/js/services.friend.js"></script><style>
:root{--bg:var(--bg-color);--card:var(--card-bg);--line:var(--border-color);--text:var(--text-color);--muted:var(--text-secondary);--primary:var(--primary-color);--soft:var(--primary-light);--danger:var(--danger-color)}*{box-sizing:border-box}html,body{background:var(--bg-color);color:var(--text-color)}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial}.app{max-width:980px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg-color) 94%,transparent);backdrop-filter:blur(10px);padding:16px 18px 10px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:23px;margin:0}.sub{color:var(--muted);margin-top:3px;font-size:12px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--card);color:var(--text);outline:none}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:9px 12px;font-weight:650;cursor:pointer}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--kyn-text-inverse)}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.tabs{display:flex;gap:7px;overflow:auto;padding:11px 18px;background:var(--card);border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:0;background:transparent;padding:9px 11px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer}.tab.active{background:var(--soft);color:var(--primary)}.content{padding:16px 18px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-title h2{font-size:15px;margin:0}.count{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:15px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-weight:850;color:var(--primary);flex:0 0 auto}.info{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bio{font-size:11px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.status{font-size:10px;margin-top:4px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-secondary);margin-right:4px}.dot.online{background:var(--success-color)}.verified{font-size:11px;color:var(--primary);margin-left:4px}.empty,.error,.hint{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:28px;text-align:center;color:var(--muted)}.error{color:var(--danger);border-color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.notice{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;color:var(--primary);font-size:12px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.chip.active{background:var(--text-color);color:var(--kyn-text-inverse);border-color:var(--text-color)}.loadmore{display:block;margin:14px auto}.back{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.content{padding:12px}.top{padding:13px 12px 9px}.tabs{padding:9px 12px}.card{align-items:flex-start}.actions{flex-direction:column}.actions .btn{width:100%}.stats{gap:6px}}
</style></head><body><main class="app"><header class="top"><div class="search"><input id="search" autocomplete="off" placeholder="Search by username, first name or last name"><button class="btn primary" id="searchBtn">Search</button><button class="btn" id="refresh" title="Refresh">↻</button></div></header><section class="content" id="content"></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const state={tab:'friends',friends:[],incoming:[],outgoing:[],discover:[],nearby:[],query:'',offset:0,total:0,loading:false,nearbyReady:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=r=>r?.data||{};const users=r=>data(r).users||[];
function avatar(u){return u.avatar?`<img class="avatar" src="${esc(u.avatar)}" alt="">`:`<div class="avatar">${esc((u.displayName||u.username||'?').slice(0,1).toUpperCase())}</div>`}
function relationship(u){return u.relationship||{status:'none',direction:null,requestId:null}}
async function action(type,u,btn){try{btn.disabled=true;const rel=relationship(u);if(type==='add')await FriendsService.send(u.id);else if(type==='accept')await FriendsService.accept(rel.requestId);else if(type==='reject')await FriendsService.reject(rel.requestId);else if(type==='cancel')await FriendsService.cancel(rel.requestId);else if(type==='remove')if(confirm('Remove this friend?'))await FriendsService.remove(u.id);await refresh();}catch(e){alert(e.message)}finally{btn.disabled=false}}
function actionButtons(u){const rel=relationship(u);if(rel.status==='accepted')return `<button class="btn danger" data-action="remove">Remove</button>`;if(rel.status==='pending'&&rel.direction==='incoming')return `<><button class="btn primary" data-action="accept">Accept</button><button class="btn" data-action="reject">Decline</button></>`;if(rel.status==='pending')return `<button class="btn" data-action="cancel">Cancel</button>`;return `<button class="btn primary" data-action="add">＋ Add friend</button>`}
function card(u,extra=''){const rel=relationship(u);return `<article class="card" data-id="${esc(u.id)}">${avatar(u)}<div class="info"><div class="name">${esc(u.displayName||u.username)}${u.isVerified?'<span class="verified">✓</span>':''}</div><div class="handle">@${esc(u.username||'user')}</div>${u.bio?`<div class="bio">${esc(u.bio)}</div>`:''}<div class="status"><span class="dot ${u.status==='online'?'online':''}"></span>${esc(u.status||'offline')}${extra?` · ${esc(extra)}`:''}${rel.status==='accepted'?' · Friends':''}</div></div><div class="actions">${actionButtons(u)}</div></article>`}
function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const u=state._map?.get(Number(b.closest('.card').dataset.id));if(u)action(b.dataset.action,u,b)})}
function notifyParent(){try{parent.postMessage({type:'FRIENDS_PAGE_CHANGED',payload:{page:state.tab},source:'friends-iframe'},'*')}catch(e){}}
function setTab(t){state.tab=t;notifyParent();render()}
function readFriendsCache(){try{return JSON.parse(localStorage.getItem('knecta_friends_cache')||'[]')}catch(_){return[]}}
async function loadFriends(){try{const r=await FriendsService.list({limit:100,offset:0});state.friends=users(r);state.total=data(r).total||state.friends.length;state._offline=false}catch(e){
// FIX (FRIENDS-NO-OFFLINE-CACHE): services.friend.js already caches the
// friends list to localStorage on every successful load (cacheFriends()) —
// it just never got read back on failure. Fall back to it instead of
// throwing and blanking the whole screen, matching how other modules
// already behave when offline.
const cached=readFriendsCache();if(cached.length){state.friends=cached;state.total=cached.length;state._offline=true}else throw e}}
async function loadRequests(){const [a,o]=await Promise.all([FriendsService.incoming({limit:100,offset:0}),FriendsService.outgoing({limit:100,offset:0})]);state.incoming=users(a);state.outgoing=users(o);try{parent.postMessage({type:'FRIENDS_REQUEST_COUNT',payload:{count:state.incoming.length},source:'friends-iframe'},'*')}catch(e){}}
async function loadDiscover(){const r=state.query?await FriendsService.search(state.query,50):await FriendsService.suggestions(30);state.discover=users(r);state.discoverReason=state.query?'search':data(r).reason}
async function loadNearby(){if(!navigator.geolocation){throw Error('This browser does not provide location services.')}const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:10000,maximumAge:300000}));await FriendsService.updateLocation(pos.coords.latitude,pos.coords.longitude);const r=await FriendsService.nearby(pos.coords.latitude,pos.coords.longitude,25);state.nearby=users(r);state.nearbyDistances=new Map(state.nearby.map(u=>[Number(u.id),u.distanceKm]));state.nearbyReady=true}
function render(){const c=$('content');state._map=new Map();let html='';if(state.tab==='friends'){html=(state._offline?'<div class="notice">You\'re offline — showing your last-loaded friends list.</div>':'')+'<div class="stats"><div class="stat"><b>'+state.friends.length+'</b><span>Friends loaded</span></div><div class="stat"><b>'+state.incoming.length+'</b><span>Pending requests</span></div><div class="stat"><b>'+state.outgoing.length+'</b><span>Sent requests</span></div></div><div class="section-title"><h2>Your friends</h2><span class="count">'+state.total+' total</span></div>'+(state.friends.length?'<div class="grid">'+state.friends.map(u=>{state._map.set(Number(u.id),u);return card(u)}).join('')+'</div>':'<div class="empty"><b>No friends yet</b><br>Use Discover or Search to find people and start connecting.</div>');}
else if(state.tab==='discover'){html='<div class="notice">Discover people by username, browse all active users, or use mutual-friend suggestions.</div><div class="filters"><button class="chip '+(!state.query?'active':'')+'" id="suggest">Suggested for you</button><button class="chip" id="browse">Browse all users</button></div><div class="section-title"><h2>'+ (state.query?'Search results':(state.discoverReason==='mutuals'?'People you may know':'Discover people')) +'</h2><span class="count">'+state.discover.length+' shown</span></div>'+(state.discover.length?'<div class="grid">'+state.discover.map(u=>{state._map.set(Number(u.id),u);return card(u)}).join('')+'</div>':'<div class="empty">No people found. Try another username.</div>');}
else if(state.tab==='requests'){html='<div class="section-title"><h2>Incoming requests</h2><span class="count">'+state.incoming.length+'</span></div>'+(state.incoming.length?'<div class="grid">'+state.incoming.map(u=>{state._map.set(Number(u.id),u);return card(u)}).join('')+'</div>':'<div class="empty">No pending requests.</div>');}
else if(state.tab==='sent'){html='<div class="section-title"><h2>Sent requests</h2><span class="count">'+state.outgoing.length+'</span></div>'+(state.outgoing.length?'<div class="grid">'+state.outgoing.map(u=>{state._map.set(Number(u.id),u);return card(u)}).join('')+'</div>':'<div class="empty">You have no sent requests.</div>');}
else{html=state.nearbyReady?'<div class="notice">Nearby results use your current location only after you grant browser permission. Your location is stored to make future nearby discovery faster.</div><div class="section-title"><h2>People nearby</h2><span class="count">Within 25 km</span></div>'+(state.nearby.length?'<div class="grid">'+state.nearby.map(u=>{state._map.set(Number(u.id),u);return card(u,String(state.nearbyDistances.get(Number(u.id))??'')+' km away')}).join('')+'</div>':'<div class="empty">No nearby users are currently discoverable.</div>'):'<div class="hint"><b>Find people near you</b><br>Allow location access to discover users within 25 km.<br><button class="btn primary" id="enableNearby" style="margin-top:12px">Enable Nearby</button></div>'}
c.innerHTML=html;wire();if($('suggest'))$('suggest').onclick=async()=>{state.query='';await refresh();};if($('browse'))$('browse').onclick=async()=>{try{const r=await FriendsService.browse(0,60);state.discover=users(r);state.query='';state.discoverReason='browse';render()}catch(e){c.innerHTML='<div class="error">'+esc(e.message)+'</div>'}};if($('enableNearby'))$('enableNearby').onclick=async()=>{try{c.innerHTML='<div class="hint">Requesting location permission…</div>';await loadNearby();render()}catch(e){c.innerHTML='<div class="error">'+esc(e.message||'Location permission was denied.')+'</div>'}}}
async function refresh(){if(state.loading)return;state.loading=true;try{try{await loadRequests()}catch(e){if(!state.incoming.length&&!state.outgoing.length&&!state.friends.length)throw e}if(state.tab==='friends')await loadFriends();if(state.tab==='discover')await loadDiscover();if(state.tab==='nearby'&&!state.nearbyReady){}render()}catch(e){
// FIX (FRIENDS-NO-OFFLINE-CACHE, cont'd): only replace the whole screen
// with a raw error when there's truly nothing already loaded to show —
// a transient/offline failure used to wipe out a perfectly good, already
//-rendered friends list just because one of the requests it also
// triggered (e.g. incoming/outgoing requests) failed.
if(state.friends.length||state.incoming.length||state.outgoing.length)render();else $('content').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{state.loading=false}}
$('searchBtn').onclick=async()=>{state.query=$('search').value.trim();state.tab='discover';notifyParent();await refresh()};$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});$('refresh').onclick=()=>refresh();
window.addEventListener('message',e=>{if(e.data?.type==='FRIENDS_LIST_UPDATE'||e.data?.type==='FRIEND_REQUEST_SENT')refresh();else if(e.data?.type==='FRIENDS_NAV'&&e.data.payload?.page)setTab(e.data.payload.page)});window.addEventListener('FRIENDS_LIST_UPDATE',refresh);
(async()=>{try{await loadRequests();await loadFriends();render();notifyParent();const target=new URLSearchParams(location.search).get('target');if(target){$('search').value=target;state.query=target;state.tab='discover';notifyParent();await refresh()}}catch(e){$('content').innerHTML='<div class="error">'+esc(e.message)+'</div>'}})();
})();</script></body></html>
