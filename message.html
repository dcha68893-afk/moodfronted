<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<!-- FIX: load the shared runtime-config-driven config.js before anything
     hardcodes the backend origin here — see chat.html for the full
     explanation of why a literal in this spot breaks under the build. -->
<script src="/js/runtime-config.js"></script>
<script src="/js/config.js"></script>
<script src="/js/avatar-fix.js?v=20260924-1"></script>
<script src="/js/theme.engine.js"></script>
<!-- FIX (SETTINGS-NOT-APPLIED-EVERYWHERE): this listener's own header comment
     already claims it's "Embedded in EVERY module iframe (messages, calls,
     status, group, friend, tools)" — it wasn't actually loaded here (or in
     friend.html/group.html/game.html), so a settings change made while one
     of those was already open never reached it; only a full reload of that
     iframe would pick up the new value via its own cache bootstrap. -->
<script src="/js/settings-broadcast-listener.js"></script>
<script>
  window.API_BASE_URL = window.__getApiOrigin();
  window.__kynAPI = window.__kynAPI || {};
  window.__kynAPI.baseUrl = window.__getApiBase();
</script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--kyn-bg-panel); color: var(--kyn-text-primary);
  }
  #convListPanel {
    width: 320px; min-width: 260px; border-right: 1px solid var(--kyn-border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #convListHeader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--kyn-border);
  }
  #newChatBtn {
    background: none; border: none; font-size: 18px; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  #newChatBtn:hover { background: var(--kyn-bg-hover); }
  #newChatBtn:active { transform: scale(0.92); }
  /* FIX (duplicate "New chat" button): chat.html's global header already
     shows a "New chat" pencil icon for the messages page (see
     headerActionConfigByPage.messages in chat.html) — clicking it just
     remotely clicks this exact button (triggerIframeHeaderAction). Showing
     this button here too meant two pencil icons for the one action, stacked
     right on top of each other. Kept in the DOM (still a real, working
     button — the shell's remote click depends on the element existing)
     and just not shown here, since the shell's copy already covers it.
     "Start a chat" in the empty conversation-list state is a separate,
     legitimate second entry point (it's only shown when there's nothing to
     look at yet), not a duplicate of this one. */
  #convListHeader #newChatBtn { display: none; }
  #archivedLinkBtn {
    background: none; border: none; font-size: 17px; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  #archivedLinkBtn:hover { background: var(--kyn-bg-hover); }
  #archivedLinkBtn:active { transform: scale(0.92); }
  .unarchive-btn {
    background: var(--kyn-accent-primary); color: #fff; border: none; border-radius: 14px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  #convList { flex: 1; overflow-y: auto; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--kyn-bg-panel); border-radius: 12px; width: 90%; max-width: 380px;
    max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between; padding: 14px;
    font-weight: 600; border-bottom: 1px solid var(--kyn-border);
  }
  #closeNewChatModal { background: none; border: none; font-size: 20px; cursor: pointer; }
  #newChatSearchInput {
    margin: 10px 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--kyn-border);
    font-size: 14px;
  }
  #newChatSearchInput.hidden { display: none; }
  #newChatResults { overflow-y: auto; flex: 1; }
  .new-chat-result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer;
  }
  .new-chat-result-item:hover { background: var(--kyn-bg-hover); }
  .new-chat-result-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #ccc; }
  /* FIX (start-chat should be a full screen like WhatsApp's "Select
     contact", not a small centered popup): #newChatModal reuses the
     generic .modal-overlay/.modal-box/.modal-header classes that
     chatInfoModal also uses — these overrides are scoped to #newChatModal
     specifically so Contact info and the media viewer are untouched. The
     header goes from [title | ✕] to [← | title (flex) | 🔍], matching the
     back-button + collapsed-search-icon pattern in the WhatsApp screenshot,
     instead of an always-visible search box. */
  #newChatModal.modal-overlay { align-items: stretch; justify-content: stretch; background: var(--kyn-bg-panel); }
  #newChatModal .modal-box { width: 100%; max-width: 100%; height: 100%; max-height: 100%; border-radius: 0; display: flex; flex-direction: column; }
  #newChatModal .modal-header { justify-content: flex-start; gap: 4px; }
  #newChatModal .modal-header span { flex: 1; }
  /* FEATURE (MULTI-SEND / BROADCAST, requested behavior): the shell
     (chat.html) already renders a real "Multi-send" 📡 header icon for the
     Messages page and remote-clicks #multiSendToggleBtn inside this iframe
     — see triggerIframeHeaderAction() in chat.html — but no element with
     that id existed here, so the icon was a dead button doing nothing.
     Reuses the New Chat / Forward picker's list and friend-loading logic
     (broadcastMode just swaps single-tap-to-open for checkboxes + a
     compose footer) rather than duplicating that whole picker a third time. */
  .new-chat-result-item.broadcast-mode { cursor: pointer; }
  .new-chat-result-item .broadcast-checkbox { width: 20px; height: 20px; margin-left: auto; flex-shrink: 0; cursor: pointer; }
  #broadcastComposeBar {
    border-top: 1px solid var(--kyn-border); padding: 10px 14px;
    display: flex; flex-direction: column; gap: 8px; background: var(--kyn-bg-input);
  }
  #broadcastComposeBar.hidden { display: none; }
  #broadcastSelectedCount { font-size: 12px; color: var(--kyn-text-secondary); }
  #broadcastComposeRow { display: flex; align-items: center; gap: 8px; }
  #broadcastComposeInput {
    flex: 1; border: 1px solid var(--kyn-border); border-radius: 20px; padding: 9px 14px;
    font-size: 14px; font-family: inherit; resize: none; max-height: 90px;
    background: var(--kyn-bg-panel); color: var(--kyn-text-primary);
  }
  #broadcastSendBtn {
    background: var(--kyn-accent-primary); color: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; flex-shrink: 0; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #broadcastSendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #broadcastSendBtn:not(:disabled):hover { filter: brightness(1.08); }
  #closeNewChatModal, #newChatSearchToggleBtn {
    background: none; border: none; font-size: 18px; cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  }
  #closeNewChatModal:hover, #newChatSearchToggleBtn:hover { background: var(--kyn-bg-hover); }
  .conv-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
    border-bottom: 1px solid var(--kyn-border);
  }
  .conv-item:hover, .conv-item.active { background: var(--kyn-bg-hover); }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ccc; flex-shrink: 0; object-fit: cover; }
  .conv-meta { flex: 1; min-width: 0; }
  .conv-name { font-weight: 600; font-size: 14px; }
  .conv-preview { font-size: 13px; color: var(--kyn-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-badge {
    background: var(--kyn-accent-primary); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 2px 7px; min-width: 18px; text-align: center;
  }
  #chatPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader {
    padding: 12px 16px; border-bottom: 1px solid var(--kyn-border);
    display: flex; align-items: center; gap: 10px;
  }
  #backBtn {
    display: none; background: none; border: none; font-size: 20px; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  #backBtn:hover { background: var(--kyn-bg-hover); }
  #backBtn:active { transform: scale(0.92); }
  /* FIX (Chat Wallpaper setting has no visible effect): Settings -> Chat -> Change Wallpaper
     saves chat.wallpaper/chat.wallpaperImage and settings-broadcast-listener.js correctly turns
     that into --chat-background/--chat-background-size/--chat-background-repeat CSS variables on
     <html>, but nothing in this file's stylesheet ever read those variables — this was the only
     place the chosen wallpaper could actually be shown, so the setting silently did nothing.
     Falls back to the existing solid theme colour when no wallpaper is set (var default). */
  #messageLog { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; background-color: var(--kyn-bg-chat); background-image: var(--chat-background, none); background-size: var(--chat-background-size, cover); background-repeat: var(--chat-background-repeat, no-repeat); background-position: center; background-attachment: local; }
  .bubble-row { display: flex; }
  .bubble-row.mine { justify-content: flex-end; }
  /* FIX (Message Font Size setting has no visible effect): Settings -> Chat -> Message Font Size
     saves chat.fontSize and settings-broadcast-listener.js correctly turns it into a
     --message-font-size CSS variable on <html>, but the bubble text itself was hard-coded to
     14px and never read that variable, so Small/Medium/Large all looked identical. */
  .bubble {
    max-width: 70%; padding: 8px 12px; border-radius: 14px; font-size: var(--message-font-size, 14px); line-height: 1.4;
    background: var(--kyn-bubble-recv); color: var(--kyn-bubble-recv-text); word-wrap: break-word;
  }
  /* FIX (Show Timestamps setting has no visible effect): the per-message time used to always
     render; hide just the time span (not the read-receipt tick/star, which are separate
     settings) when Settings -> Chat -> Show Timestamps is turned off. */
  html[data-show-timestamps="false"] .bubble-time { display: none; }
  .bubble-row.mine .bubble { background: var(--kyn-bubble-sent); color: var(--kyn-bubble-sent-text); }
  .bubble-meta { font-size: 10px; opacity: 0.65; margin-top: 3px; text-align: right; }
  .bubble-row.failed .bubble { outline: 2px solid #e04b4b; }
  .bubble-deleted { font-style: italic; opacity: 0.6; }
  .bubble-row { position: relative; }
  .bubble-menu-btn {
    /* FIX (TOO-SMALL / NOT-VISIBLE): this used to be font-size:14px,
       padding:2px 6px, opacity:0 by default with opacity only raised on
       `.bubble-row:hover` — invisible AND practically untappable on any
       touch device (there is no hover state to trigger it at all), and
       fiddly even with a mouse. Bigger hit target, and a real baseline
       opacity so it's always visible (not just discoverable on hover),
       with hover/focus/active only pushing it to fully opaque. */
    background: none; border: none; cursor: pointer; font-size: 20px; opacity: 0.55;
    width: 32px; height: 32px; line-height: 1; border-radius: 50%;
    padding: 0; align-self: flex-start; margin-top: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background-color 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  .bubble-row:hover .bubble-menu-btn,
  .bubble-menu-btn:hover,
  .bubble-menu-btn:focus-visible,
  .bubble-menu-btn:active { opacity: 1; background: rgba(0,0,0,0.06); }
  .bubble-menu-btn:active { transform: scale(0.9); }
  /* Touch devices have no hover — always show at full baseline opacity
     there instead of relying on a hover state that will never fire. */
  @media (hover: none) {
    .bubble-menu-btn { opacity: 0.75; }
  }
  .bubble-select-checkbox {
    width: 22px; height: 22px; flex-shrink: 0; align-self: center; margin: 0 6px; cursor: pointer;
  }
  .bubble-row.selecting { align-items: center; cursor: pointer; }
  .bubble-row.selected .bubble { outline: 2px solid var(--kyn-accent-primary); }
  #selectionActions {
    display: flex; align-items: center; gap: 12px; flex: 1;
  }
  #selectionActions.hidden { display: none; }
  #selectionCount { flex: 1; font-weight: 600; font-size: 14px; }
  #selectionActions button {
    background: none; border: none; cursor: pointer; font-size: 20px;
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  #selectionActions button:hover { background: rgba(0,0,0,0.06); }
  #chatHeaderActions.hidden { display: none; }
  /* FIX (PARENT-HEADER-CONSOLIDATION): chat.html's global header already
     renders a full 1:1 chat header (back arrow, avatar, name, voice/video
     call, more menu — see #headerChatCtx / showChatHeader() in chat.html)
     that mirrors exactly what this in-iframe #chatHeader used to show on
     its own, causing the duplicate header row reported (two rows: the
     parent's default "Messages" bar plus this iframe's own back/name/
     call/video/more row underneath it). This block hides #chatHeader's
     own visible presentation only — every element inside it (backBtn,
     chatHeaderName, searchInChatBtn,
     chatMoreBtn) stays in the DOM, fully functional, with its existing
     click handlers untouched, because chat.html remote-clicks these exact
     elements the same way it already does for #newChatBtn/
     #multiSendToggleBtn (see triggerIframeHeaderAction in chat.html).
     The one exception is the multi-select action bar (#selectionActions,
     "N selected / cancel / delete") — that has no equivalent in the
     parent header and stays as an in-panel contextual toolbar, shown via
     the .selection-active override below exactly while selectMode is on. */
  #chatHeader { display: none; }
  #chatHeader.selection-active { display: flex; }
  .bubble-context-menu {
    position: fixed; z-index: 1500; background: var(--kyn-bg-panel);
    border: 1px solid var(--kyn-border); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    display: flex; flex-direction: column; min-width: 170px; overflow: hidden; padding: 6px 0;
    animation: kynMenuPop 0.12s ease-out;
  }
  @keyframes kynMenuPop {
    from { opacity: 0; transform: scale(0.96) translateY(-3px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .bubble-context-menu button {
    background: none; border: none; text-align: left; padding: 9px 16px; font-size: 13.5px; cursor: pointer;
    color: var(--kyn-text-primary); transition: background-color 0.12s ease;
  }
  .bubble-context-menu button:hover { background: var(--kyn-bg-hover); }
  .status-reply-card{margin-bottom:6px;padding:9px 11px;border-radius:12px;border:1px solid var(--kyn-border);background:rgba(34,197,94,.08);max-width:100%}
  .status-reply-head{display:flex;align-items:center;gap:7px;font-size:12px}
  .status-reply-icon{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--kyn-accent-primary);color:#fff;font-size:11px}
  .status-reply-caption{margin-top:5px;font-size:11px;color:var(--kyn-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status-reply-text{margin-top:7px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .status-reply-emoji{margin-top:4px;font-size:38px;line-height:1.05}
  .reply-quote {
    border-left: 3px solid var(--kyn-accent-primary); padding: 4px 8px; margin-bottom: 4px;
    font-size: 12px; opacity: 0.75; cursor: pointer; background: rgba(0,0,0,0.04); border-radius: 4px;
  }
  #replyBar {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 14px;
    background: var(--kyn-bg-input); border-top: 1px solid var(--kyn-border); font-size: 13px;
  }
  .reply-bar-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cancelReplyBtn { background: none; border: none; font-size: 18px; cursor: pointer; }
  .date-separator { text-align: center; font-size: 12px; color: var(--kyn-text-secondary); margin: 10px 0; }
  .date-separator span { background: var(--kyn-bg-input); padding: 3px 10px; border-radius: 10px; }
  .bubble-reactions { margin-top: 2px; font-size: 14px; }
  .decrypt-retry { cursor: pointer; text-decoration: underline dotted; opacity: 0.8; }
  .decrypt-pending { opacity: 0.6; font-style: italic; }
  .decrypt-version-badge { font-size: 9px; opacity: 0.55; cursor: default; margin-left: 3px; }
  .decrypt-version-badge.legacy { opacity: 0.75; }
  /* FIX (PARENT-HEADER-CONSOLIDATION regression): this rule used to declare
     `display: flex` again here, appearing later in the stylesheet than the
     `#chatHeader { display: none; }` hide-fix above (line ~233) — since both
     rules have equal specificity, this LATER one silently won the cascade
     and re-showed the duplicate header row (the exact "two rows: parent's
     header + this iframe's own back/name/call/video row" bug the fix above
     was written to prevent). Dropped `display` from this rule; alignment
     properties only apply once `.selection-active` (or any future override)
     sets display back to flex. */
  #chatHeader { align-items: center; justify-content: space-between; }
  #chatHeaderName { flex: 1; }
  #chatSearchBar {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-bottom: 1px solid var(--kyn-border); background: var(--kyn-bg-input);
  }
  #chatSearchBar.hidden { display: none; }
  #chatSearchInput { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--kyn-border); font-size: 13px; }
  #chatSearchCount { font-size: 12px; color: var(--kyn-text-secondary); white-space: nowrap; }
  #closeChatSearchBtn { background: none; border: none; font-size: 18px; cursor: pointer; }
  .search-hit .bubble { outline: 2px solid #f5a623; }
  .chat-info-header { text-align: center; padding: 24px 14px; }
  .chat-info-avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
  .chat-info-name { font-size: 16px; font-weight: 600; }
  .chat-info-section { padding: 12px 14px; border-top: 1px solid var(--kyn-border); }
  .chat-info-section-title { font-size: 12px; font-weight: 600; color: var(--kyn-text-secondary); margin-bottom: 8px; text-transform: uppercase; }
  .chat-info-media-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .chat-info-media-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .chat-info-doc { display: block; padding: 6px 0; font-size: 13px; color: inherit; text-decoration: none; }
  .chat-info-empty { font-size: 13px; color: var(--kyn-text-secondary); }
  #chatHeaderActions { display: flex; gap: 2px; }
  /* VISUAL POLISH (requested behavior): unified sizing/centering/transition
     rules across every icon button in this module (header actions, emoji,
     attach, send, back) so they read as one consistent, deliberately
     designed control set instead of a grab-bag of ad-hoc buttons each with
     their own slightly different size and no hover/press feedback. */
  .header-icon-btn {
    background: none; border: none; font-size: 17px; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  .header-icon-btn:hover { background: var(--kyn-bg-hover); }
  .header-icon-btn:active { transform: scale(0.92); }
  .header-icon-btn:disabled { opacity: 0.35; cursor: default; }
  .header-icon-btn:disabled:hover { background: none; }
  .header-icon-btn:disabled:active { transform: none; }
  #composeInput:disabled { opacity: 0.6; cursor: default; }
  #emojiBtn:disabled { opacity: 0.5; cursor: default; }
  #emojiBtn {
    background: none; border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
  }
  #emojiBtn:hover { background: var(--kyn-bg-hover); color: var(--kyn-accent-primary); }
  #emojiBtn:active { transform: scale(0.92); }
  #emojiPicker {
    position: absolute; bottom: 60px; right: 10px; background: var(--kyn-bg-panel);
    border: 1px solid var(--kyn-border); border-radius: 14px; padding: 10px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.16);
  }
  #emojiPicker.hidden { display: none; }
  .emoji-option {
    background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; transition: background-color 0.15s ease, transform 0.1s ease;
  }
  .emoji-option:hover { background: var(--kyn-bg-hover); transform: scale(1.12); }
  #composeBar { display: flex; align-items: flex-end; gap: 6px; padding: 10px; border-top: 1px solid var(--kyn-border); position: relative; }
  #composeInput {
    flex: 1; border-radius: 22px; border: 1px solid var(--kyn-border);
    padding: 10px 16px; font-size: 14px; resize: none; max-height: 120px;
    transition: border-color 0.15s ease;
  }
  #composeInput:focus { outline: none; border-color: var(--kyn-accent-primary); }
  #sendBtn {
    background: linear-gradient(135deg, var(--kyn-accent-primary), var(--kyn-accent-secondary));
    color: #fff; border: none; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(34,197,94,0.4); transition: filter 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
  }
  #sendBtn svg { transform: translateX(1px); }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 3px 10px rgba(34,197,94,0.5); }
  #sendBtn:active:not(:disabled) { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  #attachBtn, #emojiBtn {
    color: var(--kyn-text-secondary);
  }
  #attachBtn {
    background: none; border: none; cursor: pointer; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
  }
  #attachBtn svg { transform: rotate(45deg); }
  #attachBtn:hover { background: var(--kyn-bg-hover); color: var(--kyn-accent-primary); }
  #attachBtn:active { transform: scale(0.92); }
  #attachBtn:disabled { opacity: 0.5; cursor: default; }

  /* FIX (two-panel desktop layout lost its sidebar): #convListPanel's
     "hide it while a chat is open" rule used to sit outside this media
     query — display:none at every width, not just mobile — so opening any
     chat hid the sidebar on desktop too, leaving only the single chat pane
     where the spec calls for sidebar + chat side by side on a large
     screen. Scoping both hide-on-mobile rules to this one mobile-only
     media query is what actually makes it mobile-only: below 720px, only
     one of the two panels shows at a time (WhatsApp/Telegram mobile

  @media (max-width: 720px) {

</style>
</head>
<body>

  <div id="convListPanel">
    <div id="convListHeader">
      <span id="convListTitle">Chats</span>
      <button id="archivedLinkBtn" title="Archived chats">🗄</button>
      <button id="newChatBtn" title="New chat">✎</button>
    </div>

  </div>

  <div id="chatInfoModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span>Contact info</span>
        <button id="closeChatInfoModal">&times;</button>
      </div>
      <div id="chatInfoBody"></div>
    </div>
  </div>

  <div id="mediaViewer" class="modal-overlay hidden">
    <button id="closeMediaViewer">&times;</button>
    <img id="mediaViewerImg" src="" alt="" class="hidden">
    <video id="mediaViewerVideo" src="" controls playsinline class="hidden"></video>
    <iframe id="mediaViewerFrame" src="" class="hidden"></iframe>
    <div id="mediaViewerFileName" class="hidden"></div>
    <a id="mediaViewerDownload" href="" target="_blank" rel="noopener" class="hidden">⬇ Download</a>
  </div>

  <div id="newChatModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <button id="closeNewChatModal" title="Back">&larr;</button>
        <span>New chat</span>
        <button id="newChatSearchToggleBtn" title="Search">🔍</button>
      </div>
      <input type="text" id="newChatSearchInput" class="hidden" placeholder="Search people...">
      <div id="newChatResults"></div>
      <div id="broadcastComposeBar" class="hidden">
        <div id="broadcastSelectedCount">0 selected</div>
        <div id="broadcastComposeRow">
          <textarea id="broadcastComposeInput" rows="1" placeholder="Type a message to send to everyone selected..."></textarea>
          <button id="broadcastSendBtn" title="Send to selected" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FIX: chat.html's shell "Multi-send" 📡 header icon (Messages page)
       remote-clicks this exact id (triggerIframeHeaderAction ->
       #multiSendToggleBtn) the same way its "New chat" ✎ icon remote-clicks
       #newChatBtn above — kept in the DOM as a real, working button and just
       not shown here, since the shell already renders the visible icon. -->
  <button id="multiSendToggleBtn" style="display:none;"></button>

  <div id="chatPanel" class="hide-on-mobile"></div>

  <script src="/js/kynecta.safety.layer.js"></script>
  <script src="/js/app.cache.js"></script>
  <script src="/localStore.friends.js"></script>
  <script src="/js/api.request.js"></script>
  <script src="/js/app.realtime.socket.js"></script>
  <script src="/js/core/identity/IdentityProfileStore.js"></script>
  <script src="/js/e2e-encryption.js" defer></script>
  <!-- js/double-ratchet.js was deleted (obsolete private-message Double
       Ratchet generation, commit a080662) but this <script> tag referencing
       it was left behind, causing a 404 on every load of this page. Removed;
       the canonical private-message core is loaded dynamically by
       js/e2e-session-init.js below. -->
  <!-- Phase 1 redesign: durable IndexedDB-backed session/identity store. -->
  <script src="/js/e2e-store-v2.js" defer></script>
  <script src="/js/e2e-session-init.js" defer></script>
  <!-- Persistent local cache (messages + conversation list) — read/written
       by message-client.js so reload/relogin never needs to refetch or
       re-decrypt anything already seen. Must load before message-client.js,
       not deferred, since message-client.js's top-level bootstrap reads it
       synchronously on first run. -->
  <!-- FIX (group messages leaking into the private Message Module's own
       chat list instead of being isolated to group.html): the previous fix
       here assumed "capture-phase listeners always run before bubble-phase
       ones regardless of script load order" — true for events that
       propagate through a real ancestor chain, but message events from
       postMessage() are dispatched directly AT `window`, which has no
       ancestors. With no capturing/bubbling phases to separate them, ALL
       listeners on `window` (capture:true or not) fire in the order they
       were REGISTERED. message-client.js's own window 'message' listener
       (registered synchronously the moment that script runs, from its
       top-level wireRealtimeListeners() call) was registered first because
       this script tag loaded after it — so every group message already got
       routed into applyIncomingMessage() (private-chat state) and rendered
       in this module's own chat list before this file's listener ever ran;
       its stopImmediatePropagation() call only blocks listeners still
       waiting to run, it can't undo work an earlier listener already did.
       Moving this tag ABOVE message-client.js's makes this file's listener
       register first, so it actually intercepts and isolates group
       payloads before message-client.js can touch them. -->
  <script src="/js/group-message-isolation.js"></script>
  <script src="/js/message-local-db.js"></script>
  <script src="/js/message-client.js"></script>


  <script>
  (function () {
    'use strict';

    const convListEl = document.getElementById('convList');
    const chatPanelEl = document.getElementById('chatPanel');

    // FIX (profile photos): one resolver for every user (Google / manual / relative /uploads path / placeholder).
    // Falls back to an initials avatar - never the Necpa logo.
    function userAvatarSrc(u) {
      try { if (window.NecpaAvatar) return window.NecpaAvatar.src(u); } catch (_) {}
      return (u && (u.avatar || u.photoURL || u.picture)) || '/icons/necpa-192.png';
    }
    function userAvatarName(u) {
      try { return window.NecpaAvatar ? window.NecpaAvatar.nameOf(u) : ''; } catch (_) { return ''; }
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // VISUAL POLISH: crisp inline-SVG icons (currentColor-based, so they pick
    // up the surrounding button's color/theme automatically) replacing the
    // plain emoji glyphs (📎 🙂 ▶) the composer used to render — those look
    // inconsistent across platforms/fonts and read as a placeholder rather
    // than a designed control, unlike the header's own icon set.
    const ICON_ATTACH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
    const ICON_EMOJI = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>';
    const ICON_SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
    const ICON_ATTACH_BUSY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></svg>';

    // ROOT-CAUSE FIX (chat list shows raw ciphertext JSON instead of a
    // preview — screenshot showed a "denis" row with
    // {"v":5,"kid":"...","mid":"...","senderDev... as the preview text):
    // the conv-preview line below used to fall back to
    // c.lastMessage?.content whenever displayContent hadn't resolved yet.
    // That's the raw, still-encrypted envelope — exactly the thing the
    // decrypt pipeline's own fallbackText ('🔒 Encrypted message') exists
    // to prevent ever reaching a screen (see decryptForDisplay /
    // decryptMessageForDisplay's "never leak ciphertext, either way"
    // comment in js/e2e-encryption.js). The chat bubbles already honor
    // that; this list preview just wasn't going through the same check.
    // FIX (LIST-PREVIEW-STUCK-ON-"Decrypting…"): "Decrypting…" is now only a brief
    // placeholder. It shows for at most DECRYPT_PLACEHOLDER_MS after a message is first
    // seen undecrypted; the real text replaces it the instant it resolves (also checking
    // the open chat's message bucket, which can hold a resolved copy the sidebar missed).
    // If it still hasn't resolved after the window, show the neutral locked-message label
    // instead of an endless "Decrypting…".
    const DECRYPT_PLACEHOLDER_MS = 2000;
    const _decryptSeen = new Map();
    const _decryptTimers = new Set();
    // FIX (status reaction shows raw JSON in the chat list): a status
    // reaction/comment is delivered as a `status_reply` message whose
    // decrypted text is a small JSON blob (e.g.
    // {"statusId":7,"statusType":"video","kind":"reaction","emoji":"😍",...}).
    // The chat bubble already has a friendly card for this
    // (see statusReplyHtml below), but this list preview was returning
    // lastMessage.displayContent as-is once decrypted, so the raw JSON
    // leaked straight into the conversation list. Detect the same shape
    // statusReplyHtml looks for and render the same friendly summary here.
    function _statusReplyPreviewText(lastMessage) {
      if (!lastMessage) return null;
      let interaction = null;
      for (const candidate of [lastMessage.displayContent, lastMessage.content]) {
        if (typeof candidate !== 'string') continue;
        try {
          const parsed = JSON.parse(candidate);
          if (parsed && typeof parsed === 'object' && (parsed.statusId != null || parsed.kind === 'reaction' || parsed.kind === 'comment')) {
            interaction = parsed;
            break;
          }
        } catch (_) {}
      }
      if (!interaction && lastMessage.type !== 'status_reply') return null;
      if (!interaction) return 'Status interaction';
      const isMine = lastMessage.senderId != null && window._kynCurrentUserId != null && String(lastMessage.senderId) === String(window._kynCurrentUserId);
      const kind = interaction.kind === 'reaction' ? 'reaction' : 'comment';
      if (kind === 'reaction') {
        const emoji = String(interaction.emoji || '❤️');
        return isMine ? `You reacted ${emoji} to a status` : `Reacted ${emoji} to your status`;
      }
      const text = String(interaction.text || '').trim();
      return isMine ? `You replied to a status${text ? ': ' + text : ''}` : `Replied to your status${text ? ': ' + text : ''}`;
    }
    function safeConvPreview(lastMessage, chatId) {
      if (!lastMessage) return '';
      const statusPreview = _statusReplyPreviewText(lastMessage);
      if (statusPreview !== null) return statusPreview;
      if (lastMessage.displayContent !== undefined && lastMessage.displayContent !== 'Decrypting…') return lastMessage.displayContent;
      const c = lastMessage.content;
      const looksEncrypted = typeof c === 'string' && /^\s*\{/.test(c) && c.indexOf('"v"') !== -1;
      if (lastMessage.displayContent === 'Decrypting…' || looksEncrypted) {
        try {
          if (chatId != null && lastMessage.id != null) {
            const m = window.MessageModule.getMessages(chatId).find(x => String(x.id) === String(lastMessage.id));
            if (m && m.displayContent !== undefined && m.displayContent !== 'Decrypting…') return m.displayContent;
          }
        } catch (_) {}
        const key = String(chatId) + ':' + (lastMessage.id != null ? lastMessage.id : (lastMessage.createdAt || ''));
        if (!_decryptSeen.has(key)) _decryptSeen.set(key, Date.now());
        const left = DECRYPT_PLACEHOLDER_MS - (Date.now() - _decryptSeen.get(key));
        if (left > 0) {
          if (!_decryptTimers.has(key)) {
            _decryptTimers.add(key);
            setTimeout(() => { _decryptTimers.delete(key); renderConversationList(); }, left + 30);
          }
          return 'Decrypting…';
        }
        return '🔒 Encrypted message';
      }
      return c ?? '';
    }

    // ── Chat list: Lock chat / Favourites / Mark as unread ─────────────────
    // NEW (requested behavior — chat-list long-press menu + locked chats,
    // matching WhatsApp): none of this existed anywhere in the app before.
    // Locking is device-local, like WhatsApp's own chat lock (it's gated by
    // a PIN on THIS device, not a server-verified account secret) — no
    // backend change needed. Everything here is namespaced per signed-in
    // user (`_kynCLKey`) so a shared/public device doesn't leak one
    // account's locked/favourited chat list to the next person who logs in.
    function _kynCLUserId() { return window._kynCurrentUserId || 'anon'; }
    function _kynCLKey(name) { return `kyn_${name}_${_kynCLUserId()}`; }
    function _kynCLGetSet(name) {
      try {
        const raw = localStorage.getItem(_kynCLKey(name));
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (_) { return new Set(); }
    }
    function _kynCLSaveSet(name, set) {
      try { localStorage.setItem(_kynCLKey(name), JSON.stringify(Array.from(set))); } catch (_) {}
    }
    // Locked-chats section starts hidden every time the chats screen is
    // (re)opened — it must be unlocked again each visit, same as WhatsApp.
    let _kynLockedRevealed = false;

    async function _kynHashPin(pin) {
      const enc = new TextEncoder().encode('kyn-chatlock:' + _kynCLUserId() + ':' + pin);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function _kynPinModal(title, subtitle) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;';
        overlay.innerHTML = `
          <div style="background:var(--kyn-bg-panel);border-radius:16px;padding:22px;width:100%;max-width:320px;text-align:center;">
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;">${escapeHtml(title)}</div>
            <div style="font-size:12px;color:var(--kyn-text-secondary);margin-bottom:14px;">${escapeHtml(subtitle)}</div>
            <input type="password" inputmode="numeric" maxlength="6" placeholder="••••••"
              style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font-size:20px;text-align:center;letter-spacing:8px;
                     border:1px solid var(--kyn-border);outline:none;margin-bottom:10px;" id="kynPinModalInput">
            <div id="kynPinModalErr" style="font-size:12px;color:#ef4444;min-height:16px;margin-bottom:8px;"></div>
            <div style="display:flex;gap:8px;">
              <button id="kynPinModalCancel" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--kyn-bg-hover);cursor:pointer;">Cancel</button>
              <button id="kynPinModalOk" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--kyn-accent-primary);color:#fff;font-weight:700;cursor:pointer;">OK</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        const input = overlay.querySelector('#kynPinModalInput');
        const err = overlay.querySelector('#kynPinModalErr');
        setTimeout(() => input.focus(), 50);
        const close = (val) => { overlay.remove(); resolve(val); };
        overlay.querySelector('#kynPinModalCancel').addEventListener('click', () => close(null));
        overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
        const submit = () => {
          const v = input.value.trim();
          if (!/^\d{4,6}$/.test(v)) { err.textContent = 'Enter a 4–6 digit PIN'; return; }
          close(v);
        };
        overlay.querySelector('#kynPinModalOk').addEventListener('click', submit);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      });
    }

    // Returns true once a chat-lock PIN exists on this device for this user.
    function _kynHasChatLockPin() { return !!localStorage.getItem(_kynCLKey('chatlock_pin')); }

    async function _kynSetupChatLockPin() {
      const pin = await _kynPinModal('Set a Lock Chat PIN', 'You\u2019ll need this PIN to view locked chats on this device.');
      if (!pin) return false;
      const confirmPin = await _kynPinModal('Confirm PIN', 'Enter the same PIN again.');
      if (confirmPin !== pin) { alert('PINs did not match. Try again from the chat menu.'); return false; }
      localStorage.setItem(_kynCLKey('chatlock_pin'), await _kynHashPin(pin));
      return true;
    }

    async function _kynVerifyChatLockPin() {
      const stored = localStorage.getItem(_kynCLKey('chatlock_pin'));
      if (!stored) return true; // nothing to verify against — treat as unlocked
      // Try device biometrics first when the platform offers it (Face/Touch
      // ID, Windows Hello, Android fingerprint) — falls straight through to
      // the PIN below on any unsupported/declined/failed attempt, so the
      // PIN always remains a working fallback.
      try {
        if (window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?.()) {
          try {
            await navigator.credentials.get({
              publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification: 'required', timeout: 30000 }
            });
            return true;
          } catch (_) { /* declined/unavailable/no credential — fall back to PIN */ }
        }
      } catch (_) {}
      const pin = await _kynPinModal('Enter PIN', 'Unlock your locked chats.');
      if (!pin) return false;
      return (await _kynHashPin(pin)) === stored;
    }

    function renderConversationList() {
      if (viewingArchived) return; // don't let realtime updates overwrite the archived view
      const lockedIds = _kynCLGetSet('locked_chats');
      const favIds = _kynCLGetSet('fav_chats');
      const forcedUnread = _kynCLGetSet('forced_unread');
      const allConvs = window.MessageModule.getConversations()
        .slice()
        .sort((a, b) => new Date(b.lastMessage?.createdAt || 0) - new Date(a.lastMessage?.createdAt || 0));

      // Locked chats are pulled out of the normal list instantly — they only
      // ever render inside the separate Locked chats section below, which
      // itself only shows real rows once unlocked for this visit.
      const convs = allConvs.filter(c => !lockedIds.has(String(c.chatId)));
      const lockedConvs = allConvs.filter(c => lockedIds.has(String(c.chatId)));
      // Favourites float to the top of the normal (unlocked) list.
      convs.sort((a, b) => {
        const af = favIds.has(String(a.chatId)) ? 1 : 0, bf = favIds.has(String(b.chatId)) ? 1 : 0;
        if (af !== bf) return bf - af;
        return new Date(b.lastMessage?.createdAt || 0) - new Date(a.lastMessage?.createdAt || 0);
      });

      const rowHtml = (c) => `
        <div class="conv-item${c.chatId === window.MessageModule.getActiveChatId() ? ' active' : ''}" data-chat-id="${c.chatId}">
          <img class="conv-avatar" src="${escapeHtml(userAvatarSrc(c.otherUser))}" alt="" referrerpolicy="no-referrer" data-avatar="1" data-avatar-name="${escapeHtml(userAvatarName(c.otherUser))}">
          <div class="conv-meta">
            <div class="conv-name">${favIds.has(String(c.chatId)) ? '\u2b50 ' : ''}${escapeHtml(c.otherUser?.username || 'Conversation')}</div>
            <div class="conv-preview">${escapeHtml(safeConvPreview(c.lastMessage, c.chatId))}</div>
          </div>
          ${(c.unreadCount > 0 || forcedUnread.has(String(c.chatId))) ? `<span class="unread-badge">${c.unreadCount > 99 ? '99+' : (c.unreadCount || '')}</span>` : ''}
        </div>`;

      if (convs.length === 0 && lockedConvs.length === 0) {
        convListEl.innerHTML = `
          <div class="empty-conv-list">
            <div class="empty-conv-icon">💬</div>
            <div class="empty-conv-title">No conversations yet</div>
            <div class="empty-conv-subtitle">Start a new chat to message someone</div>
            <button id="emptyStateNewChatBtn">Start a chat</button>
          </div>`;
        const startBtn = document.getElementById('emptyStateNewChatBtn');
        if (startBtn) startBtn.addEventListener('click', () => document.getElementById('newChatBtn').click());
        return;
      }

      const lockedSectionHtml = lockedConvs.length ? `
        <div class="conv-locked-header" id="kynLockedHeader" style="display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;font-weight:700;color:var(--kyn-text-secondary);cursor:pointer;">
          <span>🔒 Locked chats (${lockedConvs.length})</span>
          <span style="margin-left:auto;">▸ Unlock</span>
        </div>
      ` : '';

      convListEl.innerHTML = convs.map(rowHtml).join('') + lockedSectionHtml;

      const openRow = (chatId) => {
        if (forcedUnread.has(String(chatId))) {
          forcedUnread.delete(String(chatId));
          _kynCLSaveSet('forced_unread', forcedUnread);
        }
        window.MessageModule.openChat({ conversationId: Number(chatId) });
      };

      convListEl.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', () => openRow(el.dataset.chatId));
        _kynWireConvContextMenu(el, Number(el.dataset.chatId), lockedIds.has(el.dataset.chatId));
      });

      const lockedHeader = document.getElementById('kynLockedHeader');
      if (lockedHeader) {
        // ROOT-CAUSE FIX (LOCKED-CHATS-SHARE-THE-NORMAL-SCREEN): this used to
        // just flip _kynLockedRevealed and re-render THIS SAME list with the
        // locked rows appended inline below the regular ones — not the
        // separate, PIN-gated screen requested (open only locked chats,
        // with its own place to unlock/re-lock each one). Opens a dedicated
        // full-screen overlay instead; the inline reveal path is removed.
        lockedHeader.addEventListener('click', async () => {
          if (!_kynHasChatLockPin()) { if (!(await _kynSetupChatLockPin())) return; }
          if (await _kynVerifyChatLockPin()) _kynShowLockedChatsScreen();
        });
      }
    }

    // Dedicated locked-chats screen: shows ONLY locked conversations, each
    // with its own unlock control, and lets the user tap through to open
    // one normally. Re-verifies the PIN every time it's opened (same as
    // WhatsApp) — nothing about unlocking here persists past this screen.
    function _kynShowLockedChatsScreen() {
      const existing = document.getElementById('kynLockedScreen');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'kynLockedScreen';
      overlay.style.cssText = 'position:fixed;inset:0;background:var(--kyn-bg-root);z-index:9500;display:flex;flex-direction:column;';
      overlay.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--kyn-border);">
          <button id="kynLockedBack" style="border:none;background:none;font-size:18px;cursor:pointer;color:inherit;">←</button>
          <div style="font-weight:700;font-size:15px;">🔒 Locked Chats</div>
        </div>
        <div id="kynLockedList" style="flex:1;overflow-y:auto;"></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#kynLockedBack').addEventListener('click', () => overlay.remove());

      const renderLockedScreenList = () => {
        const lockedIds = _kynCLGetSet('locked_chats');
        const convs = (window.MessageModule.getConversations() || []).filter(c => lockedIds.has(String(c.chatId)));
        const listEl = overlay.querySelector('#kynLockedList');
        if (!convs.length) {
          listEl.innerHTML = `<div class="empty-conv-list"><div class="empty-conv-icon">🔒</div><div class="empty-conv-title">No locked chats</div><div class="empty-conv-subtitle">Long-press any chat and choose "Lock chat"</div></div>`;
          return;
        }
        listEl.innerHTML = convs.map(c => `
          <div class="conv-item" data-chat-id="${c.chatId}" style="display:flex;align-items:center;">
            <img class="conv-avatar" src="${escapeHtml(userAvatarSrc(c.otherUser))}" alt="" referrerpolicy="no-referrer" data-avatar="1" data-avatar-name="${escapeHtml(userAvatarName(c.otherUser))}">
            <div class="conv-meta">
              <div class="conv-name">${escapeHtml(c.otherUser?.username || 'Conversation')}</div>
              <div class="conv-preview">${escapeHtml(safeConvPreview(c.lastMessage, c.chatId))}</div>
            </div>
            <button data-unlock="${c.chatId}" style="border:none;background:none;font-size:16px;cursor:pointer;color:inherit;padding:8px;" title="Unlock chat">🔓</button>
          </div>`).join('');
        listEl.querySelectorAll('[data-unlock]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const ids = _kynCLGetSet('locked_chats');
            ids.delete(String(btn.dataset.unlock));
            _kynCLSaveSet('locked_chats', ids);
            renderLockedScreenList();
            renderConversationList();
          });
        });
        listEl.querySelectorAll('.conv-item').forEach(el => {
          el.addEventListener('click', () => {
            overlay.remove();
            window.MessageModule.openChat({ conversationId: Number(el.dataset.chatId) });
          });
        });
      };
      renderLockedScreenList();
    }

    function _kynCloseConvMenu() {
      const existing = document.getElementById('convContextMenu');
      if (existing) existing.remove();
    }

    // Long-press (touch) / right-click (mouse) a conversation row for the
    // WhatsApp-style chat-list menu: Favourite, Mute, Mark as unread, Lock,
    // Archive, Delete. ("Add chat shortcut" — a home-screen icon for one
    // specific chat — is an OS-level PWA integration with no equivalent
    // here, so it's intentionally left out rather than faked; "Select all"
    // bulk-selection of conversations is likewise not included yet.)
    function _kynWireConvContextMenu(row, chatId, isLocked) {
      const openMenu = async (anchorRect) => {
        _kynCloseConvMenu();
        const favIds = _kynCLGetSet('fav_chats');
        const isFav = favIds.has(String(chatId));
        const conv = window.MessageModule.getConversations().find(c => c.chatId === chatId);
        const isMuted = !!conv?.muted;
        const menu = document.createElement('div');
        menu.id = 'convContextMenu';
        menu.className = 'bubble-context-menu';
        const items = [
          { action: 'fav',    label: isFav ? '\u2b50 Remove from Favourites' : '\u2b50 Add to Favourites' },
          { action: 'unread', label: '\u2709 Mark as unread' },
          { action: 'mute',   label: isMuted ? '\ud83d\udd14 Unmute' : '\ud83d\udd15 Mute' },
          { action: 'lock',   label: isLocked ? '\ud83d\udd13 Unlock chat' : '\ud83d\udd12 Lock chat' },
          { action: 'archive', label: '\ud83d\uddc4 Archive chat' },
          { action: 'delete', label: '\ud83d\uddd1 Delete chat' },
        ];
        menu.innerHTML = items.map(i => `<button data-conv-action="${i.action}">${i.label}</button>`).join('');
        document.body.appendChild(menu);
        menu.style.top = `${anchorRect.bottom + 4}px`;
        menu.style.left = `${Math.max(8, anchorRect.left)}px`;
        menu.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            _kynCloseConvMenu();
            await _kynRunConvAction(btn.dataset.convAction, chatId, isLocked);
          });
        });
        setTimeout(() => document.addEventListener('click', _kynCloseConvMenu, { once: true }), 0);
      };
      let pressTimer = null;
      row.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => openMenu(row.getBoundingClientRect()), 500);
      }, { passive: true });
      ['touchend', 'touchmove', 'touchcancel'].forEach(evt => {
        row.addEventListener(evt, () => { if (pressTimer) clearTimeout(pressTimer); }, { passive: true });
      });
      row.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openMenu(row.getBoundingClientRect());
      });
    }

    async function _kynRunConvAction(action, chatId, isLocked) {
      const sid = String(chatId);
      if (action === 'fav') {
        const favIds = _kynCLGetSet('fav_chats');
        favIds.has(sid) ? favIds.delete(sid) : favIds.add(sid);
        _kynCLSaveSet('fav_chats', favIds);
        renderConversationList();
      } else if (action === 'unread') {
        const forced = _kynCLGetSet('forced_unread');
        forced.add(sid);
        _kynCLSaveSet('forced_unread', forced);
        renderConversationList();
      } else if (action === 'mute') {
        const conv = window.MessageModule.getConversations().find(c => c.chatId === chatId);
        if (conv?.muted) await window.MessageModule.unmuteChat(chatId);
        else await window.MessageModule.muteChat(chatId);
        renderConversationList();
      } else if (action === 'lock') {
        const lockedIds = _kynCLGetSet('locked_chats');
        if (isLocked) {
          lockedIds.delete(sid);
        } else {
          if (!_kynHasChatLockPin()) { if (!(await _kynSetupChatLockPin())) return; }
          lockedIds.add(sid);
        }
        _kynCLSaveSet('locked_chats', lockedIds);
        renderConversationList();
      } else if (action === 'archive') {
        if (!confirm('Archive this conversation? This archives it for both people in the chat, not just you.')) return;
        await window.MessageModule.archiveChat(chatId);
        renderConversationList();
      } else if (action === 'delete') {
        if (!confirm('Delete this conversation for you? This cannot be undone.')) return;
        await window.MessageModule.deleteChat(chatId);
        renderConversationList();
      }
    }

        <div class="conv-item">

          <div class="conv-meta">
            <div class="conv-name">${escapeHtml(c.otherUser?.username || 'Conversation')}</div>

    function showChatsView() {
      viewingArchived = false;
      document.getElementById('convListTitle').textContent = 'Chats';
      document.getElementById('archivedLinkBtn').textContent = '🗄';
      document.getElementById('archivedLinkBtn').title = 'Archived chats';
      document.getElementById('newChatBtn').classList.remove('hidden');
      renderConversationList();
    }

    document.getElementById('archivedLinkBtn').addEventListener('click', () => {
      if (viewingArchived) showChatsView();
      else showArchivedView();
    });

    function statusReplyHtml(m, isMine) {
      let meta=m?.metadata;if(typeof meta==='string'){try{meta=JSON.parse(meta)}catch(_){meta=null}}
      let interaction=meta?.statusInteraction||null;
      for(const candidate of [m?.displayContent,m?.content]){
        if(interaction||typeof candidate!=='string')continue;
        try{const parsed=JSON.parse(candidate);if(parsed&&typeof parsed==='object'&&(parsed.statusId!=null||parsed.kind==='reaction'||parsed.kind==='comment'))interaction=parsed}catch(_){}
      }
      if(!interaction&&m?.type!=='status_reply')return '';
      if(!interaction)return '<div class="status-reply-card"><div class="status-reply-head"><span class="status-reply-icon">↩</span><b>Status interaction</b></div><div class="status-reply-text">Unable to load the status reply details.</div></div>';
      const kind=interaction.kind==='reaction'?'reaction':'comment';
      const emoji=kind==='reaction'?String(interaction.emoji||'❤️'):'';
      const text=kind==='comment'?String(interaction.text||'').trim():'';
      const caption=String(interaction.caption||'').trim();
      const heading=isMine?(kind==='reaction'?'You reacted to a status':'You replied to a status'):(kind==='reaction'?'Reacted to your status':'Replied to your status');
      const body=kind==='reaction'?'<div class="status-reply-emoji">'+escapeHtml(emoji)+'</div>':'<div class="status-reply-text">'+escapeHtml(text||'Replied to your status')+'</div>';
      return '<div class="status-reply-card" data-status-id="'+escapeHtml(String(interaction.statusId??''))+'"><div class="status-reply-head"><span class="status-reply-icon">↩</span><b>'+escapeHtml(heading)+'</b></div>'+(caption?'<div class="status-reply-caption">'+escapeHtml(caption.slice(0,180))+'</div>':'')+body+'</div>';
    }

    function attachmentHtml(m) {
      let meta = m.metadata;
      if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (_) { meta = null; } }
      const att = meta && meta.attachment;
      if (!att) return '';
      const type = att.type || m.type;
      // FIX (ATTACHMENTS-OPEN-IN-NEW-TAB): video/audio/document/file all used to
      // render as <a target="_blank">, leaving the app entirely. Images already
      // had an in-app viewer (#mediaViewer, data-view-image) — this extends the
      // same modal to the other types instead of adding a second viewer.
      if (type === 'image') {
        return `<img class="bubble-attachment-image" data-view-image="${escapeHtml(att.url)}" src="${escapeHtml(att.url)}" alt="${escapeHtml(att.originalName || 'image')}">`;
      }
      if (type === 'video') {
        return `<video class="bubble-attachment-video" data-view-video="${escapeHtml(att.url)}" src="${escapeHtml(att.url)}" muted playsinline preload="${(window.__necpaLiteMedia && window.__necpaLiteMedia('chat')) ? 'none' : 'metadata'}"></video>`;
      }
      if (type === 'audio') {
        return `<audio class="bubble-attachment-audio" src="${escapeHtml(att.url)}" controls></audio>`;
      }
      const icon = { document: '📄', file: '📎' }[type] || '📎';
      return `<button type="button" class="bubble-attachment-file" data-view-file="${escapeHtml(att.url)}" data-file-name="${escapeHtml(att.originalName || 'Attachment')}" data-file-mime="${escapeHtml(att.mimeType || '')}">
                ${icon} ${escapeHtml(att.originalName || 'Attachment')}
              </button>`;
    }

    function replyPreviewHtml(m, chatId) {
      if (!m.replyToId) return '';
      const original = getMessages(chatId).find(x => x.id === m.replyToId);
      const label = original
        ? (original.displayContent || (original.metadata && original.metadata.attachment ? '📎 Attachment' : '…'))
        : 'Original message';
      return `<div class="reply-quote" data-jump-to="${m.replyToId}">${escapeHtml(label.slice(0, 80))}</div>`;
    }

    // ── Multi-select (select many messages, delete at once) ───────────────
    let selectMode = false;
    let selectedIds = new Set();

    function bubbleHtml(m, isMine, chatId) {
      const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const statusTick = isMine ? ({ sending: '…', sent: '✓', delivered: '✓✓', read: '✓✓', failed: '⚠' }[m.status] || '') : '';
      const editedTag = m.isEdited ? ' (edited)' : '';
      const isDeletedForEveryone = m.deleted && m.deleteForEveryone;
      const decryptFailed = m.displayContent === '🔒 Encrypted message' || m.displayContent === '🔒 Unable to decrypt this message';
      const decryptPending = m.displayContent === 'Decrypting…';
      const content = isDeletedForEveryone ? 'This message was deleted' : (m.displayContent !== undefined ? m.displayContent : '…');
      const statusCard = isDeletedForEveryone ? '' : statusReplyHtml(m, isMine);
      const retryTitle = m.decryptFailureReason
        ? `Tap to retry decryption — ${escapeHtml(m.decryptFailureReason)}`
        : 'Tap to retry decryption';
      const contentAttrs = decryptFailed ? ` class="decrypt-retry" title="${retryTitle}" data-retry-message-id="${m.id}"`
                          : decryptPending ? ` class="decrypt-pending"` : '';
      const canAct = !m.deleted && typeof m.id === 'number';
      // FIX (SELECT-MODE): while selecting, the per-bubble "..." menu is
      // replaced with a checkbox instead of sitting alongside it — mirrors
      // how the rest of the app (and WhatsApp/Telegram) handles this, and
      // avoids a tap on the bubble accidentally opening the single-message
      // context menu mid-selection.
      const isSelected = canAct && selectedIds.has(m.id);
      const menuBtn = !canAct ? ''
        : selectMode
          ? `<input type="checkbox" class="bubble-select-checkbox" data-select-for="${m.id}"${isSelected ? ' checked' : ''}>`
          : `<button class="bubble-menu-btn" data-menu-for="${m.id}" title="More">⋮</button>`;
      const reactionsHtml = (m.reactions && Object.keys(m.reactions).length > 0) ?
        `<div class="bubble-reactions">${Object.values(m.reactions).map(e => `<span>${e}</span>`).join('')}</div>` : '';
      // FEATURE (WHICH-VERSION-DECRYPTED-THIS, requested behavior): a tiny
      // badge next to the timestamp saying whether a received message was
      // opened with the current Double Ratchet (v3) scheme or the legacy
      // static-key (v2) fallback — see js/message-e2e-core.js's
      // getDecryptVersion() for how m.decryptVersion gets populated. Own
      // messages always send with the current scheme, so this only ever
      // shows for received messages that were actually decrypted.
      const decryptVersionBadge = (!isMine && m.decryptVersion)
        ? (m.decryptVersion === 'v3'
            ? `<span class="decrypt-version-badge" title="Decrypted with the current Double Ratchet (v3) encryption">🔐</span>`
            : `<span class="decrypt-version-badge legacy" title="Decrypted with the legacy (v2) key fallback — did not use the current forward-secret encryption">🔓</span>`)
        : '';
      return `
        <div class="bubble-row ${isMine ? 'mine' : ''}${m.status === 'failed' ? ' failed' : ''}${selectMode ? ' selecting' : ''}${isSelected ? ' selected' : ''}" data-message-id="${m.id}">
          ${menuBtn}
          <div class="bubble${isDeletedForEveryone ? ' bubble-deleted' : ''}">
            ${!isDeletedForEveryone ? replyPreviewHtml(m, chatId) : ''}
            ${!isDeletedForEveryone ? attachmentHtml(m) : ''}
            ${statusCard}
            ${statusCard ? '' : '<span'+contentAttrs+'>'+ (content ? escapeHtml(content) : '') +'</span>'}${!isDeletedForEveryone ? editedTag : ''}
            ${reactionsHtml}
            <div class="bubble-meta"><span class="bubble-time">${time}</span> ${statusTick}${m.starred ? ' ⭐' : ''}${decryptVersionBadge}</div>

          </div>
        </div>`;
    }

    function normalizeChatPanelId(value) {
      const id = Number(value);
      return Number.isFinite(id) && id > 0 ? id : null;
    }

    function renderChatPanel(chatId, options = {}) {
      // A new chat panel render (opening a different chat, or the initial
      // render) always starts out of selection mode — a selection made in
      // one conversation should never silently carry over into another.
      selectMode = false;
      selectedIds = new Set();
      chatId = normalizeChatPanelId(chatId) || normalizeChatPanelId(window.MessageModule.getActiveChatId());
      const conv = chatId ? window.MessageModule.getConversations().find(c => c.chatId === chatId) : null;
      const hasChat = !!chatId;
      // INSTANT-OPEN (see js/message-client.js's 'chat:opening' notify):
      // when we don't have a real chatId yet but the caller (Friends/Calls/
      // Status/a notification) already told us who we're opening a chat
      // with, show that person's name in the header and a real loading
      // state — same idea as the group module's updateGroupChatHeader() +
      // renderGroupChatLoadingState() firing before its own network calls —
      // instead of the old bare "No conversation selected" + search-icon
      // placeholder while the conversationId resolves in the background.
      const pending = !hasChat ? options.pendingContact : null;
      const headerName = hasChat ? (conv?.otherUser?.username || 'Conversation') : (pending?.userName || 'No conversation selected');

      // ROOT-CAUSE FIX: this used to swap the whole panel for a static
      // "Select a conversation to start messaging" placeholder div whenever
      // there was no active chat. That's gone — the real header, message
      // list, reply bar, composer, emoji picker, attach button, and send
      // button are always built, every time. With no chat selected there's
      // just nothing yet to call/search/send to, so those specific controls
      // render disabled and the composer shows a neutral prompt instead of a
      // full-panel takeover.
      chatPanelEl.innerHTML = `
        <div id="chatHeader">
          <button id="backBtn"${(hasChat || pending) ? '' : ' disabled style="visibility:hidden;"'}>&larr;</button>
          ${pending && pending.avatar ? `<img class="conv-avatar" src="${escapeHtml(userAvatarSrc(pending))}" alt="" referrerpolicy="no-referrer" data-avatar="1" data-avatar-name="${escapeHtml(userAvatarName(pending))}" style="width:28px;height:28px;border-radius:50%;margin-right:8px;">` : ''}
          <strong id="chatHeaderName" style="cursor:${hasChat ? 'pointer' : 'default'};">${escapeHtml(headerName)}</strong>
          <div id="chatHeaderActions">
            <button class="header-icon-btn" id="searchInChatBtn" title="Search"${hasChat ? '' : ' disabled style="visibility:hidden;"'}>🔍</button>
            <button class="header-icon-btn" id="chatMoreBtn" title="More">⋮</button>
          </div>
          <div id="selectionActions" class="hidden">
            <button id="cancelSelectBtn" title="Cancel selection">&times;</button>
            <span id="selectionCount">0 selected</span>
            <button id="bulkDeleteBtn" title="Delete selected">🗑</button>
          </div>
        </div>
        <div id="chatSearchBar" class="hidden">
          <input type="text" id="chatSearchInput" placeholder="Search in this chat...">
          <span id="chatSearchCount"></span>
          <button id="closeChatSearchBtn">&times;</button>
        </div>
        ${options.retryBanner ? `
        <div id="chatOpenFailedBanner" style="padding:10px 14px;background:#fdecea;color:#611a15;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span>⚠️ Couldn't open this conversation.</span>
          <button id="retryOpenChatBtn" style="flex-shrink:0;">Try again</button>
        </div>` : ''}
        <div id="loadOlderBtn"${hasChat ? '' : ' style="display:none;"'}>Load earlier messages</div>
        <div id="messageLog">${pending ? `
          <div class="chat-loading-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--kyn-text-secondary);">
            <div class="spinner" style="width:22px;height:22px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:kyn-spin .8s linear infinite;"></div>
            <p style="margin-top:10px;">Opening chat with ${escapeHtml(pending.userName || 'user')}…</p>
          </div>
          <style>@keyframes kyn-spin{to{transform:rotate(360deg)}}</style>
        ` : ''}</div>
        <div id="composeBar">
          <button id="attachBtn" title="Attach file">${ICON_ATTACH}</button>
          <input type="file" id="attachInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt">
          <button id="emojiBtn" title="Emoji">${ICON_EMOJI}</button>
          <textarea id="composeInput" rows="1" placeholder="${hasChat ? 'Message...' : (pending ? 'Connecting…' : 'Pick a conversation to start typing…')}"></textarea>
          <button id="sendBtn"${hasChat ? '' : ' disabled'}>${ICON_SEND}</button>
        </div>
        <div id="emojiPicker" class="hidden"></div>
      `;

      if (hasChat) renderMessages(chatId);

      // ROOT-CAUSE FIX (header shows "offline" for a peer who is actually
      // online, until an incoming message happens to arrive): the parent
      // shell (js/chat-shell-message-presence-fix.js) only ever asked the
      // backend's authoritative presence registry in reaction to an
      // incoming message notification. Opening a chat never triggered that
      // check at all, so the header just displayed whatever `otherUser
      // .online` happened to already be cached (frequently still the
      // untouched default of false). Ask for a fresh, live answer the
      // moment a real chat is opened — the parent already knows how to
      // turn this into a `check_user_online` socket round trip and feed
      // the answer straight back into this same header via
      // FRIEND_ONLINE/FRIEND_OFFLINE (see the listener below).
      if (hasChat && conv && conv.otherUser && conv.otherUser.id != null) {
        try {
          window.parent.postMessage({ type: 'kyn:requestPresenceCheck', userId: conv.otherUser.id }, '*');
        } catch (_) {}
      }

      // FIX (PARENT-HEADER-CONSOLIDATION): with #chatHeader now hidden
      // (chat.html's mirrored #headerChatCtx is the only visible chat
      // header), the parent needs real data to populate it. chat.html
      // already knows how to render this (showChatHeader(), fed today by
      // CHAT_OPENED/CHAT_OPENING payloads) but had a second, dead
      // CHAT_HEADER_UPDATE listener that nothing ever posted to. Feed it
      // here too, on every header-relevant render, as the authoritative,
      // always-current source — cheap and keeps the mirrored header in
      // sync with search/typing/select-mode changes that don't go through
      // CHAT_OPENED at all.
      try {
        window.parent.postMessage({
          source: 'message-iframe',
          type: (hasChat || pending) ? 'CHAT_HEADER_UPDATE' : 'CHAT_PANEL_CLOSED',
          payload: (hasChat || pending) ? {
            chatId: chatId || (pending && pending.userId) || null,
            seq: (window.__kynChatHdrSeq = (window.__kynChatHdrSeq || 0) + 1),
            name: headerName,
            avatarUrl: (conv && conv.otherUser && conv.otherUser.avatar) || (pending && pending.avatar) || null,
            online: !!(conv && conv.otherUser && conv.otherUser.online),
          } : {},
          timestamp: Date.now(),
        }, '*');
      } catch (_) {}

      if (options.retryBanner) {
        const retryBtn = document.getElementById('retryOpenChatBtn');
        if (retryBtn) {
          retryBtn.addEventListener('click', () => {
            window.MessageModule.openChat({ userId: options.retryBanner.userId, conversationId: options.retryBanner.conversationId, force: true });
          });
        }
      }

      const otherUserId = conv?.otherUser?.id;
      document.getElementById('chatHeaderName').addEventListener('click', () => {
        if (!hasChat) return;
        openChatInfoPanel(chatId, conv);
      });

      const searchBar = document.getElementById('chatSearchBar');
      const chatSearchInput = document.getElementById('chatSearchInput');
      const chatSearchCount = document.getElementById('chatSearchCount');
      document.getElementById('searchInChatBtn').addEventListener('click', () => {
        // Search-in-chat and the other non-call, non-send controls stay
        // usable even with no conversation open (per product decision) —
        // only actually searching needs a chatId, which chatSearchInput's
        // own input handler below still guards.
        searchBar.classList.toggle('hidden');
        if (!searchBar.classList.contains('hidden')) chatSearchInput.focus();
      });
      document.getElementById('closeChatSearchBtn').addEventListener('click', () => {
        searchBar.classList.add('hidden');
        chatSearchInput.value = '';
        chatSearchCount.textContent = '';
        document.getElementById('messageLog').querySelectorAll('.search-hit').forEach(el => el.classList.remove('search-hit'));
      });
      chatSearchInput.addEventListener('input', () => {
        if (!hasChat) { chatSearchCount.textContent = ''; return; } // nothing to search without an open chat
        const msgLog = document.getElementById('messageLog');
        const results = window.MessageModule.searchMessages(chatId, chatSearchInput.value);
        msgLog.querySelectorAll('.search-hit').forEach(el => el.classList.remove('search-hit'));
        chatSearchCount.textContent = chatSearchInput.value.trim() ? `${results.length} found` : '';
        results.forEach(r => {
          const el = msgLog.querySelector(`[data-message-id="${r.id}"]`);
          if (el) el.classList.add('search-hit');
        });
        if (results.length > 0) {
          const first = msgLog.querySelector(`[data-message-id="${results[results.length - 1].id}"]`);
          if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      });

      const cancelSelectBtn = document.getElementById('cancelSelectBtn');
      const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
      if (cancelSelectBtn) cancelSelectBtn.addEventListener('click', exitSelectMode);
      if (bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', performBulkDelete);

      // ROOT-CAUSE FIX (RESTRUCTURE-MORE-MENU, requested behavior): this
      // used to be a single `prompt()` asking the person to TYPE the exact
      // word "select"/"clear"/"archive"/"block" — no visible options, easy
      // to mistype, and completely inaccessible on mobile where prompt()
      // boxes are awkward to use at all. Replaced with a real clickable
      // dropdown, reusing the same .bubble-context-menu look the per-
      // message "⋮" menu already established, so the two menus in this
      // app look and behave consistently.
      async function runChatMoreAction(action) {
        if (action === 'search') {
          document.getElementById('searchInChatBtn').click();
        } else if (action === 'select') {
          enterSelectMode(null);
        } else if (action === 'clear') {
          if (confirm('Clear this conversation for you? This cannot be undone.')) {
            window.MessageModule.getMessages(chatId).forEach(m => {
              if (typeof m.id === 'number') window.MessageModule.deleteMessage(chatId, m.id, { forEveryone: false });
            });
          }
        } else if (action === 'archive') {
          if (!confirm('Archive this conversation? Note: this archives it for both people in the chat, not just you.')) return;
          const res = await window.MessageModule.archiveChat(chatId);
          if (res && (res.status === 'success' || res.success)) {
            window.MessageModule.setActiveChatId(null);
            document.getElementById('convListPanel').classList.remove('hide-on-mobile');
            document.getElementById('chatPanel').classList.add('hide-on-mobile');
            renderChatPanel(null);
            renderConversationList();
          } else {
            alert('Could not archive chat: ' + (res && res.message ? res.message : 'unknown error'));
          }
        } else if (action === 'block') {
          if (!otherUserId) { alert('Cannot block: unknown user for this conversation.'); return; }
          if (!confirm(`Block ${conv?.otherUser?.username || 'this user'}? They won't be able to message you.`)) return;
          try {
            const res = await window.MessageModule.request().post(`/friends/${otherUserId}/block`);
            if (res && res.success !== false) {
              alert('User blocked.');
              window.MessageModule.setActiveChatId(null);
              document.getElementById('convListPanel').classList.remove('hide-on-mobile');
              document.getElementById('chatPanel').classList.add('hide-on-mobile');
              renderChatPanel(null);
              renderConversationList();
            } else {
              alert('Could not block user: ' + (res && res.message ? res.message : 'unknown error'));
            }
          } catch (err) {
            alert('Could not block user: ' + err.message);
          }
        }
      }

      function closeChatMoreMenu() {
        const existing = document.getElementById('chatMoreMenu');
        if (existing) existing.remove();
      }

      document.getElementById('chatMoreBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!hasChat) { alert('Select a conversation first.'); return; }
        closeChatMoreMenu();
        closeBubbleMenu();
        const menu = document.createElement('div');
        menu.id = 'chatMoreMenu';
        menu.className = 'bubble-context-menu';
        const items = [
          // FIX (PARENT-HEADER-CONSOLIDATION): the standalone 🔍 search
          // icon this menu's parent header used to show lives here now —
          // chat.html's mirrored header only surfaces back/name/call/
          // video/more per spec, so "search in chat" moved under More
          // instead of being dropped. searchInChatBtn itself is unchanged.
          { action: 'search', label: '🔍 Search in chat' },
          { action: 'select', label: '☑ Select messages' },
          { action: 'clear', label: '🧹 Clear chat' },
          { action: 'archive', label: '🗄 Archive chat' },
          { action: 'block', label: '🚫 Block user' },
        ];
        menu.innerHTML = items.map(it => `<button data-more-action="${it.action}">${it.label}</button>`).join('');
        document.body.appendChild(menu);
        const rect = e.currentTarget.getBoundingClientRect();
        menu.style.top = `${rect.bottom + 4}px`;
        menu.style.left = `${Math.max(8, rect.right - 180)}px`;
        menu.querySelectorAll('button[data-more-action]').forEach(btn => {
          btn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            closeChatMoreMenu();
            runChatMoreAction(btn.dataset.moreAction);
          });
        });
        setTimeout(() => document.addEventListener('click', closeChatMoreMenu, { once: true }), 0);
      });

      const emojiBtn = document.getElementById('emojiBtn');
      const emojiPicker = document.getElementById('emojiPicker');
      const EMOJI_SET = ['😀','😂','😍','😊','😉','😢','😮','😡','👍','👎','❤️','🔥','🎉','🙏','👏','😴','🤔','😎','😭','💯'];
      emojiPicker.innerHTML = EMOJI_SET.map(e => `<button class="emoji-option">${e}</button>`).join('');
      emojiBtn.addEventListener('click', () => {
        emojiPicker.classList.toggle('hidden');
      });
      emojiPicker.querySelectorAll('.emoji-option').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('composeInput').value += btn.textContent;
          emojiPicker.classList.add('hidden');
          document.getElementById('composeInput').focus();
        });
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        if (!hasChat) return;
        window.MessageModule.sendTypingStop(chatId);
        window.MessageModule.setActiveChatId(null);
        document.getElementById('convListPanel').classList.remove('hide-on-mobile');
