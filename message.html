        document.getElementById('chatPanel').classList.add('hide-on-mobile');
        renderChatPanel(null);
        // ROOT-CAUSE FIX (mobile bottom nav bar stays hidden after tapping
        // back from a chat to the chat list): chat.html's shell already
        // listens for CHAT_LIST_SHOWN/CHAT_CLOSED/GO_BACK_TO_CHAT_LIST to
        // remove its own body.chat-panel-active class (which is what hides
        // .mobile-nav-bar via CSS while a chat is open — see chat.html's
        // window.addEventListener('message', ...) handler for those
        // types) — the group module's back button already posts the
        // equivalent GO_BACK_TO_LIST for that same reason. This back
        // button never posted anything at all, so the shell had no way to
        // know the person left the chat and the nav bar (and #globalHeader
        // chat-mode styling) stayed stuck in "chat open" state until some
        // other navigation happened to clear it.
        try {
          window.parent.postMessage({ type: 'CHAT_LIST_SHOWN', timestamp: Date.now() }, '*');
          window.parent.postMessage({ source: 'message-iframe', type: 'CHAT_PANEL_CLOSED', timestamp: Date.now() }, '*');
        } catch (_) {}
      });

      document.getElementById('loadOlderBtn').addEventListener('click', async () => {
        if (!hasChat) return;
        const msgs = window.MessageModule.getMessages(chatId);
        const oldestId = msgs.length ? msgs[0].id : null;
        if (typeof oldestId !== 'number') return; // no real cursor yet (all optimistic/local)
        await window.MessageModule.loadHistory(chatId, { before: oldestId });
        renderMessages(chatId, { preserveScroll: 'prepend' });
      });

      const input = document.getElementById('composeInput');
      const sendBtn = document.getElementById('sendBtn');
      // FIX (Autocorrect setting has no effect): Settings -> Chat -> Autocorrect saved
      // chat.autoCorrect but nothing ever read it — the compose box always used the browser's
      // default spellcheck behavior regardless of the toggle. Apply it on load and keep it live.
      function applyAutoCorrectSetting() {
        const on = window.MessageModule.getSetting('chat', 'autoCorrect') !== false;
        input.spellcheck = on;
        input.setAttribute('autocorrect', on ? 'on' : 'off');
        input.setAttribute('autocapitalize', on ? 'sentences' : 'off');
      }
      applyAutoCorrectSetting();
      const attachBtn = document.getElementById('attachBtn');
      const attachInput = document.getElementById('attachInput');

      // ROOT-CAUSE FIX (can't send another message until the previous one
      // is delivered/times out): this used to disable sendBtn, `await`
      // the full sendMessage() round trip (the REST call plus, after the
      // earlier fix, up to 50s of timeout margin), and only then re-enable
      // the button — so a slow network turned every send into a forced
      // wait before the next message could even be composed. There's no
      // real reason for that: sendMessage() already inserts its optimistic
      // bubble and returns almost immediately, and getMessages() already
      // sorts by createdAt (set synchronously, in call order) whenever
      // either side is still optimistic — see the ROOT-CAUSE FIX comment
      // on that sort in js/message-client.js — so messages render in the
      // order they were actually sent regardless of which network request
      // happens to resolve first. Fire the send without awaiting it here,
      // so the compose box is free again immediately and several messages
      // can be sent back to back; each still gets delivered, in the order
      // it was sent.
      async function doSend() {
        if (!hasChat) return;
        const content = input.value.trim();
        if (!content) return;
        // FIX (Confirm Before Sending setting has no effect): Settings -> Chat -> Confirm Send
        // saved chat.confirmSend but nothing ever read it — messages always sent immediately on
        // Enter/tap regardless of the toggle.
        if (window.MessageModule.getSetting('chat', 'confirmSend') === true) {
          if (!window.confirm('Send this message?')) return;
        }
        input.value = '';
        window.MessageModule.sendTypingStop(chatId);
        clearTimeout(typingStopTimer);
        const replyToId = activeReplyTo ? activeReplyTo.messageId : null;
        activeReplyTo = null;
        renderReplyBar();
        window.MessageModule.sendMessage({ chatId, content, replyToId }).catch(() => {});
        input.focus();
      }

      let typingStopTimer = null;
      sendBtn.addEventListener('click', doSend);
      input.addEventListener('input', () => {
        if (!hasChat) return;
        window.MessageModule.sendTypingStart(chatId);
        clearTimeout(typingStopTimer);
        typingStopTimer = setTimeout(() => window.MessageModule.sendTypingStop(chatId), 3000);
      });
      input.addEventListener('keydown', (e) => {
        if (!hasChat) return;
        if (e.key !== 'Enter' || e.shiftKey) return;
        const sendOnEnter = window.MessageModule.getSetting('chat', 'enterToSend') !== false;
        if (sendOnEnter) { e.preventDefault(); doSend(); }
        // else: let Enter insert a newline as normal textarea behavior
      });

      attachBtn.addEventListener('click', () => {
        attachInput.click();
      });
      attachInput.addEventListener('change', async () => {
        if (!hasChat) { alert('Select a conversation first.'); attachInput.value = ''; return; }
        const file = attachInput.files[0];
        if (!file) return;
        attachBtn.disabled = true;
        attachBtn.innerHTML = ICON_ATTACH_BUSY;
        try {
          const attachment = await window.MessageModule.uploadAttachment(file);
          const caption = input.value.trim();
          input.value = '';
          await window.MessageModule.sendMessage({ chatId, content: caption, attachment });
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          attachBtn.disabled = false;
          attachBtn.innerHTML = ICON_ATTACH;
          attachInput.value = '';
        }
      });
    }

    function dateSeparatorLabel(dateStr) {
      const d = new Date(dateStr);
      const today = new Date();
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      const sameDay = (a, b) => a.toDateString() === b.toDateString();
      if (sameDay(d, today)) return 'Today';
      if (sameDay(d, yesterday)) return 'Yesterday';
      return d.toLocaleDateString([], { month: 'long', day: 'numeric', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
    }

    // ROOT-CAUSE FIX (chat opens at the top): renderMessages() used to apply
    // the SAME "preserve scroll" math to two completely different
    // situations. That math (`log.scrollTop = log.scrollHeight - prevHeight`)
    // is only correct for PREPENDING older history above the current view
    // (Load Earlier Messages) — it deliberately ignores whatever scrollTop
    // was before the render and rebuilds it purely from the height delta,
    // which is exactly what you want when new content is inserted above
    // what's on screen.
    //
    // But loadHistory() (js/message-client.js) fires a separate
    // 'message:added' event for every individual message in the initial
    // history batch when a conversation is opened (up to 50 in a row, all
    // synchronously in one tick), and this file's subscribe() handler ran
    // every one of those through the exact same preserveScroll:true path.
    // For an APPENDED message, that formula collapses to "the height of
    // just the newest message" each time (prevHeight is the height before
    // that one message was added), so the effective scrollTop shrinks back
    // toward a small number every call — ending with the view sitting near
    // the top of a long conversation right after opening it, even though
    // the panel's very first render (see the plain renderMessages(chatId)
    // call above, preserveScroll left false) correctly asked for the
    // bottom.
    //
    // Fix: three distinct, explicit modes instead of one boolean:
    //   preserveScroll === false      → always scroll to the very bottom.
    //     Used for the initial full-panel render when a chat is opened.
    //   preserveScroll === true       → "sticky" update (new/edited/
    //     starred/reacted/decrypted message, and — critically — every
    //     'message:added' fired while the initial history batch streams
    //     in). Snaps to the bottom UNLESS the user has actually scrolled
    //     up first, in which case their position is left alone. This is
    //     what makes the history-loading burst end at the bottom (each
    //     call sees "was already at/near bottom" and keeps re-bottoming)
    //     while still respecting "once the user manually scrolls upward,
    //     subsequent renders must preserve that position."
    //   preserveScroll === 'prepend'  → Load Earlier Messages only: shift
    //     scrollTop by exactly how much taller the log just got, so the
    //     messages already on screen don't jump.
    function renderMessages(chatId, { preserveScroll = false } = {}) {
      const log = document.getElementById('messageLog');
      if (!log) return;

      const BOTTOM_THRESHOLD = 100; // px — "close enough to the bottom" to keep following it
      const distanceFromBottom = log.scrollHeight - log.scrollTop - log.clientHeight;
      const wasNearBottom = distanceFromBottom < BOTTOM_THRESHOLD;
      const prevScrollTop = log.scrollTop;
      const prevScrollHeight = log.scrollHeight;

      const currentUserId = window._kynCurrentUserId;
      const msgs = window.MessageModule.getMessages(chatId);

      let html = '';
      let lastDateKey = null;
      msgs.forEach(m => {
        const dateKey = m.createdAt ? new Date(m.createdAt).toDateString() : null;
        if (dateKey && dateKey !== lastDateKey) {
          html += `<div class="date-separator"><span>${dateSeparatorLabel(m.createdAt)}</span></div>`;
          lastDateKey = dateKey;
        }
        html += bubbleHtml(m, m.senderId === currentUserId, chatId);
      });
      log.innerHTML = html;

      if (preserveScroll === 'prepend') {
        log.scrollTop = prevScrollTop + (log.scrollHeight - prevScrollHeight);
      } else if (preserveScroll && !wasNearBottom) {
        log.scrollTop = prevScrollTop;
      } else {
        log.scrollTop = log.scrollHeight;
      }

      log.querySelectorAll('.bubble-menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const messageId = Number(btn.dataset.menuFor);
          openBubbleMenu(btn, chatId, messageId);
        });
      });

      // Selection mode: a checkbox click (or a tap anywhere on the bubble
      // row while selecting — mirrors WhatsApp/Telegram) toggles that
      // message in/out of the current selection.
      log.querySelectorAll('.bubble-select-checkbox').forEach(cb => {
        cb.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSelectMessage(Number(cb.dataset.selectFor));
        });
      });
      if (selectMode) {
        log.querySelectorAll('.bubble-row.selecting').forEach(row => {
          row.addEventListener('click', () => {
            const id = Number(row.dataset.messageId);
            if (Number.isFinite(id)) toggleSelectMessage(id);
          });
        });
      }

      // Long-press (touch) or right-click (mouse) a bubble to open the
      // per-message action menu (Reply/Forward/Copy/React/Star/Edit/
      // Delete/Select) — the discoverable entry point on touch devices,
      // where there's no hover to reveal the "..." button in the first
      // place. "Select" is one of that menu's own items, so multi-select
      // is still one tap away from here, matching WhatsApp/Telegram: a
      // hold opens the action menu, not bulk-select directly.
      // ROOT-CAUSE FIX (long-press/right-click did nothing but enter
      // multi-select — none of Reply/Forward/Copy/React/Star/Edit/Delete
      // were reachable without first hunting for the small "..." button):
      // this used to call enterSelectMode(id) directly, which only ever
      // shows checkboxes — it never opened openBubbleMenu() at all, so a
      // person holding a message never saw any of the actual message
      // actions, only "N selected". Route the hold/right-click to the
      // same openBubbleMenu() the "..." button already uses, anchored on
      // the row itself since there's no dedicated button under a finger
      // mid-press.
      if (!selectMode) {
        log.querySelectorAll('.bubble-row').forEach(row => {
          const id = Number(row.dataset.messageId);
          if (!Number.isFinite(id)) return;
          let pressTimer = null;
          row.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => openBubbleMenu(row, chatId, id), 500);
          }, { passive: true });
          // FIX (TOUCHMOVE-SCROLL-VIOLATION): these handlers never call
          // preventDefault(), so there was no reason for the browser to keep
          // them as scroll-blocking by default — that's what was triggering
          // Chrome's "[Violation] Added non-passive event listener to a
          // scroll-blocking 'touchmove' event" warning on every single
          // renderMessages() call (i.e. on every incoming message). Marking
          // them passive, same as the touchstart listener above, removes the
          // warning and lets the browser start scrolling immediately instead
          // of waiting to see if this handler will cancel it.
          ['touchend', 'touchmove', 'touchcancel'].forEach(evt => {
            row.addEventListener(evt, () => { if (pressTimer) clearTimeout(pressTimer); }, { passive: true });
          });
          row.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openBubbleMenu(row, chatId, id);
          });
        });
      }

      log.querySelectorAll('.reply-quote').forEach(el => {
        el.addEventListener('click', () => {
          const target = document.querySelector(`[data-message-id="${el.dataset.jumpTo}"]`);
          if (target) {
            target.scrollIntoView({ block: 'center', behavior: 'smooth' });
            target.style.outline = '2px solid var(--kyn-accent-primary)';
            setTimeout(() => { target.style.outline = ''; }, 1200);
          }
        });
      });

      log.querySelectorAll('.decrypt-retry').forEach(el => {
        el.addEventListener('click', async () => {
          const messageId = Number(el.dataset.retryMessageId);
          await window.MessageModule.retryDecrypt(chatId, messageId);
        });
      });
    }

    // ── Bubble context menu (Reply, Forward, Copy, React, Star, Edit, Delete) ──
    let activeReplyTo = null; // { messageId, chatId, preview }

    // ── Multi-select delete (spec: "delete many messages at once", no
    // separate "select" entry point previously existed at all) ────────────
    function enterSelectMode(initialMessageId) {
      selectMode = true;
      selectedIds = new Set(initialMessageId != null ? [initialMessageId] : []);
      closeBubbleMenu();
      renderMessages(window.MessageModule.getActiveChatId(), { preserveScroll: true });
      updateSelectionBar();
    }

    function exitSelectMode() {
      if (!selectMode) return;
      selectMode = false;
      selectedIds = new Set();
      const chatId = window.MessageModule.getActiveChatId();
      if (chatId) renderMessages(chatId, { preserveScroll: true });
      updateSelectionBar();
    }

    function toggleSelectMessage(messageId) {
      if (selectedIds.has(messageId)) selectedIds.delete(messageId);
      else selectedIds.add(messageId);
      if (selectedIds.size === 0) { exitSelectMode(); return; }
      const chatId = window.MessageModule.getActiveChatId();
      if (chatId) renderMessages(chatId, { preserveScroll: true });
      updateSelectionBar();
    }

    // Toggles the header between its normal icon row and the selection
    // count/cancel/delete bar. Header markup is rebuilt fresh every time a
    // chat is opened (renderChatPanel) but NOT on every message render, so
    // this only needs to flip visibility/text — it doesn't rebuild it.
    function updateSelectionBar() {
      const actions = document.getElementById('chatHeaderActions');
      const selectionBar = document.getElementById('selectionActions');
      const headerEl = document.getElementById('chatHeader');
      if (!actions || !selectionBar) return;
      if (selectMode) {
        actions.classList.add('hidden');
        selectionBar.classList.remove('hidden');
        const count = document.getElementById('selectionCount');
        if (count) count.textContent = `${selectedIds.size} selected`;
        // FIX (PARENT-HEADER-CONSOLIDATION): #chatHeader is hidden by
        // default now (chat.html's mirrored header owns the normal
        // back/name/call/video/more row) — but the multi-select bar has no
        // parent-side equivalent, so surface it locally for exactly as
        // long as selection mode is active.
        if (headerEl) headerEl.classList.add('selection-active');
      } else {
        actions.classList.remove('hidden');
        selectionBar.classList.add('hidden');
        if (headerEl) headerEl.classList.remove('selection-active');
      }
    }

    async function performBulkDelete() {
      const chatId = window.MessageModule.getActiveChatId();
      if (!chatId || selectedIds.size === 0) return;
      const ids = Array.from(selectedIds);
      const allMine = ids.every((id) => {
        const m = window.MessageModule.getMessages(chatId).find(x => x.id === id);
        return m && m.senderId === window._kynCurrentUserId;
      });
      let forEveryone = false;
      if (allMine) {
        forEveryone = confirm(`Delete ${ids.length} message(s) for everyone? Click Cancel to delete just for you.`);
      } else if (!confirm(`Delete ${ids.length} message(s) for you?`)) {
        return;
      }
      await window.MessageModule.bulkDeleteMessages(chatId, ids, { forEveryone });
      exitSelectMode();
    }

    function closeBubbleMenu() {
      const existing = document.getElementById('bubbleContextMenu');
      if (existing) existing.remove();
    }

    function openBubbleMenu(anchorEl, chatId, messageId) {
      closeBubbleMenu();
      const current = window.MessageModule.getMessages(chatId).find(m => m.id === messageId);
      // FIX (menu silently does nothing — most visible on a received
      // message that failed to decrypt): this used to just `return` here
      // with no menu, no error, nothing — indistinguishable from a broken
      // button to the user. Whatever the reason getMessages() didn't
      // return this exact id (a render slightly ahead of a state update
      // mid-sync is the likeliest, but this should never leave the user
      // with a dead button regardless of the cause), fall back to a
      // minimal menu that still offers the one action that only needs the
      // id itself — delete "for me", which every participant can always
      // do — instead of silently no-op'ing.
      if (!current) {
        console.warn('[Messages] openBubbleMenu: message', messageId, 'not found in local state — showing fallback menu');
        const fallbackMenu = document.createElement('div');
        fallbackMenu.id = 'bubbleContextMenu';
        fallbackMenu.className = 'bubble-context-menu';
        fallbackMenu.innerHTML = `<button data-menu-action="delete">🗑 Delete</button>`;
        document.body.appendChild(fallbackMenu);
        const fbRect = anchorEl.getBoundingClientRect();
        fallbackMenu.style.top = `${fbRect.bottom + 4}px`;
        fallbackMenu.style.left = `${Math.max(8, fbRect.left - 120)}px`;
        fallbackMenu.querySelector('button').addEventListener('click', async (e) => {
          e.stopPropagation();
          closeBubbleMenu();
          if (!confirm('Delete this message for you?')) return;
          await window.MessageModule.deleteMessage(chatId, messageId, { forEveryone: false });
        });
        setTimeout(() => document.addEventListener('click', closeBubbleMenu, { once: true }), 0);
        return;
      }
      const isMine = current.senderId === window._kynCurrentUserId;

      const menu = document.createElement('div');
      menu.id = 'bubbleContextMenu';
      menu.className = 'bubble-context-menu';
      const items = [
        { action: 'reply', label: '↩ Reply' },
        { action: 'forward', label: '➦ Forward' },
        { action: 'copy', label: '⧉ Copy' },
        { action: 'react', label: '🙂 React' },
        { action: 'star', label: current.starred ? '⭐ Unstar' : '☆ Star' },
        { action: 'select', label: '☑ Select' },
      ];
      if (isMine) items.push({ action: 'edit', label: '✎ Edit' });
      // FIX (NO-DELETE-ON-RECEIVED-MESSAGES): this used to only add Delete
      // when isMine — a message someone else sent you had no delete
      // option at all, not even "delete for me". Any participant can
      // always remove a message from their own view; only "delete for
      // everyone" is sender-only (enforced server-side too, see
      // routes/messages.js _deleteOneMessage), so that choice is only
      // offered when it's actually your own message.
      items.push({ action: 'delete', label: '🗑 Delete' });
      menu.innerHTML = items.map(i => `<button data-menu-action="${i.action}">${i.label}</button>`).join('');
      document.body.appendChild(menu);

      const rect = anchorEl.getBoundingClientRect();
      menu.style.top = `${rect.bottom + 4}px`;
      menu.style.left = `${Math.max(8, rect.left - 120)}px`;

      menu.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          closeBubbleMenu();
          await handleBubbleMenuAction(btn.dataset.menuAction, chatId, messageId, current);
        });
      });

      setTimeout(() => document.addEventListener('click', closeBubbleMenu, { once: true }), 0);
    }

    async function handleBubbleMenuAction(action, chatId, messageId, current) {
      switch (action) {
        case 'reply':
          activeReplyTo = { messageId, chatId, preview: (current.displayContent || '📎 Attachment').slice(0, 80) };
          renderReplyBar();
          document.getElementById('composeInput')?.focus();
          break;
        case 'forward':
          openForwardPicker(current);
          break;
        case 'copy':
          try { await navigator.clipboard.writeText(current.displayContent || ''); } catch (_) {}
          break;
        case 'react': {
          const emoji = prompt('React with an emoji:', '👍');
          if (emoji && emoji.trim()) await window.MessageModule.reactToMessage(chatId, messageId, emoji.trim());
          break;
        }
        case 'star':
          if (current.starred) await window.MessageModule.unstarMessage(chatId, messageId);
          else await window.MessageModule.starMessage(chatId, messageId);
          renderMessages(chatId, { preserveScroll: true });
          break;
        case 'edit': {
          const newContent = prompt('Edit message:', current.displayContent || '');
          if (newContent && newContent.trim()) await window.MessageModule.editMessage(chatId, messageId, newContent.trim());
          break;
        }
        case 'select':
          enterSelectMode(messageId);
          break;
        case 'delete': {
          const isMine = current.senderId === window._kynCurrentUserId;
          let forEveryone = false;
          if (isMine) {
            forEveryone = confirm('Delete for everyone? Click Cancel to delete just for you.');
          } else if (!confirm('Delete this message for you?')) {
            return;
          }
          await window.MessageModule.deleteMessage(chatId, messageId, { forEveryone });
          break;
        }
      }
    }

    function renderReplyBar() {
      const composeBar = document.getElementById('composeBar');
      if (!composeBar) return;
      let bar = document.getElementById('replyBar');
      if (!activeReplyTo) { if (bar) bar.remove(); return; }
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'replyBar';
        composeBar.parentNode.insertBefore(bar, composeBar);
      }
      bar.innerHTML = `
        <div class="reply-bar-text">Replying to: ${escapeHtml(activeReplyTo.preview)}</div>
        <button id="cancelReplyBtn">&times;</button>`;
      document.getElementById('cancelReplyBtn').addEventListener('click', () => {
        activeReplyTo = null;
        renderReplyBar();
      });
    }

    // ── Forward: reuses the New Chat picker, but forwards a message instead of just opening the chat ──
    let forwardingMessage = null;

    function openChatInfoPanel(chatId, conv) {
      const body = document.getElementById('chatInfoBody');
      const messages = window.MessageModule.getMessages(chatId);
      const mediaMessages = messages.filter(m => m.metadata && m.metadata.attachment && (m.metadata.attachment.type === 'image'));
      const fileMessages = messages.filter(m => m.metadata && m.metadata.attachment && m.metadata.attachment.type !== 'image');

      body.innerHTML = `
        <div class="chat-info-header">
          <img src="${escapeHtml(userAvatarSrc(conv?.otherUser))}" class="chat-info-avatar" referrerpolicy="no-referrer" data-avatar="1" data-avatar-name="${escapeHtml(userAvatarName(conv?.otherUser))}">
          <div class="chat-info-name">${escapeHtml(conv?.otherUser?.username || 'Conversation')}</div>
        </div>
        <div class="chat-info-section">
          <div class="chat-info-section-title">Shared media (${mediaMessages.length})</div>
          <div class="chat-info-media-grid">
            ${mediaMessages.slice(-12).reverse().map(m => `<img src="${escapeHtml(m.metadata.attachment.url)}" data-view-image="${escapeHtml(m.metadata.attachment.url)}">`).join('') || '<div class="chat-info-empty">No media shared yet</div>'}
          </div>
        </div>
        <div class="chat-info-section">
          <div class="chat-info-section-title">Documents (${fileMessages.length})</div>
          ${fileMessages.slice(-8).reverse().map(m => `
            <a class="chat-info-doc" href="${escapeHtml(m.metadata.attachment.url)}" target="_blank" rel="noopener">
              📄 ${escapeHtml(m.metadata.attachment.originalName || 'Document')}
            </a>`).join('') || '<div class="chat-info-empty">No documents shared yet</div>'}
        </div>
      `;
      document.getElementById('chatInfoModal').classList.remove('hidden');
    }

    function openForwardPicker(message) {
      forwardingMessage = message;
      closeMultiSendPicker();
      document.getElementById('newChatModal').classList.remove('hidden');
      newChatSearchInput.value = '';
      newChatSearchInput.classList.add('hidden');
      document.querySelector('#newChatModal .modal-header span').textContent = 'Forward to...';
      runNewChatSearch('');
    }

    // ── Multi-send / Broadcast: same picker, checkbox multi-select + a
    // compose footer instead of tap-to-open-one-chat. Sending loops the
    // exact same window.MessageModule.sendMessage() call the working 1:1
    // chat and the single-recipient Forward feature already use, once per
    // selected recipient — no second/competing send pipeline. ──
    let broadcastMode = false;
    let broadcastSelectedIds = new Set();

    function updateBroadcastComposeBar() {
      const bar = document.getElementById('broadcastComposeBar');
      const countEl = document.getElementById('broadcastSelectedCount');
      const sendBtn = document.getElementById('broadcastSendBtn');
      if (!bar) return;
      if (!broadcastMode) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      const n = broadcastSelectedIds.size;
      countEl.textContent = n === 0 ? 'Select people to send to' : `${n} selected`;
      const input = document.getElementById('broadcastComposeInput');
      sendBtn.disabled = n === 0 || !input.value.trim();
    }

    function openMultiSendPicker() {
      forwardingMessage = null;
      broadcastMode = true;
      broadcastSelectedIds = new Set();
      newChatModal.classList.remove('hidden');
      newChatSearchInput.value = '';
      newChatSearchInput.classList.add('hidden');
      document.querySelector('#newChatModal .modal-header span').textContent = 'Send to multiple';
      const input = document.getElementById('broadcastComposeInput');
      if (input) input.value = '';
      updateBroadcastComposeBar();
      runNewChatSearch('');
    }

    function closeMultiSendPicker() {
      broadcastMode = false;
      broadcastSelectedIds = new Set();
      updateBroadcastComposeBar();
    }

    async function sendBroadcast() {
      const input = document.getElementById('broadcastComposeInput');
      const content = (input?.value || '').trim();
      const sendBtn = document.getElementById('broadcastSendBtn');
      if (!content || broadcastSelectedIds.size === 0) return;
      const targets = Array.from(broadcastSelectedIds);
      sendBtn.disabled = true;
      const originalLabel = sendBtn.textContent;
      sendBtn.textContent = '…';
      // FIX (SAME-PATH-FOR-EVERY-RECIPIENT, requested behavior): each
      // recipient gets its own independent sendMessage() call — the exact
      // path that already works for a normal 1:1 chat (per-recipient E2E
      // encryption keyed to that recipient's own public key, its own
      // delivery/ACK tracking, its own conversation row) — instead of one
      // shared ciphertext or a single batched request. A failure sending to
      // one person (blocked, key not ready, offline) never blocks or
      // corrupts delivery to the others; failures are collected and
      // reported together at the end instead of silently dropped.
      const results = await Promise.allSettled(
        targets.map(userId => window.MessageModule.sendMessage({ receiverId: userId, content }))
      );
      const failures = results.filter(r => r.status === 'rejected').length;
      sendBtn.textContent = originalLabel;
      newChatModal.classList.add('hidden');
      closeMultiSendPicker();
      if (failures > 0) {
        alert(`Sent to ${targets.length - failures} of ${targets.length} people. ${failures} failed — check those chats and retry if needed.`);
      }
    }

    const newChatModal = document.getElementById('newChatModal');
    const newChatSearchInput = document.getElementById('newChatSearchInput');
    const newChatResults = document.getElementById('newChatResults');

    // ROOT-CAUSE FIX (friends not shown instantly on "Start a chat"): chat.html
    // (the shell) already pushes the user's friends list to every module the
    // same way — sendFriendsToStatusIframe/GroupIframe/CallsIframe/ToolsIframe
    // all have a sibling sendFriendsToMessagesIframe() that posts
    // {type:'FRIENDS_LIST_UPDATE', payload:{friends}} straight to
    // #messagesIframe (this document) every time the friend list changes, and
    // again in response to a GET_FRIENDS_LIST request (see chat.html). This
    // document never had a `message` listener at all, so every one of those
    // pushes was silently dropped and the New Chat modal fell back to a cold
    // IndexedDB/localStorage/network chain every time it opened. Calls and
    // Groups already listen for exactly this event (see calls-ui.js's
    // setupFriendsListListener / GroupModerationEngine._attachListeners) —
    // mirror that here so friends paint instantly, the same as those modules.
    let pushedFriendsCache = [];
    function normalizePushedFriend(f) {
      // .friendId covers records read straight out of KynectaFriendsLocalStore
      // (IndexedDB) — friend-core.operations.js's saveFriendLocal() upserts
      // those keyed by friendId, not id (see that file's saveFriendLocal).
      const id = f && (f.id ?? f.userId ?? f.friendId);
      if (id == null) return null;
      return {
        id: Number(id) || id,
        username: f.username || f.displayName || f.name || '',
        displayName: f.displayName || f.username || f.name || '',
        avatar: f.avatar || f.photoURL || f.profilePicture || '',
        firstName: f.firstName || '',
        lastName: f.lastName || '',
      };
    }
    // FIX (BACK-STACK-EXACT-RESTORE, messages side): chat.html used to
    // force this iframe back to its chat list every time the user
    // navigated to a different module (MODULE_BLURRED), even when that
    // navigation was the back button unwinding history and should have
    // preserved exactly which chat was open. chat.html now only sends
    // that forced-reset on a genuine deliberate switch (not
    // fromHistory) — so an open chat's DOM here is simply left alone and
    // is still showing correctly when this module becomes visible again.
    // What's missing without this listener: the PARENT's own chrome
    // (chat-panel-active body class + the mirrored header) was still
    // reset the moment focus left, and nothing told it to catch back up.
    // Re-announce the still-open chat on every MODULE_FOCUSED so the
    // parent re-syncs — reusing the exact same CHAT_HEADER_UPDATE feed
    // renderChatPanel() already sends on open, not a new code path.
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'MODULE_FOCUSED') {
        const activeId = window.MessageModule && window.MessageModule.getActiveChatId && window.MessageModule.getActiveChatId();
        const panelVisible = chatPanelEl && !chatPanelEl.classList.contains('hide-on-mobile');
        if (activeId && panelVisible) {
          const conv = window.MessageModule.getConversations().find(c => c.chatId === activeId);
          // Same live presence re-check as renderChatPanel's open path —
          // refocusing an already-open chat (e.g. switching back from
          // another module) deserves an up-to-date header just as much as
          // a fresh open does.
          if (conv && conv.otherUser && conv.otherUser.id != null) {
            try {
              window.parent.postMessage({ type: 'kyn:requestPresenceCheck', userId: conv.otherUser.id }, '*');
            } catch (_) {}
          }
          try {
            window.parent.postMessage({
              source: 'message-iframe',
              type: 'CHAT_HEADER_UPDATE',
              payload: {
                chatId: activeId,
                seq: (window.__kynChatHdrSeq = (window.__kynChatHdrSeq || 0) + 1),
                name: conv?.otherUser?.username || 'Conversation',
                avatarUrl: conv?.otherUser?.avatar || null,
                online: !!(conv && conv.otherUser && conv.otherUser.online),
              },
              timestamp: Date.now(),
            }, '*');
          } catch (_) {}
        }
        return;
      }
      // FIX-ROOT-CAUSE-STUCK-OFFLINE: chat.html's _fwdPresenceToMessages
      // already posts these on every 'user:online'/'user:offline'/
      // 'presence:update' socket event — this module just never listened.
      // Update the client-side state (also fixes the sidebar via the same
      // 'conversation:updated' notify every other patch goes through), then
      // re-announce the header immediately if the update is for whoever the
      // currently open chat is with — same CHAT_HEADER_UPDATE feed used by
      // MODULE_FOCUSED above, not a new code path.
      if (data.type === 'FRIEND_ONLINE' || data.type === 'FRIEND_OFFLINE') {
        const presP = data.payload || {};
        if (presP.userId != null && window.MessageModule && typeof window.MessageModule.updatePresence === 'function') {
          window.MessageModule.updatePresence(presP.userId, data.type === 'FRIEND_ONLINE', presP.lastSeen);
          const activeId2 = window.MessageModule.getActiveChatId && window.MessageModule.getActiveChatId();
          if (activeId2) {
            const conv2 = window.MessageModule.getConversations().find(c => c.chatId === activeId2);
            if (conv2 && conv2.otherUser && String(conv2.otherUser.id) === String(presP.userId)) {
              try {
                window.parent.postMessage({
                  source: 'message-iframe',
                  type: 'CHAT_HEADER_UPDATE',
                  payload: {
                    chatId: activeId2,
                    seq: (window.__kynChatHdrSeq = (window.__kynChatHdrSeq || 0) + 1),
                    name: conv2.otherUser.username || 'Conversation',
                    avatarUrl: conv2.otherUser.avatar || null,
                    online: !!conv2.otherUser.online,
                  },
                  timestamp: Date.now(),
                }, '*');
              } catch (_) {}
            }
          }
        }
        return;
      }
      if (data.type !== 'FRIENDS_LIST_UPDATE' && data.type !== 'FRIENDS_LIST_RESPONSE' &&
          data.type !== 'FRIENDS_DATA' && data.type !== 'FRIENDS_SYNC') return;
      const rawFriends = (data.payload && data.payload.friends) || data.friends || [];
      if (!Array.isArray(rawFriends) || rawFriends.length === 0) return;
      pushedFriendsCache = rawFriends.map(normalizePushedFriend).filter(Boolean);
      // Persist alongside the same IndexedDB 'users' store the discovery
      // cache uses (keyed by id, so this only ever fills in/updates entries —
      // never clobbers the broader discoverable-users list) so a friend is
      // still there for an instant paint on the next load even before this
      // push arrives again.
      try {
        if (window.KynectaFriendsLocalStore && typeof window.KynectaFriendsLocalStore.saveUsers === 'function') {
          window.KynectaFriendsLocalStore.saveUsers(pushedFriendsCache);
        }
      } catch (_) {}
      // If the "Start a chat" modal is open right now, repaint immediately
      // with the freshly pushed friends instead of waiting for the user to
      // retype/reopen it.
      if (newChatModal && !newChatModal.classList.contains('hidden')) {
        runNewChatSearch(newChatSearchInput.value.trim());
      }
    });
    // Ask the shell for whatever it already has cached right now (it answers
    // synchronously from its own in-memory cachedFriendsList — see chat.html's
    // GET_FRIENDS_LIST handler — the same request calls-ui.js and the group
    // module use), so friends are available even if this module finished
    // loading before the last FRIENDS_LIST_UPDATE broadcast went out.
    //
    // FIX: calls-ui.js's setupFriendsListListener fires this same request
    // after a 1s delay, not immediately — chat.html's own cachedFriendsList
    // is often still empty (or the friendsIframe hasn't answered its own
    // REQUEST_FRIENDS_LIST yet) at the instant this iframe finishes loading,
    // so a single request made right away can easily land before there's
    // anything to answer with. Ask immediately (costs nothing if it's
    // empty), then again at 1s and 3s — mirrors calls-ui.js's timing for
    // the first retry and adds one more for slower first loads — so this
    // module gets the same number of chances the reliably-working ones do.
    function _requestFriendsFromParent() {
      try {
        window.parent.postMessage({ type: 'GET_FRIENDS_LIST', source: 'messages', module: 'messages' }, '*');
      } catch (_) {}
    }
    _requestFriendsFromParent();
    setTimeout(_requestFriendsFromParent, 1000);
    setTimeout(_requestFriendsFromParent, 3000);

    // Renders a user list into the "Start chat" results panel and wires up
    // click-to-open. Factored out so both the instant cache-painted list and
    // the later live-refreshed list can share the exact same rendering path.
    function renderNewChatResults(users) {
      newChatResults.innerHTML = users.map(u => `
        <div class="new-chat-result-item${broadcastMode ? ' broadcast-mode' : ''}" data-user-id="${u.id}" data-user-name="${escapeHtml(u.username || '')}" data-user-avatar="${escapeHtml(u.avatar || u.photoURL || '')}">
          <img src="${escapeHtml(userAvatarSrc(u))}" alt="" referrerpolicy="no-referrer" data-avatar="1" data-avatar-name="${escapeHtml(userAvatarName(u))}">
          <span>${escapeHtml(u.username || u.firstName || u.displayName || 'User')}</span>
          ${broadcastMode
            ? `<input type="checkbox" class="broadcast-checkbox" data-broadcast-id="${u.id}"${broadcastSelectedIds.has(Number(u.id)) ? ' checked' : ''}>`
            : (u.friendshipStatus && u.friendshipStatus !== 'friends' ? '<span style="margin-left:auto;font-size:11px;color:var(--kyn-text-secondary);">Not a friend</span>' : '')}
        </div>
      `).join('');
      if (broadcastMode) {
        // Multi-select mode: tapping anywhere on the row toggles its
        // checkbox (mirrors the bubble-select-mode pattern already used for
        // deleting multiple messages), rather than immediately opening a
        // chat — nothing sends until the person taps the Send button below.
        newChatResults.querySelectorAll('.new-chat-result-item').forEach(el => {
          el.addEventListener('click', (e) => {
            const cb = el.querySelector('.broadcast-checkbox');
            if (e.target !== cb) cb.checked = !cb.checked;
            const id = Number(el.dataset.userId);
            if (cb.checked) broadcastSelectedIds.add(id); else broadcastSelectedIds.delete(id);
            updateBroadcastComposeBar();
          });
        });
        return;
      }
      newChatResults.querySelectorAll('.new-chat-result-item').forEach(el => {
        el.addEventListener('click', async () => {
          newChatModal.classList.add('hidden');
          const targetUserId = Number(el.dataset.userId);
          if (forwardingMessage) {
            const msg = forwardingMessage;
            forwardingMessage = null;
            document.querySelector('#newChatModal .modal-header span').textContent = 'New chat';
            const content = msg.displayContent || '';
            await window.MessageModule.sendMessage({
              receiverId: targetUserId, content,
              attachment: (msg.metadata && msg.metadata.attachment) || null,
            });
            window.MessageModule.openChat({ userId: targetUserId, userName: el.dataset.userName, avatar: el.dataset.userAvatar });
            return;
          }
          window.MessageModule.openChat({
            userId: targetUserId,
            userName: el.dataset.userName,
            avatar: el.dataset.userAvatar,
          });
        });
      });
    }

    // Matches a cached user against the current search text — username,
    // display name, first name, or last name, substring, case-insensitive.
    function matchesSearch(u, q) {
      if (!q) return true;
      return (u.username || '').toLowerCase().includes(q) ||
             (u.displayName || '').toLowerCase().includes(q) ||
             (u.firstName || '').toLowerCase().includes(q) ||
             (u.lastName || '').toLowerCase().includes(q);
    }

    // Search visibility is controlled entirely by newChatSearchToggleBtn (🔍)
    // below now — WhatsApp-style: the full list shows instantly, and search
    // is a deliberate action, not something that pops open on its own based
    // on how many people are in the list.

    // ROOT-CAUSE FIX (Start Chat has no friends / search hits the server on
    // every keystroke): this used to call GET /friends/users/all, which is
    // the backend's "discover everyone" route, not the authenticated user's
    // actual friends — see moodchat/src/routes/friends.js: the friends list
    // lives at GET /friends (mounted as /api/friends) and returns
    // {data:{friends:[...]}}, while /friends/users/all returns a filtered
    // dump of ALL users on the platform. On top of fetching the wrong list,
    // the old runNewChatSearch() re-hit that (wrong) endpoint with
    // ?search=... 300ms after every keystroke and then OVERWROTE whatever
    // the instant local filter had already rendered — so typing "d", "de",
    // "den" flickered through "Searching..." / a different result set
    // instead of progressively narrowing the same friend list.
    //
    // Fix: _loadKnownUsers() loads the real friends list exactly ONCE per
    // modal-open (not per keystroke) into _knownUsers. filterKnownUsersNow()
    // is a pure, synchronous, in-memory filter over that array — every
    // keystroke calls ONLY this, with zero network requests and zero
    // debounce, so the list narrows immediately and never gets clobbered by
    // a delayed server response.
    //
    // ROOT-CAUSE FIX #2 (still empty after the above — verified against the
    // actual storage this app writes to, not a guess): this read
    // localStorage.getItem('friends'), a key nothing in the app ever writes
    // to. The Friends module's real cache lives under
    // knecta_friends_cache / kynecta_friends_cache_v8 (see
    // friend-core.bootstrap.js's LOCAL_STORAGE_KEYS.FRIENDS and
    // loadFriendsFromBackend's second localStorage.setItem) and, more
    // reliably, in two places every other module already reads from:
    //   - window.KynectaStore.get('friends.list') — a plain, already-shaped
    //     {id, displayName, username, avatar} array that
    //     friend-core.operations.js's saveFriendLocal() keeps in sync on
    //     every friend-state change. This is Group's "Add member" picker's
    //     Strategy 3 (group-core-patch.js's _loadMemberPicker) — the exact
    //     source that makes it "reliably work".
    //   - window.KynectaFriendsLocalStore.getFriends() — the IndexedDB
    //     'accepted' bucket the same saveFriendLocal() upserts into
    //     (friend-core.operations.js). This picker used to call
    //     .getAllUsers() instead, which is a different bucket — the
    //     "discovery/all users" cache, not friends.
    // Every source below is tried, in order, the same way Group's picker
    // does it, so a friend shows up from whichever source actually has data
    // — not just the one this file originally guessed.
    let _knownUsers = [];
    let _knownUsersLoaded = false;
    async function _loadKnownUsers(forceRefresh = false) {
      if (_knownUsersLoaded && !forceRefresh) return;

      const mergeIn = (arr) => {
        if (!Array.isArray(arr) || arr.length === 0) return;
        const normalized = arr.map(normalizePushedFriend).filter(Boolean);
        const seenIds = new Set(_knownUsers.map(u => String(u.id)));
        normalized.forEach(u => { if (!seenIds.has(String(u.id))) { _knownUsers.push(u); seenIds.add(String(u.id)); } });
      };

      // Source 1: in-memory cache already pushed into this iframe via
      // FRIENDS_LIST_UPDATE/FRIENDS_DATA/FRIENDS_SYNC (see the
      // window.addEventListener('message', ...) above) — zero-latency,
      // no storage read at all.
      mergeIn(pushedFriendsCache);

      // Source 2: window.KynectaStore's 'friends.list' — Group's own
      // Strategy 3, and the most directly-shaped source in the app (see
      // comment above). Reading it here means this picker shows exactly
      // what Group would show, from the exact same place.
      try {
        if (window.KynectaStore && typeof window.KynectaStore.get === 'function') {
          mergeIn(window.KynectaStore.get('friends.list') || []);
        }
      } catch (_) {}

      // Source 3: the real friends localStorage cache (not the 'friends'
      // key — see the long comment above for why that was always empty).
      try {
        const real = JSON.parse(
          localStorage.getItem('knecta_friends_cache') ||
          localStorage.getItem('kynecta_friends_cache_v8') || '[]'
        );
        mergeIn(real);
      } catch (_) {}

      // Source 4: KynectaFriendsLocalStore's IndexedDB 'accepted' bucket —
      // getFriends(), not getAllUsers() (that one is the discovery/all-users
      // cache, a different bucket that was never guaranteed to contain this
      // user's actual friends).
      try {
        if (window.KynectaFriendsLocalStore) {
          if (typeof window.KynectaFriendsLocalStore.ready === 'function') {
            await window.KynectaFriendsLocalStore.ready().catch(() => {});
          }
          if (typeof window.KynectaFriendsLocalStore.getFriends === 'function') {
            mergeIn(await window.KynectaFriendsLocalStore.getFriends());
          }
        }
      } catch (_) {}

      // `gotDefinitiveAnswer` tracks whether some source below actually
      // resolved (even to a genuinely empty answer) so _knownUsersLoaded
      // only latches on real information — see the FIX comment further
      // down for why that matters.
      let gotDefinitiveAnswer = _knownUsers.length > 0;

      // Source 5: the relay round trip through chat.html — the original,
      // and still the most authoritative, source (it's a live server
      // call). Kept as-is; only used to fill in anything the caches above
      // missed, and to refresh stale cached data.
      try {
        const res = await window.MessageModule.request().get('/friends');
        if (res && res.success !== false && res.data) {
          let rawFriends = [];
          if (Array.isArray(res.data.friends)) rawFriends = res.data.friends;
          else if (res.data.data && Array.isArray(res.data.data.friends)) rawFriends = res.data.data.friends;
          else if (Array.isArray(res.data)) rawFriends = res.data;

          if (rawFriends.length > 0) {
            mergeIn(rawFriends);
            gotDefinitiveAnswer = true;
            try { localStorage.setItem('knecta_friends_cache', JSON.stringify(_knownUsers)); } catch (_) {}
            try {
              if (window.KynectaFriendsLocalStore && typeof window.KynectaFriendsLocalStore.saveUsers === 'function') {
                window.KynectaFriendsLocalStore.saveUsers(_knownUsers);
              }
            } catch (_) {}
          } else if (Array.isArray(rawFriends)) {
            // The relay is alive and the server gave a real (if empty)
            // answer — that's definitive too, just with nothing new to add.
            gotDefinitiveAnswer = true;
          }
        }
      } catch (err) {
        console.warn('[Messages] Relay /friends request failed, trying direct fetch:', err && err.message);
      }

      // Source 6: direct fetch straight to the backend, bypassing the relay
      // entirely — same-origin iframe, so this is just as reachable from
      // Messages as it is from Group's picker (group-core-patch.js's own
      // Strategy 4 does the same thing). Only tried if nothing above found
      // anything, and only using the token keys this app actually writes:
      // kynecta_session / kynecta_auth (see js/auth.session.manager.js —
      // the plain 'token'/'authToken'/'auth_token' keys are explicitly
      // wiped there as legacy, so checking only those, as this fallback
      // used to, could never find a real token).
      if (!_knownUsers.length) {
        try {
          let token = null;
          try {
            const s = JSON.parse(localStorage.getItem('kynecta_session') || 'null');
            token = s && s.token || null;
          } catch (_) {}
          if (!token) {
            try {
              const a = JSON.parse(localStorage.getItem('kynecta_auth') || 'null');
              token = a && a.token || null;
            } catch (_) {}
          }
          if (token) {
            const base = ((window.__kynAPI && window.__kynAPI.baseUrl) || window.API_BASE_URL ||
                window.__API_BASE || (window.__getApiBase && window.__getApiBase()) || 'https://noxopa.onrender.com/api');
            const url = /\/api$/.test(base) ? base : (base.replace(/\/$/, '') + '/api');
            const res = await fetch(`${url}/friends`, { headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } });
            if (res.ok) {
              const d = await res.json();
              const rawFriends = d?.data?.friends || d?.data || d?.friends || [];
              if (Array.isArray(rawFriends) && rawFriends.length > 0) {
                mergeIn(rawFriends);
                gotDefinitiveAnswer = true;
                try { localStorage.setItem('knecta_friends_cache', JSON.stringify(_knownUsers)); } catch (_) {}
                try {
                  if (window.KynectaFriendsLocalStore && typeof window.KynectaFriendsLocalStore.saveUsers === 'function') {
                    window.KynectaFriendsLocalStore.saveUsers(_knownUsers);
                  }
                } catch (_) {}
              } else if (Array.isArray(rawFriends)) {
                gotDefinitiveAnswer = true;
              }
            }
          }
        } catch (err) {
          console.warn('[Messages] Direct /friends fetch also failed:', err && err.message);
        }
      }

      // FIX (never-retries-after-one-failure): previously this flag was set
      // unconditionally here, so a picker opened before chat.html's relay
      // was fully wired up (e.g. right after page load) permanently
      // stopped trying for the rest of the session — even though a friend
      // was sitting there the whole time and other modules (Group, Calls)
      // could see them fine, because THEIR retries weren't blocked by a
      // stale flag. Only latch _knownUsersLoaded once some source above
      // actually gave a real answer; if every source failed (no network,
      // no token yet, relay not ready), leave it false so the next time
      // "Start chat" is opened, it tries again instead of showing a
      // permanently empty list.
      if (gotDefinitiveAnswer) _knownUsersLoaded = true;
    }

    // Instant, synchronous filter over whatever's already loaded — this is
    // what the search input calls on every keystroke, with no debounce, no
    // await, and no network request, so a letter typed narrows the list
    // immediately.
    function filterKnownUsersNow(query) {
      const q = (query || '').trim().toLowerCase();
      const filtered = _knownUsers.filter(u => matchesSearch(u, q));
      if (filtered.length > 0) {
        renderNewChatResults(filtered);
      } else if (!q && _knownUsers.length === 0) {
        newChatResults.innerHTML = '<div style="padding:14px;color:var(--kyn-text-secondary);font-size:13px;">No friends yet — search above to message anyone on Kynecta.</div>';
      } else if (q) {
        // A query is active — a global search is either in flight or about
        // to be (see runGlobalUserSearch below), so don't claim "no
        // matches" yet; that call replaces this with real results or a
        // real empty state once it resolves.
        newChatResults.innerHTML = '<div style="padding:14px;color:var(--kyn-text-secondary);font-size:13px;">Searching…</div>';
      } else {
        newChatResults.innerHTML = '<div style="padding:14px;color:var(--kyn-text-secondary);font-size:13px;">No matches</div>';
      }
      return filtered;
    }

    // ROOT-CAUSE FIX (CAN-ONLY-MESSAGE-EXISTING-FRIENDS): filterKnownUsersNow
    // only ever filters _knownUsers, which _loadKnownUsers() populates
    // exclusively from GET /friends (see its own comment above) — so typing
    // a name here could only ever narrow the friends list, never find
    // anyone else. The backend has never required a friendship to open a
    // direct chat or send a message (moodchat's directChatResolver.js only
    // blocks users who've explicitly blocked each other — see its own
    // ENFORCE-BLOCK-ON-CONVERSATION-CREATION comment — and GET
    // /api/users/search already returns and paginates every user on the
    // platform with a friendshipStatus flag). This restores that: once the
    // person types something, also query the real directory in the
    // background and merge in anyone not already shown as a friend, so
    // friend-to-non-friend and non-friend-to-non-friend messaging both work
    // again, exactly as they did before the v3 Message Module rebuild
    // introduced the friends-only-list regression. The default, empty-query
    // view stays friends-first (WhatsApp-style contact list) — this only
    // activates once the person actually searches for someone by name.
    let _globalSearchToken = 0;
    async function runGlobalUserSearch(query, knownFilteredCount) {
      const q = (query || '').trim();
      if (!q) return; // empty query: friends-first default list only, no directory-wide dump
      const myToken = ++_globalSearchToken;
      try {
        const res = await window.MessageModule.request().get(`/users/search?q=${encodeURIComponent(q)}&limit=25`);
        if (myToken !== _globalSearchToken) return; // a newer keystroke's search superseded this one
        if (newChatSearchInput.value.trim() !== q) return; // input changed while this was in flight
        // FIX (RESPONSE-SHAPE-UNCERTAINTY): the actual backend body is
        // {status:'success', data:{users:[...], pagination:{...}}}, but this
        // relay (message-client.js's _directRequest -> chat.html's
        // API_REQUEST handler -> the real fetch) can hand back that body at
        // one of several nesting depths depending on how much unwrapping
        // happened upstream — the exact same uncertainty _loadKnownUsers()
        // above already defends against for GET /friends (see its own
        // 3-shape check a few dozen lines up). _directRequest's own
        // unwrap-one-level logic specifically looks for a `success` boolean
        // key to decide whether to unwrap, but this endpoint's envelope key
        // is named `status`, not `success` — so that auto-unwrap may or may
        // not fire here. Check every depth from "still fully wrapped" down
        // to "already a bare array" instead of assuming one.
        const body = res && res.data;
        const users = Array.isArray(body) ? body
          : (body && body.data && Array.isArray(body.data.users)) ? body.data.users
          : (Array.isArray(body?.users)) ? body.users
          : (body && body.data && Array.isArray(body.data)) ? body.data
          : [];
        const knownIds = new Set(_knownUsers.filter(u => matchesSearch(u, q.toLowerCase())).map(u => String(u.id)));
        const extra = users.filter(u => u && u.id != null && !knownIds.has(String(u.id)));
        const combined = _knownUsers.filter(u => matchesSearch(u, q.toLowerCase())).concat(extra);
        if (combined.length > 0) {
          renderNewChatResults(combined);
        } else {
          newChatResults.innerHTML = '<div style="padding:14px;color:var(--kyn-text-secondary);font-size:13px;">No matches</div>';
        }
      } catch (err) {
        if (myToken !== _globalSearchToken) return;
        console.warn('[Messages] Directory search failed, showing friends-only matches:', err && err.message);
        if (knownFilteredCount === 0) {
          newChatResults.innerHTML = '<div style="padding:14px;color:var(--kyn-text-secondary);font-size:13px;">No matches</div>';
        }
      }
    }

    let _globalSearchDebounce = null;
    function scheduleGlobalUserSearch(query, knownFilteredCount) {
      if (_globalSearchDebounce) clearTimeout(_globalSearchDebounce);
      _globalSearchDebounce = setTimeout(() => runGlobalUserSearch(query, knownFilteredCount), 300);
    }

    // Called when the picker opens (and once in the background to refresh),
    // never on a keystroke — see _loadKnownUsers()'s comment above.
    async function runNewChatSearch(query) {
      await _loadKnownUsers();
      filterKnownUsersNow(query);
      if ((query || '').trim()) scheduleGlobalUserSearch(query, 0);
    }

    document.getElementById('closeChatInfoModal').addEventListener('click', () => {
      document.getElementById('chatInfoModal').classList.add('hidden');
    });
    document.getElementById('chatInfoModal').addEventListener('click', (e) => {
      if (e.target.id === 'chatInfoModal') document.getElementById('chatInfoModal').classList.add('hidden');
    });

    // FIX (ATTACHMENTS-OPEN-IN-NEW-TAB): #mediaViewer now handles image, video,
    // PDF (inline iframe) and any other file type (name + download), instead
    // of only images — see attachmentHtml() above for the matching markup.
    function closeMediaViewer() {
      const viewer = document.getElementById('mediaViewer');
      viewer.classList.add('hidden');
      const video = document.getElementById('mediaViewerVideo');
      video.pause(); video.src = '';
      document.getElementById('mediaViewerFrame').src = '';
      ['mediaViewerImg', 'mediaViewerVideo', 'mediaViewerFrame', 'mediaViewerFileName', 'mediaViewerDownload']
        .forEach(id => document.getElementById(id).classList.add('hidden'));
    }
    function openMediaViewer({ image, video, pdf, fileUrl, fileName }) {
      closeMediaViewer();
      const viewer = document.getElementById('mediaViewer');
      if (image) {
        const el = document.getElementById('mediaViewerImg'); el.src = image; el.classList.remove('hidden');
      } else if (video) {
        const el = document.getElementById('mediaViewerVideo'); el.src = video; el.classList.remove('hidden'); el.play().catch(() => {});
      } else if (pdf) {
        document.getElementById('mediaViewerFrame').src = pdf;
        document.getElementById('mediaViewerFrame').classList.remove('hidden');
      } else {
        const nameEl = document.getElementById('mediaViewerFileName');
        nameEl.textContent = fileName || 'Attachment'; nameEl.classList.remove('hidden');
      }
      if (fileUrl) {
        const dl = document.getElementById('mediaViewerDownload');
        dl.href = fileUrl; dl.classList.remove('hidden');
      }
      viewer.classList.remove('hidden');
    }
    document.getElementById('closeMediaViewer').addEventListener('click', closeMediaViewer);
    document.getElementById('mediaViewer').addEventListener('click', (e) => {
      if (e.target.id === 'mediaViewer') closeMediaViewer();
    });
    document.addEventListener('click', (e) => {
      const img = e.target.closest('[data-view-image]');
      if (img) { openMediaViewer({ image: img.dataset.viewImage, fileUrl: img.dataset.viewImage }); return; }
      const video = e.target.closest('[data-view-video]');
      if (video) { openMediaViewer({ video: video.dataset.viewVideo, fileUrl: video.dataset.viewVideo }); return; }
      const file = e.target.closest('[data-view-file]');
      if (file) {
        const url = file.dataset.viewFile, mime = file.dataset.fileMime || '', name = file.dataset.fileName || 'Attachment';
        openMediaViewer(mime === 'application/pdf' ? { pdf: url, fileUrl: url, fileName: name } : { fileUrl: url, fileName: name });
      }
    });

    document.getElementById('newChatBtn').addEventListener('click', () => {
      forwardingMessage = null;
      closeMultiSendPicker();
      document.querySelector('#newChatModal .modal-header span').textContent = 'New chat';
      newChatModal.classList.remove('hidden');
      newChatSearchInput.value = '';
      // WhatsApp-style (Image 1): the full contact list shows instantly —
      // search starts collapsed behind the 🔍 icon, not pre-opened.
      newChatSearchInput.classList.add('hidden');
      runNewChatSearch('');
    });
    document.getElementById('multiSendToggleBtn').addEventListener('click', openMultiSendPicker);
    document.getElementById('broadcastSendBtn').addEventListener('click', sendBroadcast);
    document.getElementById('broadcastComposeInput').addEventListener('input', updateBroadcastComposeBar);
    document.getElementById('broadcastComposeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBroadcast(); }
    });
    document.getElementById('closeNewChatModal').addEventListener('click', () => {
      forwardingMessage = null;
      closeMultiSendPicker();
      newChatModal.classList.add('hidden');
    });
    newChatModal.addEventListener('click', (e) => {
      if (e.target === newChatModal) { forwardingMessage = null; closeMultiSendPicker(); newChatModal.classList.add('hidden'); }
    });
    // WhatsApp-style collapsed search: tapping 🔍 reveals the input and
    // focuses it; tapping it again (now acting as a close) clears the query
    // and goes back to showing everyone. See Image 1's contact picker,
    // which never shows a search box until its search icon is tapped.
    document.getElementById('newChatSearchToggleBtn').addEventListener('click', () => {
      const isHidden = newChatSearchInput.classList.contains('hidden');
      if (isHidden) {
        newChatSearchInput.classList.remove('hidden');
        newChatSearchInput.focus();
      } else {
        newChatSearchInput.classList.add('hidden');
        newChatSearchInput.value = '';
        runNewChatSearch('');
      }
    });
    newChatSearchInput.addEventListener('input', () => {
      // Instant local filter on every keystroke — no debounce, no await, no
      // network request. Just filters the friends array _loadKnownUsers()
      // already loaded into memory when the picker opened, so typing "d",
      // then "de", then "den" progressively narrows the same list instead
      // of round-tripping to the server (and possibly showing "Searching…"
      // or a different result set) on every letter.
      const q = newChatSearchInput.value;
      const filtered = filterKnownUsersNow(q);
      // On top of the instant local narrow above, also check the real user
      // directory (debounced) so a name that isn't already a friend can
      // still be found and messaged — see runGlobalUserSearch's comment.
      if (q.trim()) scheduleGlobalUserSearch(q, filtered.length);
    });

    window.MessageModule.subscribe((event, data) => {
      switch (event) {
        case 'settings:changed':
          if (data && data.section === 'chat' && data.key === 'autoCorrect') applyAutoCorrectSetting();
          break;
        case 'conversation:updated':
          renderConversationList();
          // FIX (HEADER-SAYS-OFFLINE): presence changes arrive as conversation updates but
          // never re-sent the header to the parent, so it kept whatever it showed on open.
          try {
            const activeIdHdr = window.MessageModule.getActiveChatId();
            if (activeIdHdr && data && data.chatId === activeIdHdr && data.otherUser) {
              const onlineNow = !!data.otherUser.online;
              const hdrKey = activeIdHdr + ':' + onlineNow;
              if (window.__kynLastHdrPresence !== hdrKey) {
                window.__kynLastHdrPresence = hdrKey;
                window.parent.postMessage({
                  source: 'message-iframe',
                  type: 'CHAT_HEADER_UPDATE',
                  payload: {
                    chatId: activeIdHdr,
                    seq: (window.__kynChatHdrSeq = (window.__kynChatHdrSeq || 0) + 1),
                    name: data.otherUser.username || 'Conversation',
                    avatarUrl: data.otherUser.avatar || null,
                    online: onlineNow,
                  },
                  timestamp: Date.now(),
                }, '*');
              }
            }
          } catch (_) {}
          break;
        case 'message:added':
        case 'message:failed':
        case 'delivery-state:updated':
        case 'read-state:updated':
        case 'message:deleted':
        case 'message:edited':
        case 'message:decrypted':
        case 'message:starred':
        case 'message:reaction':
          if (data && data.chatId === window.MessageModule.getActiveChatId()) {
            renderMessages(data.chatId, { preserveScroll: true });
          }
          renderConversationList();
          break;
        case 'typing:changed': {
          if (data.chatId !== window.MessageModule.getActiveChatId()) break;
          const nameEl = document.getElementById('chatHeaderName');
          if (!nameEl) break;
          const conv = window.MessageModule.getConversations().find(c => c.chatId === data.chatId);
          nameEl.textContent = data.isTyping ? 'typing…' : (conv?.otherUser?.username || 'Conversation');
          break;
        }
        case 'chat:opening': {
          // INSTANT-OPEN: fired by js/message-client.js the moment a
          // Friends/Calls/Status/notification open starts, before the
          // conversationId round trip completes — see the comment there and
          // renderChatPanel()'s pendingContact handling above. Reveal the
          // panel now, with what we already know, instead of leaving
          // chat.html's veil to time out onto the bare placeholder.
          const { userId, userName, avatar } = data || {};
          document.getElementById('convListPanel').classList.add('hide-on-mobile');
          document.getElementById('chatPanel').classList.remove('hide-on-mobile');
          renderChatPanel(null, { pendingContact: { userId, userName, avatar } });
          // Deliberately NOT the 'CHAT_OPENED' message type — that one stops
          // chat.html's OPEN_CHAT_WITH_USER retry loop and clears
          // pending_chat (see chat.html's CHAT_OPENED handler), which must
          // keep running until the real chat actually opens. This is a
          // separate, lighter signal that only lifts the veil early.
          try {
            window.parent.postMessage({ type: 'CHAT_OPENING', payload: { userId, name: userName || null, avatar: avatar || null } }, '*');
          } catch (_) {}
          break;
        }
        case 'chat:open-requested': {
          const conversationId = normalizeChatPanelId(data && data.conversationId);
          const { userId } = data || {};
          document.getElementById('convListPanel').classList.add('hide-on-mobile');
          document.getElementById('chatPanel').classList.remove('hide-on-mobile');
          renderChatPanel(conversationId);
          // Ack to chat.html — stops its retry loop and loading veil (see
          // chat.html's CHAT_OPENED handler; this is the exact shape it reads).
          const conv = conversationId ? window.MessageModule.getConversations().find(c => c.chatId === conversationId) : null;
          try {
            window.parent.postMessage({
              type: 'CHAT_OPENED',
              payload: {
                userId: userId || conv?.otherUser?.userId || null,
                chatId: conversationId || null,
                name: conv?.otherUser?.username || null,
                avatar: conv?.otherUser?.avatar || null,
              },
            }, '*');
          } catch (_) {}
          break;
        }
        case 'chat:open-failed': {
          // ROOT-CAUSE FIX: MessageModule.openChat() already notifies this
          // event when a first-time/non-friend conversation fails to resolve
          // (backend error, cold-start timeout, unknown user, etc.) — see
          // js/message-client.js. Nothing here ever handled it, so the panel
          // was left showing whatever it already had, with no error shown
          // and no acknowledgement sent back to chat.html. chat.html's veil
          // (which hides the panel while a chat is opening) then only lifted
          // 3s later via its own safety-net timeout. Now: fall back to the
          // same real shell (disabled, no chat selected) plus a small inline
          // retry banner instead of any placeholder-style full-panel screen,
          // and tell chat.html to unveil/return to the list immediately via
          // the existing (previously unused) CHAT_LIST_SHOWN ack instead of
          // making the user wait out the 3s timeout.
          document.getElementById('convListPanel').classList.remove('hide-on-mobile');
          document.getElementById('chatPanel').classList.add('hide-on-mobile');
          window.MessageModule.setActiveChatId(null);
          renderChatPanel(null, { retryBanner: { userId: data && data.userId, conversationId: data && data.conversationId } });
          try { window.parent.postMessage({ type: 'CHAT_LIST_SHOWN' }, '*'); } catch (_) {}
          break;
        }
        case 'message:scroll-to': {
          const el = document.querySelector(`[data-message-id="${data.messageId}"]`);
          if (el) { el.scrollIntoView({ block: 'center' }); el.style.outline = '2px solid var(--kyn-accent-primary)'; }
          break;
        }
      }
    });

    renderConversationList();
    renderChatPanel(null);
  })();
  </script>
  <!-- FIX: this module's own modals (chatInfoModal, newChatModal — both
       .modal-overlay, closed by adding .hidden) had no hardware/device
       back-button coverage at all, only their own in-page × buttons —
       back-nav.js was never loaded here. See chat.html's
       handleAppBackNavigation() and back-nav.js's _visibleGenericModal()
       for the other half of this fix. -->
  <script src="back-nav.js"></script>
</body>
</html>
