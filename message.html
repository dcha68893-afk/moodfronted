<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<script src="/js/theme.engine.js"></script>
<script>
  window.API_BASE_URL = "https://noxopa.onrender.com";
  window.__kynAPI = window.__kynAPI || {};
  window.__kynAPI.baseUrl = "https://noxopa.onrender.com/api";
</script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--kyn-bg-primary, #fff); color: var(--kyn-text-primary, #111);
  }
  #convList {
    width: 320px; min-width: 260px; border-right: 1px solid var(--kyn-border, #e2e2e2);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #convList.hide-on-mobile { display: none; }
  .conv-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
    border-bottom: 1px solid var(--kyn-border, #f0f0f0);
  }
  .conv-item:hover, .conv-item.active { background: var(--kyn-bg-hover, #f5f5f5); }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ccc; flex-shrink: 0; object-fit: cover; }
  .conv-meta { flex: 1; min-width: 0; }
  .conv-name { font-weight: 600; font-size: 14px; }
  .conv-preview { font-size: 13px; color: var(--kyn-text-secondary, #777); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-badge {
    background: var(--kyn-accent, #2d7ff9); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 2px 7px; min-width: 18px; text-align: center;
  }
  #chatPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader {
    padding: 12px 16px; border-bottom: 1px solid var(--kyn-border, #e2e2e2);
    display: flex; align-items: center; gap: 10px;
  }
  #backBtn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; }
  #messageLog { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .bubble-row { display: flex; }
  .bubble-row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4;
    background: var(--kyn-bg-secondary, #f0f0f0); word-wrap: break-word;
  }
  .bubble-row.mine .bubble { background: var(--kyn-accent, #2d7ff9); color: #fff; }
  .bubble-meta { font-size: 10px; opacity: 0.65; margin-top: 3px; text-align: right; }
  .bubble-row.failed .bubble { outline: 2px solid #e04b4b; }
  .bubble-deleted { font-style: italic; opacity: 0.6; }
  .bubble-row { position: relative; align-items: center; gap: 4px; }
  .bubble-actions { display: none; gap: 2px; }
  .bubble-row.mine:hover .bubble-actions { display: flex; }
  .bubble-action-btn {
    background: none; border: none; cursor: pointer; font-size: 12px; opacity: 0.6;
    padding: 4px; border-radius: 4px;
  }
  .bubble-action-btn:hover { opacity: 1; background: var(--kyn-bg-hover, #f0f0f0); }
  #composeBar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--kyn-border, #e2e2e2); }
  #composeInput {
    flex: 1; border-radius: 20px; border: 1px solid var(--kyn-border, #ddd);
    padding: 10px 14px; font-size: 14px; resize: none; max-height: 120px;
  }
  #sendBtn {
    background: var(--kyn-accent, #2d7ff9); color: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; cursor: pointer; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
  #attachBtn {
    background: none; border: none; font-size: 20px; cursor: pointer; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: 50%;
  }
  #attachBtn:hover { background: var(--kyn-bg-hover, #f0f0f0); }
  #attachBtn:disabled { opacity: 0.5; cursor: default; }
  .bubble-attachment-image { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; margin-bottom: 4px; }
  .bubble-attachment-file {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    background: rgba(0,0,0,0.06); text-decoration: none; color: inherit; margin-bottom: 4px; font-size: 13px;
  }
  .bubble-row.mine .bubble-attachment-file { background: rgba(255,255,255,0.2); }
  #attachUploadProgress { font-size: 12px; color: var(--kyn-text-secondary,#999); padding: 0 14px; }
  #emptyState { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--kyn-text-secondary, #999); }
  #loadOlderBtn { text-align: center; padding: 8px; font-size: 12px; color: var(--kyn-accent, #2d7ff9); cursor: pointer; }
  @media (max-width: 720px) {
    #convList { width: 100%; }
    #chatPanel.hide-on-mobile { display: none; }
    #backBtn { display: inline-block; }
  }
</style>
</head>
<body>

  <div id="convList"></div>

  <div id="chatPanel" class="hide-on-mobile">
    <div id="emptyState">Select a conversation</div>
  </div>

  <script src="/js/api.request.js"></script>
  <script src="/js/api.core.js"></script>
  <script src="/js/app.realtime.socket.js"></script>
  <script src="/js/core/identity/IdentityProfileStore.js"></script>
  <script src="/js/message-client.js"></script>

  <script>
  (function () {
    'use strict';

    const convListEl = document.getElementById('convList');
    const chatPanelEl = document.getElementById('chatPanel');

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderConversationList() {
      const convs = window.MessageModule.getConversations()
        .slice()
        .sort((a, b) => new Date(b.lastMessage?.createdAt || 0) - new Date(a.lastMessage?.createdAt || 0));

      if (convs.length === 0) {
        convListEl.innerHTML = '<div style="padding:20px;color:var(--kyn-text-secondary,#999);font-size:13px;">No conversations yet</div>';
        return;
      }

      convListEl.innerHTML = convs.map(c => `
        <div class="conv-item${c.chatId === window.MessageModule.getActiveChatId() ? ' active' : ''}" data-chat-id="${c.chatId}">
          <img class="conv-avatar" src="${escapeHtml(c.otherUser?.avatar || '/img/default-avatar.png')}" alt="">
          <div class="conv-meta">
            <div class="conv-name">${escapeHtml(c.otherUser?.username || 'Conversation')}</div>
            <div class="conv-preview">${escapeHtml(c.lastMessage?.content || '')}</div>
          </div>
          ${c.unreadCount > 0 ? `<span class="unread-badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</span>` : ''}
        </div>
      `).join('');

      convListEl.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', () => {
          window.MessageModule.openChat({ conversationId: Number(el.dataset.chatId) });
        });
      });
    }

    function attachmentHtml(m) {
      let meta = m.metadata;
      if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (_) { meta = null; } }
      const att = meta && meta.attachment;
      if (!att) return '';
      if ((att.type || m.type) === 'image') {
        return `<img class="bubble-attachment-image" src="${escapeHtml(att.url)}" alt="${escapeHtml(att.originalName || 'image')}">`;
      }
      const icon = { video: '🎬', audio: '🎵', document: '📄', file: '📎' }[att.type] || '📎';
      return `<a class="bubble-attachment-file" href="${escapeHtml(att.url)}" target="_blank" rel="noopener">
                ${icon} ${escapeHtml(att.originalName || 'Attachment')}
              </a>`;
    }

    function bubbleHtml(m, isMine) {
      const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const statusTick = isMine ? ({ sending: '…', sent: '✓', delivered: '✓✓', read: '✓✓', failed: '⚠' }[m.status] || '') : '';
      const editedTag = m.isEdited ? ' (edited)' : '';
      const isDeletedForEveryone = m.deleted && m.deleteForEveryone;
      const content = isDeletedForEveryone ? 'This message was deleted' : m.content;
      const actions = (isMine && !m.deleted && typeof m.id === 'number') ? `
          <div class="bubble-actions">
            <button class="bubble-action-btn" data-action="edit" data-message-id="${m.id}" title="Edit">✎</button>
            <button class="bubble-action-btn" data-action="delete" data-message-id="${m.id}" title="Delete">🗑</button>
          </div>` : '';
      return `
        <div class="bubble-row ${isMine ? 'mine' : ''}${m.status === 'failed' ? ' failed' : ''}" data-message-id="${m.id}">
          <div class="bubble${isDeletedForEveryone ? ' bubble-deleted' : ''}">
            ${!isDeletedForEveryone ? attachmentHtml(m) : ''}
            ${content ? escapeHtml(content) : ''}${!isDeletedForEveryone ? editedTag : ''}
            <div class="bubble-meta">${time} ${statusTick}</div>
          </div>
          ${actions}
        </div>`;
    }

    function renderChatPanel(chatId) {
      if (!chatId) {
        chatPanelEl.innerHTML = '<div id="emptyState">Select a conversation</div>';
        return;
      }
      const conv = window.MessageModule.getConversations().find(c => c.chatId === chatId);
      chatPanelEl.innerHTML = `
        <div id="chatHeader">
          <button id="backBtn">&larr;</button>
          <strong>${escapeHtml(conv?.otherUser?.username || 'Conversation')}</strong>
        </div>
        <div id="loadOlderBtn">Load earlier messages</div>
        <div id="messageLog"></div>
        <div id="composeBar">
          <button id="attachBtn" title="Attach file">📎</button>
          <input type="file" id="attachInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt">
          <textarea id="composeInput" rows="1" placeholder="Message..."></textarea>
          <button id="sendBtn">&#9658;</button>
        </div>
      `;
      renderMessages(chatId);

      document.getElementById('backBtn').addEventListener('click', () => {
        window.MessageModule.setActiveChatId(null);
        document.getElementById('convList').classList.remove('hide-on-mobile');
        document.getElementById('chatPanel').classList.add('hide-on-mobile');
        renderChatPanel(null);
      });

      document.getElementById('loadOlderBtn').addEventListener('click', async () => {
        const msgs = window.MessageModule.getMessages(chatId);
        const oldestId = msgs.length ? msgs[0].id : null;
        if (typeof oldestId !== 'number') return; // no real cursor yet (all optimistic/local)
        await window.MessageModule.loadHistory(chatId, { before: oldestId });
        renderMessages(chatId, { preserveScroll: true });
      });

      const input = document.getElementById('composeInput');
      const sendBtn = document.getElementById('sendBtn');
      const attachBtn = document.getElementById('attachBtn');
      const attachInput = document.getElementById('attachInput');

      async function doSend() {
        const content = input.value.trim();
        if (!content) return;
        input.value = '';
        sendBtn.disabled = true;
        await window.MessageModule.sendMessage({ chatId, content });
        sendBtn.disabled = false;
        input.focus();
      }

      sendBtn.addEventListener('click', doSend);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
      });

      attachBtn.addEventListener('click', () => attachInput.click());
      attachInput.addEventListener('change', async () => {
        const file = attachInput.files[0];
        if (!file) return;
        attachBtn.disabled = true;
        attachBtn.textContent = '⏳';
        try {
          const attachment = await window.MessageModule.uploadAttachment(file);
          const caption = input.value.trim();
          input.value = '';
          await window.MessageModule.sendMessage({ chatId, content: caption, attachment });
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          attachBtn.disabled = false;
          attachBtn.textContent = '📎';
          attachInput.value = '';
        }
      });
    }

    function renderMessages(chatId, { preserveScroll = false } = {}) {
      const log = document.getElementById('messageLog');
      if (!log) return;
      const prevHeight = preserveScroll ? log.scrollHeight : 0;
      const currentUserId = window._kynCurrentUserId;
      const msgs = window.MessageModule.getMessages(chatId);
      log.innerHTML = msgs.map(m => bubbleHtml(m, m.senderId === currentUserId)).join('');
      if (preserveScroll) {
        log.scrollTop = log.scrollHeight - prevHeight;
      } else {
        log.scrollTop = log.scrollHeight;
      }

      log.querySelectorAll('.bubble-action-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const messageId = Number(btn.dataset.messageId);
          if (btn.dataset.action === 'delete') {
            const forEveryone = confirm('Delete for everyone? Click Cancel to delete just for you.');
            await window.MessageModule.deleteMessage(chatId, messageId, { forEveryone });
          } else if (btn.dataset.action === 'edit') {
            const current = window.MessageModule.getMessages(chatId).find(m => m.id === messageId);
            const newContent = prompt('Edit message:', current ? current.content : '');
            if (newContent && newContent.trim()) {
              await window.MessageModule.editMessage(chatId, messageId, newContent.trim());
            }
          }
        });
      });
    }

    window.MessageModule.subscribe((event, data) => {
      switch (event) {
        case 'conversation:updated':
          renderConversationList();
          break;
        case 'message:added':
        case 'message:failed':
        case 'delivery-state:updated':
        case 'read-state:updated':
        case 'message:deleted':
        case 'message:edited':
          if (data && data.chatId === window.MessageModule.getActiveChatId()) {
            renderMessages(data.chatId, { preserveScroll: true });
          }
          renderConversationList();
          break;
        case 'chat:open-requested': {
          const { conversationId, userId } = data;
          document.getElementById('convList').classList.add('hide-on-mobile');
          document.getElementById('chatPanel').classList.remove('hide-on-mobile');
          renderChatPanel(conversationId);
          // Ack to chat.html — stops its retry loop and loading veil (see
          // chat.html's CHAT_OPENED handler; this is the exact shape it reads).
          const conv = conversationId ? window.MessageModule.getConversations().find(c => c.chatId === conversationId) : null;
          try {
            window.parent.postMessage({
              type: 'CHAT_OPENED',
              payload: {
                userId: userId || conv?.otherUser?.userId || null,
                chatId: conversationId || null,
                name: conv?.otherUser?.username || null,
                avatar: conv?.otherUser?.avatar || null,
              },
            }, '*');
          } catch (_) {}
          break;
        }
        case 'message:scroll-to': {
          const el = document.querySelector(`[data-message-id="${data.messageId}"]`);
          if (el) { el.scrollIntoView({ block: 'center' }); el.style.outline = '2px solid var(--kyn-accent,#2d7ff9)'; }
          break;
        }
      }
    });

    renderConversationList();
  })();
  </script>
</body>
</html>
