<!DOCTYPE html>
<html lang="en">
<head>
    <!-- FIX (recursive window.__getApiOrigin / "not a function" on load):
         this page never loaded js/config.js. It used to define its own
         copy of __isLocalEnvironment/__getApiOrigin/__getApiBase further
         down the page (search "ENVIRONMENT DETECTION"), with the backend
         origin hardcoded as literal strings inside those functions. The
         production build (scripts/build-config.js) rewrites every
         quoted onrender.com/localhost URL literal in every shipped file
         into a call to window.__getApiOrigin()/__getApiBase() — which
         also rewrote the literals INSIDE this page's own copy of those
         functions, turning them into functions that call themselves and
         blowing the call stack. It separately turned the hardcoded
         window.API_BASE_URL assignment below into an __getApiOrigin()
         call that ran before anything on this page had defined it.
         Loading the shared, runtime-config-driven js/config.js first
         (same pattern index.html already uses) means the origin comes
         from configuration, not from literals the build step has to
         rewrite, and it's ready before anything on this page needs it. -->
    <script src="/js/runtime-config.js"></script>
    <script src="/js/config.js"></script>
    <script>window.API_BASE_URL = window.__getApiOrigin();</script>
    <script src="/js/theme.engine.js"></script>
    <script src="/js/panel-state-bridge.js"></script>
    <style id="kynUnifiedShellTheme">
        /* ONE SCREEN THEME: header, body, sidebar and bottom navigation all
           consume the same ThemeEngine variables. No module may introduce a
           separate first-paint palette. */
        html,body{background:var(--kyn-bg-root)!important;color:var(--kyn-text-primary)!important}
        #globalHeader{background:var(--kyn-bg-header)!important;border-color:var(--kyn-border)!important;color:var(--kyn-text-primary)!important}
        #permanentSidebar{background:var(--kyn-bg-sidebar)!important;color:var(--kyn-text-primary)!important}
        .mobile-nav-bar{background:var(--kyn-bg-navbar)!important;border-color:var(--kyn-navbar-border)!important;color:var(--kyn-text-primary)!important}
        .mobile-nav-bar::before{box-shadow:20px 0 0 0 transparent,0 20px 0 0 var(--kyn-navbar-notch-shadow)!important}
        #appContent,.app-content,.content-area,.main-content,.page-content{background:var(--kyn-bg-root)!important;color:var(--kyn-text-primary)!important}
    </style>
    <style id="kynCriticalHeaderFix">
        /* FIX (header patchwork/sparking): the old selector included
           [class*="header"], [class*="topbar"], [class*="top-bar"], which
           matches ANY element whose class merely contains that substring —
           not just real header bars. That caught inner pieces like
           .header-context, .header-module-badge, .header-module-copy and
           .header-actions and force-painted them with a flat, opaque
           var(--kyn-bg-header) background + border + text color. Those
           pieces were designed to be transparent (or to keep their own
           gradient/translucent styling) so they'd blend into the single
           #globalHeader surface; forcing a solid color onto them instead
           created visible rectangular patches/seams inside the header
           instead of one continuous themed bar. Scoping this rule to only
           real header/toolbar containers (and dropping the wildcard
           substring matches) fixes that without touching any icon,
           button, or feature — those elements simply stop getting an
           unwanted background override and go back to blending with
           their parent header. */
        header, .header, .top-bar, .toolbar, .app-header, .chat-header,
        .module-header {
            background: var(--kyn-bg-header) !important;
            border-color: var(--kyn-border) !important;
            color: var(--kyn-text-primary) !important;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Necpa - Chat, Friends & Marketplace</title>
    <!-- PWA: manifest MUST be linked from the main shell so beforeinstallprompt fires -->
    <link rel="manifest" href="/manifest.json">
    <!-- PWA controller (single owner of beforeinstallprompt + install UI + service-worker registration).
         Plain script in <head> so its listener exists before Chrome fires the one-time event. -->
    <script src="/pwa-manager.js"></script>
    <!-- theme-color is now set dynamically by theme.engine.js to match the saved theme -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Necpa">
    <!-- App log image (favicon / home-screen icon): must use the "necpa-*" icon set to
         match the app's actual name (Necpa), not the misspelled "necpra-*" set. -->
    <link rel="apple-touch-icon" href="/icons/necpa-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/necpa-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/necpa-512.png">
    <style>
        :root {
            --app-primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 62%, #06b6d4 100%);
            --app-primary-color: #2563eb;
            --app-primary-dark: #1d4ed8;
            --app-primary-light: #dbeafe;
            --app-secondary-surface: #f8fafc;
            --app-secondary-muted: #e5e7eb;
            --app-accent-color: #8b5cf6;
            --app-accent-soft: #cffafe;
            --app-text-color: #0f172a;
            --app-text-secondary: #64748b;
        }

        /* FIX (theme flash / "sparking of light" on dark mode reload,
           consolidated): this block used to redeclare 4 --app-* variables
           for dark mode (--app-secondary-surface/-muted/--app-text-color/
           -secondary) — but theme.engine.js's paintNow() ALREADY sets all 4
           of those as an inline style on <html> for both themes, which
           always wins over any stylesheet rule regardless of order. So this
           redeclaration was dead on arrival — never actually applied — and
           two of its four values (--app-text-color: #e2e8f0, --app-text-
           secondary: #94a3b8) didn't even match theme.engine.js's real
           values (#e5e7eb / #9ca3af), which is exactly the kind of drift
           duplicate theme authorities produce. Removed entirely rather than
           left as inert-but-misleading code someone might "fix" later
           thinking it does something. #loadingScreen's own dark override is
           gone too, now that its base rule (below) resolves correctly on
           its own via var(--kyn-bg-root). #globalHeader's override is kept
           — its bespoke two-layer gradient + blur has no existing variable
           that represents it without simplifying the actual design, so a
           real override responding to the one true data-theme signal is
           the right tool here, not a bug to remove. */
        html[data-theme="dark"] #globalHeader {
            background:
                linear-gradient(135deg, rgba(15,23,42,0.97), rgba(30,41,59,0.94)),
                linear-gradient(90deg, rgba(15,23,42,0.03), rgba(14,165,233,0.04));
            border-bottom-color: rgba(226,232,240,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--app-secondary-surface);
            overflow: hidden;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            /* FIX (COMPETING-THEME-AUTHORITY, cont'd): was a literal
               "white", requiring the separate html[data-theme="dark"]
               #loadingScreen override further down to fix it for dark mode.
               --kyn-bg-root is the exact same #fff in light mode (theme.
               engine.js's inline write) and the exact same #0f172a dark
               value the override used — so routing through it here makes
               this a single, ungated rule that's already correct in both
               themes on its own, and the separate override below is now
               genuinely redundant rather than the only thing making dark
               mode work. */
            background: var(--kyn-bg-root);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        /* GLOBAL HEADER WITH PROFILE */
        #globalHeader {
            position: fixed;
            top: 0;
            left: 60px;
            right: 0;
            height: 56px;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.97), rgba(244,247,251,0.94)),
                linear-gradient(90deg, rgba(17,24,39,0.03), rgba(14,165,233,0.04));
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(15,23,42,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 95;
            box-shadow: 0 8px 24px rgba(15,23,42,0.06);
        }

        .header-context {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-module-badge {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--app-primary-gradient);
            color: #fff;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.18);
            flex: 0 0 auto;
        }

        .header-module-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header-module-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-module-subtitle {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.72);
            border: 2px solid rgba(124, 58, 237, 0.35);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .profile-trigger:hover {
            background: rgba(255,255,255,0.95);
            border-color: rgba(124, 58, 237, 0.65);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        
        /* Header module icons/actions (single source of truth in parent) */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-actions.hidden {
            display: none !important;
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            /* FIX: was a literal rgba(255,255,255,0.70), needing the
               separate [data-theme="dark"] .header-action-btn override
               below to fix it for dark mode. --kyn-header-action-bg is the
               exact same value in light mode and the exact same dark value
               that override used — theme.engine.js already writes this
               variable inline for both themes, so this rule is correct on
               its own now, no override needed for the background itself. */
            background: var(--kyn-header-action-bg);
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .header-action-btn:hover {
            transform: translateY(-1px);
            background: var(--kyn-header-action-bg-hover);
        }

        .header-action-btn i {
            font-size: 16px;
        }

        .profile-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7c3aed;
        }
        .profile-name-sm {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        /* PROFILE MODAL */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .profile-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-card {
            width: 90%;
            max-width: 480px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
        }
        .cover-area {
            height: 160px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            cursor: pointer;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: -50px auto 12px;
            display: block;
            cursor: pointer;
            object-fit: cover;
            background: #f3f4f6;
        }
        .profile-info {
            text-align: center;
            padding: 0 20px 20px;
        }
        .profile-username {
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .profile-bio {
            color: #6b7280;
            font-size: 14px;
            margin: 8px 0;
        }
        .edit-profile-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
        }
        .profile-action-row {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-link-btn {
            background: #1f2937;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .profile-action-row .edit-profile-btn,
        .profile-action-row .settings-link-btn {
            margin-top: 0;
        }
        .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        #permanentSidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
            font-size: 20px;
            position: relative;
        }

        .nav-icon:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-icon.active {
            background: #7c3aed;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .iframe-container {
            position: fixed;
            top: 56px;
            left: 60px;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 90;
        }

        /* FIX (chat-history list flashes before a specific chat opens): opening
           a chat from friends/calls/status/group reveals #messagesContent via
           navigateToPage() so the module's background work (conversation
           lookup/creation, history fetch) can proceed — but message.html's own
           default internal view is its chat LIST, and it only swaps to the
           specific conversation once it processes the OPEN_CHAT_WITH_USER
           postMessage a beat later. That gap is what showed the list first.
           This veil hides the container's paint (not its DOM — the iframe
           keeps running and the background lookup is unaffected) until the
           CHAT_OPENED ack below confirms the specific chat is actually showing,
           so every path still goes through the same open-chat logic — it just
           never paints the in-between list state. Ordinary navigation to the
           Messages tab (browsing the list on purpose) never applies this class. */
        #messagesContent.chat-opening-veil {
            visibility: hidden !important;
        }

        /* Iframes are hidden via visibility+pointer-events so their JS initialises
           eagerly in the background — tab switching is instant instead of waiting
           for the iframe to boot on first click. */
        .iframe-container.hidden {
            visibility: hidden !important;
            pointer-events: none !important;
            /* Keep display:block so the iframe document loads & runs */
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================================
           CENTER ACTION POPUP MENU
           ============================================================ */
        #centerActionMenu {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: linear-gradient(160deg, #1e2535, #141926);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
        }
        #centerActionMenu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .center-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            transition: background 0.18s, transform 0.15s;
            min-width: 90px;
        }
        .center-menu-item:active { transform: scale(0.94); }
        .center-menu-item:hover { background: rgba(255,255,255,0.12); }
        .center-menu-item i {
            font-size: 22px;
        }
        .center-menu-item span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        /* FIX (NAV-PLUS-SWAP): renamed from .center-menu-group — Status now
           occupies this popup slot, keeping the same blue accent. */
        .center-menu-status i { color: #60a5fa; }
        .center-menu-games i { color: #f59e0b; }
        /* FIX (FRIENDS-ICON-INVISIBLE-IN-LIGHT-THEME): unlike calls/group/games,
           this icon had no explicit color, so it fell back to the .center-menu-item
           default. That default is fine in dark mode but effectively disappears
           in light mode, so give it its own explicit, theme-independent color
           like its siblings. */
        .center-menu-friends i { color: #f472b6; }
        #centerMenuOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1099;
        }
        #centerMenuOverlay.open { display: block; }

        /* ============================================================
           PROFILE EDIT PANEL (full-screen, slides up from bottom)
           ============================================================ */
        #profileEditPanel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10001;
            display: flex;
            align-items: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        #profileEditPanel.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-edit-sheet {
            width: 100%;
            max-height: 90vh;
            background: #fff;
            border-radius: 28px 28px 0 0;
            overflow-y: auto;
            transform: translateY(40px);
            transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
        }
        #profileEditPanel.active .profile-edit-sheet {
            transform: translateY(0);
        }
        .profile-edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 12px;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 2;
        }
        .profile-edit-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
        }
        .profile-edit-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-edit-body {
            padding: 20px;
        }
        .profile-edit-cover {
            width: 100%; height: 130px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .profile-edit-cover img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .profile-edit-cover-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 13px; font-weight: 600; gap: 6px;
            opacity: 0; transition: opacity 0.2s;
        }
        .profile-edit-cover:hover .profile-edit-cover-overlay { opacity: 1; }
        .profile-edit-avatar-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .profile-edit-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 3px solid #7c3aed;
            object-fit: cover;
            cursor: pointer;
            flex-shrink: 0;
        }
        .profile-edit-avatar-hint {
            font-size: 13px; color: #64748b; line-height: 1.5;
        }
        .profile-edit-avatar-hint strong { color: #7c3aed; display: block; font-size: 14px; margin-bottom: 2px; }
        .profile-edit-field {
            margin-bottom: 16px;
        }
        .profile-edit-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .profile-edit-field input,
        .profile-edit-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.18s;
            font-family: inherit;
            resize: none;
        }
        .profile-edit-field input:focus,
        .profile-edit-field textarea:focus {
            border-color: #7c3aed;
            background: #fff;
        }
        .profile-edit-save {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .profile-edit-save:active { opacity: 0.85; }

        /* ============================================================
           ============================================================ */

        /* ---- Notch / pill shape cut-out behind center button ---- */
        .mobile-nav-bar::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: transparent;
            border-radius: 0 0 40px 40px;

            box-shadow: 0 20px 0 0 var(--kyn-navbar-notch-shadow);

            background: var(--kyn-bg-navbar, linear-gradient(180deg, rgba(10,13,22,0.98) 0%, rgba(13,17,28,0.99) 100%));

            body.status-panel-active .mobile-nav-bar,

        .mobile-nav-icon {

            border-radius: 3px;
            background: #3b82f6;

        }

        .mobile-nav-icon.active::before {
            transform: translateX(-50%) scaleX(1);

        .mobile-nav-icon::after {
            content: '';
            position: absolute;

            height: 4px;
            border-radius: 50%;
            background: #3b82f6;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mobile-nav-icon.active::after {
            transform: translateX(-50%) scale(1);

        /* Notification badge on nav icons */

        @keyframes badgePop {

        /* Desktop styles */

                bottom: 76px;

            body.group-panel-active .iframe-container,
            body.status-panel-active .iframe-container,

        @keyframes pulse {
            0%, 100% {

        /* Additional utility classes */

        .pointer-events-auto { pointer-events: auto; }

           as #dbeafe / #cffafe (light blue/cyan), while this block forced
           them to #1e3a8a / #1e293b (dark navy/slate) permanently, with no
           light-mode path back and no dependence on data-theme at all —
           a second, competing, always-on theme authority, exactly what
           this app must not have. (--app-secondary-surface,

            background: #0f172a !important;
        }

        /* Iframe containers dark bg */
        [data-theme="dark"] .iframe-container {
            background: #0f172a !important;
        }

        /* ── TOOLS MODULE NAV TABS (in parent header) ────────────────── */
        #toolsHeaderNav, #friendsHeaderNav {
            display: flex; align-items: center; gap: 4px;
        }
        #toolsHeaderNav.hidden, #friendsHeaderNav.hidden { display: none !important; }
        /* FIX (theme audit): these pills only had translucent-white/light-gray
           values (background rgba(255,255,255,0.07), text #9ca3af) meant to
           sit on the header's old permanently-dark background — now that
           #globalHeader correctly goes light in light mode, that combination
           is close to invisible (near-white on white). Base styles below are
           now readable on a light header; [data-theme="dark"] restores the
           original dark-mode look. */
        .jm-parent-nav-tab {
            display: inline-flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2px; padding: 4px 8px;
            border: none; background: rgba(15,23,42,0.06);
            border-radius: 10px; color: #475569;
            cursor: pointer; transition: background .18s, color .18s;
            min-height: 44px; min-width: 44px;
        }
        .jm-parent-nav-tab:hover { background: rgba(15,23,42,0.12); color: #111b21; }
        .jm-parent-nav-tab.active { background: rgba(37,99,235,0.14); color: #2563eb; }
        [data-theme="dark"] .jm-parent-nav-tab { background: rgba(255,255,255,0.07); color: #9ca3af; }
        [data-theme="dark"] .jm-parent-nav-tab:hover { background: rgba(255,255,255,0.14); color: #e5e7eb; }
        [data-theme="dark"] .jm-parent-nav-tab.active { background: rgba(37,99,235,0.25); color: #60a5fa; }
        /* toolsBackBtn removed — back navigation handled inside the tools iframe */

        /* STATUS ONE-PANEL MOBILE */
        @media (max-width: 768px) {
            body.status-panel-active #statusContent { top:0!important;left:0!important;right:0!important;bottom:0!important;z-index:5000!important;visibility:visible!important;pointer-events:auto!important;display:block!important;background:transparent!important; }
            body.status-panel-active #globalHeader, body.status-panel-active #permanentSidebar, body.status-panel-active .mobile-nav-bar { visibility:hidden!important;pointer-events:none!important; }
            body.status-panel-active .iframe-container:not(#statusContent) { visibility:hidden!important;pointer-events:none!important; }
            #statusContent .content-iframe { width:100%!important;height:100%!important;display:block!important;border:0!important; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <!-- FIX (WRONG-ICON-ON-LAUNCH-SCREEN): this was a hardcoded 🧠 emoji on a
         purple/green gradient tile captioned "Kynecta" — leftover pre-rebrand
         placeholder art. It is the first thing shown on every cold start, so it
         was the "brain icon instead of the Necpa icon" seen at launch. It now
         renders the real app icon (/icons/necpa-192.png — the same asset
         manifest.json ships for the installed PWA) under the real product name,
         with a plain tile kept only as an onerror fallback so the screen never
         goes blank if the image 404s. -->
    <div id="loadingScreen">
        <div style="text-align: center;">
            <img src="/icons/necpa-192.png" alt="Necpa"
                 style="width: 64px; height: 64px; border-radius: 16px; display: block; object-fit: cover; margin: 0 auto 16px; animation: pulse 1.5s infinite;"
                 onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{style:'width:64px;height:64px;border-radius:16px;margin:0 auto 16px;background:#1a73e8'}));">
            <h2 style="color: #374151;">Necpa</h2>
            <p style="color: #6b7280;">Loading...</p>
        </div>
    </div>

    <!-- Global Header with Profile & Cover -->
    <div id="globalHeader">

        <!-- DEFAULT: icon + page title (hidden when group chat is open) -->
        <div class="header-context">
            <div id="headerModuleBadge" class="header-module-badge">
                <i id="headerModuleIcon" class="fas fa-comments"></i>
            </div>
            <div class="header-module-copy">
                <div id="headerModuleTitle" class="header-module-title">Messages</div>
                <div id="headerModuleSubtitle" class="header-module-subtitle">Your recent chats load from local cache first.</div>
            </div>
        </div>

        <!-- 1:1 CHAT CONTEXT: replaces default when a direct-message chat is open.
             Mirrors message.html's own header (kept functional but visually hidden
             there) so there is exactly one header rendered, with no duplicate row
             and no leftover blank space. -->
        <div id="headerChatCtx">
            <button class="hgm-btn" id="hdrChatBack" title="Back to chats">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div id="hdrChatAvatar" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:13px;color:#fff;cursor:pointer;user-select:none;overflow:hidden;">
                <i class="fas fa-user"></i>
            </div>
            <div style="flex:1;min-width:0;cursor:pointer;" id="hdrChatInfo">
                <div id="hdrChatName" style="font-weight:600;font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;">Chat</div>
                <div id="hdrChatStatus" style="font-size:11px;color:var(--text-secondary);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Offline</div>
            </div>
            <button class="hgm-btn" id="hdrChatMore" title="More options"><i class="fas fa-ellipsis-v"></i></button>
        </div>

        <!-- GROUP CHAT CONTEXT: replaces default when a group panel is open -->
        <div id="headerGroupCtx">
            <!-- Back -->
            <button class="hgm-btn" id="hdrGroupBack" title="Back to groups">
                <i class="fas fa-arrow-left"></i>
            </button>
            <!-- Avatar initials -->
            <div id="hdrGroupAvatar" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0084ff,#0055cc);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:13px;color:#fff;cursor:pointer;user-select:none;">G</div>
            <!-- Name + meta -->
            <div style="flex:1;min-width:0;">
                <div id="hdrGroupName" style="font-weight:600;font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;">Group</div>
                <div id="hdrGroupMeta" style="font-size:11px;color:var(--text-secondary);line-height:1.2;">0 members</div>
            </div>
            <!-- Actions -->
            <div style="position:relative;">
                <button class="hgm-btn" id="hdrGroupMore" title="More options"><i class="fas fa-ellipsis-v"></i></button>
                <div id="hdrGroupMenu" style="display:none;position:fixed;min-width:175px;background:var(--surface-color);border:1px solid var(--border-color);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:9999;overflow:hidden;padding:4px 0;">
                    <button class="hgm-item" data-hga="members"><i class="fas fa-users"></i> Members</button>
                    <button class="hgm-item" data-hga="settings"><i class="fas fa-cog"></i> Settings</button>
                    <button class="hgm-item" data-hga="purpose"><i class="fas fa-tag"></i> Purpose</button>
                    <button class="hgm-item" data-hga="info"><i class="fas fa-info-circle"></i> Group Info</button>
                    <hr style="border:none;border-top:1px solid var(--border-color);margin:4px 0;">
                    <button class="hgm-item" data-hga="leave" style="color:#f59e0b;"><i class="fas fa-sign-out-alt"></i> Leave Group</button>
                    <button class="hgm-item hgm-danger" data-hga="delete"><i class="fas fa-trash"></i> Delete Group</button>
                </div>
            </div>
        </div>

        <div id="headerActions" class="header-actions hidden" aria-label="Module actions"></div>

        <!-- TOOLS NAV TABS — shown only when tools page is active -->
        <div id="toolsHeaderNav" class="hidden" aria-label="Tools navigation">
            <button class="jm-parent-nav-tab" data-tools-page="home" title="Home" onclick="toolsNavTo('home')">
                <i class="fas fa-home" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Home</span>
            </button>
            <button class="jm-parent-nav-tab" data-tools-page="categories" title="Categories" onclick="toolsNavTo('categories')">
                <i class="fas fa-th-list" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Categories</span>
            </button>
            <button class="jm-parent-nav-tab" data-tools-page="cart" title="Cart" onclick="toolsNavTo('cart')" style="position:relative">
                <i class="fas fa-shopping-cart" style="font-size:15px"></i>
                <span id="parentCartBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#f97316;color:#fff;font-size:8px;font-weight:800;border-radius:10px;padding:1px 5px;min-width:14px;text-align:center;line-height:1.4">0</span>
                <span style="font-size:10px;line-height:1">Cart</span>
            </button>
            <button class="jm-parent-nav-tab" data-tools-page="wishlist" title="Wishlist" onclick="toolsNavTo('wishlist')">
                <i class="fas fa-heart" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Wishlist</span>
            </button>
            <button class="jm-parent-nav-tab" data-tools-page="account" title="Account" onclick="toolsNavTo('account')">
                <i class="fas fa-user-circle" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Account</span>
            </button>
        </div>

        <!-- FRIENDS NAV TABS — shown only when friends page is active. Replaces
             the Friends/Discover/Requests/Sent/Nearby tab row that used to live
             inside friend.html's own iframe: this parent header now owns the
             tabs, and just tells the iframe which one is active. -->
        <div id="friendsHeaderNav" class="hidden" aria-label="Friends navigation">
            <button class="jm-parent-nav-tab active" data-friends-page="friends" title="Friends" onclick="friendsNavTo('friends')">
                <i class="fas fa-user-friends" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Friends</span>
            </button>
            <button class="jm-parent-nav-tab" data-friends-page="discover" title="Discover" onclick="friendsNavTo('discover')">
                <i class="fas fa-compass" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Discover</span>
            </button>
            <button class="jm-parent-nav-tab" data-friends-page="requests" title="Requests" onclick="friendsNavTo('requests')" style="position:relative">
                <i class="fas fa-user-clock" style="font-size:15px"></i>
                <span id="friendsRequestsBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#f97316;color:#fff;font-size:8px;font-weight:800;border-radius:10px;padding:1px 5px;min-width:14px;text-align:center;line-height:1.4">0</span>
                <span style="font-size:10px;line-height:1">Requests</span>
            </button>
            <button class="jm-parent-nav-tab" data-friends-page="sent" title="Sent" onclick="friendsNavTo('sent')">
                <i class="fas fa-paper-plane" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Sent</span>
            </button>
            <button class="jm-parent-nav-tab" data-friends-page="nearby" title="Nearby" onclick="friendsNavTo('nearby')">
                <i class="fas fa-location-arrow" style="font-size:15px"></i>
                <span style="font-size:10px;line-height:1">Nearby</span>
            </button>
        </div>

        <div id="profileTrigger" class="profile-trigger" title="Profile & Settings" aria-label="Profile">
            <img id="headerAvatar" class="profile-avatar-sm" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c3aed'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="avatar">
        </div>
    </div>

    <!-- Hidden username element for JS compatibility -->
    <span id="headerUserName" style="display:none;">User</span>

    <!-- Profile Modal -->
    <div id="profileModal" class="profile-modal">
        <div class="profile-card">
            <div class="cover-area" id="coverClickArea">
            <img id="modalCoverImg" class="cover-img" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 200%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 x2=%221%22 y1=%220%22 y2=%221%22%3E%3Cstop stop-color=%22%23667eea%22/%3E%3Cstop offset=%221%22 stop-color=%22%23764ba2%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22600%22 height=%22200%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2250%25%22 y=%2252%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2230%22 font-weight=%22700%22 fill=%22white%22%3ECover Photo%3C/text%3E%3C/svg%3E">
                <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <img id="modalAvatarImg" class="avatar-large" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c3aed'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
            <div class="profile-info">
                <div class="profile-username" id="modalUsername">User</div>
                <div class="profile-bio" id="modalBio">Hey there! I'm using Kynecta.</div>
                <div class="profile-action-row">
                    <button id="editProfileBtn" class="edit-profile-btn"><i class="fas fa-pen"></i> Edit Profile</button>
                    <button id="openSettingsBtn" class="settings-link-btn"><i class="fas fa-cog"></i> Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Permanent Sidebar (Desktop) -->
    <div id="permanentSidebar">
        <button class="nav-icon active" data-page="messages"><i class="fas fa-comments"></i></button>
        <button class="nav-icon" data-page="status"><i class="fas fa-circle"></i></button>
        <button class="nav-icon" data-page="group"><i class="fas fa-users"></i></button>
        <button class="nav-icon" data-page="friends"><i class="fas fa-user-friends"></i></button>
        <button class="nav-icon" data-page="games"><i class="fas fa-gamepad"></i></button>
        <button class="nav-icon" data-page="settings"><i class="fas fa-cog"></i></button>
        <button class="nav-icon" data-page="tools"><i class="fas fa-tools"></i></button>
        <div class="mt-auto mb-4 relative">
            <div class="kynecta-status-dot status-connected" style="position: absolute; bottom: 2px; right: 2px;"></div>
        </div>
    </div>

    <!-- Modern Bottom Navigation Bar (5-icon, mobile) -->
    <div id="mobileNavBar" class="mobile-nav-bar" role="navigation" aria-label="Main navigation">
        <!-- 1. Chat / Messages -->
        <button class="mobile-nav-icon active" data-page="messages" aria-label="Chat">
            <i class="fas fa-comment-dots"></i>
            <span class="nav-label">Chat</span>
        </button>

        <!-- 2. Games -->
        <button class="mobile-nav-icon" data-page="games" aria-label="Games">
            <i class="fas fa-gamepad"></i>
            <span class="nav-label">Games</span>
        </button>

        <!-- 3. CENTER — Quick Action (+) with popup menu -->
        <button class="mobile-nav-icon nav-center-action" id="centerActionBtn" aria-label="New Action" onclick="toggleCenterMenu(event)">
            <i class="fas fa-plus"></i>
        </button>

        <!-- 4. Groups -->
        <!-- FIX (NAV-PLUS-SWAP): this slot used to be Status/Updates (data-page="status").
             Status now lives inside the "+" popup menu instead, and Group has moved out
             of that popup into this bottom-bar slot — see the matching swap below in
             #centerActionMenu. -->
        <button class="mobile-nav-icon" data-page="group" aria-label="Groups">
            <i class="fas fa-users"></i>
            <span class="nav-label">Groups</span>
        </button>

        <!-- 5. Marketplace / Tools -->
        <button class="mobile-nav-icon" data-page="tools" aria-label="Marketplace">
            <i class="fas fa-store"></i>
            <span class="nav-label">Market</span>
        </button>
    </div>
    
    <!-- Center Action Popup Menu -->
    <div id="centerMenuOverlay" onclick="closeCenterMenu()"></div>
    <div id="centerActionMenu">
        <!-- FIX (NAV-PLUS-SWAP): was center-menu-group / navigateToPage('group') here;
             Group now sits in the bottom bar's Updates slot instead (see above), and
             Status has taken this spot in the "+" popup so it sits next to Friends. -->
        <div class="center-menu-item center-menu-status" onclick="closeCenterMenu(); navigateToPage('status');">
            <i class="fas fa-circle"></i>
            <span>Status</span>
        </div>
        <div class="center-menu-item center-menu-friends" onclick="closeCenterMenu(); navigateToPage('friends');">
            <i class="fas fa-user-friends"></i>
            <span>Friends</span>
        </div>
    </div>

    <!-- Profile Edit Panel (full-screen sheet) -->
    <div id="profileEditPanel">
        <div class="profile-edit-sheet">
            <div class="profile-edit-header">
                <h3>Edit Profile</h3>
                <button class="profile-edit-close" id="profileEditCloseBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="profile-edit-body">
                <!-- Cover photo -->
                <div class="profile-edit-cover" id="editCoverArea">
                    <img id="editCoverImg" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 200%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 x2=%221%22 y1=%220%22 y2=%221%22%3E%3Cstop stop-color=%22%23667eea%22/%3E%3Cstop offset=%221%22 stop-color=%22%23764ba2%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22600%22 height=%22200%22 fill=%22url(%23g)%22/%3E%3C/svg%3E" alt="cover">
                    <div class="profile-edit-cover-overlay"><i class="fas fa-camera"></i> Change Cover</div>
                </div>
                <!-- Avatar row -->
                <div class="profile-edit-avatar-row">
                    <img id="editAvatarImg" class="profile-edit-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c3aed'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="avatar">
                    <div class="profile-edit-avatar-hint">
                        <strong>Profile Photo</strong>
                        Tap your photo to update it
                    </div>
                </div>
                <!-- Fields -->
                <div class="profile-edit-field">
                    <label>Display Name</label>
                    <input type="text" id="editDisplayName" placeholder="Your name">
                </div>
                <div class="profile-edit-field">
                    <label>Bio</label>
                    <textarea id="editBio" rows="3" placeholder="Tell people about yourself..."></textarea>
                </div>
                <button class="profile-edit-save" id="profileEditSaveBtn">
                    <i class="fas fa-check"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- IFrame Containers for each module -->
    <div id="messagesContent" class="iframe-container">
        <iframe id="messagesIframe" class="content-iframe" src="message.html" data-module="messages"></iframe>
    </div>
    <div id="statusContent" class="iframe-container hidden">
        <iframe id="statusIframe" class="content-iframe" src="status.html" data-module="status"></iframe>
    </div>
    <div id="groupContent" class="iframe-container hidden">
        <iframe id="groupIframe" class="content-iframe" src="group.html" data-module="group"></iframe>
    </div>
    <div id="friendsContent" class="iframe-container hidden">
        <iframe id="friendsIframe" class="content-iframe" src="friend.html" data-module="friends" allow="camera; microphone; geolocation"></iframe>
    </div>
    <div id="settingsContent" class="iframe-container hidden">
        <iframe id="settingsIframe" class="content-iframe" src="settings.html" data-module="settings"></iframe>
    </div>
    <div id="toolsContent" class="iframe-container hidden">
        <iframe id="toolsIframe" class="content-iframe" src="Tools.html" data-module="tools"></iframe>
    </div>

    <!-- ── Add Friend FAB (fixed, bottom-right, above the bottom nav) ── -->
    <!-- Shown only on the messages module via JS below.
         FIX-FAB-POSITION: previously pinned at top:112px;right:14px, which sat
         directly on top of the calls-module's quick-actions row (Voice/Video/
         Group Call) and category tabs, overlapping real content. A standard
         bottom-right FAB position clears every module's own header regardless
         of that module's individual header height. -->
    <button id="fabAddFriend"
        onclick="navigateToPage('friends')"
        title="Add Friend"
        style="display:none;position:fixed;bottom:78px;right:16px;z-index:400;
               width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
               background:linear-gradient(135deg,#667eea,#764ba2);
               color:#fff;display:none;align-items:center;justify-content:center;
               box-shadow:0 4px 16px rgba(102,126,234,.5);
               transition:transform .15s,box-shadow .15s;">
        <i class="fas fa-user-plus" style="font-size:16px;pointer-events:none;"></i>
    </button>
    <div id="gamesContent" class="iframe-container hidden">
        <iframe id="gamesIframe" class="content-iframe" src="game.html" data-module="games"></iframe>
    </div>
    <style>
        .mobile-nav-icon[data-page="tools"] .ecom-nav-badge,
        .nav-icon[data-page="tools"] .ecom-nav-badge {
            position: absolute; top: 6px; right: calc(50% - 20px);
            min-width: 17px; height: 17px; padding: 0 3px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff; font-size: 9px; font-weight: 800;
            border-radius: 10px; display: none; align-items: center;
            justify-content: center; border: 2px solid var(--kyn-navbar-ring);
            line-height: 1; pointer-events: none;
            animation: badgePop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        .mobile-nav-icon[data-page="tools"] .ecom-notif-dot {
            position: absolute; top: 8px; right: calc(50% - 16px);
            width: 8px; height: 8px; background: #ef4444;
            border-radius: 50%; border: 2px solid var(--kyn-navbar-ring); display: none;
        }
        /* ── Add-Friend FAB ─────────────────────────────────────────────── */
        #fabAddFriend {
            transition: transform .15s ease, box-shadow .15s ease;
        }
        #fabAddFriend:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(102,126,234,.65) !important;
        }
        #fabAddFriend:active { transform: scale(.94); }
        /* Desktop: sit left of sidebar, vertically centered */
        @media (min-width: 768px) {
            #fabAddFriend { top: 50% !important; left: 80px !important; right: auto !important; bottom: auto !important; transform: translateY(-50%) !important; }
            #fabAddFriend:hover { transform: translateY(-50%) scale(1.1) !important; }
            #fabAddFriend:active { transform: translateY(-50%) scale(.94) !important; }
        }

    <script>
        // ======================================================================
        // SESSION PROTECTION
        // ======================================================================
        // __isLocalEnvironment / __getApiOrigin / __getApiBase are already
        // defined by js/config.js, loaded at the top of <head> — see the FIX
        // comment there for why this page no longer keeps its own hardcoded
        // copy of them.
        window.__apiBaseUrl = window.__getApiBase();

        // Session protection - prevent clearing critical auth keys
        (function() {
            const originalRemove = localStorage.removeItem;
            window.__allowAuthStorageMutation__ = window.__allowAuthStorageMutation__ === true;
            window.__withAuthStorageMutation = function(callback) {
                const previous = window.__allowAuthStorageMutation__ === true;
                window.__allowAuthStorageMutation__ = true;
                try {
                    return typeof callback === 'function' ? callback() : undefined;
                } finally {
                    window.__allowAuthStorageMutation__ = previous;
                }
            };
            localStorage.removeItem = function(key) {
                originalRemove.call(this, key);
            };
        })();

        // ======================================================================
        // TRUSTED ORIGIN HELPER
        // ======================================================================
        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            try {
                const url = new URL(origin);
                if (url.hostname === 'localhost' || url.hostname === '127.0.0.1') return true;
                if (url.protocol === 'https:' && url.hostname.endsWith('.onrender.com')) return true;
                if (url.origin === window.location.origin) return true;
            } catch(e) {}
            return false;
        }

        // ======================================================================
        // MODULE MAPPINGS
        // ======================================================================
        const moduleToIframeId = {
            'messages':  'messagesIframe',
            'message':   'messagesIframe',
            'status':    'statusIframe',
            'group':     'groupIframe',
            'groups':    'groupIframe',
            'group-core':'groupIframe',
            'friends':   'friendsIframe',
            'friend':    'friendsIframe',
            'friend-core':'friendsIframe',
            'settings':  'settingsIframe',
            'setting':   'settingsIframe',
            'tools':     'toolsIframe',
            'tool':      'toolsIframe',
            'marketplace':'toolsIframe',
            'games':     'gamesIframe',
            'game':      'gamesIframe',
        };

        // FIX-ROOT-CAUSE-DUPLICATE-MODULE-ALIASES: moduleToIframeId intentionally
        // keeps multiple alias keys (e.g. 'messages' AND 'message', 'friends' AND
        // 'friend' AND 'friend-core') pointing at the SAME physical iframe, for
        // lookups elsewhere that use either form (moduleToIframeId[page] etc).
        // But dispatchEventToModules() and sendToAllModulesIfNeeded() both did
        // `Object.entries(moduleToIframeId).forEach(...)` — which walks every
        // ALIAS, not every iframe — so a single broadcast cycle posted
        // SESSION_DATA/AUTH_READY/PARENT_READY (or any dispatchEventToModules
        // broadcast) into the SAME iframe 2-3 times per tick, once per alias.
        // Each child module's incoming-message validator only accepts messages
        // whose `target` exactly equals its own canonical MODULE_NAME (plural:
        // 'messages', 'friends', 'calls', 'groups', 'settings', 'tools' — see
        // "EXACT match required" / "EXACT module name per contract" comments in
        // each *-core module) so every alias send beyond the first was silently
        // rejected as wrong_target — visible as repeated
        // "[messages] Rejected message: wrong_target | target=message" console
        // spam. Worse, the redundant *accepted* sends (the matching-alias one
        // firing 2-3x back to back because RealtimeStabilizationLayer's own
        // duplicate suppression is keyed differently) is exactly what
        // RealtimeStabilizationLayer's "postMessage storm detected" warnings
        // were catching, and each one re-triggers downstream work (extra
        // fetchConversations()/fetchFriends() calls racing each other, extra
        // re-renders) — a very plausible contributor to the UI feeling like it
        // hangs on rapid interaction (e.g. the chat-list three-dot menu).
        //
        // Fix: walk each physical iframe exactly once, using only its first
        // (canonical, plural) alias — object key insertion order guarantees the
        // plural form is listed first for every entry above.
        const _uniqueModuleEntries = (function () {
            const seenIframeIds = new Set();
            const entries = [];
            Object.entries(moduleToIframeId).forEach(function ([moduleName, iframeId]) {
                if (seenIframeIds.has(iframeId)) return;
                seenIframeIds.add(iframeId);
                entries.push([moduleName, iframeId]);
            });
            return entries;
        })();

        // FIX-006: Iframe-ready queue — prevents postMessage events dropped during iframe load
        // Without this, any socket event arriving while an iframe's JS is still loading is silently lost.
        const _iframeReady = new Set();         // modules that have sent CHILD_READY
        const _iframeQueue = new Map();         // module -> Array<message> (queued before CHILD_READY)
        const _IFRAME_QUEUE_MAX = 100;          // cap per module to prevent memory growth

        // FIX-POSTMESSAGE-STORM: sliding-window throttle — max 10 msgs/sec per module
        const _postThrottleWindows = new Map();
        function _postToModule(moduleName, iframeId, message) {
            const iframe = document.getElementById(iframeId);
            if (!iframe || !iframe.contentWindow) return;

            // FIX Bug 3: Throttle raised to 30/sec (was 10). Real-time message events
            // (message:new, CALL_INCOMING etc.) are NEVER dropped regardless of rate.
            const _now = Date.now();
            if (!_postThrottleWindows.has(moduleName)) _postThrottleWindows.set(moduleName, []);
            const _wins = _postThrottleWindows.get(moduleName);
            // Drop timestamps older than 1 second
            while (_wins.length && _now - _wins[0] > 1000) _wins.shift();
            if (_wins.length >= 30) {
                // Storm detected — only drop low-priority setting floods, never real-time data
                const _t = message && message.type;
                const _isCritical = !_t || _t === 'message:new' || _t === 'new_message' || _t === 'FRIENDS_LIST_UPDATE' || _t === 'SESSION_DATA' || _t === 'AUTH_READY' || _t === 'PARENT_READY';
                if (!_isCritical && (_t === 'SETTING_CHANGED' || _t === 'SETTINGS_GLOBAL_UPDATE')) {
                    console.warn('[IframeQueue] postMessage storm — dropped', _t, 'for', moduleName);
                    return;
                }
            }
            _wins.push(_now);

            if (_iframeReady.has(moduleName)) {
                try { iframe.contentWindow.postMessage(message, '*'); } catch(e) {
                    console.error('[IframeQueue] postMessage failed for', moduleName, e.message);
                }
            } else {
                if (!_iframeQueue.has(moduleName)) _iframeQueue.set(moduleName, []);
                const q = _iframeQueue.get(moduleName);
                if (q.length < _IFRAME_QUEUE_MAX) q.push(message);
            }
        }

        function _flushIframeQueue(moduleName) {
            const queue = _iframeQueue.get(moduleName);
            if (!queue || queue.length === 0) return;
            const iframeId = moduleToIframeId[moduleName];
            if (!iframeId) return;
            const iframe = document.getElementById(iframeId);
            if (!iframe || !iframe.contentWindow) return;
            _chatLog('[IframeQueue] Flushing', queue.length, 'queued events to:', moduleName);
            queue.forEach(msg => { try { iframe.contentWindow.postMessage(msg, '*'); } catch(_) {} });
            _iframeQueue.delete(moduleName);
        }

        // FIX-ROOT-CAUSE-MESSAGE-DELIVERY-BYPASSES-READY-QUEUE: _postToModule (above)
        // is the ONLY delivery path in this codebase that actually checks _iframeReady
        // and queues-for-later via _iframeQueue/_flushIframeQueue when a target iframe
        // hasn't finished loading yet. Every message-delivery path that exists — the 5
        // documented "redundant" message:new relays (2 here, 2 in app.realtime.socket.js,
        // 1 in phase15.delivery.patch.js), including __kynRelayMessageOnce, the single
        // gate all 5 are supposed to route through — does a raw
        // `iframe.contentWindow.postMessage(...)` instead, which the browser silently
        // discards if the Messages iframe hasn't attached its listener yet (e.g. it's
        // mid-navigation/reload, which is exactly when a real-time message is most
        // likely to arrive, right after the user opens/returns to the app). Since a raw
        // postMessage never throws either way, every one of those 5 paths then reports
        // "delivered" and claims the shared dedup key (__kynRelayedMsgIds), so nothing
        // ever retries — this is a real, confirmed path for "message shows sent but
        // never displayed to the receiver". Exposing _postToModule here lets those paths
        // (patched below and in app.realtime.socket.js) route messages-iframe delivery
        // through the same ready-check + queue-and-flush-on-CHILD_READY mechanism that
        // already works correctly for every OTHER event type in this app.
        window.__kynPostToModule = _postToModule;

        // ======================================================================
        // PROFILE & COVER PICTURE MANAGEMENT
        // ======================================================================
        let currentUserProfile = { 
            id: null, 
            username: 'User', 
            avatar: null, 
            cover: null, 
            bio: 'Hey there! I\'m using Kynecta.' 
        };

        function createInlineAvatar(name, bgColor = '#2563eb', fgColor = '#ffffff') {
            const safeName = String(name || 'User').trim() || 'User';
            const initials = safeName
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(part => part.charAt(0).toUpperCase())
                .join('') || 'U';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="${bgColor}"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="${fgColor}">${initials}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function normalizeAvatarUrl(url, name, bgColor = '#2563eb') {
            const fallback = createInlineAvatar(name, bgColor);
            if (!url) return fallback;
            const value = String(url);
            if (!navigator.onLine && /ui-avatars\.com|placehold\.co/i.test(value)) {
                return fallback;
            }
            return value;
        }

        function readCachedStatusArray(key) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function getCachedApiFallback(endpoint) {
            if (endpoint === '/auth/me') {
                return { user: cachedUser, data: cachedUser };
            }
            if (endpoint === '/status/my') {
                return { statuses: readCachedStatusArray('knecta_my_statuses_cache') };
            }
            if (endpoint === '/status/highlights') {
                return { statuses: readCachedStatusArray('knecta_status_highlights'), highlights: readCachedStatusArray('knecta_status_highlights') };
            }
            return null;
        }

        function loadCachedFriendsListFromStorage() {
            const candidates = [
                'friends',
                'kynecta_friends_cache',
                'knecta_friends_cache',
                'knecta_contacts_cache'
            ];
            for (const key of candidates) {
                try {
                    const parsed = JSON.parse(localStorage.getItem(key) || 'null');
                    let arr = null;
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        arr = parsed;
                    } else if (parsed && Array.isArray(parsed.friends) && parsed.friends.length > 0) {
                        arr = parsed.friends;
                    }
                    if (arr) {
                        // FIX: Deduplicate by String(id) — integer key 5 and string key "5" are
                        // the same friend but both get stored due to a Map key type mismatch,
                        // causing 2 real friends to display as 4.
                        // Also strip non-accepted records (pending/blocked/removed) so they never
                        // appear in the friends list broadcast to all modules.
                        const seen = new Set();
                        const deduped = arr.filter(f => {
                            if (!f || !f.id) return false;
                            const st = f.status || 'accepted';
                            if (st === 'pending' || st === 'pending_sent' || st === 'pending_received' ||
                                st === 'blocked' || st === 'removed' || st === 'rejected') return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);
                            return true;
                        });
                        if (deduped.length > 0) return deduped;
                    }
                } catch (_) {}
            }
            return [];
        }

        function loadUserProfileFromStorage() {
            try {
                const auth = localStorage.getItem('kynecta_auth');
                if (auth) {
                    const parsed = JSON.parse(auth);
                    const user = parsed.user || parsed;
                    currentUserProfile.id = user.id || user.userId || parsed.userId || parsed.id;
                    currentUserProfile.username = user.displayName || user.username || user.name || parsed.displayName || parsed.username || 'User';
                    currentUserProfile.avatar = user.avatar || user.photoURL || parsed.avatar || parsed.photoURL;
                    currentUserProfile.cover = user.cover || parsed.cover;
                    currentUserProfile.bio = user.bio || parsed.bio || 'Hey there! I\'m using Kynecta.';
                }
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                if (token && !currentUserProfile.id) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        currentUserProfile.id = payload.userId || payload.id;
                        currentUserProfile.username = payload.displayName || payload.username || payload.name || 'User';
                    } catch(e) {}
                }
                const savedAvatar = localStorage.getItem('user_avatar');
                if (savedAvatar) currentUserProfile.avatar = savedAvatar;
                const savedCover = localStorage.getItem('user_cover');
                if (savedCover) currentUserProfile.cover = savedCover;
                const savedBio = localStorage.getItem('user_bio');
                if (savedBio) currentUserProfile.bio = savedBio;
                // BUG FIX (REAL-AVATAR-NEVER-PERSISTED-TO-USER_AVATAR-KEY): a user who
                // signed in with Google (or whose avatar came from kynecta_auth on
                // login) had a real photo in currentUserProfile.avatar, but the
                // 'user_avatar' localStorage key — the single key every other module
                // (status.html's iframe, header icons, etc.) reads to show the real
                // photo — was only ever written when the user manually uploaded a new
                // avatar via saveProfileUpdates(). So anyone who never uploaded one
                // saw a generic initials/placeholder icon everywhere except this
                // header, even though their real photo was known. Persist it here too,
                // once, so every module resolves the same real photo consistently.
                if (currentUserProfile.avatar && !savedAvatar) {
                    try { localStorage.setItem('user_avatar', currentUserProfile.avatar); } catch(_) {}
                }
                updateProfileUI();
            } catch(e) {}
        }

        function updateProfileUI() {
            const avatarUrl = normalizeAvatarUrl(currentUserProfile.avatar, currentUserProfile.username, '#2563eb');
            document.getElementById('headerAvatar').src = avatarUrl;
            document.getElementById('headerUserName').innerText = currentUserProfile.username;
            document.getElementById('modalAvatarImg').src = avatarUrl;
            document.getElementById('modalUsername').innerText = currentUserProfile.username;
            document.getElementById('modalBio').innerText = currentUserProfile.bio;
            document.getElementById('modalCoverImg').src = currentUserProfile.cover || 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 200%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 x2=%221%22 y1=%220%22 y2=%221%22%3E%3Cstop stop-color=%22%23667eea%22/%3E%3Cstop offset=%221%22 stop-color=%22%23764ba2%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22600%22 height=%22200%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2250%25%22 y=%2252%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2230%22 font-weight=%22700%22 fill=%22white%22%3ECover Photo%3C/text%3E%3C/svg%3E';
        }

        async function saveProfileUpdates(avatarFile, coverFile, bioText) {
            const baseUrl = window.__getApiBase();
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            if (!token) return;
            
            if (avatarFile) {
                const formData = new FormData();
                formData.append('avatar', avatarFile);
                try {
                    // BUG FIX: this used to POST to `${baseUrl}/users/avatar`, which
                    // doesn't exist — the backend only mounts avatar upload under
                    // `/api/profile/avatar` (src/routes/profiles.js). The 404 was
                    // silently swallowed by the catch below, so saving an avatar
                    // looked like it worked but nothing was ever persisted, and it
                    // reverted to the placeholder on every refresh.
                    const res = await fetch(`${baseUrl}/profile/avatar`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        // BUG FIX: the backend response shape is
                        // { success, data: { profile, pictureUrl } } — not a
                        // top-level `avatarUrl` — so this was always reading
                        // undefined even on a successful upload.
                        const avatarUrl = data?.data?.pictureUrl || data?.data?.profile?.profilePicture;
                        if (avatarUrl) {
                            currentUserProfile.avatar = avatarUrl;
                            localStorage.setItem('user_avatar', avatarUrl);
                        }
                    } else {
                        console.warn('Avatar upload failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Avatar upload failed:', e); }
            }
            
            if (coverFile) {
                const formData = new FormData();
                formData.append('cover', coverFile);
                try {
                    // BUG FIX: same endpoint-path issue as avatar above — the real
                    // route is `/api/profile/cover`, not `/api/users/cover`.
                    const res = await fetch(`${baseUrl}/profile/cover`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        // BUG FIX: same nested-response issue as avatar above —
                        // read data.data.coverUrl, not a top-level data.coverUrl.
                        const coverUrl = data?.data?.coverUrl || data?.data?.profile?.coverPhoto;
                        if (coverUrl) {
                            currentUserProfile.cover = coverUrl;
                            localStorage.setItem('user_cover', coverUrl);
                        }
                    } else {
                        console.warn('Cover upload failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Cover upload failed:', e); }
            }
            
            if (bioText !== undefined) {
                try {
                    // BUG FIX: same nonexistent-endpoint issue as avatar/cover above
                    // (was PATCH `${baseUrl}/users/profile`; the real route is
                    // PUT `/api/profile`). Also now actually checks res.ok instead
                    // of unconditionally treating the save as successful.
                    const res = await fetch(`${baseUrl}/profile`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bio: bioText })
                    });
                    if (res.ok) {
                        currentUserProfile.bio = bioText;
                        localStorage.setItem('user_bio', bioText);
                    } else {
                        console.warn('Bio update failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Bio update failed:', e); }
            }
            updateProfileUI();
            
            // Broadcast to all modules
            dispatchEventToModules({
                type: 'UPDATE_PROFILE_DATA',
                payload: { avatar: currentUserProfile.avatar, cover: currentUserProfile.cover, bio: currentUserProfile.bio }
            });
        }

        function setupProfileModal() {
            const modal = document.getElementById('profileModal');
            const trigger = document.getElementById('profileTrigger');
            const closeBtn = document.getElementById('closeModalBtn');
            const editBtn = document.getElementById('editProfileBtn');
            const settingsBtn = document.getElementById('openSettingsBtn');
            
            trigger.onclick = () => modal.classList.add('active');
            closeBtn.onclick = () => modal.classList.remove('active');
            modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
            
            // Edit Profile opens the full edit panel
            editBtn.onclick = () => {
                modal.classList.remove('active');
                openProfileEditPanel();
                if (typeof logProcessStatus === 'function') {
                    logProcessStatus('profile-action', true, 'open-edit-profile');
                }
            };

            if (settingsBtn) {
                settingsBtn.onclick = () => {
                    modal.classList.remove('active');
                    navigateToPage('settings');
                    if (typeof logProcessStatus === 'function') {
                        logProcessStatus('profile-action', true, 'open-settings');
                    }
                };
            }
        }

        // ======================================================================
        // CENTER ACTION POPUP MENU
        // ======================================================================
        function toggleCenterMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('centerActionMenu');
            const overlay = document.getElementById('centerMenuOverlay');
            const isOpen = menu.classList.contains('open');
            if (isOpen) {
                menu.classList.remove('open');
                overlay.classList.remove('open');
