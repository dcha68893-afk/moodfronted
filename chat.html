                            sessionStorage.setItem('pending_chat', JSON.stringify(_callChatPayload));
                            document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                            // Retry until iframe ACKs (clears pending_chat via CHAT_OPENED)
                            let _rfcAttempts = 0;
                            const _postRFC = () => {
                                const msgIframe = document.getElementById('messagesIframe');
                                if (msgIframe && msgIframe.contentWindow) {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: _callChatPayload,
                                        source: 'parent-frame'
                                    }, '*');
                                }
                                if (_rfcAttempts++ < 10) {
                                    setTimeout(() => { if (sessionStorage.getItem('pending_chat')) _postRFC(); }, 800);
                                }
                            };
                            setTimeout(_postRFC, 400);
                        } else if (payload.userId || payload.userName) {
                            // ✅ FIXED: Regular navigation from friends/calls - open chat with user
                            const chatPayload = {
                                userId: payload.userId,
                                userName: payload.userName || 'User',
                                findExisting: true, // Continue existing chat if available
                                timestamp: Date.now(),
                                source: payload.source || 'parent-frame'
                            };
                            
                            sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                            document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                            
                            // Retry until iframe ACKs
                            let _chatAttempts = 0;
                            const _postChatOpen = () => {
                                const msgIframe = document.getElementById('messagesIframe');
                                if (msgIframe && msgIframe.contentWindow) {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: chatPayload,
                                        source: 'parent-frame'
                                    }, '*');
                                }
                                if (_chatAttempts++ < 12) {
                                    setTimeout(() => { if (sessionStorage.getItem('pending_chat')) _postChatOpen(); }, 600);
                                }
                            };
                            setTimeout(_postChatOpen, 400);
                        }
                    } else if (data.module === 'friends' && data.payload?.returnFromCall) {
                        const friendsIframe = document.getElementById('friendsIframe');
                        if (friendsIframe && friendsIframe.contentWindow) setTimeout(() => friendsIframe.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*'), 300);
                    }
                }

                if (data.type === 'DIRECT_CHAT_REQUEST') {
                    const chatPayload = {
                        userId:       data.payload.userId,
                        userName:     data.payload.userName || data.payload.name || 'User',
                        findExisting: true,
                        timestamp: Date.now()
                    };
                    navigateToPage('messages');
                    // FIX-HEADER-ICON-CONFLICT: navigateToPage('messages') only shows the
                    // chat LIST — it deliberately never sets chat-panel-active on its own
                    // (see the comment on that flag inside navigateToPage). Every other
                    // code path that opens one specific chat sets this flag right after
                    // navigating; this path was missing it, so #globalHeader (the sidebar's
                    // own header) stayed visible instead of message.html's chat header,
                    // making it look like the sidebar's icons had leaked into the chat panel.
                    document.body.classList.add('chat-panel-active');
                    
                    // Fix infinite loop - use proper counter and acknowledgment
                    if (!window.__dcAttempts) window.__dcAttempts = 0;
                    if (!window.__dcChatOpened) window.__dcChatOpened = false;
                    
                    const _postChatOpen = () => {
                        if (window.__dcChatOpened) {
                            window.__dcAttempts = 0; // Reset counter on success
                            return; // ACK received — stop
                        }
                        
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            messagesIframe.contentWindow.postMessage({
                                type:    'OPEN_CHAT_WITH_USER',
                                payload: chatPayload,
                                source:  'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            _chatLog('[chat.html] DIRECT_CHAT_REQUEST → OPEN_CHAT_WITH_USER sent, attempt', window.__dcAttempts + 1);
                        }
                        
                        if (window.__dcAttempts++ < 3) { // Reduced from 12 to 3 attempts
                            setTimeout(_postChatOpen, 600);
                        } else {
                            console.warn('[chat.html] DIRECT_CHAT_REQUEST failed after 3 attempts, stopping to prevent infinite loop');
                            window.__dcAttempts = 0; // Reset counter
                        }
                    };
                    
                    // Reset state before starting new request
                    window.__dcChatOpened = false;
                    window.__dcAttempts = 0;
                    setTimeout(_postChatOpen, 300);
                }

                if (data.type === 'DIRECT_CALL_REQUEST') {
                    const p = data.payload || {};
                    // Always return to friends after a direct call from friends module
                    sendFriendsToCallsIframe();
                    __dispatchCallToIframe(p.userId, p.userName || p.name || 'User', p.callType || 'voice', 'friends', p.userId, 'friends-module');
                }

                // FIX-INCALL-CHAT-BROKEN (send side): calls.html's in-call chat
                // falls back to posting this message up when it has no direct
                // socket (which is always, inside that iframe). Relay it out
                // through the one real socket connection, which lives here.
                if (data.type === 'CALL_CHAT_MESSAGE') {
                    const p = data.payload || {};
                    if (window.wsService && typeof window.wsService.emit === 'function') {
                        window.wsService.emit('call:chat_message', p);
                    } else if (window.KynectaRealtime && window.KynectaRealtime._socket) {
                        window.KynectaRealtime._socket.emit('call:chat_message', p);
                    } else {
                        console.warn('[Parent] CALL_CHAT_MESSAGE: no socket available to send');
                    }
                }

                // FIX-MSG-DELIVERY-ACK-RELAY: message.html (messagesIframe) keeps its own
                // independent socket connection, which can be momentarily disconnected or
                // still reconnecting when a message arrives — silently no-op'ing the direct
                // 'message:delivery_ack' emit. messages-core.ui-bridge.js already posts this
                // fallback up to us as a safety net (see FIX-ACK-SILENT-FAIL there), but until
                // now nothing here ever listened for it, so the sender's 10s delivery timeout
                // fired anyway even though the receiver had the message. Same root cause and
                // same fix pattern as CALL_CHAT_MESSAGE above: relay it out through the one
                // real, always-on socket connection, which lives here in chat.html.
                if (data.type === 'message:client_delivery_ack') {
                    const p = data.payload || {};
                    if (p && p.messageId && p.senderId) {
                        if (window.wsService && typeof window.wsService.emit === 'function') {
                            window.wsService.emit('message:delivery_ack', p);
                        } else if (window.KynectaRealtime && window.KynectaRealtime._socket) {
                            window.KynectaRealtime._socket.emit('message:delivery_ack', p);
                        } else {
                            console.warn('[Parent] message:client_delivery_ack: no socket available to send');
                        }
                    }
                }


                // ── GROUP CALL — triggered by parent header call/video buttons ──────────
                // postToGroup sends PARENT_GROUP_CALL to group iframe, which re-posts
                // INITIATE_CALL to parent. But we also handle it directly here so the
                // group header buttons in chat.html can dispatch calls without a round-trip.
                if (data.type === 'PARENT_GROUP_CALL') {
                    const p = data.payload || {};
                    const grp = window.__gcCurrentGroup || {};
                    const groupId   = p.groupId   || grp.id   || null;
                    const groupName = p.groupName  || grp.name || 'Group';
                    const callType  = p.type || p.callType || 'voice';
                    if (groupId) {
                        sendFriendsToCallsIframe();
                        __dispatchCallToIframe(
                            groupId, groupName, callType,
                            'group',          // returnTo
                            groupId,          // chatUserId
                            'group-hdr',      // source
                            { groupId, groupName, isGroup: true }
                        );
                    }
                }

                // ── STATUS_REPLY_RECEIVED / OPEN_CHAT ─────────────────────────────────────
                // Fired by status-ui.js when a user replies to a status.
                // Navigate to messages and open the correct conversation.
                if (data.type === 'OPEN_CHAT' || data.type === 'STATUS_REPLY_RECEIVED') {
                    const p = data.payload || {};
                    const targetUserId = p.userId || p.recipientId || p.ownerId;
                    const targetChatId = p.chatId;

                    const chatPayload = {
                        userId:       targetUserId,
                        chatId:       targetChatId,
                        findExisting: true,
                        statusReply:  true,
                        timestamp:    Date.now(),
                    };

                    navigateToPage('messages');
                    // FIX-HEADER-ICON-CONFLICT: see identical fix/comment on the
                    // DIRECT_CHAT_REQUEST handler above — this path opens one specific
                    // chat too, so it needs the same explicit chat-panel-active flag.
                    document.body.classList.add('chat-panel-active');

                    let _srAttempts = 0;
                    const _postStatusReplyOpen = () => {
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            messagesIframe.contentWindow.postMessage({
                                type:    'OPEN_CHAT_WITH_USER',
                                payload: chatPayload,
                                source:  'parent-frame',
                                timestamp: Date.now(),
                            }, '*');
                        }
                        if (_srAttempts++ < 3) setTimeout(_postStatusReplyOpen, 500);
                    };
                    setTimeout(_postStatusReplyOpen, 300);
                    _chatLog('[chat.html] STATUS_REPLY → navigated to messages, opening chat userId:', targetUserId, 'chatId:', targetChatId);
                }

                if (data.type === 'CHILD_CLOSING') {
                    const returnPage = data.returnTo || window.__lastActivePage || 'messages';
                    navigateToPage(returnPage);
                    if (returnPage === 'messages') {
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) setTimeout(() => messagesIframe.contentWindow.postMessage({ type: 'CALL_ENDED_RETURN', timestamp: Date.now() }, '*'), 200);
                    }
                }

                if (data.type === 'HIDE_SIDEBAR_ICONS') {
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = '0.3'; el.style.pointerEvents = 'none'; });
                    // FIX: Watchdog — auto-restore nav after 90s max (prevents permanent freeze if SHOW never fires)
                    clearTimeout(window.__navHideWatchdog);
                    window.__navHideWatchdog = setTimeout(function() {
                        document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = ''; el.style.pointerEvents = ''; });
                        console.warn('[NavWatchdog] Auto-restored nav icons after timeout');
                    }, 90000);
                }
                if (data.type === 'SHOW_SIDEBAR_ICONS') {
                    clearTimeout(window.__navHideWatchdog);
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = ''; el.style.pointerEvents = ''; });
                }

                if (data.type === 'API_RESPONSE' && data.status === 401) await refreshAuthToken();

                // FIX: Bounce REACTION_UPDATED (from ADD_REACTION API echo) back into
                // messages iframe as message:reaction so the sender sees their own emoji
                // immediately from the server-confirmed reactions object
                if (data.type === 'REACTION_UPDATED') {
                    const msgIframe3 = document.getElementById('messagesIframe');
                    if (msgIframe3 && msgIframe3.contentWindow) {
                        msgIframe3.contentWindow.postMessage({
                            type: 'message:reaction',
                            payload: data.payload,
                            source: 'ws-bridge'
                        }, '*');
                    }
                }

                if (data.type === 'REFRESH_CALL_HISTORY') {
                    const userId = data.payload?.userId || cachedUserId;
                    if (userId) await refreshCallHistoryForUser(userId);
                }

                if (data.type === 'CALL_INITIATE' || data.type === 'call:initiate') {
                    const localCallId = data.payload?.callId;
                    const callType = data.payload?.callType || data.payload?.type || 'audio';
                    const calleeId = data.payload?.calleeId;
                    const participantIds = data.payload?.participantIds;
                    const isGroupCall = data.payload?.isGroupCall || false;
                    // FIX-GROUP-CALL-NOTICE: groupId was previously never read here at all,
                    // so the backend had no way to resolve the group's member list or know
                    // which group's room to broadcast group:call-started to.
                    const groupId = data.payload?.groupId || null;
                    const callOriginPage = data.payload?.returnTo || window.__currentPage || window.__lastActivePage || 'calls';
                    window.__pendingCallOrigin = callOriginPage;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    try { if (!token) token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('nexopa_token') || localStorage.getItem('accessToken'); } catch(e) {}
                    try {
                        const body = { callType: callType === 'voice' ? 'audio' : callType, isGroupCall: isGroupCall };
                        if (isGroupCall && groupId) body.groupId = parseInt(groupId, 10);
                        if (isGroupCall && participantIds) body.participantIds = participantIds;
                        else if (calleeId && !isGroupCall) body.participantIds = [parseInt(calleeId)];
                        const resp = await fetch(`${baseUrl}/calls`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(body) });
                        const respData = await resp.json();
                        const callsIframe = document.getElementById('callsIframe');

                        // Offline fix: backend returns HTTP 200 with success:false + offline:true
                        // when the callee has no active socket.
                        // NOTE: receiverOnline is an advisory hint only — the backend ALWAYS creates
                        // the call and fires the socket notification regardless. We never abort here.
                        // Genuine no-answer is handled by the 30-second ring timeout on the caller side.
                        if (resp.ok && (respData.data?.call?.id || respData.data?.callId)) {
                            const serverCallId = respData.data?.call?.id || respData.data?.callId;
                            window.__callIdMap = window.__callIdMap || {};
                            window.__callIdMap[localCallId] = serverCallId;

                            // ── FIX: Also emit call:initiate via Socket.IO so CallSignalingService
                            // can set up the call room and route signals without HTTP round-trips.
                            // This ensures the receiver gets call:incoming even if the HTTP notification
                            // races with a brief socket reconnect on the backend.
                            try {
                                const _rtSocket = window.KynectaRealtime && window.KynectaRealtime._socket;
                                if (_rtSocket && _rtSocket.connected) {
                                    _rtSocket.emit('call:initiate', {
                                        callId: serverCallId,
                                        targetUserId: calleeId || (participantIds && participantIds[0]),
                                        callType: callType === 'voice' ? 'audio' : callType,
                                        callerName: respData.data?.callerName || null,
                                        isGroupCall,
                                        participantIds: participantIds || (calleeId ? [parseInt(calleeId)] : []),
                                        timestamp: Date.now()
                                    });
                                }
                            } catch(_socketCallErr) {}

                            if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { ...(respData.data?.call || respData.data), calleeName: respData.data?.calleeName || null, calleeAvatar: respData.data?.calleeAvatar || null, callId: serverCallId, localCallId: localCallId, callType: callType, returnTo: callOriginPage, receiverOnline: true, success: true } }, '*');
                        } else {
                            if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { success: false, error: respData?.message || 'Failed to start call', localCallId } }, '*');
                        }
                    } catch(err) {
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { success: false, error: err.message, localCallId } }, '*');
                    }
                }

                if (data.type === 'API_REQUEST' && window.__callIdMap) {
                    let ep = data.payload?.endpoint || '';
                    Object.entries(window.__callIdMap).forEach(([local, server]) => { if (ep.includes(local)) data.payload.endpoint = ep.replace(local, server); });
                }

                // WebRTC Signaling Bridge
                if (data.type === 'SIGNAL_OFFER' || data.type === 'SIGNAL_ANSWER' || data.type === 'ICE_CANDIDATE') {
                    const payload = data.payload || {};
                    const localOrServerCallId = payload.callId || payload.id || null;
                    const resolvedCallId = (window.__callIdMap && window.__callIdMap[localOrServerCallId]) || localOrServerCallId;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    try {
                        if (!token) token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('nexopa_token') || localStorage.getItem('accessToken');
                    } catch(e) {}

                    if (!resolvedCallId) {
                        console.warn('[Parent] WebRTC signal dropped - missing callId', { type: data.type });
                        return;
                    }

                    // ── PRIMARY PATH: Socket.IO (real-time, low-latency) ────────────────
                    // Always try Socket.IO first — this is the correct path for WebRTC signals.
                    // HTTP REST was the only path before, which caused race conditions and
                    // call setup failures when the socket was briefly unstable.
                    let socketRelayed = false;
                    try {
                        const _rtSocket = window.KynectaRealtime && window.KynectaRealtime._socket;
                        if (_rtSocket && _rtSocket.connected) {
                            if (data.type === 'ICE_CANDIDATE') {
                                _rtSocket.emit('webrtc:signal', {
                                    callId: resolvedCallId,
                                    type: 'ice-candidate',
                                    candidate: payload.candidate,
                                    targetUserId: payload.targetUserId || payload.toUserId || null,
                                    timestamp: Date.now()
                                });
                            } else {
                                const signalType = data.type === 'SIGNAL_OFFER' ? 'offer' : 'answer';
                                const sdpPayload = data.type === 'SIGNAL_OFFER' ? payload.offer : payload.answer;
                                // Also emit call:webrtc_offer / call:webrtc_answer for CallSignalingService
                                _rtSocket.emit('call:webrtc_offer', {
                                    callId: resolvedCallId,
                                    targetUserId: payload.targetUserId || payload.toUserId || null,
                                    offer: sdpPayload,
                                    type: signalType,
                                    timestamp: Date.now()
                                });
                                _rtSocket.emit('webrtc:signal', {
                                    callId: resolvedCallId,
                                    type: signalType,
                                    sdp: typeof sdpPayload === 'string' ? sdpPayload : JSON.stringify(sdpPayload),
                                    targetUserId: payload.targetUserId || payload.toUserId || null,
                                    timestamp: Date.now()
                                });
                            }
                            socketRelayed = true;
                        }
                    } catch(_socketErr) {
                        console.warn('[Parent] Socket.IO signal relay failed:', _socketErr.message);
                    }

                    // ── FALLBACK PATH: HTTP REST ─────────────────────────────────────────
                    // Only use HTTP if Socket.IO failed/unavailable AND we have a token.
                    if (!socketRelayed && token) {
                        try {
                            if (data.type === 'ICE_CANDIDATE') {
                                const iceResp = await fetch(`${baseUrl}/calls/${resolvedCallId}/ice`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Authorization': `Bearer ${token}`
                                    },
                                    body: JSON.stringify({
                                        candidate: payload.candidate,
                                        timestamp: payload.timestamp || Date.now()
                                    })
                                });
                                if (!iceResp.ok) throw new Error(`ICE relay failed with ${iceResp.status}`);
                            } else {
                                const signalType = data.type === 'SIGNAL_OFFER' ? 'offer' : 'answer';
                                const sdpPayload = data.type === 'SIGNAL_OFFER' ? payload.offer : payload.answer;
                                const signalResp = await fetch(`${baseUrl}/calls/${resolvedCallId}/signal`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Authorization': `Bearer ${token}`
                                    },
                                    body: JSON.stringify({
                                        type: signalType,
                                        sdp: typeof sdpPayload === 'string' ? sdpPayload : JSON.stringify(sdpPayload),
                                        targetUserId: payload.targetUserId || payload.toUserId || null,
                                        timestamp: payload.timestamp || Date.now()
                                    })
                                });
                                if (!signalResp.ok) throw new Error(`${signalType} relay failed with ${signalResp.status}`);
                            }
                        } catch(sigErr) {
                            console.warn('[Parent] WebRTC signal HTTP fallback failed:', sigErr.message);
                        }
                    }
                    return;
                }

                // ── ADD PARTICIPANT to an existing call (group call) ─────────────
                if (data.type === 'CALL_ADD_PARTICIPANT') {
                    const payload = data.payload || {};
                    const localOrServerCallId = payload.callId || null;
                    const resolvedCallId = (window.__callIdMap && window.__callIdMap[localOrServerCallId]) || localOrServerCallId;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    try {
                        if (!token) token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('nexopa_token') || localStorage.getItem('accessToken');
                    } catch(e) {}

                    _chatLog('[Parent] Adding participant to call', payload);

                    if (!resolvedCallId || !payload.targetUserId || !token) {
                        console.warn('[Parent] call participant invite dropped - missing callId, targetUserId, or token');
                        return;
                    }

                    try {
                        const inviteResp = await fetch(`${baseUrl}/calls/${resolvedCallId}/participants`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                targetUserId: payload.targetUserId,
                                targetUserName: payload.targetUserName || null,
                                callType: payload.existingCallType || 'voice',
                                invitedBy: window.__currentUserId || null
                            })
                        });
                        const inviteData = await inviteResp.json().catch(() => ({}));
                        if (!inviteResp.ok || inviteData.success === false || inviteData.status === 'error') {
                            throw new Error(inviteData.message || 'Invite failed');
                        }
                        _chatLog('[Parent] participant invite sent successfully -> userId', payload.targetUserId);
                    } catch(e) {
                        console.warn('[Parent] call participant invite failed:', e.message);
                    }
                    return;
                }

                if (data.type === 'GET_FRIENDS_LIST') {
                    const src = event.source;
                    if (src && src.postMessage) src.postMessage({ type: 'FRIENDS_LIST_RESPONSE', payload: { friends: cachedFriendsList, timestamp: Date.now() } }, '*');
                    requestFriendsFromFriendIframe();
                }

                if (data.type === 'FRIENDS_DATA') {
                    const incoming = data.friends || data.payload?.friends || [];
                    if (Array.isArray(incoming) && incoming.length > 0) {
                        // FIX: Deduplicate by String(id) before caching and broadcasting.
                        // Without this, int id=5 and string id="5" both survive as separate
                        // entries, making every friend appear twice in all modules.
                        const seen = new Set();
                        cachedFriendsList = incoming.filter(f => {
                            if (!f || !f.id) return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);
                            return true;
                        });
                        broadcastFriendsToAllModules(cachedFriendsList);
                    }
                }

                // FIX: Also handle FRIENDS_SYNC — emitted by friend-core's syncToGlobals debounce.
                // This covers the instant cross-module sync path on every friend state change.
                if (data.type === 'FRIENDS_SYNC') {
                    const incoming = data.friends || [];
                    if (Array.isArray(incoming) && incoming.length > 0) {
                        const seen = new Set();
                        cachedFriendsList = incoming.filter(f => {
                            if (!f || !f.id) return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);
                            return true;
                        });
                        broadcastFriendsToAllModules(cachedFriendsList);
                    }
                }

                // FIX: Handle FRIEND_RELATIONSHIP_CHANGED for immediate cross-module status update
                if (data.type === 'FRIEND_RELATIONSHIP_CHANGED') {
                    const { action, friendId, friend } = data;
                    if (action === 'accepted' && friendId && friend) {
                        // Upsert this friend into the cached list
                        const idx = cachedFriendsList.findIndex(f => String(f.id) === String(friendId));
                        if (idx >= 0) cachedFriendsList[idx] = { ...cachedFriendsList[idx], ...friend };
                        else cachedFriendsList.push(friend);
                        broadcastFriendsToAllModules(cachedFriendsList);
                    } else if (action === 'removed' && friendId) {
                        cachedFriendsList = cachedFriendsList.filter(f => String(f.id) !== String(friendId));
                        broadcastFriendsToAllModules(cachedFriendsList);
                    }
                    // Relay the event to all modules
                    dispatchEventToModules({ type: 'FRIEND_RELATIONSHIP_CHANGED', payload: data, source: 'parent' });
                }

                if (data.type === 'FETCH_LISTINGS') {
                    const requestId = data.payload?.requestId;
                    if (!requestId) return;
                    const page = data.payload?.page || 1;
                    const limit = data.payload?.limit || 20;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    if (!token) { try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('nexopa_token') || localStorage.getItem('accessToken'); } catch(e) {} }
                    if (!token) { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*'); return; }
                    fetch(`${baseUrl}/marketplace/listings?page=${page}&limit=${limit}`, { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, credentials: 'include' })
                        .then(r => r.json())

            // ======================================================================

                    const f = document.getElementById('callsIframe');

                }
                function _normalizeSignalSdp(raw) {

                    }

                // ── UNIVERSAL BACK NAVIGATION ─────────────────────────────────

            // FIX-STALE-CALL-REPLAY: pending_call was being replayed to the calls

            window.__kynReplayPendingCall = function(callsIframeEl) {

                const age = Date.now() - (callData && callData.timestamp || 0);

            setupGlobalCallBanner();

                    ['kyn:call_answered',    'CALL_ACCEPTED'],

                // Friends → friends iframe
                ['kyn:friend:request','kyn:friend_request','kyn:friend:accepted',
                 'kyn:friend_accepted','kyn:friend:removed','kyn:friend_removed'].forEach(evt => {

                ['kyn:user:online','kyn:user:offline','kyn:presence:update','kyn:PRESENCE_UPDATE'].forEach(evt => {

                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe?.contentWindow) {
                            messagesIframe.contentWindow.postMessage({
                                type: 'message:new',
                                payload: { ...msg, transport: 'LAN' },
                                message: { ...msg, transport: 'LAN' },

                    _wsService.on('lan:peer_joined', (data) => {
                        document.querySelectorAll('iframe').forEach(f => {
                            try { f.contentWindow.postMessage({ type: 'lan:peer_joined', payload: data }, '*'); } catch(_) {}

                window.addEventListener('online', () => {

                });
                document.addEventListener('kyn:socket:connected', () => {
                    setTimeout(() => window.__OfflineMessageQueue?.flushAll?.(), 2000);

            const pendingChat = sessionStorage.getItem('pending_chat');
            if (pendingChat) {
                try {
                    const chatData = JSON.parse(pendingChat);
                    document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                    // Retry posting until message.html ACKs by clearing pending_chat
                    let _loadAttempts = 0;
                    const _postPending = () => {
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            messagesIframe.contentWindow.postMessage({
                                type: 'OPEN_CHAT_WITH_USER',
                                payload: chatData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                        }
                        if (_loadAttempts++ < 12) {
                            setTimeout(() => { if (sessionStorage.getItem('pending_chat')) _postPending(); }, 700);
                        } else {
                            // Give up — lifecycle ACTIVE in message.html will still replay from sessionStorage
                            console.warn('[chat.html] pending_chat not consumed after retries — lifecycle will handle it');

            setTimeout(() => {

                if (_ci && window.__kynReplayPendingCall) window.__kynReplayPendingCall(_ci);
            }, 1000);
        });

    <script>
/* ===================================================================
   GROUP HEADER CONTROLLER  v1.0  — injected into chat.html
   ===================================================================
   • Listens for GROUP_PANEL_OPEN  → activates group context in globalHeader
   • Listens for GROUP_PANEL_CLOSE → restores default header
   • Back / Call / Video / More buttons forwarded to group iframe
   • GROUP_DELETED → clear all group storage caches
   • CALL_ENDED duplicate refresh already debounced in main script

(function () {
'use strict';

function groupIframe() { return document.getElementById('groupIframe'); }
function postToGroup(type, payload) {
    var f = groupIframe();
    if (f && f.contentWindow)
        f.contentWindow.postMessage({ type: type, payload: payload || {}, source: 'parent-shell', timestamp: Date.now() }, '*');
}

/* ── Show group context in globalHeader ─────────────────────── */
function showGroupHeader(g) {
    if (!g) return;
    // Store for PARENT_GROUP_CALL dispatch
    window.__gcCurrentGroup = g;
    var hdr   = document.getElementById('globalHeader');
    var ctx   = document.getElementById('headerGroupCtx');
    var name  = document.getElementById('hdrGroupName');
    var meta  = document.getElementById('hdrGroupMeta');
    var av    = document.getElementById('hdrGroupAvatar');
    var acts  = document.getElementById('headerActions');
    var prof  = document.getElementById('profileTrigger');

    if (name) name.textContent = g.name || 'Group';
    if (meta) meta.textContent = ((g.stats && g.stats.totalMembers) || g.memberCount || 0) + ' members';
    if (av) {
        var ii = (g.name || 'G').split(' ').map(function (w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
        av.textContent = ii;
    }
    if (hdr)  hdr.classList.add('group-chat-active');
    hdr && hdr.classList.remove('chat-active');
    if (acts) acts.classList.add('hidden');
    if (prof) prof.style.visibility = 'hidden';
    window.__groupHeaderShown = true;
}

/* ── Restore default header ─────────────────────────────────── */
function hideGroupHeader() {
    var hdr  = document.getElementById('globalHeader');
    var menu = document.getElementById('hdrGroupMenu');
    var acts = document.getElementById('headerActions');
    var prof = document.getElementById('profileTrigger');

    if (hdr)  hdr.classList.remove('group-chat-active');
    if (menu) menu.style.display = 'none';
    if (prof) prof.style.visibility = '';
    window.__groupHeaderShown = false;

    /* Restore header label for current page */
    var page = window.__currentPage || 'messages';
    if (typeof updateHeaderContext === 'function') try { updateHeaderContext(page); } catch (e) {}
    if (typeof updateHeaderActions === 'function') try { updateHeaderActions(page); } catch (e) {}
}

/* ── Wire header buttons (called once after DOM ready) ──────── */
function wireButtons() {
    /* Back */
    var back = document.getElementById('hdrGroupBack');
    if (back && !back._ghw) { back._ghw = true;
        back.addEventListener('click', function () {
            postToGroup('PARENT_GROUP_CLOSE', {});
            hideGroupHeader();
        });
    }
    /* Voice call */
    var call = document.getElementById('hdrGroupCall');
    if (call && !call._ghw) { call._ghw = true;
        call.addEventListener('click', function () { postToGroup('PARENT_GROUP_CALL', { type: 'voice' }); });
    }
    /* Video call */
    var vid = document.getElementById('hdrGroupVideo');
    if (vid && !vid._ghw) { vid._ghw = true;
        vid.addEventListener('click', function () { postToGroup('PARENT_GROUP_CALL', { type: 'video' }); });
    }
    /* Three-dots — forwards to group iframe's chatMoreMenu (the authoritative menu) */
    var more = document.getElementById('hdrGroupMore');
    if (more && !more._ghw) { more._ghw = true;
        more.addEventListener('click', function (e) {
            e.stopPropagation();
            // Send message to group iframe — group.html's setupMenu() handles it
            postToGroup('OPEN_GROUP_MORE_MENU', {});
        });

    var av = document.getElementById('hdrGroupAvatar');
    if (av && !av._ghw) { av._ghw = true;
        av.addEventListener('click', function () { postToGroup('PARENT_GROUP_ACTION', { action: 'info' }); });
    }
}

/* ── Listen for messages from group iframe ──────────────────── */
window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.source === 'parent-hdr') return; // ignore echoes

    /* Group panel opened */
    if (d.type === 'GROUP_PANEL_OPEN' || d.type === 'GROUP_PANEL_OPENED' ||
        d.type === 'GROUP_CHAT_OPENED' || d.type === 'GROUP_DETAIL_OPENED') {
        var g = d.payload || d.group || d.data || {};
        showGroupHeader(g);
        document.body.classList.add('group-panel-active'); // all widths
        return;
    }

    /* Group panel closed */
    if (d.type === 'GROUP_PANEL_CLOSE' || d.type === 'GROUP_PANEL_CLOSED' ||
        d.type === 'GROUP_LIST_SHOWN'  || d.type === 'GO_BACK_TO_LIST') {
        hideGroupHeader();
        document.body.classList.remove('group-panel-active'); // all widths
        return;
    }

    /* Group updated (member count changed etc.) */
    if (d.type === 'GROUP_PANEL_UPDATE') {
        if (window.__groupHeaderShown) showGroupHeader(d.payload || {});
        return;
    }

    /* Group deleted — clear storage + refresh list */
    if (d.type === 'GROUP_DELETED') {
        var gid = d.payload && (d.payload.groupId || d.payload.id);
        if (gid) clearGroupFromAllStorage(String(gid));
        hideGroupHeader();
        if (window.innerWidth <= 768) document.body.classList.remove('group-panel-active');
        setTimeout(function () { postToGroup('PARENT_REFRESH_GROUPS', {}); }, 250);

    }

    // ── PHASE15 FIX-PHASE-C: Post-call UI restoration ────────────────────────
    if (d.type === 'POST_CALL_RESTORE') {
        // ── FIX: A single hangup can trigger this from both the local endCall()
        // path AND a remote call:ended echo. Dedup within 1.5s so we don't fire
        // navigateToPage() twice for the same hangup.
        var _pcrNow = Date.now();
        if (window.__lastPostCallRestoreAt && (_pcrNow - window.__lastPostCallRestoreAt) < 1500) {
            return;
        }
        window.__lastPostCallRestoreAt = _pcrNow;

        document.body.classList.remove('call-screen-active', 'in-call-active');
        // FIX (nav-icons-stuck-hidden): this is the definitive final cleanup

        // never reset window.__activeCallInProgress. That flag staying
        // stale=true defeats the FIX-CALL-STUCK-WATCHDOG a few hundred lines

        // sessionStorage 'call_return_ctx') so we reopen the EXACT chat/group/friend
        // screen the call was triggered from, not just the generic 'messages' tab.
        // Previously this handler ignored that context entirely and only ever did
        // navigateToPage(d.returnTo || 'messages'), which always landed on the

        var _pcCtx = window.__callReturnContext;

        try { sessionStorage.removeItem('call_return_ctx'); } catch(e) {}

        var _pcReturnTo = (_pcCtx && _pcCtx.returnTo) || d.returnTo || window.__lastActivePage || 'messages';
        var _pcPageMap = { conversations: 'messages', chats: 'messages', home: 'messages' };
        var _pcPage = _pcPageMap[_pcReturnTo] || _pcReturnTo;

        if (_pcPage === 'group') {
            navigateToPage('group');
            var _pcGf = document.getElementById('groupIframe');
            if (_pcGf && _pcGf.contentWindow) {

                    _pcGf.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, groupId: _pcCtx && _pcCtx.groupId, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                }, 300);
            }
        } else if (_pcPage === 'friends') {
            navigateToPage('friends');
            var _pcFf = document.getElementById('friendsIframe');
            if (_pcFf && _pcFf.contentWindow) {
                setTimeout(function() {
                    _pcFf.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                }, 300);
            }
        } else if (_pcPage === 'messages') {
            navigateToPage('messages');

            // when the CURRENT user initiated the call (__dispatchCallToIframe
            // sets it). For the receiver of a call, the specific chat they were

            // calls-core.js's pendingCallReturnChatUserId, itself set from
            // chat.html's callData._receiverReturnChatUserId at the moment the

            var _pcChatUserId = (_pcCtx && _pcCtx.chatUserId) || d.chatUserId;
            var _pcChatUserName = (_pcCtx && _pcCtx.userName) || d.chatUserName;
            if (_pcChatUserId) {
                var _pcMf = document.getElementById('messagesIframe');
                if (_pcMf && _pcMf.contentWindow) {

                        _pcMf.contentWindow.postMessage({ type: 'OPEN_CHAT_WITH_USER', payload: { userId: _pcChatUserId, userName: _pcChatUserName || 'User', returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                        document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                    }, 300);

}, true);

/* ── Purge a group from every localStorage / sessionStorage key ─ */
function clearGroupFromAllStorage(gidStr) {

        'knecta_groups_cache','groups_cache','group_list','myGroups','joinedGroups',
        'groupsData','kynecta_groups_v8','GC_groups','GC_myGroups','GC_joinedGroups',
        'knecta_group_queue'

    var gf = groupIframe();

        // was dropped forever, permanently hiding the chat header icons for
        // the rest of the session. A low incoming seq (<=2) means a fresh
        // iframe session, not a stale message, so always accept it.
        if (_lastChatHeaderInfo && info.chatId !== _lastChatHeaderInfo.chatId &&
            typeof info.seq === 'number' && typeof _lastChatHeaderInfo.seq === 'number' &&
            info.seq < _lastChatHeaderInfo.seq && info.seq > 2) {
            return;
        }
        _lastChatHeaderInfo = { chatId: info.chatId, seq: info.seq };

        var hdr  = document.getElementById('globalHeader');
        var name = document.getElementById('hdrChatName');
        var stat = document.getElementById('hdrChatStatus');
        var av   = document.getElementById('hdrChatAvatar');
        var acts = document.getElementById('headerActions');
        var prof = document.getElementById('profileTrigger');

        if (name) name.textContent = info.name || 'Chat';
        if (stat) stat.textContent = info.status || (info.online ? 'Online' : 'Offline');
        if (av) {
            if (info.avatarUrl) {
                av.innerHTML = '';
                var img = document.createElement('img');
                img.src = info.avatarUrl;
                img.alt = info.name || 'Chat';
                img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
                img.onerror = function () { av.innerHTML = '<i class="fas fa-user"></i>'; };
                av.appendChild(img);
            } else if (!av.querySelector('img')) {
                av.innerHTML = '<i class="fas fa-user"></i>';
            }
        }
        // Don't fight the group header if a group panel happens to be active
        if (hdr && !hdr.classList.contains('group-chat-active')) hdr.classList.add('chat-active');
        // FIX: belt-and-suspenders — also clear any inline style that might
        // be forcing this bar hidden from an older/unrelated code path, so
        // the CSS rule above is never fought by a leftover inline override.
        if (hdr) { hdr.style.removeProperty('opacity'); hdr.style.removeProperty('visibility'); hdr.style.removeProperty('display'); hdr.style.removeProperty('pointer-events'); }
        if (acts) acts.classList.add('hidden');
        if (prof) prof.style.visibility = 'hidden';
        window.__chatHeaderShown = true;
    }

    /* ── Restore default header ───────────────────────────────────── */
    function hideChatHeader() {
        var hdr  = document.getElementById('globalHeader');
        var prof = document.getElementById('profileTrigger');
        if (hdr)  hdr.classList.remove('chat-active');
        if (prof) prof.style.visibility = '';
        window.__chatHeaderShown = false;

        var page = window.__currentPage || 'messages';
        if (typeof updateHeaderContext === 'function') try { updateHeaderContext(page); } catch (e) {}
        if (typeof updateHeaderActions === 'function') try { updateHeaderActions(page); } catch (e) {}
    }

    /* ── Wire header buttons (called once after DOM ready) ─────────── */
    function wireButtons() {
        var back = document.getElementById('hdrChatBack');
        if (back && !back._chw) { back._chw = true;
            back.addEventListener('click', function () {
                postToMessage('PARENT_CHAT_ACTION', { action: 'back' });
                hideChatHeader();
            });
        }
        var call = document.getElementById('hdrChatCall');
        if (call && !call._chw) { call._chw = true;
            call.addEventListener('click', function () { postToMessage('PARENT_CHAT_ACTION', { action: 'call' }); });
        }
        var vid = document.getElementById('hdrChatVideo');
        if (vid && !vid._chw) { vid._chw = true;
            vid.addEventListener('click', function () { postToMessage('PARENT_CHAT_ACTION', { action: 'video' }); });
        }
        var more = document.getElementById('hdrChatMore');
        if (more && !more._chw) { more._chw = true;
            more.addEventListener('click', function (e) {
                e.stopPropagation();
                postToMessage('PARENT_CHAT_ACTION', { action: 'menu' });
            });
        }
        var info = document.getElementById('hdrChatInfo');
        if (info && !info._chw) { info._chw = true;
            info.addEventListener('click', function () { postToMessage('PARENT_CHAT_ACTION', { action: 'profile' }); });
        }
    }

    /* ── Listen for state broadcasts from the message iframe ───────── */
    // FIX-HEADER-ICON-REVERT: CHAT_PANEL_CLOSED used to call hideChatHeader()
    // synchronously and unconditionally the instant the message arrived.
    // message.html's broadcastState() (mutation observer + 1.5s poll) can
    // fire once right around the moment a chat panel opens or re-renders —
    // e.g. sampling chatPanel's classList a beat before 'hidden' is actually
    // removed, or a debounce window that resolves mid-transition — and send
    // a stale CLOSED for a panel that is, in fact, open and already showing
    // its own header (back/call/video/menu icons). Accepting that at face
    // value snapped the header straight back to the default page icon set
    // (the messages-list "history" icons: multi-send/new-chat), even though
    // the user was still inside the chat panel. Debounce it: delay applying
    // a close, and cancel the pending close if a CHAT_HEADER_UPDATE (proof
    // the panel is genuinely open) arrives in the meantime.
    var _chatHeaderCloseTimer = null;
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object') return;
        if (d.source === 'message-iframe') {
            if (d.type === 'CHAT_HEADER_UPDATE') {
                if (_chatHeaderCloseTimer) { clearTimeout(_chatHeaderCloseTimer); _chatHeaderCloseTimer = null; }
                if (window.__currentPage === 'messages') showChatHeader(d.payload || {});
                return;
            }
            if (d.type === 'CHAT_PANEL_CLOSED') {
                if (_chatHeaderCloseTimer) clearTimeout(_chatHeaderCloseTimer);
                _chatHeaderCloseTimer = setTimeout(function () {
                    _chatHeaderCloseTimer = null;
                    hideChatHeader();
                }, 400);
                return;
            }
        }
    });

    if (document.readyState === 'loading')
        document.addEventListener('DOMContentLoaded', wireButtons);
    else
        setTimeout(wireButtons, 100);

    window.__chatHdrShow = showChatHeader;
    window.__chatHdrHide = hideChatHeader;
    // FIX-HEADER-ICON-REVERT: let other listeners (e.g. the CHAT_OPENED
    // handler in setupPanelDetection, earlier in this document) cancel a
    // pending debounced close the instant they know the panel just opened,
    // instead of waiting for the 400ms timer to expire on its own.
    window.__cancelChatHeaderClose = function () {
        if (_chatHeaderCloseTimer) { clearTimeout(_chatHeaderCloseTimer); _chatHeaderCloseTimer = null; }
    };
    })();
    </script>
    <script>
  // FIX-KEEPALIVE: 14 minutes left almost no margin against Render's
  // 15-minute idle-sleep window — a single slow tick (network hiccup, tab
  // throttled in background, a missed timer due to heavy main-thread work)
  // was enough to let the dyno sleep mid-session. When it slept, the live
  // Socket.IO connection died from under the user (the "transport close" /
  // "xhr poll error" reconnect storms), which is what broke real-time
  // delivery for calls, messages, and status until the dyno cold-started
  // back up tens of seconds later.
  //
  // Pinging every 4 minutes gives roughly 4x margin, so a few missed/slow
  // ticks in a row are needed before the dyno could ever go idle — and a
  // background-tab/throttled-timer slip (common on mobile) won't single-
  // handedly cause it anymore.
  function keepBackendAwake() {
    fetch('https://nexopa-fy56.onrender.com/api/health', {
      method: 'GET',
      cache: 'no-cache'
    })
    .then(r => _chatLog('[KeepAlive] Ping sent, status:', r.status))
    .catch(e => console.warn('[KeepAlive] Ping failed:', e.message));
  }

  // Ping immediately on load, then every 4 minutes.
  keepBackendAwake();
  setInterval(keepBackendAwake, 4 * 60 * 1000);

  // FIX-KEEPALIVE-2: also ping immediately whenever the tab regains
  // visibility/focus after being backgrounded — this is exactly the
  // scenario (phone screen off, tab switched away) where setInterval
  // timers get throttled or paused by the browser, letting the dyno sleep
  // even with a short interval configured.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      keepBackendAwake();
    }
  });
  window.addEventListener('focus', keepBackendAwake);
</script>

<!-- PWA Install Banner + Instant Update -->
<script>
(function _pwaInstallAndUpdate() {
    'use strict';
    var isStandalone = function() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true ||
               document.referrer.includes('android-app://');
    };
    function _showEl(id, html) {
        if (document.getElementById(id)) return;
        var el = document.createElement('div');
        el.id = id;
        el.innerHTML = html;
        document.body.appendChild(el);
    }

    // Install Banner
    var _dp = null;
    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        _dp = e;
        var ts = parseInt(localStorage.getItem('pwa_dismissed') || '0');
        if (Date.now() - ts < 3 * 86400000) return;
        _showEl('pwaInstallBanner',
            '<div style="position:fixed;bottom:0;left:0;right:0;z-index:999999;background:#fff;border-top:2px solid #667eea;box-shadow:0 -4px 20px rgba(0,0,0,.15);padding:14px 16px;display:flex;align-items:center;gap:12px;font-family:-apple-system,sans-serif;animation:_pslide .35s ease">' +
            '<style>@keyframes _pslide{from{transform:translateY(100%)}to{transform:translateY(0)}}</style>' +
            '<img src="/nexopa-192.png" style="width:44px;height:44px;border-radius:10px;flex-shrink:0" onerror="this.style.display=\'none\'">' +
            '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:#111">Install Nexopa</div>' +
            '<div style="font-size:12px;color:#6b7280;margin-top:1px">Faster &amp; works offline</div></div>' +
            '<button onclick="window._pwaInstall()" style="background:#667eea;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0">Install</button>' +
            '<button onclick="window._pwaDismiss()" style="background:none;border:none;color:#9ca3af;font-size:22px;line-height:1;cursor:pointer;padding:2px;flex-shrink:0">&times;</button></div>'
        );
    });
    window._pwaInstall = async function() {
        if (!_dp) return;
        _dp.prompt();
        var r = await _dp.userChoice;
        _dp = null;
        var b = document.getElementById('pwaInstallBanner');
        if (b) b.remove();
    };
    window._pwaDismiss = function() {
        var b = document.getElementById('pwaInstallBanner');
        if (b) b.remove();
        localStorage.setItem('pwa_dismissed', String(Date.now()));
    };
    window.addEventListener('appinstalled', function() {
        var b = document.getElementById('pwaInstallBanner');
        if (b) b.remove();
    });

    // FIX: removed a duplicate, buggier inline PWA-update/banner implementation
    // that lived here. pwa-manager.js (loaded above) already does this
    // correctly: it compares SW versions before showing the banner (fixing
    // false-positive banners with no real update) and uses controllerchange
    // as the single, one-time reload trigger (fixing the double-reload
    // "opening-loading-opening-loading" loop). Having both meant two
    // independent systems racing each other on every update.
})();
</script>
