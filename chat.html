                menu.classList.add('open');
                overlay.classList.add('open');
            }
        }
        function closeCenterMenu() {
            document.getElementById('centerActionMenu').classList.remove('open');
            document.getElementById('centerMenuOverlay').classList.remove('open');
        }

        // ======================================================================
        // PROFILE EDIT PANEL
        // ======================================================================
        function openProfileEditPanel() {
            const panel = document.getElementById('profileEditPanel');
            // Pre-fill fields with current data
            document.getElementById('editDisplayName').value = currentUserProfile.username || '';
            document.getElementById('editBio').value = currentUserProfile.bio || '';
            const avatarUrl = normalizeAvatarUrl(currentUserProfile.avatar, currentUserProfile.username, '#2563eb');
            document.getElementById('editAvatarImg').src = avatarUrl;
            document.getElementById('editCoverImg').src = currentUserProfile.cover || document.getElementById('editCoverImg').src;
            panel.classList.add('active');

            // Avatar tap
            document.getElementById('editAvatarImg').onclick = () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = async (e) => {
                    if (!e.target.files[0]) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('editAvatarImg').src = ev.target.result;
                        document.getElementById('headerAvatar').src = ev.target.result;
                        document.getElementById('modalAvatarImg').src = ev.target.result;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                    await saveProfileUpdates(e.target.files[0], null, null);
                };
                input.click();
            };

            // Cover tap
            document.getElementById('editCoverArea').onclick = () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = async (e) => {
                    if (!e.target.files[0]) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('editCoverImg').src = ev.target.result;
                        document.getElementById('modalCoverImg').src = ev.target.result;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                    await saveProfileUpdates(null, e.target.files[0], null);
                };
                input.click();
            };

            // Save button
            document.getElementById('profileEditSaveBtn').onclick = async () => {
                const newBio = document.getElementById('editBio').value.trim();
                const newName = document.getElementById('editDisplayName').value.trim();
                if (newBio) await saveProfileUpdates(null, null, newBio);
                if (newName && newName !== currentUserProfile.username) {
                    currentUserProfile.username = newName;
                    localStorage.setItem('user_displayName', newName);
                    updateProfileUI();
                }
                panel.classList.remove('active');
            };

            // Close button
            document.getElementById('profileEditCloseBtn').onclick = () => panel.classList.remove('active');
            panel.onclick = (e) => { if (e.target === panel) panel.classList.remove('active'); };
        }

        // ======================================================================
        // CENTRALIZED EVENT DISPATCHER
        // ======================================================================
        function dispatchEventToModules(event) {
            const enrichedEvent = {
                ...event,
                source: 'parent',
                timestamp: event.timestamp || Date.now(),
                parentBroadcast: true,
                broadcastId: `${event.type}_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`
            };
            // FIX-006: Use _postToModule which queues messages for not-yet-ready iframes
            // FIX-ROOT-CAUSE-DUPLICATE-MODULE-ALIASES: walk each physical iframe once
            // (see _uniqueModuleEntries above) instead of once per alias key, so a
            // targetModule-less broadcast doesn't post into the same iframe 2-3 times.
            // NOTE: when enrichedEvent.targetModule is one of the non-canonical alias
            // names (e.g. 'message', 'friend', 'call'), it still needs to reach that
            // iframe — resolve the alias to its iframeId directly for that case.
            if (enrichedEvent.targetModule) {
                const _targetIframeId = moduleToIframeId[enrichedEvent.targetModule];
                if (_targetIframeId) _postToModule(enrichedEvent.targetModule, _targetIframeId, enrichedEvent);
                return;
            }
            _uniqueModuleEntries.forEach(([moduleName, iframeId]) => {
                _postToModule(moduleName, iframeId, enrichedEvent);
            });
        }
        
        const moduleRegistry = new Set();
        
        function registerModule(moduleName) {
            if (moduleName && !moduleRegistry.has(moduleName)) {
                moduleRegistry.add(moduleName);
                _chatLog(`📝 Module registered: ${moduleName} (Total: ${moduleRegistry.size})`);
            }
        }

        // ======================================================================
        // IFRAME SEND HELPERS
        // ======================================================================
        function sendFriendsToStatusIframe(friends) {
            const iframe = document.getElementById('statusIframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: 'FRIENDS_LIST_UPDATE',
                    payload: { friends: friends || (typeof cachedFriendsList !== 'undefined' ? cachedFriendsList : []), timestamp: Date.now() }
                }, '*');

        function logProcessStatus(processKey, isSuccess, detail) {

                const cacheKey = `${status}:${networkState}:${detail || ''}`;
                if (window.__processLogCache.get(processKey) === cacheKey) return;
                window.__processLogCache.set(processKey, cacheKey);

        function handleAppBackNavigation() {
            // ROOT-CAUSE FIX (hardware/device back button skips straight
            // past a panel a MODULE opened locally on its own, closing the
            // whole module instead — while the in-app back-arrow/cancel
            // button on that same panel works fine): every one of the ~8
            // module iframes has back-nav.js loaded, whose goBack() already
            // knows how to close a tracked local panel (friendDetailsPanel,
            // marketplaceDetailPanel, statusViewerPanel, etc. — see
            // back-nav.js's own panel list) — but only when something
            // INSIDE that iframe calls it (a click on the panel's own back
            // arrow). The device back button fires `popstate` on this
            // TOP-level document, not inside the iframe, so this function —
            // the sole authoritative hardware-back handler — never knew
            // such a panel was open at all: it has no visibility into an
            // iframe's own internal DOM, so it fell straight through to its
            // own module-level checks below and closed/left the entire
            // module. window.__childLocalPanel is kept up to date by a
            // matching fix in back-nav.js, which reports every local panel
            // open/close via postMessage as it happens (see the
            // SCREEN_STATE_CHANGED listener below) — so it can be checked
            // synchronously, with no round trip, before anything else here.
            window.__childLocalPanel = window.__childLocalPanel || {};
            const activeIframe = document.querySelector(`.content-iframe[data-module="${window.__currentPage}"]`);
            const openPanel = activeIframe && window.__childLocalPanel[activeIframe.id];
            if (activeIframe && openPanel) {
                try { activeIframe.contentWindow.postMessage({ type: 'CLOSE_LOCAL_PANEL', panel: openPanel }, '*'); } catch (_) {}
                // Optimistic — the iframe's own SCREEN_STATE_CHANGED message
                // (sent right after it actually closes the panel) reconciles
                // this if it turns out to be stale.
                delete window.__childLocalPanel[activeIframe.id];
                logProcessStatus('back-navigation', true, `closed-local-panel:${openPanel}`);
                return true;
            }

            const profileModal = document.getElementById('profileModal');
            if (profileModal && profileModal.classList.contains('active')) {
                profileModal.classList.remove('active');
                logProcessStatus('back-navigation', true, 'closed-profile-modal');
                return true;
            }

            const profilePanel = document.getElementById('profileEditPanel');
            if (profilePanel && profilePanel.classList.contains('active')) {
                profilePanel.classList.remove('active');
                logProcessStatus('back-navigation', true, 'closed-profile-editor');
                return true;
            }

            if (document.body.classList.contains('chat-panel-active')) {
                notifyMessagesBackToList();
                document.body.classList.remove('chat-panel-active');
                logProcessStatus('back-navigation', true, 'returned-chat-list');
                return true;
            }

            if (document.body.classList.contains('group-panel-active')) {
                document.body.classList.remove('group-panel-active');
                // Notify group iframe to go back to list
                const groupIframe = document.getElementById('groupIframe');
                if (groupIframe && groupIframe.contentWindow) {
                    groupIframe.contentWindow.postMessage({ type: 'GO_BACK_TO_LIST' }, '*');
                }
                logProcessStatus('back-navigation', true, 'returned-group-list');

            if (document.body.classList.contains('status-panel-active')) {

                }
                logProcessStatus('back-navigation', true, 'returned-status-list');

            if (document.body.classList.contains('games-panel-active')) {

                // Tell the games iframe (game.html) to go back to the arcade

            // FIX (BACK-STACK-EXACT-RESTORE, Tools module): Tools' sub-tabs

            if (window.__currentPage === 'tools' && window.__toolsCurrentPage && window.__toolsCurrentPage !== 'home') {

        function navigateToPage(page, options = {}) {
            _chatLog('[Navigation] navigateToPage called with:', page, options);
            if (!page) {
                console.warn('[Navigation] No page provided to navigateToPage');
                return;
            }
            // ── FAB visibility: show only on the messages module ──
            var _fab = document.getElementById('fabAddFriend');
            if (_fab) {
                var _fabPages = ['messages'];
                _fab.style.display = _fabPages.includes(page) ? 'flex' : 'none';
            }
            // FIX: clear the mirrored friend-request badge once the user
            // actually opens the Friends module — same "seen it, clear it"
            // pattern already used for the messages unread badge below.
            if (page === 'friends') {
                document.querySelectorAll('.friend-req-nav-badge').forEach(b => b.remove());
            }
            const fromHistory = !!options.fromHistory;
            if (window.__currentPage !== page) {
                // PHASE15 FIX: Maintain a proper navigation history stack
                if (!window.__navHistory) window.__navHistory = [];
                if (!fromHistory && window.__currentPage) {
                    window.__navHistory.push(window.__currentPage);
                    // Cap history stack at 20 entries
                    if (window.__navHistory.length > 20) window.__navHistory.shift();

                window.__lastActivePage = window.__currentPage || 'messages';
                window.__currentPage = page;
                _chatLog('[Navigation] Page changed from', window.__lastActivePage, 'to', page);
            }
            updateHeaderContext(page);
            updateHeaderActions(page);
            
            _chatLog('[Navigation] Hiding all iframe containers...');
            document.querySelectorAll('.iframe-container').forEach(c => {
                _chatLog('[Navigation] Hiding:', c.id, 'current classes:', c.className);
                c.classList.add('hidden');
            });
            
            const target = document.getElementById(`${page}Content`);
            _chatLog('[Navigation] Target element:', target, 'for page:', page);
            if (target) {
                _chatLog('[Navigation] Target before removing hidden:', target.className);
                target.classList.remove('hidden');
                _chatLog('[Navigation] Target after removing hidden:', target.className);
            } else {
                console.error('[Navigation] Target element not found for page:', page);

            document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`.nav-icon[data-page="${page}"], .mobile-nav-icon[data-page="${page}"]`).forEach(b => b.classList.add('active'));
            
            // FIX: the mirrored 1:1 chat header (#headerChatCtx) must only ever
            // show while the messages page is actually the visible one — the
            // iframe that feeds it keeps running (and broadcasting its state)
            // even while hidden, so guard here rather than trust it to know.
            if (page !== 'messages' && typeof window.__chatHdrHide === 'function') {
                window.__chatHdrHide();
            }


            // FIX: Clean up group/status panel classes when navigating away from those modules
            if (page !== 'group') {
                // FIX (All Groups list not showing after navigating away and back,
                // path 2): this used to only clear the PARENT's own CSS class.
                // If the user tapped a different bottom-nav icon (Messages, Calls,
                // etc.) while a group chat was open, instead of using the hardware
                // back button, the groupIframe was never told to close its internal
                // #groupChatPanel — so #sidebar (holding the All/My/Joined/Invites/
                // Admin tabs and #allGroupsList) stayed hidden on mobile exactly like
                // the GO_BACK_TO_LIST case above. Mirror that same notification here.
                // FIX (BACK-STACK-EXACT-RESTORE): this used to fire
                // unconditionally — including while the back button was
                // unwinding history through 'group' on its way to an
                // earlier module. That forced groupIframe to close its
                // open chat/settings panel every single time, so by the
                // time the user actually pressed back far enough to
                // return TO group, its own internal panel had already
                // been wiped and it could only ever show the bare list —
                // never the exact group chat/settings panel the user was
                // last on. groupChatPanel and its settings sub-panel live
                // entirely inside this iframe, which is never destroyed,
                // so simply NOT force-closing it here is enough to
                // preserve exact state; only reset it on a genuine
                // deliberate switch away (tapping a different nav icon),
                // never while fromHistory is unwinding the back stack.
                if (!fromHistory && document.body.classList.contains('group-panel-active')) {
                    const _groupIframeAway = document.getElementById('groupIframe');
                    if (_groupIframeAway && _groupIframeAway.contentWindow) {
                        _groupIframeAway.contentWindow.postMessage({ type: 'GO_BACK_TO_LIST', source: 'parent', timestamp: Date.now() }, '*');
                    }
                }
                document.body.classList.remove('group-panel-active');
            }
            if (page === 'status') {
                // FIX (Status opens the content panel instead of the status
                // list on mobile): this used to add status-panel-active
                // unconditionally on entry, which puts the iframe in its
                // full-screen "deeper screen" mode (parent header + nav hidden)
                // before the user has opened anything. Entering Status must land
                // on the LIST. status.html raises the class itself through
                // STATUS_PANEL_OPENED (feed / viewer / composer) and drops it
                // again with STATUS_LIST_SHOWN.
                document.body.classList.remove('status-panel-active');
            } else {
                if (document.body.classList.contains('status-panel-active')) {
                    // Leaving Status mid-flow (viewer/composer/feed open): reset
                    // the iframe to its list so returning later starts clean.
                    try {
                        const _statusIframeAway = document.getElementById('statusIframe');
                        if (_statusIframeAway && _statusIframeAway.contentWindow) {
                            _statusIframeAway.contentWindow.postMessage({ type: 'GO_BACK_TO_LIST', source: 'parent', timestamp: Date.now() }, '*');
                        }
                    } catch (_) {}
                }
                document.body.classList.remove('status-panel-active');
            }

            // FIX (NAV BAR STICKING when leaving Games via a different nav icon):
            // mirrors the group/status cleanup just above. game-v3.html's own
            // notifyGamesPanel() (relayed through game.html) handles the normal
            // in-arcade paths (opening a game, tapping back-to-arcade, the ×
            // close button), but if the player switches tabs a different way —
            // tapping Messages/Status/etc. directly while a game is open —
            // gamesIframe never gets a chance to send GAMES_PANEL_CLOSED, so
            // without this the nav would stay hidden on every other tab too.
            if (page !== 'games') {
                document.body.classList.remove('games-panel-active');
            }

            // BUG FIX (no icon nav after a call ends / after leaving a screen):
            // chat-panel-active hides .mobile-nav-bar (see CSS), and this used
            // to be left untouched whenever navigating away from 'messages',
            // on the theory that "the message iframe manages it". In practice
            // if a call — or any other navigation — happened without a clean
            // close event from that iframe (e.g. call started from the Calls
            // or Friends tab, or the iframe was swapped out mid-chat), the
            // class stayed stuck true forever, hiding the bottom nav bar even
            // on screens that have nothing to do with an open chat. Clear it
            // here for every page except 'messages'; POST_CALL_RESTORE (and
            // any other flow that deliberately reopens a specific chat) sets
            // it again explicitly right after calling navigateToPage(), so
            // that legitimate case is unaffected.
            if (page !== 'messages') {
                document.body.classList.remove('chat-panel-active');
                _unveilMessages();
            }
            
            // FIX (message module stuck in chat panel after navigating away
            // without clicking back): navigateToPage() already told the
            // messages iframe when it becomes FOCUSED again, but never told
            // it anything when navigating AWAY from it. If the user was
            // inside a specific chat (not just the chat list) and switched
            // to another module via the nav bar — not by tapping the
            // in-chat back button first — the iframe's own internal state
            // stayed on that chat forever, so coming back to Messages later
            // (or even just glancing at the tab) showed the same open chat
            // instead of the chat list. Tell it to reset, mirroring exactly
            // what clicking its own back button already does.
            // FIX (BACK-STACK-EXACT-RESTORE): same class of bug as the
            // group GO_BACK_TO_LIST fix above — MODULE_BLURRED used to
            // fire even while the back button was unwinding history
            // through 'messages', forcing the open chat closed before the
            // user ever actually pressed back far enough to return to it.
            // chatPanelEl's DOM lives inside messagesIframe, which is
            // never destroyed, so leaving it alone during a fromHistory
            // transition is what actually preserves "exactly the chat the
            // user was last on" instead of always landing back on the
            // chat list. Still reset on any deliberate switch away.
            if (!fromHistory && page !== 'messages' && window.__lastActivePage === 'messages') {
                const _msgIframeBlur = document.getElementById('messagesIframe');
                if (_msgIframeBlur && _msgIframeBlur.contentWindow) {
                    _msgIframeBlur.contentWindow.postMessage({ type: 'MODULE_BLURRED', source: 'parent', timestamp: Date.now() }, '*');
                }
            }

            if (page === 'messages') sendFriendsToMessagesIframe();
            if (page === 'group')    sendFriendsToGroupIframe();
            if (page === 'status')   sendFriendsToStatusIframe();
            if (page === 'tools')    sendFriendsToToolsIframe();

            // FIX Bug 6: When user navigates TO the messages page, notify the iframe
            // so it can clear processedMessageIds and re-render messages that arrived
            // while the user was on another tab. Without this, off-screen messages
            // are permanently lost due to sessionStorage-backed dedup.
            if (page === 'messages') {
                const _msgIframe = document.getElementById('messagesIframe');
                if (_msgIframe && _msgIframe.contentWindow) {
                    setTimeout(() => {
                        _msgIframe.contentWindow.postMessage({ type: 'MODULE_FOCUSED', source: 'parent', timestamp: Date.now() }, '*');
                    }, 150);
                }
            }

            // FIX ("All Groups" — and whichever other tab was active — going
            // blank after navigating away and back): the group module never
            // received any "you're visible again" signal, unlike messages
            // above. Its list-rendering only ever re-runs on data/sync
            // events (kyn:groupsLoaded, groupSync:*, etc.) or an explicit
            // tab click — neither of which fires just from the iframe
            // becoming visible again, even though its in-memory data is
            // still perfectly correct. Sending the same MODULE_FOCUSED
            // signal messages already relies on, and having group.html
            // re-render its currently-active section on receipt (see the

        // FIX (Log Out button did nothing at the app-shell level): every
        // module iframe (Settings, Status, etc.) calls its own local logout
        // handler, then broadcasts a 'SESSION_INVALIDATED' postMessage (or,
        // for a genuinely expired/revoked token, AppRuntimeAuthority itself
        // fires a 'SESSION_EXPIRED' window event via clearSession()) — but
        // this shell (chat.html), which is the thing actually holding the
        // auth token and rendering the whole app, never listened for either.
        // The network logout call succeeded, the iframe's own state cleared,
        // but the parent shell's AuthStorage/localStorage/IndexedDB were
        // never wiped and the user was never sent back to the login page —
        // they stayed inside a fully-rendered, still-"logged-in"-looking app
        // shell with a token that (after the session-fix earlier) is now
        // correctly revoked server-side, so the very next API call would 401
        // with no explanation shown to the user. This is the single handler
        // that makes both paths (explicit logout and detected-invalid
        // session) actually take the user back to the login page.
        // FIX (session-expiry "duplicate/overlapping screens" bug): every
        // module iframe detects auth failure independently and reports it
        // upward, but each one uses a DIFFERENT postMessage `type` —
        // messages/api.auth.js sends 'AUTH_SESSION_EXPIRED', friend.html
        // sends 'TOKEN_EXPIRED' or 'AUTH_ERROR', Tools sends 'AUTH_ERROR'
        // (with payload.error === 'UNAUTHORIZED_API_CALL') or 'LOGOUT',
        // calls sends 'LOGOUT', friend.html's manual fallback button sends
        // 'REDIRECT_TO_LOGIN'. This shell only ever listened for
        // 'SESSION_INVALIDATED' / 'userLoggedOut', so every one of those
        // other real, auto-detected expirations was silently dropped: the
        // shell never redirected, so the iframe that detected it just sat
        // there frozen/broken (the "duplicate screen still displaying but
        // not working"), while a completely separate stale visual could
        // still be showing elsewhere. Recognizing every real signal here
        // is what actually makes the redirect fire for session expiry in
        // normal use, not just for the two paths that happened to already
        // use the right name.
        // FIX-BOOT-RACE-FALSE-LOGOUT: this shell now reloads in full on
        // every account switch (see js/authStorage.js's reloadAppShell()),
        // which means all 7 module iframes (Messages/Status/Groups/Friends/
        // Calls/Settings/Tools) boot simultaneously and each independently
        // races to receive its token and make its first API call. If ANY one
        // of them fires an API call before it has the freshly-issued token
        // propagated to it, it reports an auth failure upward — and, with no
        // guard, _performFullLogoutRedirect() below fires immediately and
        // bounces the user straight back to the login page seconds after a
        // completely valid login/switch. This is a startup race, not an
        // actual expired/invalid session (a token that's seconds old cannot
        // legitimately be expired). Give the app a short window after boot
        // to let every iframe finish its own handshake before any
        // auto-detected (not user-initiated) auth failure is trusted.
        const __APP_SHELL_BOOT_TIME__ = Date.now();
        const AUTH_BOOT_GRACE_MS = 5000;
        // LOGOUT / REDIRECT_TO_LOGIN are deliberate, explicit signals (a real
        // logout button, or friend.html's manual "session problem" fallback
        // button) — never suppress those, even during the boot grace window.
        const EXPLICIT_FATAL_MESSAGE_TYPES = new Set(['LOGOUT', 'REDIRECT_TO_LOGIN']);
        function _withinAuthBootGrace() {
            return (Date.now() - __APP_SHELL_BOOT_TIME__) < AUTH_BOOT_GRACE_MS;
        }

        function _isFatalAuthMessage(d) {
            if (!d || typeof d !== 'object' || !d.type) return false;
            switch (d.type) {
                case 'SESSION_INVALIDATED':
                case 'userLoggedOut':
                case 'AUTH_SESSION_EXPIRED':
                case 'TOKEN_EXPIRED':
                case 'REDIRECT_TO_LOGIN':
                case 'LOGOUT':
                    return true;
                case 'AUTH_ERROR': {
                    // Tools posts AUTH_ERROR for every failed API call, not just
                    // auth failures (payload.error === 'API_CALL_FAILED' covers
                    // network/5xx errors too) — only its confirmed-401/403 code
                    // means the session actually died. friend.html's AUTH_ERROR
                    // is already dedicated to real auth failures, so it's always
                    // fatal.
                    const src = d.payload && d.payload.source;
                    const errCode = d.payload && d.payload.error;
                    if (src === 'friends') return true;
                    if (errCode === 'UNAUTHORIZED_API_CALL') return true;
                    return errCode === undefined && src === undefined; // unknown-shape AUTH_ERROR: treat as fatal rather than silently drop
                }
                default:
                    return false;
            }
        }

        // FIX (part of the same bug): even once the redirect fires, a
        // sibling iframe forced fully visible via CSS (e.g. the calls
        // iframe's "!important" full-screen-during-a-call override) can
        // stay painted for a moment, or — if the redirect had previously
        // been silently dropped — indefinitely. Explicitly hide every
        // panel and strip the active-panel body classes BEFORE navigating,
        // so "session expired" always means "close all screens, show only
        // the login page," never an overlap of old and new screens.
        function _teardownAllPanelsForLogout() {
            try {
                document.body.classList.remove('chat-panel-active', 'group-panel-active', 'status-panel-active', 'games-panel-active');
                document.querySelectorAll('.iframe-container').forEach(function (el) {
                    el.classList.add('hidden');
                    el.style.setProperty('display', 'none', 'important');
                });
            } catch (_) {}
        }

        function _performFullLogoutRedirect(reason, origin) {
            if (window.__loggingOut) return; // avoid double-fire from multiple signals arriving together
            window.__loggingOut = true;
            // DIAGNOSTIC-LOGIN-BOUNCE: this fires with no logging today, so
            // when a real (not boot-grace-suppressed) fatal signal arrives
            // shortly after login there's no way to tell which iframe/signal
            // caused it from the console alone. Log it loudly, with the
            // elapsed time since boot, so a reported "opens then bounces
            // back to login after a few seconds" report can be traced to
            // its actual source instead of guessed at.
            console.error('[chat.html] REDIRECTING TO LOGIN — fatal auth signal:', reason, '| origin:', origin || '(n/a, e.g. SESSION_EXPIRED)', '| ms since boot:', Date.now() - __APP_SHELL_BOOT_TIME__, '| within boot grace:', _withinAuthBootGrace());
            _teardownAllPanelsForLogout();
            try {
                if (window.AppRuntimeAuthority && typeof window.AppRuntimeAuthority.clearSession === 'function') {
                    window.AppRuntimeAuthority.clearSession({ emit: false, reason: reason || 'logout' });
                } else if (window.AuthStorage && typeof window.AuthStorage.clearAuth === 'function') {
                    window.AuthStorage.clearAuth();
                }
            } catch (_) {}
            window.location.replace('index.html');
        }
        window.addEventListener('SESSION_EXPIRED', (e) => {
            const reason = e && e.detail && e.detail.reason;
            if (_withinAuthBootGrace()) {
                console.warn('[chat.html] Ignoring SESSION_EXPIRED received during the post-login/switch boot grace window (treating as a module-boot race, not a real expiry):', reason);
                return;
            }
            _performFullLogoutRedirect(reason);
        });
        window.addEventListener('message', (event) => {
            if (!isTrustedOrigin(event.origin)) return;
            const _d = event.data || {};
            if (_isFatalAuthMessage(_d)) {
                if (_withinAuthBootGrace() && !EXPLICIT_FATAL_MESSAGE_TYPES.has(_d.type)) {
                    console.warn('[chat.html] Ignoring auto-detected auth-failure message received during the post-login/switch boot grace window (treating as a module-boot race, not a real auth failure):', _d.type);
                    return;
                }
                _performFullLogoutRedirect(_d.type, event.origin);
            }
        });

        // Companion listener for the ROOT-CAUSE FIX in handleAppBackNavigation()
        // above: every module iframe's back-nav.js now reports its own local
        // panel open/close state here as it happens (`restore` is the panel's
        // element id while a tracked panel is open, or null once it closes),
        // keyed by which iframe it came from — so the hardware-back handler
        // always has a synchronous, up-to-date answer to "does the currently
        // visible module have a local panel open right now?" with no
        // round-trip needed at the moment a back press actually happens.
        window.addEventListener('message', (event) => {
            if (!isTrustedOrigin(event.origin)) return;
            const _d = event.data || {};
            if (_d.type !== 'SCREEN_STATE_CHANGED') return;
            window.__childLocalPanel = window.__childLocalPanel || {};
            // FIX: js/config.js's installMessageStabilization() wraps
            // window.postMessage with a function bound to the TARGET window,
            // so in this app event.source is the receiving window itself, not
            // the iframe that sent the message. Identity by contentWindow can
            // therefore never match; fall back to the sender's declared module
            // (data-module on the iframe) so hardware-back can see local panels.
            const sourceIframe = Array.from(document.querySelectorAll('.content-iframe')).find(f => f.contentWindow === event.source || (_d.module && f.dataset.module === _d.module));
            if (!sourceIframe) return;
            if (_d.restore) window.__childLocalPanel[sourceIframe.id] = _d.restore;
            else delete window.__childLocalPanel[sourceIframe.id];
        });

        window.addEventListener('popstate', (event) => {
            // FIX (root cause of "back from any sub-screen jumps straight to
            // the previous MODULE instead of closing the sub-screen, in every
            // module"): this handler used to check event.state.page BEFORE
            // calling handleAppBackNavigation(), and jumped straight to
            // navigateToPage(statePage) whenever it differed from
            // window.__currentPage — completely bypassing
            // handleAppBackNavigation()'s panel-aware checks (chat-panel-active,
            // group-panel-active, status-panel-active, call-screen-active,
            // profile modals). None of those sub-screens push their own
            // browser history entry when they open, so the *previous* entry in
            // browser history is always the previous MODULE, never the
            // previous sub-screen — meaning this fast path fired on every
            // single hardware-back press made while any sub-screen was open,
            // in every module, and skipped straight past the code that closes
            // it. handleAppBackNavigation() is already panel-aware AND
            // module-stack-aware (it falls through to popping __navHistory
            // itself when no sub-screen is open) — it must always run first.
            // event.state.page is only a fallback for the rare case where the
            // app has genuinely nothing left to handle but the browser still
            // has its own history state to reconcile with.
            const handled = handleAppBackNavigation();
            if (handled) return;

            const statePage = event && event.state && event.state.appNav ? event.state.page : null;
            if (statePage && statePage !== window.__currentPage) {

                return;
            }

            syncBrowserHistoryState(window.__currentPage || 'messages', true);
        });

        document.addEventListener('backbutton', function(event) {
            event.preventDefault();
            handleAppBackNavigation();
        }, false);

        let loadingDismissed = false;
        function dismissLoadingScreen(delay = 250) {

            loadingDismissed = true;

                }

        }

        dismissLoadingScreen(350);
        
        // ======================================================================
        // CHAT AND CALL PANEL DETECTION FOR MOBILE
        // ======================================================================
        function setupPanelDetection() {
            const messagesIframe = document.getElementById('messagesIframe');
            if (!messagesIframe) return;
            
            window.addEventListener('message', function(event) {
                if (!isTrustedOrigin(event.origin)) return;
                const data = event.data || {};
                
                // INSTANT-OPEN (see message.html's 'chat:opening' case /
                // js/message-client.js's 'chat:opening' notify): lifts the
                // chat-opening-veil the moment the messages iframe knows WHO
                // it's opening a chat with, even before the conversationId
                // round trip finishes — same instant-reveal idea the group
                // module already uses (openGroupChat() shows the header +
                // a loading state before its own network calls, instead of
                // waiting on them). Deliberately does NOT set
                // __dcChatOpened/__ocwuChatOpened or clear pending_chat —
                // those retry loops must keep running until the real
                // CHAT_OPENED ack below arrives, in case this specific
                // attempt never resolves and needs a retry to get through.
                if (data.type === 'CHAT_OPENING') {
                    _unveilMessages();
                    var _openingInfo = data.payload || {};
                    if ((_openingInfo.name || _openingInfo.userId) && typeof showChatHeader === 'function') {
                        showChatHeader({
                            name: _openingInfo.name,
                            avatarUrl: _openingInfo.avatar,
                            online: false,
                            chatId: _openingInfo.userId,
                            seq: 1
                        });
                    }
                }

                // Handle chat panel state
                if (data.type === 'CHAT_OPENED' || data.type === 'CONVERSATION_OPENED') {
                    // FIX (chat-history list flashes before a specific chat opens):
                    // this IS the confirmation that message.html has swapped from
                    // its list view to the actual conversation — safe to reveal now.
                    _unveilMessages();
                    // FIX (dead ACK flags): window.__dcChatOpened / __ocwuChatOpened
                    // are checked by the DIRECT_CHAT_REQUEST and OPEN_CHAT_WITH_USER
                    // relay loops further down this file to know when to stop
                    // retrying — but nothing ever set them back to true on a
                    // successful open, so every "open chat from friends/calls/status"
                    // action fired 3 duplicate OPEN_CHAT_WITH_USER postMessages into
                    // messagesIframe 600ms apart regardless of whether the first one
                    // already worked. Confirming here (this IS the ACK) stops that.
                    window.__dcChatOpened = true;
                    window.__ocwuChatOpened = true;
                    // Apply on all widths — CSS only shows effect on mobile
                    document.body.classList.add('chat-panel-active');
                    // FIX (back-navigation-skips-chat): opening a 1:1 chat never
                    // pushed a browser history entry, unlike group/status panels
                    // (see syncBrowserHistoryState calls below). So pressing back
                    // skipped straight past "close chat, return to list" to
                    // whatever older page-level entry was actually next in the
                    // stack — landing on a random other module. Push a history
                    // entry here to match the existing group/status pattern.
                    syncBrowserHistoryState(window.__currentPage, false);
                    // Clear pending_chat so all retry loops stop
                    try { sessionStorage.removeItem('pending_chat'); } catch (_) {}
                    // FIX: render the header immediately with whatever we already
                    // know (name/avatar/userId, now sent along with CHAT_OPENED)
                    // instead of leaving it blank until the separate
                    // CHAT_HEADER_UPDATE broadcast eventually arrives. That
                    // broadcast (debounced + a 1.5s poll on the message.html
                    // side) still runs and will refine/correct this (e.g. live
                    // online status), it just no longer has to be the *first*
                    // thing that ever populates the header.
                    var _coInfo = data.payload || {};
                    // Remember exactly which chat is open, not just that the Messages page is active.
                    if (_coInfo.userId || _coInfo.chatId) {
                        window.__lastOpenChatUserId = _coInfo.userId || _coInfo.chatId;
                        window.__lastOpenChatName = _coInfo.name || null;
                    }
                    if (typeof window.__cancelChatHeaderClose === 'function') window.__cancelChatHeaderClose();
                    if ((_coInfo.name || _coInfo.userId) && typeof showChatHeader === 'function') {
                        showChatHeader({
                            name: _coInfo.name,
                            avatarUrl: _coInfo.avatarUrl,
                            online: !!_coInfo.online,
                            chatId: _coInfo.chatId || _coInfo.userId,
                            seq: 1
                        });
                    }
                }
                if (data.type === 'CHAT_LIST_SHOWN' || data.type === 'CHAT_CLOSED' || data.type === 'GO_BACK_TO_CHAT_LIST') {
                    _unveilMessages();
                    // FIX: previously only cleared chat-panel-active on mobile widths (and only
                    // if messagesContent wasn't hidden), which — now that the flag is applied
                    // unconditionally on open (see CHAT_OPENED/CONVERSATION_OPENED above) — left
                    // it permanently stuck on desktop after closing a chat. Clear it on all widths.
                    const messagesContainer = document.getElementById('messagesContent');
                    if (window.innerWidth > 768 || !messagesContainer || !messagesContainer.classList.contains('hidden')) {
                        document.body.classList.remove('chat-panel-active');
                    }
                    window.__lastOpenChatUserId = null;
                    window.__lastOpenChatName = null;
                    if (typeof hideChatHeader === 'function') hideChatHeader();
                }

                // ── GROUP PANEL: hide nav when group chat/detail opens; show when back ──
                if (data.type === 'GROUP_PANEL_OPENED' || data.type === 'GROUP_CHAT_OPENED' || data.type === 'GROUP_DETAIL_OPENED' || data.type === 'GROUP_PANEL_OPEN') {
                    // Add group-panel-active on all widths (hides nav on mobile, controls header on desktop)
                    document.body.classList.add('group-panel-active');
                    syncBrowserHistoryState(window.__currentPage, false);
                    // Store current group for PARENT_GROUP_CALL dispatch
                    var _gpData = data.payload || data.group || data.data || {};
                    window.__gcCurrentGroup = _gpData;
                    // Update globalHeader to show group context (all screen sizes)
                    if (window.__groupHdrShow) window.__groupHdrShow(_gpData);
                }
                // FIX (BACK-STACK-EXACT-RESTORE): re-sync only — group.html
                // sends this on MODULE_FOCUSED when its own panel was never
                // actually closed (see the fromHistory-gated skip of
                // GO_BACK_TO_LIST above). Mirrors the GROUP_PANEL_OPEN
                // handling above minus syncBrowserHistoryState, which must
                // NOT run again here or every re-focus would push another
                // duplicate browser history entry for a panel that was
                // already open before the user navigated away.
                if (data.type === 'GROUP_PANEL_RESTORE') {
                    document.body.classList.add('group-panel-active');
                    var _gprData = data.payload || {};
                    window.__gcCurrentGroup = _gprData;
                    if (window.__groupHdrShow) window.__groupHdrShow(_gprData);
                }
                if (data.type === 'GROUP_PANEL_CLOSED' || data.type === 'GROUP_LIST_SHOWN' || data.type === 'GO_BACK_TO_LIST' || data.type === 'GROUP_PANEL_CLOSE') {
                    document.body.classList.remove('group-panel-active');
                    // Restore globalHeader (all screen sizes)
                    if (window.__groupHdrHide) window.__groupHdrHide();
                }

                // ── STATUS PANEL: hide nav when status view/create opens; show when back ──
                if (data.type === 'STATUS_VIEW_OPENED' || data.type === 'STATUS_CREATE_OPENED' || data.type === 'STATUS_PANEL_OPENED') {
                    if (window.innerWidth <= 768) {
                        document.body.classList.add('status-panel-active');
                        syncBrowserHistoryState(window.__currentPage, false);
                    }
                }
                if (data.type === 'STATUS_PANEL_CLOSED' || data.type === 'STATUS_LIST_SHOWN') {
                    // event.source is unreliable here (see SCREEN_STATE_CHANGED
                    // handler): accept the status module's own declared source too.
                    if (window.innerWidth <= 768 && (event.source === document.getElementById('statusIframe')?.contentWindow || data.source === 'professional-status')) {
                        document.body.classList.remove('status-panel-active');
                    }
                }

                // ── GAMES PANEL: hide nav when a specific game opens; show again on the arcade home/list ──
                // Mirrors the GROUP/STATUS panel handling above. game.html's inner iframe
                // (game-v3.html, the actual arcade) posts these — see its home()/openGame()
                // wiring below.
                if (data.type === 'GAMES_PANEL_OPENED') {
                    if (window.innerWidth <= 768) {
                        document.body.classList.add('games-panel-active');
                        syncBrowserHistoryState(window.__currentPage, false);
                    }
                }
                if (data.type === 'GAMES_PANEL_CLOSED') {
                    if (window.innerWidth <= 768) {
                        document.body.classList.remove('games-panel-active');
                    }
                }

            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            setupPanelDetection();
            dismissLoadingScreen(0);
            // Only strip chat-panel-active on load.
            if (window.innerWidth <= 768) {
                document.body.classList.remove('chat-panel-active');

        // uncoordinated code paths that each independently postMessage a
        // 'message:new' event into the messages iframe (2 in this file, 2 in
        // app.realtime.socket.js, 1 in phase15.delivery.patch.js) — each one
        // added over time as a "safety net" when a symptom was diagnosed,
        // without ever removing the earlier path that was actually the real
        // culprit. Multiple paths racing to deliver the same message can
        // cause duplicate/garbled renders, or a malformed early delivery
        // getting processed first while dedup logic on the receiving end
        // silently drops the correct, fuller delivery that arrives right
        // after it — a plausible root cause of "message logged as received
        // but never rendered."
        //
        // window.__kynRelayMessageOnce(iframeWindow, type, payload) is now
        // the single gate every one of those 5 call-sites routes through: it
        // performs the actual postMessage but only for the FIRST caller per
        // unique message (by serverId/localId/broadcastId + chatId), so the
        // other 4 become safe no-ops instead of duplicate deliveries. This
        // preserves every path as a fallback (none were deleted, since I
        // can't verify live which one is safe to remove) while guaranteeing
        // only one delivery actually reaches the iframe.

        // registry used to be an in-memory `Set` (window.__kynRelayedMsgIds),
        // which only ever deduped delivery attempts made from WITHIN this one
        // window (chat.html's own several internal relay code paths). It

        // Socket.IO connection and joins the same `user:{uid}` room — was
        // independently receiving and processing the exact same server

        // every existing call site (5+ of them) keeps working unmodified.
        // See the matching fix in js/phase15.delivery.patch.js, which defines
        // this identically as a fallback for windows that load it standalone
        // (message.html, group.html, calls.html, status.html) — this inline
        // definition simply takes precedence in chat.html's own window.
        (function () {
            const CLAIM_PREFIX = 'kyn_relay_claim_';
            const CLAIM_TTL_MS = 15000;
            let _sweepCounter = 0;

            function _claimKeyFor(type, payload) {
                const p = (payload && payload.payload) ? payload.payload : payload;
                const chatId = String((p && (p.chatId || p.conversationId)) || '');
                const msgId  = String((p && (p.id || p.serverId || p.localId || p._broadcastId)) || '');
                return (type || 'message:new') + ':' + chatId + ':' + (msgId || (p && p.content) || '');

                        const k = localStorage.key(i);

            // app.realtime.socket.js's iframe broadcast) needs to check this BEFORE

            // messageSync.engine.js's decrypt/persist pipeline) can gate on
            // the exact same shared claim without duplicating this logic.

            function shouldPreferDirectApi(endpoint, method) {
                const normalizedMethod = String(method || 'GET').toUpperCase();
                if (normalizedMethod !== 'GET') return true;
                // FIX (FRIENDS-LIST-INCONSISTENT-ACROSS-MODULES): '/calls',
                // '/groups', etc. were already routed straight through
                // directApiRequest (a single well-tested fetch + envelope-
                // unwrap), skipping the older window.api.request.request
                // path entirely. '/friends' wasn't on this list, so it took
                // that other path instead — the same endpoint, hit by
                // different modules (Friends, Messages' New Chat picker,
                // Calls, Groups), could come back through two different
                // response-shaping code paths depending on which one ran.
                // Every module's own friends list should be resolved the
                // same well-tested way, not just the ones that happened to
                // already be listed here.
                return ['/groups', '/status', '/tools', '/marketplace', '/friends']
                    .some(prefix => endpoint === prefix || endpoint.startsWith(prefix + '/'));
            }

            function shouldRetryDirectApi(endpoint, responsePayload) {
                if (!responsePayload || responsePayload.success !== false) return false;
                const errorText = String(responsePayload.error || responsePayload.message || '').toLowerCase();
                return (
                    responsePayload.statusCode === 0 ||
                    responsePayload.statusCode === 408 ||
                    responsePayload.statusCode === 504 ||
                    errorText.includes('timeout') ||
                    errorText.includes('network') ||
                    errorText.includes('fetch') ||
                    shouldPreferDirectApi(endpoint, 'GET')
                );
            }

            async function directApiRequest(endpoint, method, body, params, token) {
                const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                let url = baseUrl + endpoint;
                if (method === 'GET' && params && typeof params === 'object') {
                    const queryString = new URLSearchParams(params).toString();
                    if (queryString) url += '?' + queryString;
                }

                // Use token refresh mechanism from api.core.js if available
                let currentToken = token;
                if (window.refreshTokenIfNeeded && window.validateToken) {
                    try {
                        // Validate current token
                        const validation = window.validateToken(currentToken);
                        if (!validation.valid) {
                            _chatLog('[Parent] Token invalid, attempting refresh...');
                            const refreshResult = await window.refreshTokenIfNeeded();
                            if (refreshResult.success) {
                                currentToken = refreshResult.token;
                                _chatLog('[Parent] Token refreshed successfully');
                            } else if (refreshResult.requiresReauth) {
                                _chatLog('[Parent] Token refresh requires reauthentication');
                                // FIX (auth-cascade): this used to return the 401 straight to the
                                // iframe (friend-core.bootstrap.js / messages-core.bootstrap.js)
                                // with no other side effect. Nothing in the app was ever told the
                                // session had genuinely ended, so the realtime socket kept
                                // reconnecting and GroupOrchestrator/PollingManager kept re-polling
                                // every few seconds forever, each hitting this same dead end — the
                                // repeating "Token expired and requires reauthentication" spam.
                                // app.realtime.socket.js already listens for 'auth:session:ended'
                                // and calls disconnect() (sets _manualDisconnect, stops the
                                // reconnect loop) — dispatch it here so that actually fires.
                                window.dispatchEvent(new CustomEvent('auth:session:ended', {
                                    detail: { source: 'directApiRequest', endpoint, reason: 'refresh_failed', timestamp: new Date().toISOString() }
                                }));
                                return { success: false, error: 'Token expired and requires reauthentication', statusCode: 401, data: null };
                            }
                        }
                    } catch (err) {
                        console.warn('[Parent] Token validation failed:', err);
                    }
                }

                const headers = { 'Accept': 'application/json' };
                if (body && !(body instanceof FormData)) headers['Content-Type'] = 'application/json';
                if (currentToken) headers['Authorization'] = `Bearer ${currentToken}`;

                const fetchOptions = {
                    method,
                    headers,
                    credentials: 'include',
                    // ROOT-CAUSE FIX (same bug, fourth confirmed occurrence —
                    // already fixed in api.core.js, api.request.js's fallback
                    // fetch, and js/e2e-encryption.js's two key-endpoint
                    // calls): no cache option here means the browser's
                    // default HTTP cache can answer a repeat request with a
                    // conditional 304, and every caller of directApiRequest
                    // reads responsePayload.success (ultimately from
                    // response.ok below), which is false for a 304
                    // regardless of the cached body. This function is the
                    // ALWAYS-taken path for every non-GET request
                    // (shouldPreferDirectApi returns true unconditionally
                    // for POST/PUT/DELETE — see above), so this one covers
                    // sending messages, not just GETs.
                    cache: 'no-store',
                };
                if (body && method !== 'GET') {
                    if (body instanceof FormData) {
                        fetchOptions.body = body;
                    } else if (typeof body === 'string') {
                        // FIX: body is already a JSON string (friend-core.js calls JSON.stringify
                        // before putting it in the API_REQUEST payload). Double-serializing it here
                        // wraps it in extra quotes, making req.body arrive as undefined on the server.
                        // Detect pre-serialized strings and pass them through as-is.
                        fetchOptions.body = body;
                        // Ensure Content-Type is set even when body is a pre-serialized string
                        if (!headers['Content-Type']) headers['Content-Type'] = 'application/json';
                    } else {
                        fetchOptions.body = JSON.stringify(body);
                    }
                }

                let response = await fetch(url, fetchOptions);
                let responseData;
                let contentType = response.headers.get('content-type') || '';
                
                if (contentType.includes('application/json')) responseData = await response.json();
                else responseData = { message: await response.text() || 'Request completed' };

                // Handle 401 Unauthorized with token refresh
                if (response.status === 401 && window.refreshTokenIfNeeded && window.validateToken) {
                    _chatLog('[Parent] 401 response, attempting token refresh...');
                    try {
                        const refreshResult = await window.refreshTokenIfNeeded();
                        if (refreshResult.success) {
                            _chatLog('[Parent] Token refreshed, retrying request...');
                            // Retry with new token
                            headers['Authorization'] = `Bearer ${refreshResult.token}`;
                            const retryOptions = { method, headers, credentials: 'include' };
                            if (body && method !== 'GET') {
                                retryOptions.body = body instanceof FormData ? body : JSON.stringify(body);
                            }
                            
                            response = await fetch(url, retryOptions);
                            contentType = response.headers.get('content-type') || '';
                            if (contentType.includes('application/json')) responseData = await response.json();
                            else responseData = { message: await response.text() || 'Request completed' };
                        } else if (refreshResult.requiresReauth) {
                            _chatLog('[Parent] Token refresh requires reauthentication');
                            // FIX (auth-cascade): see matching comment above — dispatch so the
                            // socket manager's existing 'auth:session:ended' listener stops the
                            // reconnect loop instead of retrying against a session that's dead.
                            window.dispatchEvent(new CustomEvent('auth:session:ended', {
                                detail: { source: 'directApiRequest', endpoint, reason: 'refresh_failed', timestamp: new Date().toISOString() }
                            }));
                            return { success: false, error: 'Token expired and requires reauthentication', statusCode: 401, data: responseData };
                        }
                    } catch (refreshErr) {
                        console.warn('[Parent] Token refresh failed:', refreshErr);
                        return { success: false, error: 'Token refresh failed', statusCode: 401, data: responseData };
                    }
                }

                if (!response.ok) {
                    return { success: false, error: responseData?.message || responseData?.error || `HTTP ${response.status}`, statusCode: response.status, data: responseData };
                }

                // FIX: Unwrap backend envelope { success, data: {...} } so friend-core receives a flat
                // { success, data: { friends:[...] } } instead of a double-nested payload which causes data:null.
                if (responseData && typeof responseData === 'object' && 'success' in responseData) {
                    return {
                        success: responseData.success !== false,
                        data: responseData.data ?? responseData,
                        error: responseData.error || responseData.message || null,
                        statusCode: response.status
                    };
                }

                return { success: true, data: responseData, statusCode: response.status };
            }

            function getSessionData() {
                const auth = window.AuthStorage?.getAuth?.() || null;
                const session = window.Session?.getSession?.() || null;
                const token = session?.token ||
                              auth?.token ||
                              window.Session?.getToken?.() ||
                              localStorage.getItem('authToken') ||
                              localStorage.getItem('token') ||
                              localStorage.getItem('necpa_token') ||
                              localStorage.getItem('accessToken');

                let user = session?.user || auth?.user || window.Session?.getUser?.() || null;
                let userId = user?.id || user?.userId || session?.userId || auth?.userId || auth?.id || null;

                if (!userId) {
                    try {
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            const payload = JSON.parse(atob(parts[1]));
                            userId = payload.userId || payload.id || payload.sub || payload.user_id || payload.uid || null;
                            if (!user && userId) {
                                user = {
                                    id: userId,

                            }
                        }
                    } catch (e) {

                    }
                }

                if (!userId) return null;
                return { token, userId: String(userId), user };
            }

            function updateSessionCache() {

                    cachedUser = session.user || { id: cachedUserId, userId: cachedUserId, username: 'User' };
                    if (cachedUser && (cachedUser.id == null || cachedUser.userId == null)) {

                        cachedUser.userId = cachedUser.userId ?? cachedUserId;

                    cachedUserId = null;
                    cachedUser = null;

            // FIX 3: Fetch profile role from /api/profile and cache it
            let _roleFetchInFlight = false;
            async function _fetchAndCacheUserRole(token) {
                if (_roleFetchInFlight) return;
                _roleFetchInFlight = true;
                try {
                    const base = (window.__kynAPI?.baseUrl || '').replace(/\/api$/, '').replace(/\/$/, '') ||
                                 (typeof window.__getApiBase === 'function' ? window.__getApiBase().replace(/\/api$/, '') : '') || '';
                    const res = await fetch(base + '/api/profile', {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        // FIX (admin-role-never-hydrated): GET /api/profile responds with
                        // { success, message, data: { profile } } — this used to read
                        // profile.role / profile.user.role directly off the top-level
                        // JSON, which is always undefined for that shape, so it silently
                        // fell back to 'user' every single time this ran (including for
                        // real admin accounts), overwriting any correct role that had
                        // already been cached from login. Unwrap all the shapes the
                        // backend has used (data.profile, data, or a flat body) instead
                        // of assuming one.
                        const profile = json?.data?.profile || json?.data || json?.profile || json;
                        const role = profile?.role || profile?.user?.role || 'user';
                        const isAdmin = role === 'admin' || role === 'moderator' || profile?.isAdmin === true;
                        // P1 FIX: Do NOT persist role in localStorage — keeps role in memory only
                        // localStorage.setItem('userRole', role); // REMOVED — localStorage role is a security risk
                        window.__cachedUserRole = role;
                        if (cachedUser) { cachedUser.role = role; cachedUser.isAdmin = isAdmin; }
                        if (window.currentUser) { window.currentUser.role = role; window.currentUser.isAdmin = isAdmin; }
                        if (window.__kynUser) { window.__kynUser.role = role; window.__kynUser.isAdmin = isAdmin; }
                        // Propagate to Tools/marketplace iframe
                        const toolsFrame = document.getElementById('toolsIframe') || document.getElementById('marketplaceIframe');
                        if (toolsFrame?.contentWindow) {
                            toolsFrame.contentWindow.postMessage({ type: 'USER_ROLE_UPDATE', role, isAdmin }, '*');
                        }
                    }
                } catch(e) {
                    console.warn('[chat.html] Profile role fetch failed:', e.message);
                } finally { _roleFetchInFlight = false; }
            }

            function requestFriendsFromFriendIframe() {
                const friendsIframe = document.getElementById('friendsIframe');
                if (friendsIframe && friendsIframe.contentWindow) {

            function broadcastFriendsToAllModules(friends) {

            function sendSessionToModule(iframe, moduleName) {
                window.__moduleSessionDispatchCache = window.__moduleSessionDispatchCache || {};
                const isSettings = moduleName === 'settings';
                if (!cachedToken || !cachedUserId) {
                    if (isSettings) {
                        if (!iframe || !iframe.contentWindow) return;
                        iframe.contentWindow.postMessage({
                            type: 'PARENT_READY',
                            id: `parent_ready_${Date.now()}_${moduleName}`,
                            source: 'parent',
                            target: moduleName,
                            payload: { protocol: 'KYN-8.0', state: 'READY', message: 'Parent ready (no session)', session: null, userId: null },
                            timestamp: Date.now()
                        }, '*');
                    }
                    return;
                }
                if (!iframe || !iframe.contentWindow) return;

                const now = Date.now();
                const sessionFingerprint = `${cachedUserId}:${String(cachedToken).slice(-24)}`;
                const lastDispatch = window.__moduleSessionDispatchCache[moduleName];
                if (lastDispatch &&
                    lastDispatch.fingerprint === sessionFingerprint &&
                    now - lastDispatch.timestamp < 300) {
                    return;
                }
                window.__moduleSessionDispatchCache[moduleName] = {
                    fingerprint: sessionFingerprint,
                    timestamp: now
                };

                const numericUserId = Number(cachedUserId);
                const normalizedUserId = Number.isFinite(numericUserId) ? numericUserId : cachedUserId;
                const userData = {
                    id: normalizedUserId,
                    userId: normalizedUserId,
                    username: cachedUser?.username || 'User',
                    displayName: cachedUser?.displayName || cachedUser?.username || 'User',
                    email: cachedUser?.email || '',
                    firstName: cachedUser?.firstName || '',
                    lastName: cachedUser?.lastName || '',

                };

                const sessionData = {
                    token: cachedToken,
                    user: userData,
                    authenticated: true,
                    expiresAt: Date.now() + 3600000,
                    ready: true,
                    userId: normalizedUserId,
                    id: normalizedUserId
                };

                // ── patch v1: expose session on window so same-origin iframes
                // and services (services_friend.js, friendqueue_manager.js etc.)
                // can find the token without relying solely on postMessage ──
                window.__PARENT_SESSION__ = sessionData;
                window.AUTH_SESSION       = sessionData;

                iframe.contentWindow.postMessage({
                    type: 'SESSION_DATA',
                    id: `session_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: sessionData,
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'AUTH_READY',
                    id: `auth_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        authenticated: true,
                        session: sessionData,
                        user: userData,
                        userId: normalizedUserId,
                        timestamp: now
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'PARENT_READY',
                    id: `parent_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        protocol: 'KYN-8.0',
                        state: 'READY',
                        message: 'Parent is ready',
                        session: sessionData,
                        userId: normalizedUserId
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');
                
                setTimeout(() => {
                    if (moduleName === 'messages') sendFriendsToMessagesIframe();
                    if (moduleName === 'group') sendFriendsToGroupIframe();
                    if (moduleName === 'status') sendFriendsToStatusIframe();
                    if (moduleName === 'tools') sendFriendsToToolsIframe();
                }, 500);
            }

            let lastSessionSend = 0;
            const SESSION_SEND_INTERVAL = 30000;

            (function earlyTokenInit() {
                try {

                              localStorage.getItem('token') ||
                              localStorage.getItem('necpa_token') ||

                    if (t && !cachedToken) {
                        cachedToken = t;
                        const parts = t.split('.');
                        if (parts.length === 3) {

            function getCachedSettings() {
                try {
                    const raw = localStorage.getItem('knecta_settings_cache');
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    return parsed?.data || parsed;
                } catch(e) { return null; }
            }

            function persistCachedSettings(settings) {
                try {
                    localStorage.setItem('knecta_settings_cache', JSON.stringify({
                        data: settings || {},
                        timestamp: Date.now(),
                        version: '1.0.0'
                    }));
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function updateCachedSettingsPath(section, key, value) {
                const existing = getCachedSettings() || {};
                if (!existing[section] || typeof existing[section] !== 'object') existing[section] = {};
                existing[section][key] = value;
                persistCachedSettings(existing);
                return existing;
            }

            function pushSettingsToModule(iframe, moduleName) {
                if (!iframe || !iframe.contentWindow) return;
                // FIX-SETTINGS-PROPAGATION: Try multiple sources so a module always
                // gets settings even when knecta_settings_cache hasn't been written yet.
                let settings = getCachedSettings();
                if (!settings || Object.keys(settings).length === 0) {
                    // Try AppSettings as fallback
                    if (window.AppSettings && typeof window.AppSettings.getAll === 'function') {
                        try { settings = window.AppSettings.getAll(); } catch(e) {}
                    }
                }
                if (!settings || Object.keys(settings).length === 0) {
                    // Try raw localStorage key written by settingsManager
                    try {
                        const raw = localStorage.getItem('knecta_settings_cache') || localStorage.getItem('necpa_settings_default');
                        if (raw) { const p = JSON.parse(raw); settings = p?.data || p; }
                    } catch(e) {}
                }
                if (!settings || Object.keys(settings).length === 0) return; // nothing to push
                // PHASE15 FIX: Send ONE batched SETTINGS_UPDATED message instead of
                // one SETTING_CHANGED per key. With 118+ settings keys, the old approach
                // fired 118 postMessages per navigation causing a massive storm that
                // overwhelmed RealtimeStabilizationLayer and delayed real events.
                iframe.contentWindow.postMessage({
                    type: 'SETTINGS_UPDATED',
                    source: 'parent',
                    target: moduleName,
                    payload: { settings, timestamp: Date.now() },
                    timestamp: Date.now()
                }, '*');
                // PHASE15 FIX: Send ONE aggregate SETTING_CHANGED with all keys flattened
                // instead of one postMessage per key. Receivers can expand this themselves.
                try {
                    iframe.contentWindow.postMessage({
                        type: 'SETTINGS_BATCH',
                        source: 'parent',
                        payload: { settings, timestamp: Date.now() }
                    }, '*');
                } catch(e) {}
            }

            // FIX-POSTMESSAGE: 100ms debounce for SETTING_CHANGED floods during navigation
            var _settingChangedDebounce = {};
            function emitGlobalAppEvent(type, payload, options = {}) {
                // Debounce SETTING_CHANGED / SETTINGS_GLOBAL_UPDATE to 100ms per key
                if (type === 'SETTING_CHANGED' || type === 'SETTINGS_GLOBAL_UPDATE') {
                    var _debKey = type + ':' + (payload && payload.section || '') + ':' + (payload && payload.key || '');
                    if (_settingChangedDebounce[_debKey]) clearTimeout(_settingChangedDebounce[_debKey]);
                    _settingChangedDebounce[_debKey] = setTimeout(function() {
                        delete _settingChangedDebounce[_debKey];
                        if (window.appEvents && typeof window.appEvents.emit === 'function') {
                            window.appEvents.emit(type, payload, options); return;
                        }
                        if (window.KynectaEventBus && typeof window.KynectaEventBus.emit === 'function') {
                            window.KynectaEventBus.emit(type, payload, options);
                        }
                    }, 100);
                    return;
                }
                if (window.appEvents && typeof window.appEvents.emit === 'function') {
                    window.appEvents.emit(type, payload, options);
                    return;
                }
                if (window.KynectaEventBus && typeof window.KynectaEventBus.emit === 'function') {
                    window.KynectaEventBus.emit(type, payload, options);
                }
            }

            function sendToAllModulesIfNeeded(force = false) {
                const now = Date.now();
                if (!force && now - lastSessionSend < SESSION_SEND_INTERVAL) return;
                if (!cachedToken || !cachedUserId) updateSessionCache();
                if (!cachedToken || !cachedUserId) return;
                lastSessionSend = now;
