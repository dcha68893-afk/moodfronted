<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.API_BASE_URL = "https://nexopa-fy56.onrender.com";</script>
    <script src="/js/theme.engine.js"></script>
    <style id="kynCriticalHeaderFix">
        header, .header, .top-bar, .toolbar, .app-header, .chat-header,
        .module-header, [class*="header"], [class*="topbar"], [class*="top-bar"] {
            background: var(--kyn-bg-header) !important;
            border-color: var(--kyn-border) !important;
            color: var(--kyn-text-primary) !important;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kynecta - Advanced Mood-Based Chat</title>
    <!-- PWA: manifest MUST be linked from the main shell so beforeinstallprompt fires -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexopa">
    <link rel="apple-touch-icon" href="/icons/nexopa-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/nexopa-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/nexopa-512.png">
    <style>
        :root {
            --app-primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 62%, #06b6d4 100%);
            --app-primary-color: #2563eb;
            --app-primary-dark: #1d4ed8;
            --app-primary-light: #dbeafe;
            --app-secondary-surface: #f8fafc;
            --app-secondary-muted: #e5e7eb;
            --app-accent-color: #8b5cf6;
            --app-accent-soft: #cffafe;
            --app-text-color: #0f172a;
            --app-text-secondary: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--app-secondary-surface);
            overflow: hidden;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        /* GLOBAL HEADER WITH PROFILE */
        #globalHeader {
            position: fixed;
            top: 0;
            left: 60px;
            right: 0;
            height: 56px;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.97), rgba(244,247,251,0.94)),
                linear-gradient(90deg, rgba(17,24,39,0.03), rgba(14,165,233,0.04));
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(15,23,42,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 95;
            box-shadow: 0 8px 24px rgba(15,23,42,0.06);
        }

        .header-context {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-module-badge {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--app-primary-gradient);
            color: #fff;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.18);
            flex: 0 0 auto;
        }

        .header-module-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header-module-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-module-subtitle {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.72);
            border: 2px solid rgba(124, 58, 237, 0.35);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .profile-trigger:hover {
            background: rgba(255,255,255,0.95);
            border-color: rgba(124, 58, 237, 0.65);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        
        /* Header module icons/actions (single source of truth in parent) */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-actions.hidden {
            display: none !important;
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(255,255,255,0.70);
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .header-action-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.95);
        }

        .header-action-btn i {
            font-size: 16px;
        }

        .profile-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7c3aed;
        }
        .profile-name-sm {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        /* PROFILE MODAL */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .profile-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-card {
            width: 90%;
            max-width: 480px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
        }
        .cover-area {
            height: 160px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            cursor: pointer;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: -50px auto 12px;
            display: block;
            cursor: pointer;
            object-fit: cover;
            background: #f3f4f6;
        }
        .profile-info {
            text-align: center;
            padding: 0 20px 20px;
        }
        .profile-username {
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .profile-bio {
            color: #6b7280;
            font-size: 14px;
            margin: 8px 0;
        }
        .edit-profile-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
        }
        .profile-action-row {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-link-btn {
            background: #1f2937;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .profile-action-row .edit-profile-btn,
        .profile-action-row .settings-link-btn {
            margin-top: 0;
        }
        .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        #permanentSidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
            font-size: 20px;
            position: relative;
        }

        .nav-icon:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-icon.active {
            background: #7c3aed;
            color: white;
        }

        /* Call button animations */
        .nav-icon[data-page="calls"].call-incoming {
            animation: callPulse 1s ease infinite;
            background: rgba(124, 58, 237, 0.3);
        }

        @keyframes callPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); background: rgba(124, 58, 237, 0.5); }
        }

        /* Call active indicator */
        .call-active-indicator {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            animation: callActivePulse 1.5s infinite;
        }

        @keyframes callActivePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* INCOMING CALL BANNER - GLOBAL */
        #kyn-call-banner {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1f2937, #111827);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            display: none;
            align-items: center;
            gap: 20px;
            z-index: 10001;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .call-banner-actions button {
            background: white;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
        }
        .call-banner-actions .accept-call {
            background: #10b981;
            color: white;
        }
        .call-banner-actions .decline-call {
            background: #ef4444;
            color: white;
        }

        .incoming-call-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        .incoming-call-toast button {
            background: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .incoming-call-toast button.accept {
            background: #10b981;
            color: white;
        }

        .incoming-call-toast button.decline {
            background: #ef4444;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .iframe-container {
            position: fixed;
            top: 56px;
            left: 60px;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 90;
        }

        /* Iframes are hidden via visibility+pointer-events so their JS initialises
           eagerly in the background — tab switching is instant instead of waiting
           for the iframe to boot on first click. */
        .iframe-container.hidden {
            visibility: hidden !important;
            pointer-events: none !important;
            /* Keep display:block so the iframe document loads & runs */
        }

        /* ── CALL SCREEN: full screen on ALL screen sizes ── */
        /* When a call is active the calls iframe must cover  */
        /* the entire viewport — header, sidebar, nav bar     */
        /* must all be hidden behind the call panel.          */
        body.call-screen-active #callsContent {
            top: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 10000 !important;
            background: transparent !important;
            /* Override .hidden — the iframe MUST be visible during a call */
            visibility: visible !important;
            pointer-events: auto !important;
            display: block !important;
        }
        body.call-screen-active #globalHeader {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
        body.call-screen-active #permanentSidebar {
            z-index: 0 !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.call-screen-active .mobile-nav-bar {
            z-index: 0 !important;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================================
           CENTER ACTION POPUP MENU
           ============================================================ */
        #centerActionMenu {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: linear-gradient(160deg, #1e2535, #141926);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
        }
        #centerActionMenu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .center-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            transition: background 0.18s, transform 0.15s;
            min-width: 90px;
        }
        .center-menu-item:active { transform: scale(0.94); }
        .center-menu-item:hover { background: rgba(255,255,255,0.12); }
        .center-menu-item i {
            font-size: 22px;
        }
        .center-menu-item span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .center-menu-calls i { color: #34d399; }
        .center-menu-group i { color: #60a5fa; }
        .center-menu-games i { color: #f59e0b; }
        #centerMenuOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1099;
        }
        #centerMenuOverlay.open { display: block; }

        /* ============================================================
           PROFILE EDIT PANEL (full-screen, slides up from bottom)
           ============================================================ */
        #profileEditPanel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10001;
            display: flex;
            align-items: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        #profileEditPanel.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-edit-sheet {
            width: 100%;
            max-height: 90vh;
            background: #fff;
            border-radius: 28px 28px 0 0;
            overflow-y: auto;
            transform: translateY(40px);
            transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
        }
        #profileEditPanel.active .profile-edit-sheet {
            transform: translateY(0);
        }
        .profile-edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 12px;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 2;
        }
        .profile-edit-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
        }
        .profile-edit-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-edit-body {
            padding: 20px;
        }
        .profile-edit-cover {
            width: 100%; height: 130px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .profile-edit-cover img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .profile-edit-cover-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 13px; font-weight: 600; gap: 6px;
            opacity: 0; transition: opacity 0.2s;
        }
        .profile-edit-cover:hover .profile-edit-cover-overlay { opacity: 1; }
        .profile-edit-avatar-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .profile-edit-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 3px solid #7c3aed;
            object-fit: cover;
            cursor: pointer;
            flex-shrink: 0;
        }
        .profile-edit-avatar-hint {
            font-size: 13px; color: #64748b; line-height: 1.5;
        }
        .profile-edit-avatar-hint strong { color: #7c3aed; display: block; font-size: 14px; margin-bottom: 2px; }
        .profile-edit-field {
            margin-bottom: 16px;
        }
        .profile-edit-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .profile-edit-field input,
        .profile-edit-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.18s;
            font-family: inherit;
            resize: none;
        }
        .profile-edit-field input:focus,
        .profile-edit-field textarea:focus {
            border-color: #7c3aed;
            background: #fff;
        }
        .profile-edit-save {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .profile-edit-save:active { opacity: 0.85; }

        /* ============================================================
           ============================================================ */

        /* ---- Notch / pill shape cut-out behind center button ---- */
        .mobile-nav-bar::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: transparent;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 20px 0 0 rgba(13,17,26,0.97);
            pointer-events: none;
        }

        .mobile-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px; /* PHASE15 FIX: reduced from 76px */
            background: linear-gradient(180deg, rgba(10,13,22,0.98) 0%, rgba(13,17,28,0.99) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 1000;
            justify-content: space-around;
            align-items: center;
            padding: 0 6px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-shadow:
                0 -12px 40px rgba(0,0,0,0.55),
                0 -1px 0 rgba(255,255,255,0.05),
                inset 0 1px 0 rgba(255,255,255,0.04);
            transform: translateY(0);
            transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }

        /* Hide with smooth slide animation on chat/call screens */
        body.chat-panel-active .mobile-nav-bar,
        body.call-screen-active .mobile-nav-bar,
        body.group-panel-active .mobile-nav-bar,
        body.status-panel-active .mobile-nav-bar {
            transform: translateY(100%) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Ensure flex display persists on mobile */
        @media (max-width: 768px) {
            .mobile-nav-bar {
                display: flex !important;
            }
            body.chat-panel-active .mobile-nav-bar,
            body.call-screen-active .mobile-nav-bar,
            body.group-panel-active .mobile-nav-bar,
            body.status-panel-active .mobile-nav-bar {
                display: flex !important;
                transform: translateY(100%) !important;
                opacity: 0 !important;
            }
        }

        /* ---- Nav item wrapper ---- */
        .mobile-nav-icon {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 4px 8px;
            color: rgba(148, 163, 184, 0.55);
            cursor: pointer;
            font-size: 21px;
            position: relative;
            border: none;
            background: transparent;
            transition:
                color 0.25s ease,
                transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 16px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            min-height: 56px;
        }

        .mobile-nav-icon:active {
            transform: scale(0.84);
        }

        /* Icon label text */
        .mobile-nav-icon .nav-label {

            bottom: 8px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #3b82f6;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);

        /* Desktop styles */
        @media (max-width: 768px) {
            #permanentSidebar {
                display: none;
            }
            .iframe-container {
                left: 0;
                top: 56px;
                /* Leave room for the 76px bottom nav + safe area */
                bottom: 76px;
            }
            body.chat-panel-active .iframe-container,
            body.group-panel-active .iframe-container,
            body.status-panel-active .iframe-container {
                bottom: 0;
            }

            /* ── CALL SCREEN: calls iframe goes TRULY full screen ── */
            body.call-screen-active #callsContent {
                top: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 10000 !important;
                visibility: visible !important;
                pointer-events: auto !important;
                display: block !important;
                /* FIX (call-header-bleed-through): belt-and-suspenders — the
                   iframe itself has no opaque background by default, so if
                   anything underneath ever painted before the in-call UI
                   loaded, it could show through the edges. Force transparent
                   here (the call UI inside the iframe supplies its own
                   opaque background) rather than relying on paint order. */
                background: transparent !important;
            }

            #globalHeader {
                left: 0;
                padding: 0 14px;
            }
            body.call-screen-active #globalHeader,
            body.status-panel-active #globalHeader {
                opacity: 0 !important;
                pointer-events: none !important;
                visibility: hidden !important;
            }
            body.group-panel-active #globalHeader,
            body.chat-panel-active #globalHeader {
                /* FIX: a 1:1 chat panel now renders its header via the mirrored
                   #headerChatCtx block inside #globalHeader itself (name, avatar,
                   back arrow, call/video/menu buttons — see showChatHeader()).
                   Previously chat-panel-active hid #globalHeader entirely on
                   mobile, leaving only an empty bar where that header should be
                   and losing the back button + call controls. Only fully-custom
                   full-bleed screens (an active call, the status viewer) still
                   hide the global header. */
                opacity: 1 !important;
                visibility: visible !important;
                pointer-events: auto !important;
            }
            /* FIX (call-header-bleed-through): body.call-screen-active and
               body.chat-panel-active #globalHeader rules above have identical
               specificity. When a call starts from inside an already-open
               chat, both classes land on <body> at once, and because the
               chat-panel-active rule appears later in this stylesheet it won
               the cascade — leaving the old chat header (name/avatar/message
               icon) visibly bleeding through on top of the fullscreen call
               UI. An active call must always win regardless of source order. */
            body.call-screen-active.chat-panel-active #globalHeader,
            body.call-screen-active.group-panel-active #globalHeader {
                opacity: 0 !important;
                visibility: hidden !important;
                pointer-events: none !important;
            }
            .header-module-subtitle {
                display: none;
            }
            .profile-name-sm {
                display: none;
            }

            /* FIX: Ensure header action buttons (More Options, call, search) are
               always visible on mobile — never hidden by overflow or flex collapse */
            .header-actions {
                display: flex !important;
                flex-shrink: 0 !important;
                gap: 6px !important;
            }
            .header-action-btn {
                display: inline-flex !important;
                width: 34px !important;
                height: 34px !important;
                flex-shrink: 0 !important;
            }

            /* FIX: Admin icon/FAB always on top in mobile */
            #admFab {
                display: flex !important;
                bottom: 80px !important;
                right: 12px !important;
                z-index: 9999 !important;
            }

            /* FIX: Viewport fill for iframes on iOS */
            .content-iframe {
                height: 100% !important;
                width: 100% !important;
            }
        }

        @media (min-width: 769px) {
            .mobile-nav-bar {
                display: none !important;
            }
            .mobile-back-btn {
                display: none !important;
            }
        }

    <script>
        // ======================================================================
        // ENVIRONMENT DETECTION & SESSION PROTECTION
        // ======================================================================
        window.__isLocalEnvironment = window.__isLocalEnvironment || function(hostname) {
            const host = String(hostname || window.location.hostname || '').toLowerCase();
            if (!host) return true;
            if (host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0') return true;
            if (host.endsWith('.local')) return true;
            if (host.startsWith('192.168.') || host.startsWith('10.')) return true;
            return /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
        };
        window.__getApiOrigin = window.__getApiOrigin || function() {
            const host = String(window.location?.hostname || '').toLowerCase();
            if (window.__isLocalEnvironment(host)) return 'http://localhost:4000';
            if (host.includes('nexopa.onrender.com')) return 'https://nexopa-fy56.onrender.com';
            return 'https://nexopa-fy56.onrender.com';
        };
        window.__getApiBase = window.__getApiBase || function() {
            return `${window.__getApiOrigin()}/api`;
        };
        // Expose __apiBaseUrl so group-ui.js panelFetch can resolve the backend origin
        window.__apiBaseUrl = window.__getApiBase();

        // Session protection - prevent clearing critical auth keys
        (function() {
            const originalRemove = localStorage.removeItem;
            window.__allowAuthStorageMutation__ = window.__allowAuthStorageMutation__ === true;
            window.__withAuthStorageMutation = function(callback) {
                const previous = window.__allowAuthStorageMutation__ === true;
                window.__allowAuthStorageMutation__ = true;
                try {
                    return typeof callback === 'function' ? callback() : undefined;
                } finally {
                    window.__allowAuthStorageMutation__ = previous;
                }
            };
            localStorage.removeItem = function(key) {
                originalRemove.call(this, key);
            };
        })();

        // ======================================================================
        // TRUSTED ORIGIN HELPER
        // ======================================================================
        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            try {
                const url = new URL(origin);
                if (url.hostname === 'localhost' || url.hostname === '127.0.0.1') return true;
                if (url.protocol === 'https:' && url.hostname.endsWith('.onrender.com')) return true;
                if (url.origin === window.location.origin) return true;
            } catch(e) {}
            return false;
        }

        // ======================================================================
        // MODULE MAPPINGS
        // ======================================================================
        const moduleToIframeId = {
            'messages':  'messagesIframe',
            'message':   'messagesIframe',
            'status':    'statusIframe',
            'group':     'groupIframe',
            'groups':    'groupIframe',
            'group-core':'groupIframe',
            'friends':   'friendsIframe',
            'friend':    'friendsIframe',
            'friend-core':'friendsIframe',
            'calls':     'callsIframe',
            'call':      'callsIframe',
            'calls-core':'callsIframe',
            'settings':  'settingsIframe',
            'setting':   'settingsIframe',
            'tools':     'toolsIframe',
            'tool':      'toolsIframe',
            'marketplace':'toolsIframe',
            'games':     'gamesIframe',
            'game':      'gamesIframe',
        };

        // FIX-006: Iframe-ready queue — prevents postMessage events dropped during iframe load
        // Without this, any socket event arriving while an iframe's JS is still loading is silently lost.
        const _iframeReady = new Set();         // modules that have sent CHILD_READY
        const _iframeQueue = new Map();         // module -> Array<message> (queued before CHILD_READY)
        const _IFRAME_QUEUE_MAX = 100;          // cap per module to prevent memory growth

        // FIX-POSTMESSAGE-STORM: sliding-window throttle — max 10 msgs/sec per module
        const _postThrottleWindows = new Map();
        function _postToModule(moduleName, iframeId, message) {
            const iframe = document.getElementById(iframeId);
            if (!iframe || !iframe.contentWindow) return;

            // FIX Bug 3: Throttle raised to 30/sec (was 10). Real-time message events
            // (message:new, CALL_INCOMING etc.) are NEVER dropped regardless of rate.
            const _now = Date.now();
            if (!_postThrottleWindows.has(moduleName)) _postThrottleWindows.set(moduleName, []);
            const _wins = _postThrottleWindows.get(moduleName);
            // Drop timestamps older than 1 second
            while (_wins.length && _now - _wins[0] > 1000) _wins.shift();
            if (_wins.length >= 30) {
                // Storm detected — only drop low-priority setting floods, never real-time data
                const _t = message && message.type;
                const _isCritical = !_t || _t === 'message:new' || _t === 'new_message' || _t === 'CALL_INCOMING' || _t === 'call:incoming' || _t === 'CALL_INCOMING' || _t === 'FRIENDS_LIST_UPDATE' || _t === 'SESSION_DATA' || _t === 'AUTH_READY' || _t === 'PARENT_READY';
                if (!_isCritical && (_t === 'SETTING_CHANGED' || _t === 'SETTINGS_GLOBAL_UPDATE')) {
                    console.warn('[IframeQueue] postMessage storm — dropped', _t, 'for', moduleName);
                    return;
                }
            }
            _wins.push(_now);

            if (_iframeReady.has(moduleName)) {
                try { iframe.contentWindow.postMessage(message, '*'); } catch(e) {
                    console.error('[IframeQueue] postMessage failed for', moduleName, e.message);
                }
            } else {
                if (!_iframeQueue.has(moduleName)) _iframeQueue.set(moduleName, []);
                const q = _iframeQueue.get(moduleName);
                if (q.length < _IFRAME_QUEUE_MAX) q.push(message);
            }
        }

        function _flushIframeQueue(moduleName) {
            const queue = _iframeQueue.get(moduleName);
            if (!queue || queue.length === 0) return;
            const iframeId = moduleToIframeId[moduleName];
            if (!iframeId) return;
            const iframe = document.getElementById(iframeId);
            if (!iframe || !iframe.contentWindow) return;
            _chatLog('[IframeQueue] Flushing', queue.length, 'queued events to:', moduleName);
            queue.forEach(msg => { try { iframe.contentWindow.postMessage(msg, '*'); } catch(_) {} });
            _iframeQueue.delete(moduleName);
        }

        function createInlineAvatar(name, bgColor = '#2563eb', fgColor = '#ffffff') {
            const safeName = String(name || 'User').trim() || 'User';
            const initials = safeName
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(part => part.charAt(0).toUpperCase())
                .join('') || 'U';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="${bgColor}"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="${fgColor}">${initials}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function normalizeAvatarUrl(url, name, bgColor = '#2563eb') {
            const fallback = createInlineAvatar(name, bgColor);
            if (!url) return fallback;
            const value = String(url);
            if (!navigator.onLine && /ui-avatars\.com|placehold\.co/i.test(value)) {
                return fallback;
            }
            return value;
        }

        function readCachedStatusArray(key) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function getCachedApiFallback(endpoint) {
            if (endpoint === '/auth/me') {
                return { user: cachedUser, data: cachedUser };
            }
            if (endpoint === '/status/my') {
                return { statuses: readCachedStatusArray('knecta_my_statuses_cache') };
            }
            if (endpoint === '/status/highlights') {
                return { statuses: readCachedStatusArray('knecta_status_highlights'), highlights: readCachedStatusArray('knecta_status_highlights') };
            }
            return null;
        }

        function loadCachedFriendsListFromStorage() {
            const candidates = [
                'friends',
                'kynecta_friends_cache',
                'knecta_friends_cache',
                'knecta_contacts_cache'
            ];
            for (const key of candidates) {
                try {
                    const parsed = JSON.parse(localStorage.getItem(key) || 'null');
                    let arr = null;
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        arr = parsed;
                    } else if (parsed && Array.isArray(parsed.friends) && parsed.friends.length > 0) {
                        arr = parsed.friends;
                    }
                    if (arr) {
                        // FIX: Deduplicate by String(id) — integer key 5 and string key "5" are
                        // the same friend but both get stored due to a Map key type mismatch,
                        // causing 2 real friends to display as 4.
                        // Also strip non-accepted records (pending/blocked/removed) so they never
                        // appear in the friends list broadcast to all modules.
                        const seen = new Set();
                        const deduped = arr.filter(f => {
                            if (!f || !f.id) return false;
                            const st = f.status || 'accepted';
                            if (st === 'pending' || st === 'pending_sent' || st === 'pending_received' ||
                                st === 'blocked' || st === 'removed' || st === 'rejected') return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);
                            return true;
                        });
                        if (deduped.length > 0) return deduped;
                    }
                } catch (_) {}
            }
            return [];
        }

        function loadCachedCallHistoryFromStorage() {
            try {
                const parsed = JSON.parse(localStorage.getItem('cached_call_history') || 'null');
                if (parsed && Array.isArray(parsed.calls)) {
                    // CRITICAL FIX: Filter out permanently deleted calls
                    const deletedIds = new Set();
                    try {
                        const dl = JSON.parse(localStorage.getItem('kyn_deleted_calls_v1') || '[]');
                        dl.forEach(id => deletedIds.add(String(id)));
                    } catch(_) {}
                    return deletedIds.size > 0
                        ? parsed.calls.filter(c => c && c.id && !deletedIds.has(String(c.id)))
                        : parsed.calls;
                }
            } catch (_) {}
            return [];
        }

        function saveCachedCallHistoryToStorage(calls) {
            try {
                // Filter deleted before saving
                const deletedIds = new Set();
                try {
                    const dl = JSON.parse(localStorage.getItem('kyn_deleted_calls_v1') || '[]');
                    dl.forEach(id => deletedIds.add(String(id)));
                } catch(_) {}
                const filtered = Array.isArray(calls)
                    ? calls.filter(c => c && c.id && !deletedIds.has(String(c.id)))
                    : [];
                localStorage.setItem('cached_call_history', JSON.stringify({ calls: filtered, savedAt: Date.now() }));
            } catch(_) {}
        }

        function loadUserProfileFromStorage() {
            try {
                const auth = localStorage.getItem('kynecta_auth');
                if (auth) {
                    const parsed = JSON.parse(auth);
                    const user = parsed.user || parsed;
                    currentUserProfile.id = user.id || user.userId || parsed.userId || parsed.id;
                    currentUserProfile.username = user.displayName || user.username || user.name || parsed.displayName || parsed.username || 'User';
                    currentUserProfile.avatar = user.avatar || user.photoURL || parsed.avatar || parsed.photoURL;
                    currentUserProfile.cover = user.cover || parsed.cover;
                    currentUserProfile.bio = user.bio || parsed.bio || 'Hey there! I\'m using Kynecta.';
                }
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                if (token && !currentUserProfile.id) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        currentUserProfile.id = payload.userId || payload.id;
                        currentUserProfile.username = payload.displayName || payload.username || payload.name || 'User';
                    } catch(e) {}
                }
                const savedAvatar = localStorage.getItem('user_avatar');
                if (savedAvatar) currentUserProfile.avatar = savedAvatar;

                if (savedCover) currentUserProfile.cover = savedCover;
                const savedBio = localStorage.getItem('user_bio');

                // signed in with Google (or whose avatar came from kynecta_auth on
                // login) had a real photo in currentUserProfile.avatar, but the
                // 'user_avatar' localStorage key — the single key every other module
                // (status.html's iframe, header icons, etc.) reads to show the real
                // photo — was only ever written when the user manually uploaded a new
                // avatar via saveProfileUpdates(). So anyone who never uploaded one
                // saw a generic initials/placeholder icon everywhere except this
                // header, even though their real photo was known. Persist it here too,
                // once, so every module resolves the same real photo consistently.
                if (currentUserProfile.avatar && !savedAvatar) {

        async function saveProfileUpdates(avatarFile, coverFile, bioText) {
            const baseUrl = window.__getApiBase();
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            if (!token) return;
            
            if (avatarFile) {
                const formData = new FormData();
                formData.append('avatar', avatarFile);
                try {
                    // BUG FIX: this used to POST to `${baseUrl}/users/avatar`, which
                    // doesn't exist — the backend only mounts avatar upload under
                    // `/api/profile/avatar` (src/routes/profiles.js). The 404 was
                    // silently swallowed by the catch below, so saving an avatar
                    // looked like it worked but nothing was ever persisted, and it
                    // reverted to the placeholder on every refresh.
                    const res = await fetch(`${baseUrl}/profile/avatar`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        // BUG FIX: the backend response shape is
                        // { success, data: { profile, pictureUrl } } — not a
                        // top-level `avatarUrl` — so this was always reading
                        // undefined even on a successful upload.
                        const avatarUrl = data?.data?.pictureUrl || data?.data?.profile?.profilePicture;
                        if (avatarUrl) {
                            currentUserProfile.avatar = avatarUrl;
                            localStorage.setItem('user_avatar', avatarUrl);
                        }
                    } else {
                        console.warn('Avatar upload failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Avatar upload failed:', e); }
            }
            
            if (coverFile) {
                const formData = new FormData();
                formData.append('cover', coverFile);
                try {
                    // BUG FIX: same endpoint-path issue as avatar above — the real
                    // route is `/api/profile/cover`, not `/api/users/cover`.
                    const res = await fetch(`${baseUrl}/profile/cover`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        // BUG FIX: same nested-response issue as avatar above —
                        // read data.data.coverUrl, not a top-level data.coverUrl.
                        const coverUrl = data?.data?.coverUrl || data?.data?.profile?.coverPhoto;
                        if (coverUrl) {
                            currentUserProfile.cover = coverUrl;
                            localStorage.setItem('user_cover', coverUrl);
                        }
                    } else {
                        console.warn('Cover upload failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Cover upload failed:', e); }
            }
            
            if (bioText !== undefined) {
                try {
                    // BUG FIX: same nonexistent-endpoint issue as avatar/cover above
                    // (was PATCH `${baseUrl}/users/profile`; the real route is
                    // PUT `/api/profile`). Also now actually checks res.ok instead
                    // of unconditionally treating the save as successful.
                    const res = await fetch(`${baseUrl}/profile`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bio: bioText })
                    });
                    if (res.ok) {
                        currentUserProfile.bio = bioText;
                        localStorage.setItem('user_bio', bioText);
                    } else {
                        console.warn('Bio update failed:', res.status, await res.text().catch(() => ''));
                    }
                } catch(e) { console.warn('Bio update failed:', e); }
            }
            updateProfileUI();
            
            // Broadcast to all modules
            dispatchEventToModules({
                type: 'UPDATE_PROFILE_DATA',
                payload: { avatar: currentUserProfile.avatar, cover: currentUserProfile.cover, bio: currentUserProfile.bio }
            });
        }

        let pendingIncomingCall = null;
        
        function hideGlobalBanner() {
            const banner = document.getElementById('kyn-call-banner');
            if (banner) banner.style.display = 'none';
            pendingIncomingCall = null;
            logProcessStatus('call-banner', true, 'dismissed');

        function setupGlobalCallBanner() {
            const banner = document.getElementById('kyn-call-banner');
            const acceptBtn = document.getElementById('bannerAcceptCall');
            const declineBtn = document.getElementById('bannerDeclineCall');
            
            function hideBanner() {
                banner.style.display = 'none';
                pendingIncomingCall = null;
            }
            
            acceptBtn.onclick = async () => {
                if (pendingIncomingCall) {
                    const callId = pendingIncomingCall.callId || pendingIncomingCall.id;
                    if (callId) {
                        const baseUrl = window.__getApiBase();
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                        try {
                            await fetch(`${baseUrl}/calls/${callId}/answer`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({})
                            });
                        } catch(e) {}
                    }
                    // ── FIX: Do NOT navigate to 'calls' page here.
                    // Navigating to 'calls' destroys/reloads the iframe, wiping all call state.
                    // The calls iframe is ALREADY active (it received the incoming call).
                    // Just mark the call as active and send AUTO_ACCEPT_CALL to the live iframe.
                    document.body.classList.add('call-screen-active');
                    window.__activeCallInProgress = true;
                    // ── FIX: remove .hidden so callsContent iframe is actually visible ──
                    var _bannerCC = document.getElementById('callsContent');
                    if (_bannerCC) _bannerCC.classList.remove('hidden');
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'AUTO_ACCEPT_CALL',
                            payload: pendingIncomingCall
                        }, '*');
                    } else {
                        // Fallback: iframe not ready, navigate then send
                        navigateToPage('calls');
                        setTimeout(() => {
                            const _f = document.getElementById('callsIframe');
                            if (_f && _f.contentWindow) {
                                _f.contentWindow.postMessage({ type: 'AUTO_ACCEPT_CALL', payload: pendingIncomingCall }, '*');
                            }
                        }, 800);
                    }
                    hideBanner();
                }
            };
            
            declineBtn.onclick = async () => {
                if (pendingIncomingCall) {
                    const callId = pendingIncomingCall.callId || pendingIncomingCall.id;
                    if (callId) {
                        const baseUrl = window.__getApiBase();
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                        try {
                            await fetch(`${baseUrl}/calls/${callId}/reject`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                        } catch(e) {}
                    }
                    hideBanner();
                } else {
                    hideBanner();
                }
            };
            
            window.showIncomingCallBanner = (callData) => {
                // Dedup: ignore if same call already being shown
                if (pendingIncomingCall && (pendingIncomingCall.callId || pendingIncomingCall.id) === (callData.callId || callData.id)) return;
                pendingIncomingCall = callData;
                const nameEl = document.getElementById('callerName');
                if (nameEl) nameEl.innerText = callData.callerName || callData.fromUserName || 'Someone';

                const _appVisible = document.visibilityState === 'visible' && !document.hidden;
                const _onCallsPage = (window.__currentPage === 'calls');
                // ── FIX: Always tag the receiver's current page, even when backgrounded,
                // so calls-core.js knows where to navigate back to after the call ends.
                callData._receiverReturnTo = window.__currentPage || 'messages';
                // FIX (call-end return navigation — receiver side): also carry
                // the SPECIFIC chat that was open (if any), not just the page,
                // so ending the call can return to that exact conversation.
                if (window.__currentPage === 'messages' && window.__lastOpenChatUserId) {
                    callData._receiverReturnChatUserId = window.__lastOpenChatUserId;
                    callData._receiverReturnChatName = window.__lastOpenChatName;
                }

                // Hidden / backgrounded app: show only the OS notification, never force-open the call page.
                if (!_appVisible) {
                    if (window.Notification && Notification.permission === 'granted') {
                        try {
                            new Notification(callData.callerName || 'Incoming call', {
                                body: `${(callData.callType || 'voice').toString().replace(/^./, c => c.toUpperCase())} call`,
                                silent: false,
                                tag: `incoming-call-${callData.callId || callData.id || Date.now()}`
                            });
                        } catch (_) {}
                    }
                } else {
                    // Visible / inside app: mark call-screen-active but do NOT navigate to
                    // 'calls' page — that would reload the iframe and lose call state.
                    // The calls iframe is always loaded in the background and has already
                    // received the incoming call event.
                    document.body.classList.add('call-screen-active');
                    window.__activeCallInProgress = true;
                    // FIX: Set __callActive = true so _onIframeVisible in calls.html
                    // sees a call in progress and does NOT reset to idle screen.
                    window.__callActive = true;
                    window.__callInitiatedAt = Date.now(); // used by 5s recency guard
                    window.__callDispatchedAt = Date.now(); // suppress stale CALL_FORCE_ENDED echoes for 15s
                    window.__lastActivePage = window.__currentPage || 'messages';
                    // ── FIX: Tag the receiver's current page onto callData so calls-core.js
                    // (running in the iframe) can store it as pendingCallReturnTo. Without
                    // this, the receiver always returns to 'messages' after the call ends,
                    // regardless of where they actually were (friends, group, calls, etc).
                    callData._receiverReturnTo = window.__currentPage || 'messages';
                // FIX (call-end return navigation — receiver side): also carry
                // the SPECIFIC chat that was open (if any), not just the page,
                // so ending the call can return to that exact conversation.
                if (window.__currentPage === 'messages' && window.__lastOpenChatUserId) {
                    callData._receiverReturnChatUserId = window.__lastOpenChatUserId;
                    callData._receiverReturnChatName = window.__lastOpenChatName;
                }
                    banner.style.display = 'none';
                    // ── FIX: callsContent visibility — .hidden sets visibility:hidden
                    // which hides the iframe even with call-screen-active fullscreen CSS.
                    // Must make the callsContent actually visible for the receiver's
                    // incoming call screen to show.
                    var _incCC = document.getElementById('callsContent');
                    if (_incCC) _incCC.classList.remove('hidden');
                }

                // ── RELIABLE DELIVERY: wait for iframe to signal it's ready ──
                // call_patches.js (or calls-ui.js) posts CALLS_IFRAME_READY when loaded.
                // If already ready, deliver after 100ms settle time.
                // If not ready within 1500ms, deliver anyway as fallback.
                let _delivered = false;
                let _fallbackTimer = null;
                function _onIframeReady(evt) {
                    if (evt.data && evt.data.type === 'CALLS_IFRAME_READY') {
                        setTimeout(_deliverToIframe, 80);
                    }
                }
                function _deliverToIframe() {
                    if (_delivered) return;
                    _delivered = true;
                    // FIX-LEAK: tear down the ready-listener here, unconditionally, so it
                    // is removed whichever path triggered delivery (ready signal OR the
                    // fallback timer). Previously it was only removed inside _onIframeReady,
                    // so when the fallback fired first the listener stayed attached forever —
                    // a stale one accumulated per incoming call, and all of them fired together
                    // (re-posting old callData) the next time CALLS_IFRAME_READY was seen.
                    clearTimeout(_fallbackTimer);
                    window.removeEventListener('message', _onIframeReady);
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        // FIX: Send all variant names — calls.html switch now handles all of them
                        callsIframe.contentWindow.postMessage(
                            { type: 'CALL_INCOMING', payload: callData, source: 'banner-bridge' }, '*'
                        );
                        callsIframe.contentWindow.postMessage(
                            { type: 'INCOMING_CALL', payload: callData, source: 'banner-bridge' }, '*'
                        );
                        callsIframe.contentWindow.postMessage(
                            { type: 'call:incoming', payload: callData, source: 'banner-bridge' }, '*'
                        );
                    }
                }

                if (window.__callsIframeReady) {
                    setTimeout(_deliverToIframe, 100);
                } else {
                    // Listen for the ready signal
                    _fallbackTimer = setTimeout(_deliverToIframe, 1500);
                    window.addEventListener('message', _onIframeReady);
                }

                // Background notification should self-clear from pending state if unanswered.
                setTimeout(() => {
                    if (pendingIncomingCall === callData && !_appVisible) hideBanner();
                }, 180000);
            };
        }

        // ======================================================================
        // CENTRALIZED EVENT DISPATCHER
        // ======================================================================
        function dispatchEventToModules(event) {
            const enrichedEvent = {
                ...event,

    <script>

        // uncoordinated code paths that each independently postMessage a
        // 'message:new' event into the messages iframe (2 in this file, 2 in
        // app.realtime.socket.js, 1 in phase15.delivery.patch.js) — each one
        // added over time as a "safety net" when a symptom was diagnosed,
        // without ever removing the earlier path that was actually the real
        // culprit. Multiple paths racing to deliver the same message can
        // cause duplicate/garbled renders, or a malformed early delivery
        // getting processed first while dedup logic on the receiving end
        // silently drops the correct, fuller delivery that arrives right
        // after it — a plausible root cause of "message logged as received
        // but never rendered."
        //
        // window.__kynRelayMessageOnce(iframeWindow, type, payload) is now
        // the single gate every one of those 5 call-sites routes through: it
        // performs the actual postMessage but only for the FIRST caller per
        // unique message (by serverId/localId/broadcastId + chatId), so the
        // other 4 become safe no-ops instead of duplicate deliveries. This
        // preserves every path as a fallback (none were deleted, since I
        // can't verify live which one is safe to remove) while guaranteeing
        // only one delivery actually reaches the iframe.
        window.__kynRelayedMsgIds = window.__kynRelayedMsgIds || new Set();
        window.__kynRelayMessageOnce = function (iframeWindow, type, payload) {
            try {
                const p = (payload && payload.payload) ? payload.payload : payload; // tolerate either shape
                const chatId = String((p && (p.chatId || p.conversationId)) || '');
                const msgId  = String((p && (p.id || p.serverId || p.localId || p._broadcastId)) || '');
                const key = (type || 'message:new') + ':' + chatId + ':' + (msgId || (p && p.content) || Date.now());
                if (window.__kynRelayedMsgIds.has(key)) return false; // already delivered by another path
                window.__kynRelayedMsgIds.add(key);
                setTimeout(function () { window.__kynRelayedMsgIds.delete(key); }, 15000);
                if (!iframeWindow) return true; // registration-only call — caller already posted directly
                iframeWindow.postMessage(
                    (payload && payload.type) ? payload : { type: type || 'message:new', payload: p, source: 'ws-bridge' },
                    '*'

                return true;
            } catch (_) { return false; }
        };

            function waitForApi() {

                            clearInterval(checkInterval);
                            resolve();

                    setTimeout(() => {

            const requestThrottle = new Map();

            function canMakeRequest(endpoint) {
                const now = Date.now();
                const lastRequest = requestThrottle.get(endpoint) || 0;
                const throttleTime = THROTTLE_TIMES[endpoint] || THROTTLE_TIMES.default;
                if (now - lastRequest < throttleTime) {
                    return false;
                }
                requestThrottle.set(endpoint, now);
                return true;
