            function shouldPreferDirectApi(endpoint, method) {
                const normalizedMethod = String(method || 'GET').toUpperCase();
                if (normalizedMethod !== 'GET') return true;
                return ['/groups', '/status', '/calls', '/tools', '/marketplace']
                    .some(prefix => endpoint === prefix || endpoint.startsWith(prefix + '/'));
            }

            function shouldRetryDirectApi(endpoint, responsePayload) {
                if (!responsePayload || responsePayload.success !== false) return false;
                const errorText = String(responsePayload.error || responsePayload.message || '').toLowerCase();
                return (
                    responsePayload.statusCode === 0 ||
                    responsePayload.statusCode === 408 ||
                    responsePayload.statusCode === 504 ||
                    errorText.includes('timeout') ||
                    errorText.includes('network') ||
                    errorText.includes('fetch') ||
                    shouldPreferDirectApi(endpoint, 'GET')
                );
            }

            async function directApiRequest(endpoint, method, body, params, token) {
                const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                let url = baseUrl + endpoint;
                if (method === 'GET' && params && typeof params === 'object') {
                    const queryString = new URLSearchParams(params).toString();
                    if (queryString) url += '?' + queryString;
                }

                // Use token refresh mechanism from api.core.js if available
                let currentToken = token;
                if (window.refreshTokenIfNeeded && window.validateToken) {
                    try {
                        // Validate current token
                        const validation = window.validateToken(currentToken);
                        if (!validation.valid) {
                            _chatLog('[Parent] Token invalid, attempting refresh...');
                            const refreshResult = await window.refreshTokenIfNeeded();
                            if (refreshResult.success) {
                                currentToken = refreshResult.token;
                                _chatLog('[Parent] Token refreshed successfully');
                            } else if (refreshResult.requiresReauth) {
                                _chatLog('[Parent] Token refresh requires reauthentication');
                                return { success: false, error: 'Token expired and requires reauthentication', statusCode: 401, data: null };
                            }
                        }
                    } catch (err) {
                        console.warn('[Parent] Token validation failed:', err);
                    }
                }

                const headers = { 'Accept': 'application/json' };
                if (body && !(body instanceof FormData)) headers['Content-Type'] = 'application/json';
                if (currentToken) headers['Authorization'] = `Bearer ${currentToken}`;

                const fetchOptions = { method, headers, credentials: 'include' };
                if (body && method !== 'GET') {
                    if (body instanceof FormData) {
                        fetchOptions.body = body;
                    } else if (typeof body === 'string') {
                        // FIX: body is already a JSON string (friend-core.js calls JSON.stringify
                        // before putting it in the API_REQUEST payload). Double-serializing it here
                        // wraps it in extra quotes, making req.body arrive as undefined on the server.
                        // Detect pre-serialized strings and pass them through as-is.
                        fetchOptions.body = body;
                        // Ensure Content-Type is set even when body is a pre-serialized string
                        if (!headers['Content-Type']) headers['Content-Type'] = 'application/json';
                    } else {
                        fetchOptions.body = JSON.stringify(body);
                    }
                }

                let response = await fetch(url, fetchOptions);
                let responseData;
                let contentType = response.headers.get('content-type') || '';
                
                if (contentType.includes('application/json')) responseData = await response.json();
                else responseData = { message: await response.text() || 'Request completed' };

                // Handle 401 Unauthorized with token refresh
                if (response.status === 401 && window.refreshTokenIfNeeded && window.validateToken) {
                    _chatLog('[Parent] 401 response, attempting token refresh...');
                    try {
                        const refreshResult = await window.refreshTokenIfNeeded();
                        if (refreshResult.success) {
                            _chatLog('[Parent] Token refreshed, retrying request...');
                            // Retry with new token
                            headers['Authorization'] = `Bearer ${refreshResult.token}`;
                            const retryOptions = { method, headers, credentials: 'include' };
                            if (body && method !== 'GET') {
                                retryOptions.body = body instanceof FormData ? body : JSON.stringify(body);
                            }
                            
                            response = await fetch(url, retryOptions);
                            contentType = response.headers.get('content-type') || '';
                            if (contentType.includes('application/json')) responseData = await response.json();
                            else responseData = { message: await response.text() || 'Request completed' };
                        } else if (refreshResult.requiresReauth) {
                            _chatLog('[Parent] Token refresh requires reauthentication');
                            return { success: false, error: 'Token expired and requires reauthentication', statusCode: 401, data: responseData };
                        }
                    } catch (refreshErr) {
                        console.warn('[Parent] Token refresh failed:', refreshErr);
                        return { success: false, error: 'Token refresh failed', statusCode: 401, data: responseData };
                    }
                }

                if (!response.ok) {
                    return { success: false, error: responseData?.message || responseData?.error || `HTTP ${response.status}`, statusCode: response.status, data: responseData };
                }

                // FIX: Unwrap backend envelope { success, data: {...} } so friend-core receives a flat
                // { success, data: { friends:[...] } } instead of a double-nested payload which causes data:null.
                if (responseData && typeof responseData === 'object' && 'success' in responseData) {
                    return {
                        success: responseData.success !== false,
                        data: responseData.data ?? responseData,
                        error: responseData.error || responseData.message || null,
                        statusCode: response.status
                    };
                }

                return { success: true, data: responseData, statusCode: response.status };
            }

            function getSessionData() {
                const auth = window.AuthStorage?.getAuth?.() || null;
                const session = window.Session?.getSession?.() || null;
                const token = session?.token ||
                              auth?.token ||
                              window.Session?.getToken?.() ||
                              localStorage.getItem('authToken') ||
                              localStorage.getItem('token') ||
                              localStorage.getItem('nexopa_token') ||
                              localStorage.getItem('accessToken');
                if (!token) return null;

                let user = session?.user || auth?.user || window.Session?.getUser?.() || null;
                let userId = user?.id || user?.userId || session?.userId || auth?.userId || auth?.id || null;

                if (!userId) {
                    try {
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            const payload = JSON.parse(atob(parts[1]));
                            userId = payload.userId || payload.id || payload.sub || payload.user_id || payload.uid || null;
                            if (!user && userId) {
                                user = {
                                    id: userId,
                                    userId: userId,
                                    username: payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                                    email: payload.email || '',
                                    displayName: payload.displayName || payload.username || payload.name || 'User',
                                    firstName: payload.firstName || '',
                                    lastName: payload.lastName || ''
                                };
                            }
                        }
                    } catch (e) {
                        console.warn('[Parent] Failed to decode token:', e);
                    }
                }

                if (!userId) return null;
                return { token, userId: String(userId), user };
            }

            function updateSessionCache() {
                const session = getSessionData();
                const localFriends = loadCachedFriendsListFromStorage();
                if (localFriends.length > 0) {
                    cachedFriendsList = localFriends;
                    broadcastFriendsToAllModules(cachedFriendsList);
                }
                if (session && session.userId) {
                    cachedToken = session.token;
                    const normalizedUserId = Number(session.userId);
                    cachedUserId = Number.isFinite(normalizedUserId) ? normalizedUserId : session.userId;
                    cachedUser = session.user || { id: cachedUserId, userId: cachedUserId, username: 'User' };
                    if (cachedUser && (cachedUser.id == null || cachedUser.userId == null)) {
                        cachedUser.id = cachedUser.id ?? cachedUserId;
                        cachedUser.userId = cachedUser.userId ?? cachedUserId;
                    }
                    // FIX 3: Hydrate role from backend if not already known
                    if (!cachedUser.role && cachedToken) { _fetchAndCacheUserRole(cachedToken); }
                    requestFriendsFromFriendIframe();
                } else {
                    cachedToken = null;
                    cachedUserId = null;
                    cachedUser = null;
                }
            }

            // FIX 3: Fetch profile role from /api/profile and cache it
            let _roleFetchInFlight = false;
            async function _fetchAndCacheUserRole(token) {
                if (_roleFetchInFlight) return;
                _roleFetchInFlight = true;
                try {
                    const base = (window.__kynAPI?.baseUrl || '').replace(/\/api$/, '').replace(/\/$/, '') ||
                                 (typeof window.__getApiBase === 'function' ? window.__getApiBase().replace(/\/api$/, '') : '') || '';
                    const res = await fetch(base + '/api/profile', {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                    });
                    if (res.ok) {
                        const profile = await res.json();
                        const role = profile?.role || profile?.user?.role || 'user';
                        const isAdmin = role === 'admin' || role === 'moderator' || profile?.isAdmin === true;
                        // P1 FIX: Do NOT persist role in localStorage — keeps role in memory only
                        // localStorage.setItem('userRole', role); // REMOVED — localStorage role is a security risk
                        window.__cachedUserRole = role;
                        if (cachedUser) { cachedUser.role = role; cachedUser.isAdmin = isAdmin; }
                        if (window.currentUser) { window.currentUser.role = role; window.currentUser.isAdmin = isAdmin; }
                        if (window.__kynUser) { window.__kynUser.role = role; window.__kynUser.isAdmin = isAdmin; }
                        // Propagate to Tools/marketplace iframe
                        const toolsFrame = document.getElementById('toolsIframe') || document.getElementById('marketplaceIframe');
                        if (toolsFrame?.contentWindow) {
                            toolsFrame.contentWindow.postMessage({ type: 'USER_ROLE_UPDATE', role, isAdmin }, '*');
                        }
                    }
                } catch(e) {
                    console.warn('[chat.html] Profile role fetch failed:', e.message);
                } finally { _roleFetchInFlight = false; }
            }

            function requestFriendsFromFriendIframe() {
                const friendsIframe = document.getElementById('friendsIframe');
                if (friendsIframe && friendsIframe.contentWindow) {

            function broadcastFriendsToAllModules(friends) {

                sendFriendsToMessagesIframe(friends);
                sendFriendsToGroupIframe(friends);

                sendFriendsToToolsIframe(friends);

            function sendSessionToModule(iframe, moduleName) {
                window.__moduleSessionDispatchCache = window.__moduleSessionDispatchCache || {};
                const isSettings = moduleName === 'settings';
                if (!cachedToken || !cachedUserId) {
                    if (isSettings) {
                        if (!iframe || !iframe.contentWindow) return;
                        iframe.contentWindow.postMessage({
                            type: 'PARENT_READY',
                            id: `parent_ready_${Date.now()}_${moduleName}`,
                            source: 'parent',
                            target: moduleName,
                            payload: { protocol: 'KYN-8.0', state: 'READY', message: 'Parent ready (no session)', session: null, userId: null },
                            timestamp: Date.now()
                        }, '*');
                    }
                    return;
                }
                if (!iframe || !iframe.contentWindow) return;

                const now = Date.now();
                const sessionFingerprint = `${cachedUserId}:${String(cachedToken).slice(-24)}`;
                const lastDispatch = window.__moduleSessionDispatchCache[moduleName];
                if (lastDispatch &&
                    lastDispatch.fingerprint === sessionFingerprint &&
                    now - lastDispatch.timestamp < 300) {
                    return;
                }
                window.__moduleSessionDispatchCache[moduleName] = {
                    fingerprint: sessionFingerprint,
                    timestamp: now
                };

                const numericUserId = Number(cachedUserId);
                const normalizedUserId = Number.isFinite(numericUserId) ? numericUserId : cachedUserId;
                const userData = {
                    id: normalizedUserId,
                    userId: normalizedUserId,
                    username: cachedUser?.username || 'User',
                    displayName: cachedUser?.displayName || cachedUser?.username || 'User',
                    email: cachedUser?.email || '',
                    firstName: cachedUser?.firstName || '',
                    lastName: cachedUser?.lastName || '',
                    // FIX 1: Always propagate role & isAdmin to iframes via SESSION_DATA
                    role: cachedUser?.role || window.__cachedUserRole || 'user',
                    // P1 FIX: isAdmin must come from server-verified session only — not localStorage
                    isAdmin: cachedUser?.isAdmin === true || cachedUser?.role === 'admin' || cachedUser?.role === 'moderator' || window.__cachedUserRole === 'admin'
                };

                const sessionData = {
                    token: cachedToken,
                    user: userData,
                    authenticated: true,
                    expiresAt: Date.now() + 3600000,
                    ready: true,
                    userId: normalizedUserId,
                    id: normalizedUserId
                };

                // ── patch v1: expose session on window so same-origin iframes
                // and services (services_friend.js, friendqueue_manager.js etc.)
                // can find the token without relying solely on postMessage ──
                window.__PARENT_SESSION__ = sessionData;
                window.AUTH_SESSION       = sessionData;

                iframe.contentWindow.postMessage({
                    type: 'SESSION_DATA',
                    id: `session_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: sessionData,
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'AUTH_READY',
                    id: `auth_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        authenticated: true,
                        session: sessionData,
                        user: userData,
                        userId: normalizedUserId,
                        timestamp: now
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'PARENT_READY',
                    id: `parent_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        protocol: 'KYN-8.0',
                        state: 'READY',
                        message: 'Parent is ready',
                        session: sessionData,
                        userId: normalizedUserId
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');
                
                setTimeout(() => {
                    if (moduleName === 'calls') sendFriendsToCallsIframe();
                    if (moduleName === 'messages') sendFriendsToMessagesIframe();
                    if (moduleName === 'group') sendFriendsToGroupIframe();
                    if (moduleName === 'status') sendFriendsToStatusIframe();
                    if (moduleName === 'tools') sendFriendsToToolsIframe();
                }, 500);
            }

            let lastSessionSend = 0;
            const SESSION_SEND_INTERVAL = 30000;

            (function earlyTokenInit() {
                try {
                    const t = localStorage.getItem('authToken') ||
                              localStorage.getItem('token') ||
                              localStorage.getItem('nexopa_token') ||
                              localStorage.getItem('accessToken');
                    if (t && !cachedToken) {
                        cachedToken = t;
                        const parts = t.split('.');
                        if (parts.length === 3) {
                            const p = JSON.parse(atob(parts[1]));
                            cachedUserId = p.userId || p.id || p.sub || null;
                        }
                    }
                } catch(e) {}
            })();

            function getCachedSettings() {
                try {
                    const raw = localStorage.getItem('knecta_settings_cache');
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    return parsed?.data || parsed;
                } catch(e) { return null; }
            }

            function persistCachedSettings(settings) {
                try {
                    localStorage.setItem('knecta_settings_cache', JSON.stringify({
                        data: settings || {},
                        timestamp: Date.now(),
                        version: '1.0.0'
                    }));
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function updateCachedSettingsPath(section, key, value) {
                const existing = getCachedSettings() || {};
                if (!existing[section] || typeof existing[section] !== 'object') existing[section] = {};
                existing[section][key] = value;
                persistCachedSettings(existing);
                return existing;
            }

            function pushSettingsToModule(iframe, moduleName) {
                if (!iframe || !iframe.contentWindow) return;
                // FIX-SETTINGS-PROPAGATION: Try multiple sources so a module always
                // gets settings even when knecta_settings_cache hasn't been written yet.
                let settings = getCachedSettings();
                if (!settings || Object.keys(settings).length === 0) {
                    // Try AppSettings as fallback
                    if (window.AppSettings && typeof window.AppSettings.getAll === 'function') {
                        try { settings = window.AppSettings.getAll(); } catch(e) {}
                    }
                }
                if (!settings || Object.keys(settings).length === 0) {
                    // Try raw localStorage key written by settingsManager
                    try {
                        const raw = localStorage.getItem('knecta_settings_cache') || localStorage.getItem('nexopa_settings_default');
                        if (raw) { const p = JSON.parse(raw); settings = p?.data || p; }
                    } catch(e) {}
                }
                if (!settings || Object.keys(settings).length === 0) return; // nothing to push
                // PHASE15 FIX: Send ONE batched SETTINGS_UPDATED message instead of
                // one SETTING_CHANGED per key. With 118+ settings keys, the old approach
                // fired 118 postMessages per navigation causing a massive storm that
                // overwhelmed RealtimeStabilizationLayer and delayed real events.
                iframe.contentWindow.postMessage({
                    type: 'SETTINGS_UPDATED',
                    source: 'parent',
                    target: moduleName,
                    payload: { settings, timestamp: Date.now() },
                    timestamp: Date.now()
                }, '*');
                // PHASE15 FIX: Send ONE aggregate SETTING_CHANGED with all keys flattened
                // instead of one postMessage per key. Receivers can expand this themselves.
                try {
                    iframe.contentWindow.postMessage({
                        type: 'SETTINGS_BATCH',
                        source: 'parent',
                        payload: { settings, timestamp: Date.now() }
                    }, '*');
                } catch(e) {}
            }

            // FIX-POSTMESSAGE: 100ms debounce for SETTING_CHANGED floods during navigation
            var _settingChangedDebounce = {};
            function emitGlobalAppEvent(type, payload, options = {}) {
                // Debounce SETTING_CHANGED / SETTINGS_GLOBAL_UPDATE to 100ms per key
                if (type === 'SETTING_CHANGED' || type === 'SETTINGS_GLOBAL_UPDATE') {
                    var _debKey = type + ':' + (payload && payload.section || '') + ':' + (payload && payload.key || '');
                    if (_settingChangedDebounce[_debKey]) clearTimeout(_settingChangedDebounce[_debKey]);
                    _settingChangedDebounce[_debKey] = setTimeout(function() {
                        delete _settingChangedDebounce[_debKey];
                        if (window.appEvents && typeof window.appEvents.emit === 'function') {
                            window.appEvents.emit(type, payload, options); return;
                        }
                        if (window.KynectaEventBus && typeof window.KynectaEventBus.emit === 'function') {
                            window.KynectaEventBus.emit(type, payload, options);
                        }
                    }, 100);
                    return;
                }
                if (window.appEvents && typeof window.appEvents.emit === 'function') {
                    window.appEvents.emit(type, payload, options);
                    return;
                }
                if (window.KynectaEventBus && typeof window.KynectaEventBus.emit === 'function') {
                    window.KynectaEventBus.emit(type, payload, options);
                }
            }

            function sendToAllModulesIfNeeded(force = false) {
                const now = Date.now();
                if (!force && now - lastSessionSend < SESSION_SEND_INTERVAL) return;
                if (!cachedToken || !cachedUserId) updateSessionCache();
                if (!cachedToken || !cachedUserId) return;
                lastSessionSend = now;
                Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                    const iframe = document.getElementById(iframeId);
                    if (iframe && iframe.contentWindow) {
                        sendSessionToModule(iframe, moduleName);
                        setTimeout(() => pushSettingsToModule(iframe, moduleName), 200);
                    }
                });
                setTimeout(() => requestFriendsFromFriendIframe(), 1000);
            }

            // FIX: Throttle call history refresh — CALL_ENDED echoes create infinite loops
            // where each iframe CALL_ENDED triggers another broadcast → another refresh.
            // Allow at most one real API fetch per 8 seconds.
            let _lastCallHistoryRefresh = 0;
            let _callHistoryPending = false;

            async function refreshCallHistoryForUser(userId) {
                const _now = Date.now();
                if (_now - _lastCallHistoryRefresh < 8000) return;
                if (_callHistoryPending) return;
                _lastCallHistoryRefresh = _now;
                _callHistoryPending = true;
                const cachedCalls = loadCachedCallHistoryFromStorage();
                const callsIframe = document.getElementById('callsIframe');
                if (callsIframe && callsIframe.contentWindow && cachedCalls.length > 0) {
                    callsIframe.contentWindow.postMessage({
                        type: 'CALL_HISTORY_UPDATE',
                        payload: { calls: cachedCalls, loading: false, cached: true, timestamp: Date.now() }
                    }, '*');
                }
                if (!cachedToken) {
                    return cachedCalls;
                }
                try {
                    // suppressed: [Parent] Refreshing call history
                    const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';

                    if (callsIframe && callsIframe.contentWindow && navigator.onLine) {
                        callsIframe.contentWindow.postMessage({
                            type: 'CALL_HISTORY_UPDATE',
                            payload: { calls: cachedCalls, loading: true, cached: cachedCalls.length > 0, timestamp: Date.now() }
                        }, '*');
                    }

                    if (!navigator.onLine) {
                        return cachedCalls;
                    }

                    let response = await fetch(`${baseUrl}/calls/history?limit=50`, {
                        headers: { 'Authorization': `Bearer ${cachedToken}` }
                    });
                    
                    // Handle 404 fallback
                    if (!response.ok && response.status === 404) {
                        response = await fetch(`${baseUrl}/calls?limit=50&page=1`, {
                            headers: { 'Authorization': `Bearer ${cachedToken}` }
                        });
                    }
                    
                    // Handle 429 rate limiting with exponential backoff
                    if (!response.ok && response.status === 429) {
                        console.warn('[Parent] Rate limited (429), retrying with backoff...');
                        await new Promise(resolve => setTimeout(resolve, 2000)); // 2s delay
                        response = await fetch(`${baseUrl}/calls/history?limit=50`, {
                            headers: { 'Authorization': `Bearer ${cachedToken}` }
                        });
                        
                        // Second retry with longer delay if still rate limited
                        if (!response.ok && response.status === 429) {
                            console.warn('[Parent] Still rate limited, retrying with longer backoff...');

                            _kynDeferStaleCallEvent(data, 4000 - _sinceDispatchCSA2);
                        } else {
                            window.__activeCallInProgress = false;
                            document.body.classList.remove('call-screen-active');
                            if (typeof logProcessStatus === 'function') {
                                logProcessStatus('call-screen', true, 'inactive');
                            }
                        }
                    }
                    return;
                }

                // ── CALL_MINIMISED: show slim green "Call in progress" tap-to-return bar ──
                if (data.type === 'CALL_MINIMISED') {
                    const peerName = (data.payload && data.payload.peer) || 'User';
                    let miniBar = document.getElementById('_kynMiniCallBar');
                    if (!miniBar) {
                        miniBar = document.createElement('div');
                        miniBar.id = '_kynMiniCallBar';
                        miniBar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:8500;background:linear-gradient(90deg,#34c759,#28a745);color:#fff;padding:9px 16px;font-size:13px;font-weight:600;display:none;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;';
                        miniBar.innerHTML = '<div style="display:flex;align-items:center;gap:8px"><i class="fas fa-phone-alt" style="font-size:14px"></i><span id="_kynMiniBarName">Call in progress</span></div><span style="font-size:11px;opacity:.85">Tap to return →</span>';
                        miniBar.addEventListener('click', () => { navigateToPage('calls'); miniBar.style.display = 'none'; });
                        document.body.appendChild(miniBar);
                    }
                    const nameSpan = document.getElementById('_kynMiniBarName');
                    if (nameSpan) nameSpan.textContent = 'Call in progress with ' + peerName;
                    miniBar.style.display = 'flex';
                    return;
                }

                // Hide mini bar when call fully ends
                if (data.type === 'CALL_ENDED' || data.type === 'CALL_FORCE_ENDED' || data.type === 'CALL_REJECTED') {
                    const miniBar = document.getElementById('_kynMiniCallBar');
                    if (miniBar) miniBar.style.display = 'none';
                }

                // ==================================================================
                // CALL ACCEPT HANDLER - POST /calls/:id/answer (with endpoint fallback)
                // ==================================================================
                if (data.type === 'CALL_ACCEPT' || data.type === 'call:accept') {
                    const callId = data.payload?.callId;
                    const baseUrl = window.__getApiBase();
                    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                    let success = false;
                    let resultData = null;
                    if (callId) {
                        // Try multiple endpoint variants — server may use /accept instead of /answer
                        const endpoints = [
                            `${baseUrl}/calls/${callId}/answer`,
                            `${baseUrl}/calls/${callId}/accept`,
                            `${baseUrl}/calls/accept/${callId}`,
                            `${baseUrl}/calls/${callId}/respond`
                        ];
                        for (const endpoint of endpoints) {
                            try {
                                const res = await fetch(endpoint, {
                                    method: 'POST',
                                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ accepted: true, timestamp: Date.now() })
                                });
                                resultData = await res.json().catch(()=>({}));
                                if (res.ok || res.status === 200) {
                                    success = true;
                                    _chatLog('[Parent] Call accept result OK via:', endpoint);
                                    break;
                                }
                                if (res.status !== 404) break; // Non-404 error — stop trying
                            } catch(e) { console.warn('[Parent] CALL_ACCEPT error on', endpoint, ':', e.message); }
                        }
                        // If all REST endpoints failed, signal via WebSocket directly
                        if (!success && window.wsService) {
                            try {
                                window.wsService.emit('call:accepted', { callId, timestamp: Date.now() });
                                success = true;
                                _chatLog('[Parent] Call accept signaled via WebSocket fallback');
                            } catch(e) {}
                        }
                    }
                    if (event.source) {
                        event.source.postMessage({
                            type: 'CALL_ACCEPT_RESULT',
                            payload: { success, callId, data: resultData, timestamp: Date.now() }
                        }, '*');
                    }
                    hideGlobalBanner();
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }

                // ==================================================================
                // CALL REJECT HANDLER - POST /calls/:id/reject
                // ==================================================================
                if (data.type === 'CALL_REJECT' || data.type === 'call:reject') {
                    const callId = data.payload?.callId;
                    const baseUrl = window.__getApiBase();
                    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                    let success = false;
                    if (callId) {
                        try {
                            const res = await fetch(`${baseUrl}/calls/${callId}/reject`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            success = res.ok;
                            _chatLog('[Parent] Call reject result:', success);
                        } catch(e) { console.warn('[Parent] CALL_REJECT error:', e); }
                    }
                    if (event.source) {
                        event.source.postMessage({
                            type: 'CALL_REJECT_RESULT',
                            payload: { success, callId, timestamp: Date.now() }
                        }, '*');
                    }
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    // FIX (nav-icons-stuck-hidden): reset the flag alongside the
                    // class — see the matching fix on POST_CALL_RESTORE above for
                    // why leaving this stale=true breaks the stuck-nav watchdog.
                    window.__activeCallInProgress = false;
                    // Broadcast CALL_ENDED to all iframes so the CALLER side resets when declined
                    const _rCallId = callId;
                    document.querySelectorAll('iframe').forEach(f => {
                        if (f.contentWindow) f.contentWindow.postMessage({
                            type: 'CALL_ENDED',
                            payload: { callId: _rCallId, reason: 'declined', status: 'declined' },
                            source: 'parent-reject-broadcast'
                        }, '*');
                    });
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }

                // ==================================================================
                // CALL DISPATCH LOGIC
                // ==================================================================
                if (!window.__callDispatchLock) window.__callDispatchLock = { ts: 0, userId: null };

                function __isCallDuplicate(userId) {
                    const lock = window.__callDispatchLock;
                    return lock.userId === String(userId) && (Date.now() - lock.ts) < 2000;
                }

                function __dispatchCallToIframe(userId, userName, callType, returnTo, chatUserId, source, extraCtx) {
                    if (__isCallDuplicate(userId)) {
                        _chatLog('[Parent] ⏭ Duplicate call dispatch suppressed');
                        return;
                    }
                    window.__callDispatchLock = { ts: Date.now(), userId: String(userId) };

                    // Normalise returnTo aliases
                    if (returnTo === 'friends-page' || returnTo === 'friend') returnTo = 'friends';
                    else if (returnTo === 'chat' || returnTo === 'message') returnTo = 'messages';
                    // If not set, use the current page (so calls from calls module return to calls)
                    else if (!returnTo || returnTo === 'undefined') {
                        returnTo = window.__currentPage || window.__lastActivePage || 'calls';
                    }
                    // 'calls' is valid — user started from calls module, return there after

                    const ctx = { returnTo, chatUserId: chatUserId || userId, userName, source, ts: Date.now(), ...(extraCtx || {}) };
                    window.__callReturnContext = ctx;
                    try { sessionStorage.setItem('call_return_ctx', JSON.stringify(ctx)); } catch(e) {}

                    _chatLog('[Parent] Dispatching call → user=' + userName + '(' + userId + ') type=' + callType + ' returnTo=' + returnTo);

                    // ✅ FIX: Set ALL call flags BEFORE navigation so the iframe's
                    // IntersectionObserver/_onIframeVisible sees callActive=true and
                    // does NOT reset to idle. Previously __callActive was set after
                    // navigateToPage(), causing the outgoing screen to be wiped.
                    window.__callActive = true;
                    window.__activeCallInProgress = true;
                    window.__callDispatchedAt = Date.now();
                    document.body.classList.add('call-screen-active');

                    // Pre-seed peer info so calling screen can populate instantly
                    window.__activePeerName   = userName;
                    window.__activePeerType   = callType;
                    window.__activePeerAvatar = null;

                    navigateToPage('calls');

                    // ── FIX: ensure callsContent is fully visible with correct positioning
                    var _callsCC = document.getElementById('callsContent');
                    if (_callsCC) {
                        _callsCC.classList.remove('hidden');
                        _callsCC.style.setProperty('position', 'fixed', 'important');
                        _callsCC.style.setProperty('top', '0', 'important');
                        _callsCC.style.setProperty('left', '0', 'important');
                        _callsCC.style.setProperty('right', '0', 'important');
                        _callsCC.style.setProperty('bottom', '0', 'important');
                        _callsCC.style.setProperty('z-index', '99999', 'important');
                        _callsCC.style.setProperty('display', 'block', 'important');
                        _callsCC.style.setProperty('visibility', 'visible', 'important');
                    }

                    const callsIframe = document.getElementById('callsIframe');
                    if (!callsIframe) return;

                    // FIX-GROUP-CALL-NOTICE: previously extraCtx (which carries groupId/
                    // groupName for group calls) was captured into ctx/call_return_ctx but
                    // silently dropped from the payload actually posted to the calls iframe.
                    // Without groupId reaching calls-ui.js, a "start call" from a group chat
                    // was indistinguishable from a 1:1 call to a user whose id happened to
                    // equal the group's id — so no real members were notified.
                    const payload = { userId, userName, callType, returnTo, chatUserId: chatUserId || userId, source, timestamp: Date.now(), ...(extraCtx || {}) };

                    try { sessionStorage.setItem('pending_call', JSON.stringify(payload)); } catch(e) {}

                    // FIX-CALL-DISPATCH-RACE: this used to postMessage straight into the
                    // iframe after a blind 400ms setTimeout, instead of going through the
                    // same _postToModule/_iframeReady/_iframeQueue system every other
                    // module (messages, tools, groups, friends) already uses. Under real
                    // load — many scripts and API calls competing at page load — calls.html
                    // routinely takes longer than 400ms to finish loading and mount its
                    // message listener, so CALL_ORIGIN/OPEN_CALL_WITH_USER were posted into
                    // a target that wasn't listening yet and silently dropped. calls-core.js
                    // then sat waiting forever for the parent handshake, stuck in BOOT/
                    // WAIT_PARENT — this is why calls intermittently failed to reach the
                    // active stage, or never did ("Timeout waiting for core"). _postToModule
                    // queues the message if 'calls' isn't ready yet and the existing
                    // CHILD_READY handler automatically flushes it the instant calls.html
                    // signals it's actually ready, removing the race entirely.
                    _postToModule('calls', 'callsIframe', { type: 'CALL_ORIGIN', origin: returnTo, source: 'parent-frame' });
                    _postToModule('calls', 'callsIframe', { type: 'OPEN_CALL_WITH_USER', payload, source: 'parent-frame' });
                }

                if (data.type === 'SWITCH_MODULE' && data.module === 'calls') {
                    const p = data.payload || {};
                    const _swReturnTo = p.returnTo || window.__currentPage || 'messages';
                    const _swExtra = p.groupId ? { groupId: p.groupId, groupName: p.groupName || p.userName, isGroupCall: true } : {};
                    __dispatchCallToIframe(p.userId, p.userName || 'User', p.callType || 'voice', _swReturnTo, p.chatUserId || p.userId, 'messages-module', _swExtra);
                    return;
                }

                if (data.type === 'INITIATE_CALL') {
                    const p = data.payload || {};
                    const _iciReturnTo = p.returnTo || (p.isGroup ? 'group' : 'messages');
                    const _iciExtra = p.isGroup ? { groupId: p.groupId || p.userId, groupName: p.userName, isGroupCall: true } : {};
                    __dispatchCallToIframe(p.userId, p.userName || 'User', p.callType || 'voice', _iciReturnTo, p.userId, 'messages-module', _iciExtra);
                }

                // Receiver-side missed call recording — fired by calls-core when 3-min timeout expires
                if (data.type === 'RECORD_MISSED_CALL') {
                    _chatLog('[Parent] Recording receiver-side missed call:', data.payload);
                    // Forward to calls iframe to add to recent-calls list as missed
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'RECORD_MISSED_CALL',
                            payload: data.payload || {},
                            source: 'parent-frame'
                        }, '*');
                    }
                    // Also notify via ws-bridge if available
                    if (window.wssBridge && window.wssBridge.emit) {
                        window.wssBridge.emit('missed_call', data.payload || {});
                    }
                }

                if (data.type === 'CALLS_IDLE_SCREEN_SHOWN') {
                    // FIX (post-call stuck-on-calls-screen audit): see calls-ui.js
                    // for the full rationale — this fires unconditionally every
                    // time the calls iframe resets to its own idle screen after a
                    // call ends, regardless of whether CALL_ENDED/CALL_ENDED_RETURN
                    // got through. If we're still showing the full-screen call UI
                    // at this point, the iframe clearly isn't in a call anymore —
                    // restore nav and navigate back now instead of waiting for the
                    // 1500ms watchdog poll (or, if some other guard swallowed every
                    // other signal, at all).
                    if (document.body.classList.contains('call-screen-active')) {
                        window.__activeCallInProgress = false;
                        document.body.classList.remove('call-screen-active');
                        _kynReturnFromCallToOrigin();
                    }
                }

                if (data.type === 'CALL_ENDED_RETURN' || data.type === 'CALL_ENDED_NAVIGATE_BACK') {
                    // ── GUARD: ignore if a call was just dispatched in the last 3s ───────
                    // CALL_ENDED_RETURN fires from stale WS echoes during call SETUP, not
                    // just after call ends. Only drop signals within the first 3 seconds
                    // (true instantaneous echoes). 10s was too long — it blocked short calls.
                    // FIX-NAV-BACK: previously this *dropped* the signal outright, so a call
                    // that was genuinely declined/cancelled within the first 3s never navigated
                    // the user back at all (permanently stuck on the calls screen). Instead,
                    // re-deliver the same signal once the guard window has passed.
                    const _sinceDispatch = window.__callDispatchedAt ? Date.now() - window.__callDispatchedAt : 99999;
                    if (_sinceDispatch < 3000) {
                        console.warn('[Parent] CALL_ENDED_RETURN deferred — call dispatched only', Math.round(_sinceDispatch/1000)+'s ago (possible stale echo), retrying shortly');
                        setTimeout(() => {
                            try { window.postMessage({ type: data.type, returnTo: data.returnTo, payload: data.payload, source: 'stale-echo-retry' }, '*'); } catch(_e) {}
                        }, 3000 - _sinceDispatch + 50);
                        return;
                    }

                    let ctx = window.__callReturnContext;
                    if (!ctx) {
                        try { const s = sessionStorage.getItem('call_return_ctx'); if (s) ctx = JSON.parse(s); } catch(e) {}
                    }
                    window.__callReturnContext = null;
                    window.__callDispatchLock = { ts: 0, userId: null };
                    window.__callDispatchedAt = 0;
                    try { sessionStorage.removeItem('call_return_ctx'); } catch(e) {}

                    // Debounce: ignore duplicate navigation within 3s
                    const _ceNow = Date.now();
                    if (window.__callEndedNavAt && (_ceNow - window.__callEndedNavAt) < 3000) return;
                    window.__callEndedNavAt = _ceNow;
                    setTimeout(() => { window.__callEndedNavAt = 0; }, 5000);

                    // Clear in-progress flag — call is truly done
                    window.__activeCallInProgress = false;
                    document.body.classList.remove('call-screen-active');

                    // FIX: Always restore nav icons when call ends
                    clearTimeout(window.__navHideWatchdog);
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = ''; el.style.pointerEvents = ''; });

                    // Navigate back to where the call was triggered from.
                    // 'calls'    → calls sidebar (call started from calls module)
                    // 'messages' → messages, re-open specific chat
                    // 'friends'  → friends sidebar
                    // Receiver side has no ctx — use __lastActivePage
                    const returnTo = ctx?.returnTo
                        || window.__lastActivePage
                        || 'messages';
                    _chatLog('[Parent] Call ended → returnTo=' + returnTo);

                    // CRITICAL: Clear session dispatch cache so the next navigateToPage
                    // ALWAYS sends a fresh token — prevents hasToken:false rejection in modules
                    window.__moduleSessionDispatchCache = {};

                    if (returnTo === 'calls') {
                        navigateToPage('calls');
                    } else if (returnTo === 'messages') {
                        navigateToPage('messages');
                        if (ctx?.chatUserId) {
                            const msgIframe = document.getElementById('messagesIframe');
                            if (msgIframe && msgIframe.contentWindow) {
                                setTimeout(() => {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: { userId: ctx.chatUserId, userName: ctx.userName || 'User', returnFromCall: true, timestamp: Date.now() },
                                        source: 'parent-frame'
                                    }, '*');
                                    document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                                }, 300);
                            }
                        }
                    } else if (returnTo === 'friends') {
                        navigateToPage('friends');
                        const friendsIframe = document.getElementById('friendsIframe');
                        if (friendsIframe && friendsIframe.contentWindow) {
                            setTimeout(() => {
                                friendsIframe.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                            }, 300);
                        }
                    } else if (returnTo === 'group') {
                        // Return to group panel — navigate to group module then re-open the specific group
                        navigateToPage('group');
                        const groupIframe = document.getElementById('groupIframe');
                        if (groupIframe && groupIframe.contentWindow) {
                            setTimeout(() => {
                                groupIframe.contentWindow.postMessage({
                                    type: 'RETURN_FROM_CALL',
                                    payload: {
                                        returnFromCall: true,
                                        // FIX (CALL-END-NAV-CRASH): ctx is legitimately null here on
                                        // the receiver side of a call (see "Receiver side has no ctx"
                                        // comment above) — this branch dereferenced ctx.groupId/
                                        // groupName directly instead of using optional chaining like
                                        // the sibling 'messages' branch does, so returning from a call
                                        // that was answered (not started) from the group module threw
                                        // "Cannot read properties of null (reading 'groupId')" and
                                        // aborted the whole post-call navigation.
                                        groupId: ctx?.groupId || null,
                                        groupName: ctx?.groupName || null,
                                        timestamp: Date.now()
                                    },
                                    source: 'parent-frame'
                                }, '*');
                            }, 300);
                        }
                    } else {
                        navigateToPage(returnTo || 'messages');
                    }
                }

                // VERIFY SESSION HANDLER
                if (data.type === 'VERIFY_SESSION') {
                    const requestId = data.payload?.requestId || data.requestId;
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage({
                            type: 'VERIFY_RESPONSE',
                            requestId: requestId,
                            payload: { valid: true, timestamp: Date.now(), module: data.source }
                        }, '*');
                    }
                    return;
                }

                // CHECK FRIEND HANDLER — lets the calls iframe enforce the
                // "Friends Only" calling setting, which previously had no way
                // to check the friends list across the iframe boundary.
                if (data.type === 'CHECK_FRIEND') {
                    const requestId = data.payload?.requestId || data.requestId;
                    const callerId = data.payload?.callerId;
                    let isFriend = true; // fail open: unknown -> treat as friend, never wrongly block
                    try {
                        if (Array.isArray(window.friends) && callerId != null) {
                            isFriend = window.friends.some(f =>
                                String(f.id) === String(callerId) || String(f.userId) === String(callerId)
                            );
                        }
                    } catch (e) { /* keep fail-open default */ }
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage({
                            type: 'CHECK_FRIEND_RESPONSE',
                            requestId: requestId,
                            payload: { isFriend: isFriend }
                        }, '*');
                    }
                    return;
                }

                // CHILD READY HANDLER
                if (data.type === 'CHILD_READY') {
                    const targetModule = data.module || data.source || data.payload?.module || null;
                    if (targetModule) {
                        registerModule(targetModule);
                        // FIX-OBJECTMULTIPLEX: Only mark ready + flush AFTER the iframe's
                        // 'load' event has fired. If the iframe is still loading, the
                        // flush may cause ObjectMultiplex "orphaned data" errors because
                        // the child's message handler isn't mounted yet.
                        const _iframeEl = moduleToIframeId[targetModule]
                            ? document.getElementById(moduleToIframeId[targetModule]) : null;
                        const _doReadyFlush = function() {
                            _iframeReady.add(targetModule);
                            _flushIframeQueue(targetModule);
                        };
                        if (_iframeEl && !_iframeEl.dataset.loadFired) {
                            // Not yet load-fired — wait for it (with 2s fallback)
                            const _loadGuard = setTimeout(_doReadyFlush, 2000);
                            _iframeEl.addEventListener('load', function _onLoad() {
                                _iframeEl.removeEventListener('load', _onLoad);
                                _iframeEl.dataset.loadFired = '1';
                                clearTimeout(_loadGuard);
                                _doReadyFlush();
                            }, { once: true });
                        } else {
                            _doReadyFlush();   // already loaded — flush immediately
                        }
                    }
                    if (targetModule && moduleToIframeId[targetModule]) {
                        const iframe = document.getElementById(moduleToIframeId[targetModule]);
                        if (iframe && iframe.contentWindow) {
                            // Always re-read session in case it arrived after page load
                            if (!cachedToken || !cachedUserId) updateSessionCache();

                            if (cachedToken && cachedUserId) {
                                // Send immediately
                                sendSessionToModule(iframe, targetModule);
                                // Re-send at 350ms: core may still be in INITIALIZING and drops first
                                setTimeout(() => {
                                    if (iframe && iframe.contentWindow && cachedToken && cachedUserId) {
                                        sendSessionToModule(iframe, targetModule);
                                    }
                                }, 350);
                                // Third retry at 800ms covers very slow devices / cold starts
                                setTimeout(() => {
                                    if (iframe && iframe.contentWindow && cachedToken && cachedUserId) {
                                        sendSessionToModule(iframe, targetModule);
                                        // Also push friends immediately after session is confirmed ACTIVE
                                        if (targetModule === 'messages') sendFriendsToMessagesIframe();
                                    }
                                }, 800);
                            } else {
                                updateSessionCache();
                                if (cachedToken && cachedUserId) {
                                    sendSessionToModule(iframe, targetModule);
                                    // Retry once in case updateSessionCache was async
                                    setTimeout(() => {
                                        if (cachedToken && cachedUserId) sendSessionToModule(iframe, targetModule);
                                    }, 500);
                                }
                            }
                            setTimeout(() => pushSettingsToModule(iframe, targetModule), 300);
                        }
                    } else {
                        sendToAllModulesIfNeeded(true);
                    }
                }

                // FRIEND EVENTS
                if (data.type === 'FRIEND_ACCEPTED' || data.type === 'FRIEND_REJECTED' || data.type === 'FRIEND_REMOVED') {
                    setTimeout(() => requestFriendsFromFriendIframe(), 500);
                    dispatchEventToModules({ type: data.type, payload: data.payload || data, originalSource: data.source || 'child-module' });

                    // FIX: When a friend request is accepted, the accepter's iframe sends
                    // FRIEND_ACCEPTED with targetUserId = the original sender's userId.
                    // The parent MUST relay FRIEND_REQUEST_ACCEPTED back to ALL modules so
                    // the sender's "Sent Requests" list clears and their friends list updates.
                    // In this single-user iframe architecture, all modules belong to the same
                    // logged-in user — but the socket server handles cross-user notification.
                    // The relay here covers same-user multi-tab and the friends iframe itself.
                    if (data.type === 'FRIEND_ACCEPTED') {
                        const p = data.payload || {};
                        const targetUserId   = p.targetUserId   || p.requesterId || null;
                        const acceptedById   = p.acceptedById   || p.friendId    || null;
                        const acceptedByName = p.acceptedByName || p.friend?.displayName || '';
                        const acceptedByAvatar = p.acceptedByAvatar || p.friend?.avatar || null;
                        const requestId      = p.requestId || null;

                        // Relay FRIEND_REQUEST_ACCEPTED to all modules (covers the accepter's
                        // own views — friends list, sent requests, etc.)
                        const acceptedPayload = {
                            type: 'FRIEND_REQUEST_ACCEPTED',
                            payload: {
                                requestId,
                                friendId:        acceptedById,
                                acceptedById,
                                acceptedByName,
                                acceptedByAvatar,
                                friend:          p.friend || { id: acceptedById, displayName: acceptedByName, avatar: acceptedByAvatar },
                                targetUserId,
                                timestamp:       Date.now()
                            },
                            source: 'parent',
                            originalSource: 'friend-accepted-relay'
                        };
                        dispatchEventToModules(acceptedPayload);

                        // Also emit on the EventBus so any subscriber (status, calls, etc.) can react
                        try {
                            if (window.KynectaEventBus) {
                                window.KynectaEventBus.emit('FRIEND_REQUEST_ACCEPTED', acceptedPayload.payload, { async: true });
                            }
                        } catch(_) {}
                    }
                }

                // SETTINGS HANDLERS
                if (data.type === 'SETTINGS_UPDATED') {
                    const settings = data.settings || data.payload?.settings || null;
                    // Ignore "section-only" updates coming from settings UI.
                    // Those messages don't carry the full settings object and would wipe/apply defaults.
                    if (!settings || typeof settings !== 'object' || Array.isArray(settings) || Object.keys(settings).length === 0) {
                        return;
                    }
                    persistCachedSettings(settings);
                    try {
                        if (window.SettingsStore) {
                            Object.entries(settings || {}).forEach(([section, values]) => {
                                if (!values || typeof values !== 'object') return;
                                Object.entries(values).forEach(([key, value]) => window.SettingsStore.set(`${section}.${key}`, value));
                            });
                        }
                    } catch(e) {}
                    if (settings.appearance?.theme || settings.theme) {
                        if (window.ThemeManager) {
                            window.ThemeManager.setTheme(settings.appearance?.theme || settings.theme);
