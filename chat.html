            async function refreshAuthToken() {
                try {
                    const refreshToken = localStorage.getItem('refreshToken');
                    if (!refreshToken) return false;
                    const response = await fetch(`${window.__getApiBase()}/auth/refresh`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refreshToken }),
                        credentials: 'include'
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const newToken = data.token || data.accessToken;
                        if (newToken) {
                            localStorage.setItem('authToken', newToken);
                            localStorage.setItem('token', newToken);
                            localStorage.setItem('necpa_token', newToken);
                            localStorage.setItem('accessToken', newToken);
                            const authData = localStorage.getItem('kynecta_auth');
                            if (authData) {
                                const parsed = JSON.parse(authData);
                                parsed.token = newToken;
                                localStorage.setItem('kynecta_auth', JSON.stringify(parsed));
                            }
                            _chatLog('[Parent] ✅ Token refreshed successfully');
                            updateSessionCache();
                            setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                            return true;
                        }
                    }
                    return false;
                } catch (error) {
                    console.error('[Parent] Token refresh error:', error);
                    return false;
                }
            }

            function scheduleSessionCacheUpdate() {
                if (window.safeTimeout) {
                    window.safeTimeout(updateSessionCache, 150);
                } else {
                    setTimeout(updateSessionCache, 150);
                }
            }

            updateSessionCache();
            setInterval(scheduleSessionCacheUpdate, 30000);

            window.addEventListener('storage', function(e) {

                    if (window.safeTimeout) {
                        window.safeTimeout(() => sendToAllModulesIfNeeded(true), 100);
                    } else {
                        setTimeout(() => sendToAllModulesIfNeeded(true), 100);

            // MAIN MESSAGE HANDLER - WITH WS-BRIDGE SOURCE DETECTION
            // ======================================================================
            window.addEventListener('message', async function(event) {

                if (!data || typeof data !== 'object') return;

                // FRIENDS_DATA or FRIEND_RELATIONSHIP_CHANGED, rebroadcast to every OTHER
                // iframe so chat, calls, status, groups all see updated friends instantly.
                if (data.type === 'FRIENDS_SYNC' || data.type === 'FRIENDS_DATA' || data.type === 'FRIEND_RELATIONSHIP_CHANGED') {
                    const iframes = document.querySelectorAll('iframe');
                    iframes.forEach(function(frame) {
                        if (frame.contentWindow === event.source) return; // don't echo back to sender
                        try { frame.contentWindow.postMessage(data, '*'); } catch (_) {}
                    });

                    if (data.friends && Array.isArray(data.friends)) {
                        window.friends = data.friends;
                        window.dispatchEvent(new CustomEvent('friendsUpdated', { detail: { friends: data.friends, source: data.type } }));
                    }
                    // Fall through — still handled below by FRIENDS_DATA/FRIENDS_SYNC blocks
                }

                // socket connection and normally sends 'message:delivery_ack' directly
                // over it. That connection can be momentarily disconnected/reconnecting
                // when a message arrives, which silently drops the ack and leaves the
                // sender's 10s delivery-timeout to fire even though the message was
                // genuinely displayed. The iframe also relays the same ack here as a
                // fallback; forward it over this shell's own always-on socket. The
                // server-side handler is idempotent (it just clears a timer), so it's
                // safe even if the iframe's direct emit also succeeded.
                if (data.type === 'message:client_delivery_ack' && data.payload) {
                    try {
                        if (window.wsService && typeof window.wsService.emit === 'function') {
                            // DIAGNOSTIC (temporary — undelivered-after-10s investigation):
                            // confirm the relay actually had a connected socket to hand
                            // this to, and log the exact payload forwarded, so a gap here
                            // (vs. the iframe's own "relayed via parent postMessage" log)
                            // would show up as this line being present or absent.
                            console.log('[AckRelay] forwarding to real socket, connected=', !!(window.KynectaRealtime && window.KynectaRealtime._socket && window.KynectaRealtime._socket.connected), data.payload);
                            window.wsService.emit('message:delivery_ack', data.payload);

                        }

                }

                    }

                                friendId:        acceptedById,
                                acceptedById,
                                acceptedByName,
                                acceptedByAvatar,

                        if (key === 'performanceMode') document.documentElement.setAttribute('data-performance-mode', value ? 'true' : 'false');
                    }
                    // ── notifications ──────────────────────────────────────────
                    if (section === 'notifications') {
                        document.documentElement.setAttribute(`data-notification-${key}`, value === true ? 'true' : value === false ? 'false' : String(value));
                    }
                    // ── privacy ────────────────────────────────────────────────
                    if (section === 'privacy') {
                        document.documentElement.setAttribute(`data-privacy-${key}`, value === true ? 'true' : value === false ? 'false' : String(value));
                    }
                    // ── chat ───────────────────────────────────────────────────
                    if (section === 'chat') {
                        document.documentElement.setAttribute(`data-chat-${key}`, value === true ? 'true' : value === false ? 'false' : String(value));
                    }
                    // ── groups ─────────────────────────────────────────────────
                    if (section === 'groups') {
                        document.documentElement.setAttribute(`data-groups-${key}`, value === true ? 'true' : value === false ? 'false' : String(value));
                    }
                    // ── mood ───────────────────────────────────────────────────
                    if (section === 'mood' && key === 'currentMood') document.documentElement.setAttribute('data-mood', value);
                    updateCachedSettingsPath(section, key, value);
                    // Broadcast as SETTING_CHANGED so all iframes get section/key/value
                    emitGlobalAppEvent('SETTING_CHANGED', {
                        section, key, value,
                        source: data.source || 'settings',
                        timestamp: Date.now()
                    }, { async: true });
                    dispatchEventToModules({ type: 'SETTING_CHANGED', payload: { section, key, value, timestamp: Date.now() }, originalSource: 'settings' });
                    dispatchEventToModules({ type: 'SETTINGS_GLOBAL_UPDATE', payload: { section, key, value, timestamp: Date.now() }, originalSource: 'settings' });

                    // ✅ FIX: BroadcastChannel delivery for single-key changes
                    try {
                        if (!window.__settingsBC) window.__settingsBC = new BroadcastChannel('kynecta_settings');
                        window.__settingsBC.postMessage({ type: 'SETTING_CHANGED', section, key, value, ts: Date.now() });
                    } catch (_) {}
                    // Update cached settings so future iframes bootstrap the latest value
                    try {
                        var _cached = JSON.parse(localStorage.getItem('knecta_settings_cache') || '{"data":{}}');
                        var _d = _cached.data || {};
                        if (!_d[section]) _d[section] = {};
                        _d[section][key] = value;
                        _cached.data = _d;
                        _cached.timestamp = Date.now();
                        localStorage.setItem('knecta_settings_cache', JSON.stringify(_cached));
                        var _full = JSON.parse(localStorage.getItem('kyn_app_settings') || '{}');
                        if (!_full[section]) _full[section] = {};
                        _full[section][key] = value;
                        localStorage.setItem('kyn_app_settings', JSON.stringify(_full));
                    } catch (_) {}
                }

                // ── settings_updated socket event relay ─────────────────────────
                // When the realtime socket receives a settings_updated event from
                // the server (e.g. settings changed on another device), relay to all iframes.
                if (data.type === 'SOCKET_EVENT' && data.event === 'settings_updated') {
                    const settingsPayload = data.payload || data.data || {};
                    if (window.AppSettings && typeof window.AppSettings.merge === 'function') {
                        window.AppSettings.merge(settingsPayload, { skipBroadcast: true, source: 'parent-socket-relay' });
                    }
                    // See comment above the other dispatchEventToModules('SETTINGS_UPDATED', ...)
                    // call: settings is sent both nested and flat so every consumer shape
                    // across the module iframes picks it up.
                    dispatchEventToModules({ type: 'SETTINGS_UPDATED', payload: { settings: settingsPayload, timestamp: Date.now() }, settings: settingsPayload, originalSource: 'socket' });
                    emitGlobalAppEvent('SETTINGS_UPDATED', { settings: settingsPayload, source: 'socket', timestamp: Date.now() }, { async: true });
                }

                // ── FIX (IDENTITY-CENTRALIZATION): profile/avatar/cover/username/bio
                // update relay — same shape as the settings_updated relay above.
                // This is what makes "edit avatar -> every module updates instantly"
                // actually true: the parent shell is the one place that can reach
                // every module iframe (messages, friends, groups, calls, status,
                // marketplace, search, notifications), so it re-broadcasts whatever
                // the realtime socket relayed up to it.
                if (data.type === 'SOCKET_EVENT' && ['profile:update', 'avatar:update', 'cover:update', 'username:update', 'bio:update', 'displayName:update', 'privacy:update'].includes(data.event)) {
                    const identityPayload = data.payload || {};
                    try { if (window.Identity && typeof window.Identity.applyUpdate === 'function') window.Identity.applyUpdate(identityPayload); } catch (_) {}
                    dispatchEventToModules({ type: 'IDENTITY_UPDATED', payload: identityPayload, event: data.event, originalSource: 'socket' });
                    emitGlobalAppEvent('IDENTITY_UPDATED', { identity: identityPayload, event: data.event, source: 'socket', timestamp: Date.now() }, { async: true });
                }

                // ✅ ROOT-FIX: ADD_REACTION — previously silently dropped.
                // messages-core safeSend('ADD_REACTION') posts to this parent,
                // but there was no handler → reaction never reached API or DB,
                // never broadcast to receiver, only updated local memory.
                if (data.type === 'ADD_REACTION') {
                    (async () => {
                        const p = data.payload || data;
                        const msgId = p.messageId;
                        const emoji = p.emoji;
                        if (!msgId || !emoji) return;
                        let token = cachedToken;
                        if (!token) {
                            try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('necpa_token') || localStorage.getItem('accessToken'); } catch(e) {}
                        }
                        try {
                            const resp = await fetch(`/api/messages/${msgId}/react`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
                                body: JSON.stringify({ emoji, add: p.add !== false })
                            });
                            const result = await resp.json().catch(() => ({}));
                            // Echo the confirmed reactions back to messages iframe so sender sees own reaction
                            if (result.success && result.data) {
                                const msgIframe = document.getElementById('messagesIframe');
                                if (msgIframe && msgIframe.contentWindow) {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'REACTION_UPDATED',
                                        payload: { messageId: msgId, reactions: result.data.reactions, emoji, action: result.data.action }
                                    }, '*');
                                }
                            }
                        } catch(e) { console.warn('[chat.html] ADD_REACTION api error:', e); }
                    })();
                    return;
                }

                // ✅ ROOT-FIX: FORWARD_MESSAGE — also silently dropped before.
                if (data.type === 'FORWARD_MESSAGE') {
                    (async () => {
                        const p = data.payload || data;
                        const { messageId, targetConversationIds } = p;
                        if (!messageId || !targetConversationIds || !targetConversationIds.length) return;
                        let token = cachedToken;
                        if (!token) {
                            try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('necpa_token') || localStorage.getItem('accessToken'); } catch(e) {}
                        }
                        try {
                            await fetch(`/api/messages/${messageId}/forward`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
                                body: JSON.stringify({ targetConversationIds })
                            });
                        } catch(e) { console.warn('[chat.html] FORWARD_MESSAGE api error:', e); }
                    })();
                    return;
                }

                // STORAGE PROXY HANDLERS
                if (data.type === 'STORAGE_GET') {
                    let storedValue = null;
                    try { storedValue = localStorage.getItem(data.key); } catch(e) {}
                    try {
                        event.source.postMessage({ type: 'STORAGE_RESULT', requestId: data.requestId, value: storedValue, error: null }, '*');
                    } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_SET') {
                    try { if (data.key && data.value !== undefined) localStorage.setItem(data.key, data.value); } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_REMOVE') {
                    try { if (data.key) localStorage.removeItem(data.key); } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_CLEAR') {
                    try {
                        const prefix = data.prefix || 'knecta_';
                        const keysToRemove = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const k = localStorage.key(i);
                            if (k && k.startsWith(prefix)) keysToRemove.push(k);
                        }
                        keysToRemove.forEach(k => localStorage.removeItem(k));
                    } catch(e) {}
                    return;
                }

                // FILE UPLOAD PROXY
                if (data.type === 'FILE_UPLOAD') {
                    const { requestId, fileName, fileType, fileSize, base64Data } = data;
                    const replySource = event.source;
                    const sendResult = (payload) => {
                        try { if (replySource && replySource.postMessage) replySource.postMessage({ type: 'FILE_UPLOAD_RESULT', requestId, ...payload }, '*'); } catch(e) {}
                    };
                    try {
                        const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                        let token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('necpa_token') || localStorage.getItem('accessToken');
                        const [meta, b64] = base64Data.split(',');
                        const mime = (meta.match(/:(.*?);/) || [])[1] || fileType || 'application/octet-stream';
                        const binary = atob(b64);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes], { type: mime });
                        const formData = new FormData();
                        formData.append('file', blob, fileName || 'upload');
                        formData.append('type', mime.split('/')[0]);
                        const headers = {};
                        if (token) headers['Authorization'] = 'Bearer ' + token;
                        const uploadRes = await fetch(baseUrl + '/upload', { method: 'POST', headers, body: formData, credentials: 'include' });
                        if (uploadRes.ok) {
                            const json = await uploadRes.json().catch(() => ({}));
                            const url = json.url || json.data?.url || json.fileUrl || json.mediaUrl;
                            if (url) { sendResult({ url, success: true }); return; }
                        }
                        sendResult({ error: 'Upload failed', success: false });
                    } catch(uploadErr) {
                        sendResult({ error: uploadErr.message || 'Upload failed', success: false });
                    }
                    return;
                }

                // PHASE14 FIX: Relay typing indicators from messages-core iframe to socket
                // messages-core sends START_TYPING/STOP_TYPING via postMessage but chat.html
                // was silently dropping them — typing indicators never reached the server/recipients
                if (data.type === 'START_TYPING' || data.type === 'STOP_TYPING') {
                    try {
                        const chatId = data.payload?.conversationId || data.payload?.chatId || data.conversationId || data.chatId;
                        if (chatId) {
                            const wsRef = window.wsService || window.KynectaRealtime;
                            if (wsRef && typeof wsRef.emit === 'function') {
                                wsRef.emit(data.type === 'START_TYPING' ? 'typing:start' : 'typing:stop', { chatId });
                            } else if (window.KynectaRealtime?._socket?.connected) {
                                window.KynectaRealtime._socket.emit(
                                    data.type === 'START_TYPING' ? 'typing:start' : 'typing:stop',
                                    { chatId }
                                );
                            }
                        }
                    } catch (_) {}
                    return;
                }

                // PHASE14 FIX: Relay MARK_AS_READ from messages-core to socket for real-time read receipts
                if (data.type === 'MARK_AS_READ' || data.type === 'mark_as_read') {
                    try {
                        const chatId = data.payload?.chatId || data.chatId;
                        const messageIds = data.payload?.messageIds || data.messageIds || [];
                        const wsRef = window.KynectaRealtime?._socket;
                        if (wsRef?.connected && chatId) {
                            wsRef.emit('mark_as_read', { chatId, messageIds });
                        }
                    } catch (_) {}
                    return;
                }

                // API REQUEST HANDLER
                if (data.type === 'API_REQUEST') {
                    let endpoint = data.payload?.endpoint || data.endpoint;
                    if (!endpoint) return;
                    if (endpointMappings[endpoint]) endpoint = endpointMappings[endpoint];
                    if (endpoint.startsWith('/api/')) endpoint = endpoint.substring(4);
                    if (!endpoint.startsWith('/')) endpoint = '/' + endpoint;

                    const requestId = data.payload?.requestId || data.requestId;
                    const method = data.payload?.method || data.method || 'GET';
                    const body = data.payload?.body || data.payload?.data || data.body || data.data || null;
                    const params = data.payload?.params || data.params || null;
                    
                    let token = data.payload?.token || cachedToken;
                    if (!token) {
                        try {
                            const freshSession = getSessionData();
                            token = freshSession?.token || null;
                            if (token && !cachedToken) { cachedToken = token; cachedUserId = freshSession.userId; cachedUser = freshSession.user; }
                        } catch(e) {}
                    }
                    if (!token) {
                        try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('necpa_token') || localStorage.getItem('accessToken'); } catch(e) {}
                    }

                    try {
                        const cachedApiFallback = getCachedApiFallback(endpoint);
                        if (cachedApiFallback) {
                            if (event.source && event.source.postMessage) {
                                event.source.postMessage({
                                    type: 'API_RESPONSE',
                                    requestId: requestId,
                                    payload: { success: true, data: cachedApiFallback, statusCode: 200, fallback: true, local: true },
                                    timestamp: new Date().toISOString()
                                }, '*');
                            }
                            return;
                        }
                        // FIX: navigator.onLine can report false when local sync engines
                        // broadcast a "network lost" event (e.g. realtime socket timeout).
                        // We do a fast fetch probe to confirm real connectivity before skipping.
                        // If the probe fails we return the offline payload; if it succeeds we proceed.
                        const __isReallyOffline = async () => {
                            if (navigator.onLine === false) {
                                // Double-check with a tiny HEAD probe to our own server
                                try {
                                    await fetch('/favicon.ico', { method: 'HEAD', cache: 'no-store', signal: AbortSignal.timeout(2000) });
                                    return false; // fetch succeeded — we are online
                                } catch(_) {
                                    return true;
                                }
                            }
                            return false;
                        };
                        if (await __isReallyOffline()) {
                            const offlinePayload = {
                                success: false,
                                error: 'Offline - skipping API',
                                statusCode: 0,
                                offline: true,
                                data: endpoint.startsWith('/status') ? { statuses: [], highlights: [] } : null
                            };
                            if (event.source && event.source.postMessage) {
                                event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: offlinePayload, timestamp: new Date().toISOString() }, '*');
                            }
                            return;
                        }
                        let responsePayload;
                        const preferDirectApi = shouldPreferDirectApi(endpoint, method);
                        if (!preferDirectApi && window.api?.request?.request) {
                            // FIX: correct arg order — coreFetch signature is (url, options), not (method, url, options)
                            const apiResult = await window.api.request.request(endpoint, {
                                method,
                                data: body,
                                params,
                                token,
                                headers: token ? { Authorization: `Bearer ${token}` } : {}
                            });

                            responsePayload = {
                                success: apiResult?.ok !== false && apiResult?.success !== false,
                                data: apiResult?.data ?? null,
                                error: apiResult?.error || null,
                                statusCode: apiResult?.status || apiResult?.statusCode || 200,
                                offline: !!apiResult?.offline,
                                fallback: !!apiResult?.fallback,
                                cached: !!apiResult?.cached
                            };
                        }
                        // FIX: when window.api.request.request is unavailable responsePayload stays
                        // undefined — shouldRetryDirectApi returns false for undefined, so
                        // directApiRequest was never called and postMessage fired with payload:undefined.
                        // Guard with responsePayload === undefined so we always fall through to the direct fetch.
                        if (preferDirectApi || responsePayload === undefined || shouldRetryDirectApi(endpoint, responsePayload)) {
                            responsePayload = await directApiRequest(endpoint, method, body, params, token);
                        }
                        if (event.source && event.source.postMessage) event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: responsePayload, timestamp: new Date().toISOString() }, '*');

                        // ── FIX: Emit new_message via Socket.IO after successful message POST ──
                        // This ensures the backend broadcasts to the recipient via Socket.IO
                        // rather than relying only on the HTTP response. The queue was showing
                        // "sent successfully" with no ACK because the socket event was never emitted.
                        if (responsePayload && responsePayload.success !== false &&
                            method === 'POST' && endpoint && endpoint.match(/\/messages$|\/messages\//) &&
                            responsePayload.data) {
                            try {
                                const _msgData = responsePayload.data.message || responsePayload.data;
                                const _rtSocket = window.KynectaRealtime && window.KynectaRealtime._socket;
                                if (_rtSocket && _rtSocket.connected && _msgData && _msgData.id) {
                                    _rtSocket.emit('message:ack', {
                                        messageId: _msgData.id,
                                        chatId: _msgData.chatId || _msgData.conversationId,
                                        status: 'delivered',
                                        timestamp: Date.now()
                                    });
                                }
                            } catch(_ackErr) {}
                        }
                    } catch (error) {
                        if (event.source && event.source.postMessage) event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: { success: false, error: error.message || 'Network request failed', statusCode: 0, data: null }, timestamp: new Date().toISOString() }, '*');
                    }
                }

                // MODULE SWITCHING
                if (data.type === 'SWITCH_MODULE') {
                    navigateToPage(data.module);
                    
                    // ✅ FIXED: Handle chat opening for messages module from friends/calls
                    if (data.module === 'messages' && data.payload) {
                        const payload = data.payload;
                        
                        if (payload.userId || payload.userName || payload.conversationId) {
                            // ✅ FIXED: Regular navigation from friends/calls - open chat with user
                            // FIX (notification-click-drops-target): this previously always
                            // dropped conversationId/messageId even when the caller supplied
                            // them (e.g. a DM notification click already knows exactly which
                            // chat/message to jump to) — forwarding them through now instead
                            // of forcing every SWITCH_MODULE-based open through a fresh
                            // by-userId lookup.
                            const chatPayload = {
                                userId: payload.userId,
                                userName: payload.userName || null,
                                avatar: payload.avatar || null,
                                conversationId: payload.conversationId || null,
                                messageId: payload.messageId || null,
                                findExisting: true, // Continue existing chat if available
                                timestamp: Date.now(),
                                source: payload.source || 'parent-frame'
                            };
                            
                            sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                            _veilMessagesUntilChatOpen();
                            document.body.classList.add('chat-panel-active'); /* FIX: was gated to mobile-only (window.innerWidth<=768), so desktop never got this flag and the header/avatar/call/video/more icons never fully activated on wide screens for these code paths. Now applied on all widths, matching group-panel-active. */
                            
                            // Retry until iframe ACKs
                            let _chatAttempts = 0;
                            const _postChatOpen = () => {
                                const msgIframe = document.getElementById('messagesIframe');
                                if (msgIframe && msgIframe.contentWindow) {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: chatPayload,
                                        source: 'parent-frame'
                                    }, '*');
                                }
                                if (_chatAttempts++ < 12) {
                                    setTimeout(() => { if (sessionStorage.getItem('pending_chat')) _postChatOpen(); }, 600);
                                }
                            };
                            // FIX: fire the first attempt immediately (see veil comment above)
                            // instead of waiting 400ms before even trying.
                            _postChatOpen();
                        }
                    }
                    // FIX (GROUP-CLICK-NOT-OPENING): navigateToPage(data.module) above only
                    // ever switches the visible module container — it never opens a specific
                    // group. Every sender of a groups SWITCH_MODULE (e.g. the Messages
                    // module's embedded group sidebar in group-message-isolation.js) also
                    // includes payload.groupId expecting the exact group to open, the same
                    // way the 'messages' branch above opens a specific chat. That never
                    // happened for groups, so clicking a group from anywhere outside
                    // group.html itself just showed the bare group list. Mirrors the
                    // messages module's retry-until-open pattern, using the group iframe's
                    // GROUP_PANEL_OPEN ack (posted by group.html's openGroup()) instead of
                    // messagesIframe's CHAT_OPENED.
                    if (data.module === 'group' && data.payload?.groupId) {
                        const _gid = data.payload.groupId;
                        let _gAcked = false;
                        let _gAttempts = 0;
                        const _postG = () => {
                            if (_gAcked) return;
                            const gIframe = document.getElementById('groupIframe');
                            if (gIframe && gIframe.contentWindow) {
                                gIframe.contentWindow.postMessage({ type: 'OPEN_GROUP_BY_ID', payload: { groupId: _gid }, source: 'parent-frame' }, '*');
                            }
                            if (_gAttempts++ < 12) setTimeout(_postG, 500);
                        };
                        window.addEventListener('message', function _gAckListener(gackEvt) {
                            if (gackEvt.data && gackEvt.data.type === 'GROUP_PANEL_OPEN' &&
                                String(gackEvt.data.payload && gackEvt.data.payload.id) === String(_gid)) {
                                _gAcked = true;
                                window.removeEventListener('message', _gAckListener);
                            }
                        });
                        _postG();
                    }
                }

                // FIX (GROUP-CLICK-NOT-OPENING, direct path): some callers post a bare
                // 'OPEN_GROUP_BY_ID' message straight to the parent (not wrapped in
                // SWITCH_MODULE) expecting it to reach group.html the same way
                // 'OPEN_CHAT_WITH_USER' reaches messagesIframe. Nothing here relayed it,
                // so that request silently went nowhere. Forward it straight into the
                // group iframe; also make sure the Group module is actually visible,
                // since a deep-link/notification click may arrive before the user has
                // ever opened the Groups tab this session.
                if (data.type === 'OPEN_GROUP_BY_ID' && data.payload?.groupId) {
                    try { navigateToPage('group'); } catch (_) {}
                    const gIframe = document.getElementById('groupIframe');
                    if (gIframe && gIframe.contentWindow) {
                        gIframe.contentWindow.postMessage({ type: 'OPEN_GROUP_BY_ID', payload: data.payload, source: 'parent-frame' }, '*');
                    }
                }

                if (data.type === 'DIRECT_CHAT_REQUEST') {
                    const chatPayload = {
                        userId:       data.payload.userId,
                        userName:     data.payload.userName || data.payload.name || null,
                        findExisting: true,
                        timestamp: Date.now()
                    };
                    _veilMessagesUntilChatOpen();
                    navigateToPage('messages');
                    // FIX-HEADER-ICON-CONFLICT: navigateToPage('messages') only shows the
                    // chat LIST — it deliberately never sets chat-panel-active on its own
                    // (see the comment on that flag inside navigateToPage). Every other
                    // code path that opens one specific chat sets this flag right after
                    // navigating; this path was missing it, so #globalHeader (the sidebar's
                    // own header) stayed visible instead of message.html's chat header,
                    // making it look like the sidebar's icons had leaked into the chat panel.
                    document.body.classList.add('chat-panel-active');
                    
                    // Fix infinite loop - use proper counter and acknowledgment
                    if (!window.__dcAttempts) window.__dcAttempts = 0;
                    if (!window.__dcChatOpened) window.__dcChatOpened = false;
                    
                    const _postChatOpen = () => {
                        if (window.__dcChatOpened) {
                            window.__dcAttempts = 0; // Reset counter on success
                            return; // ACK received — stop
                        }
                        
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            messagesIframe.contentWindow.postMessage({
                                type:    'OPEN_CHAT_WITH_USER',
                                payload: chatPayload,
                                source:  'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            _chatLog('[chat.html] DIRECT_CHAT_REQUEST → OPEN_CHAT_WITH_USER sent, attempt', window.__dcAttempts + 1);
                        }
                        
                        if (window.__dcAttempts++ < 3) { // Reduced from 12 to 3 attempts
                            setTimeout(_postChatOpen, 600);
                        } else {
                            console.warn('[chat.html] DIRECT_CHAT_REQUEST failed after 3 attempts, stopping to prevent infinite loop');
                            window.__dcAttempts = 0; // Reset counter
                        }
                    };
                    
                    // Reset state before starting new request
                    window.__dcChatOpened = false;
                    window.__dcAttempts = 0;
                    // FIX: fire immediately — was delayed 300ms before the first
                    // attempt, widening the visible list-flash window for no benefit.
                    _postChatOpen();
                }

                // ROOT-CAUSE FIX (Phase 18 canonical-pipeline audit — Status module):
                // status.html's viewer-bubble "Chat" button (window.openChatWith) posts a raw
                // { type: 'OPEN_CHAT_WITH_USER', payload: { userId } } directly to window.parent
                // (this shell). Unlike Friend module (which also sends a SWITCH_MODULE message
                // that this shell already handles) or Calls module (which sends
                // DIRECT_CHAT_REQUEST), Status module has never sent anything else — and this
                // shell had NO listener for a bare OPEN_CHAT_WITH_USER arriving directly from a
                // child iframe (the shell only ever *sends* that type down to messagesIframe).
                // The message was silently dropped: chat.html never navigated to the messages
                // page and never relayed anything into messagesIframe, so "Chat" from Status
                // did nothing. Only Chat History (same-iframe, real conversationId) worked.
                // Route this the same way DIRECT_CHAT_REQUEST is handled: navigate to the
                // messages page, flag chat-panel-active, and relay into messagesIframe with a
                // short retry loop (message.html's own 2s dedup already protects against this
                // ever double-opening alongside some other relay path for the same user).
                if (data.type === 'OPEN_CHAT_WITH_USER' && event.source !== window &&
                    (!document.getElementById('messagesIframe') || event.source !== document.getElementById('messagesIframe').contentWindow)) {

                            findExisting: _ocwuPayload.findExisting !== false,
                            timestamp: Date.now()

                        navigateToPage('messages');

                        window.__ocwuChatOpened = false;
                        window.__ocwuAttempts = 0;

                        const _postOcwuOpen = () => {
                            if (window.__ocwuChatOpened) { window.__ocwuAttempts = 0; return; }
                            const messagesIframe = document.getElementById('messagesIframe');
                            if (messagesIframe && messagesIframe.contentWindow) {

                                    type: 'OPEN_CHAT_WITH_USER',
                                    payload: chatPayload,
                                    source: 'parent-frame',
                                    timestamp: Date.now()

                            }

                            }
                        };

                        // waiting 300ms before the first attempt.

                    }
                }

                // FIX-MSG-DELIVERY-ACK-RELAY: message.html (messagesIframe) keeps its own
                // independent socket connection, which can be momentarily disconnected or
                // still reconnecting when a message arrives — silently no-op'ing the direct
                // 'message:delivery_ack' emit. messages-core.ui-bridge.js already posts this
                // fallback up to us as a safety net (see FIX-ACK-SILENT-FAIL there), but until
                // now nothing here ever listened for it, so the sender's 10s delivery timeout
                // fired anyway even though the receiver had the message. Same root cause and
                // same fix pattern as the other relays: relay it out through the one
                // real, always-on socket connection, which lives here in chat.html.
                if (data.type === 'message:client_delivery_ack') {
                    const p = data.payload || {};

                // ── STATUS_REPLY_RECEIVED / OPEN_CHAT ─────────────────────────────────────

                // ROOT-CAUSE FIX (Phase 18 canonical-pipeline audit — marketplace double-fire):
                // this block used to match any OPEN_CHAT regardless of payload, including the
                // marketplace product-inquiry variant (data.payload.product_id present). Because
                // it ran first and fired its own relay into messagesIframe WITHOUT productId or
                // the pre-filled inquiry message, message.html's 2s open-chat dedup (keyed by
                // userId) then silently swallowed the marketplace-specific handler's relay
                // (further below, ~400ms later) that actually carried productId/message — so
                // "Message Seller" from a product page always opened a bare chat with no product

                // bridge handler below as the only one that runs for that case.
                if ((data.type === 'OPEN_CHAT' && !data.payload?.product_id) || data.type === 'STATUS_REPLY_RECEIVED') {
                    const p = data.payload || {};

                        userId:       targetUserId,
                        chatId:       targetChatId,

                        statusReply:  true,
                        timestamp:    Date.now(),

                    _veilMessagesUntilChatOpen();
                    navigateToPage('messages');
                    // FIX-HEADER-ICON-CONFLICT: see identical fix/comment on the
                    // DIRECT_CHAT_REQUEST handler above — this path opens one specific
                    // chat too, so it needs the same explicit chat-panel-active flag.
                    document.body.classList.add('chat-panel-active');

                                type:    'OPEN_CHAT_WITH_USER',

                                timestamp: Date.now(),
                            }, '*');

                    // FIX: fire immediately (see veil comment above) instead of
                    // waiting 300ms before the first attempt.

                }

                // immediately from the server-confirmed reactions object
                if (data.type === 'REACTION_UPDATED') {

                    if (Array.isArray(incoming) && incoming.length > 0) {

                        // Without this, int id=5 and string id="5" both survive as separate
                        // entries, making every friend appear twice in all modules.
                        const seen = new Set();
                        cachedFriendsList = incoming.filter(f => {
                            if (!f || !f.id) return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);

                        });

                    }
                }

                // FIX: Also handle FRIENDS_SYNC — emitted by friend-core's syncToGlobals debounce.
                // This covers the instant cross-module sync path on every friend state change.
                if (data.type === 'FRIENDS_SYNC') {
                    const incoming = data.friends || [];
                    if (Array.isArray(incoming) && incoming.length > 0) {
                        const seen = new Set();
                        cachedFriendsList = incoming.filter(f => {
                            if (!f || !f.id) return false;
                            const k = String(f.id);
                            if (seen.has(k)) return false;
                            seen.add(k);
                            return true;
                        });
                        broadcastFriendsToAllModules(cachedFriendsList);

                // FIX: Handle FRIEND_RELATIONSHIP_CHANGED for immediate cross-module status update
                if (data.type === 'FRIEND_RELATIONSHIP_CHANGED') {

                    if (action === 'accepted' && friendId && friend) {
                        // Upsert this friend into the cached list
                        const idx = cachedFriendsList.findIndex(f => String(f.id) === String(friendId));
                        if (idx >= 0) cachedFriendsList[idx] = { ...cachedFriendsList[idx], ...friend };
                        else cachedFriendsList.push(friend);
                        broadcastFriendsToAllModules(cachedFriendsList);
                    } else if (action === 'removed' && friendId) {
                        cachedFriendsList = cachedFriendsList.filter(f => String(f.id) !== String(friendId));
                        broadcastFriendsToAllModules(cachedFriendsList);

                    dispatchEventToModules({ type: 'FRIEND_RELATIONSHIP_CHANGED', payload: data, source: 'parent' });

                if (data.type === 'FETCH_LISTINGS') {

                    const limit = data.payload?.limit || 20;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    if (!token) { try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('necpa_token') || localStorage.getItem('accessToken'); } catch(e) {} }
                    if (!token) { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*'); return; }
                    fetch(`${baseUrl}/marketplace/listings?page=${page}&limit=${limit}`, { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, credentials: 'include' })
                        .then(r => r.json())
                        .then(responseData => { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: responseData.data || { listings: [], total: 0 } } }, '*'); })
                        .catch(() => { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*'); });

                const _mpEvTypes = new Set([

                        userId:    data.payload.userId || data.payload.seller_id,
                        userName:  data.payload.userName || data.payload.seller_name || 'Seller',
                        message:   data.payload.message || '',
                        productId: data.payload.product_id,

                    (function() {

                        }

                // ── END MARKETPLACE BRIDGE ────────────────────────────────────────────
            });

            // ======================================================================
            // WEBSOCKET EVENT LISTENERS WITH SOURCE: 'ws-bridge'
            // ── Bound once; re-bound if KynectaRealtime initialises late ────────
            // ======================================================================
        const _chatLog = (...a) => { if (window.__CHAT_DEBUG__) console.log(...a); };
            var _wsRealtimeListenersBound = false;
            function _bindWsRealtimeListeners() {

                        setTimeout(_bindWsRealtimeListeners, 150);
                    } else {
                        console.warn('[Parent] wsService never became available — realtime notifications may not work');
                    }
                    return;
                }
                _wsRealtimeListenersBound = true;
                window._wsBindRetryCount = 0;

                // ── REAL-TIME MESSAGE BRIDGE ──────────────────────────────────
                // Forward incoming chat messages from WebSocket to the messages iframe.
                // This is what makes the receiver's screen update instantly without polling.
                // Tracks which socket event triggered _fwdNewMessage so echo prevention
                // can be skipped for recipient-only events (receive_message / message:received).
                let _fwdNewMessageSourceEvent = null;
                // ── RECEIVER FIX: Queue messages that arrive before the iframe is ready ──
                // Without this, messages sent to the receiver while messagesIframe is still
                // loading are silently dropped — the receiver never sees them.

                var _msgQueueFlushing = false;
                function _flushMsgQueue() {
                    if (_msgQueueFlushing) return;
                    _msgQueueFlushing = true;
                    var q = _msgQueue.splice(0);
                    q.forEach(function(item) {
                        _fwdNewMessageSourceEvent = item.src;
                        _fwdNewMessage(item.payload);
                    });
                    _msgQueueFlushing = false;
                }
                // Flush queue whenever messagesIframe posts its ready signal
                window.addEventListener('message', function(ev) {
                    if (ev.data && (ev.data.type === 'MESSAGES_IFRAME_READY' || ev.data.type === 'FRAME_READY') && _msgQueue.length > 0) {
                        setTimeout(_flushMsgQueue, 80);
                    }
                });
                function _fwdNewMessage(payload) {
                    const msgIframe = document.getElementById('messagesIframe');
                    if (!msgIframe || !msgIframe.contentWindow) {
                        // Queue for delivery once iframe is ready, retry every 400ms up to 10s
                        if (!_msgQueueFlushing) {
                            _msgQueue.push({ payload: payload, src: _fwdNewMessageSourceEvent });
                            var _qRetries = 0;
                            var _qTimer = setInterval(function() {
                                _qRetries++;
                                var fi = document.getElementById('messagesIframe');
                                if (fi && fi.contentWindow) { clearInterval(_qTimer); _flushMsgQueue(); }
                                else if (_qRetries > 25) clearInterval(_qTimer); // give up after 10s
                            }, 400);

                        return;
                    }

                    if (!_isRecipientEvent) {
                        const _wsPayloadSenderId = payload && (payload.senderId || (payload.sender && payload.sender.id));

                        if (_wsPayloadSenderId && _wsCurrentUserId &&
                            String(_wsPayloadSenderId) === _wsCurrentUserId) {

                            // (optimistic echo) OR its serverId is in our sent-ids track list.
                            // Without this, any message FROM us to ourselves is wrongly suppressed
                            // even on the receiver side — and server echoes without localId pass through.
                            const _sid = payload.id || payload.serverId;
                            const _hasLocalMarker = !!(payload.localId || payload.requestId);
                            const _alreadySent = _sid && (function() {
                                try {
                                    return JSON.parse(localStorage.getItem('kynecta_sent_ids_v8') || '[]').includes(String(_sid));
                                } catch(_) { return false; }
                            })();
                            if (_hasLocalMarker || _alreadySent) {
                                // It's our own echo — only forward a status confirmation
                                msgIframe.contentWindow.postMessage({
                                    type: 'message:sent',
                                    payload: {
                                        localId:   payload.localId   || null,
                                        serverId:  payload.id        || payload.serverId || null,
                                        messageId: payload.id        || payload.localId  || null,
                                        status:    payload.status    || 'sent'
                                    },
                                    source: 'ws-bridge'
                                }, '*');
                                _fwdNewMessageSourceEvent = null;
                                return;
                            }
                            // No local marker and not in sent list — could be a message from another
                            // device/tab or a race condition. Forward it so receiver always sees it.
                        }
                    }
                    _fwdNewMessageSourceEvent = null;

                    // FIXED: Enrich payload — ensure chatId is always present.
                    const _enriched = { ...payload };
                    // HARD IDENTITY BOUNDARY: group messages belong only to the group
                    // surface. Never forward a group payload into message.html, where
                    // it can be resolved as a 1:1 conversation and appear duplicated.
                    const _isGroupMessage = String(_enriched.chatType || '').toLowerCase() === 'group'
                        || _enriched.isGroup === true
                        || !!_enriched.groupId;
                    if (_isGroupMessage) {
                        return;
                    }
                    if (!_enriched.chatId && _enriched.conversationId) _enriched.chatId = _enriched.conversationId;
                    if (!_enriched.chatId && _enriched.chat_id)        _enriched.chatId = _enriched.chat_id;
                    if (!_enriched.chatId && _enriched.roomId)         _enriched.chatId = _enriched.roomId;

                    msgIframe.contentWindow.postMessage({ type: 'message:new', payload: _enriched, source: 'ws-bridge' }, '*');
                    // FIX-ROOT-CAUSE-MESSAGE-DELIVERY-BYPASSES-READY-QUEUE: the raw
                    // postMessage above is left in place as one of the redundant
                    // paths, but it silently does nothing if messagesIframe hasn't
                    // attached its listener yet (mid-load/navigation). Route the
                    // same payload through _postToModule as well, which checks
                    // _iframeReady and queues-for-flush-on-CHILD_READY when it's
                    // not — so a message arriving during that window is delivered
                    // once the iframe finishes loading instead of being lost.
                    try {
                        if (window.__kynPostToModule) {
                            window.__kynPostToModule('messages', 'messagesIframe', { type: 'message:new', payload: _enriched, source: 'ws-bridge' });
                        }
                    } catch (_) {}
                    // Mark this delivery in the shared gate too, so the other
                    // 4 relay paths (2 in app.realtime.socket.js, 1 in
                    // phase15.delivery.patch.js, plus this file's own second
                    // call-site below) treat it as already delivered.
                    try {
                        if (window.__kynRelayMessageOnce) window.__kynRelayMessageOnce(null, 'message:new', { chatId: _enriched.chatId, id: _enriched.id, serverId: _enriched.serverId, localId: _enriched.localId, _broadcastId: _enriched._broadcastId });
                    } catch (_) {}

                    const _cid = _enriched.chatId;
                    if (_cid) {

                            type: 'CONVERSATION_UPDATED',
                            payload: { chatId: _cid, lastMessage: _enriched.content, lastMessageAt: _enriched.createdAt || Date.now() },
                            source: 'ws-bridge'
                        }, '*');
                    }
                }
                function _fwdMessageDelivered(payload) {
                    const msgIframe = document.getElementById('messagesIframe');
                    if (msgIframe && msgIframe.contentWindow) {
                        msgIframe.contentWindow.postMessage({ type: 'message:delivered', payload: payload, source: 'ws-bridge' }, '*');
                        msgIframe.contentWindow.postMessage({ type: 'message_delivered', payload: payload, source: 'ws-bridge' }, '*');
                    }
                }
                function _fwdMessageRead(payload) {
                    const msgIframe = document.getElementById('messagesIframe');
                    if (msgIframe && msgIframe.contentWindow) {
                        msgIframe.contentWindow.postMessage({ type: 'message:read', payload: payload, source: 'ws-bridge' }, '*');
                        msgIframe.contentWindow.postMessage({ type: 'message_read', payload: payload, source: 'ws-bridge' }, '*');
                    }
                }
                function _fwdPresence(payload) {
                    const msgIframe = document.getElementById('messagesIframe');
                    if (msgIframe && msgIframe.contentWindow) {
                        msgIframe.contentWindow.postMessage({ type: payload.online ? 'FRIEND_ONLINE' : 'FRIEND_OFFLINE', payload: payload, source: 'ws-bridge' }, '*');
                    }
                }

                // ✅ FIX 8: Forward message:sent so sender's optimistic tick updates
                function _fwdMessageSent(payload) {
                    const msgIframe = document.getElementById('messagesIframe');
                    if (msgIframe && msgIframe.contentWindow) {
                        msgIframe.contentWindow.postMessage({ type: 'message:sent',     payload: payload, source: 'ws-bridge' }, '*');
                        msgIframe.contentWindow.postMessage({ type: 'message_sent',     payload: payload, source: 'ws-bridge' }, '*');
                    }
                }

                // All naming conventions the backend might use
                // FIX (WSSERVICE-LEGACY-SHIM-NEVER-RECEIVES-EVENTS): window.wsService is
                // documented elsewhere in this codebase (messages-core.ui-bridge.js) as
                // "the legacy shim" — it is a real, separately-connected object, but it is
                // NOT the one that actually receives the server's pushed 'message:new'
                // events; window.KynectaRealtime is. Binding _fwdNewMessage (the ONLY
                // function that relays an incoming message into the messages iframe for
                // live rendering) exclusively to wsService means it silently never fires
                // for real incoming messages, even though wsService itself reports
                // connected — the message notification/badge machinery elsewhere in the
                // app binds directly to KynectaRealtime and works fine, which is why this
                // symptom looked like "notification appears but the message never renders
                // in the open chat panel" rather than a total connection failure. Bind to
                // BOTH: when wsService and KynectaRealtime happen to be the same object
                // (the intended/common case once the alias in _ensureWsService() above
                // succeeds) this registers once, since .on() below already de-dupes by
                // handler reference; when they differ, this ensures the relay is attached
                // to whichever one is actually live.
                const _msgEventTargets = [window.wsService, window.KynectaRealtime].filter(
                    (t, i, arr) => t && typeof t.on === 'function' && arr.indexOf(t) === i
                );
                _msgEventTargets.forEach(function(_t) {
                    _t.on('message:sent',       _fwdMessageSent);      // ✅ FIX 8
                    _t.on('message_sent',       _fwdMessageSent);      // ✅ FIX 8
                    _t.on('message:new',        _fwdNewMessage);
                    _t.on('new_message',        _fwdNewMessage);
                    _t.on('newMessage',         _fwdNewMessage);
                    _t.on('chat:message',       _fwdNewMessage);
                    // FIX: receive_message / message:received are sent ONLY to the recipient's
                    // user room by the backend. Without binding these the receiver NEVER sees
                    // the incoming message in their chat panel — the payload reaches the parent
                    // window but is silently dropped because no listener existed for it.
                    _t.on('receive_message',    function(p) { _fwdNewMessageSourceEvent = 'receive_message';  _fwdNewMessage(p); });

    <script>
/* ===================================================================
   GROUP HEADER CONTROLLER  v1.0  — injected into chat.html
   ===================================================================
   • Listens for GROUP_PANEL_OPEN  → activates group context in globalHeader
   • Listens for GROUP_PANEL_CLOSE → restores default header
   • Back / Call / Video / More buttons forwarded to group iframe
   • GROUP_DELETED → clear all group storage caches
      =================================================================== */
(function () {
'use strict';

function groupIframe() { return document.getElementById('groupIframe'); }
function postToGroup(type, payload) {
    var f = groupIframe();
    if (f && f.contentWindow)
        f.contentWindow.postMessage({ type: type, payload: payload || {}, source: 'parent-shell', timestamp: Date.now() }, '*');
}
// FIX (ReferenceError: postToGroup is not defined): postToGroup was only ever
// declared inside this IIFE's local closure, but other <script> blocks further
// down this same file (each one its own separate execution context — an IIFE
// in one script tag is invisible to another) call postToGroup directly, e.g.
// the group push-notification deep-link handler (kyn:openGroup). That call
// silently threw and was swallowed, so a group notification click never
// actually opened the group. Expose it on window so every later script block
// in this file can reuse the one real implementation instead of each needing
// its own copy (or reimplementing it against a stale/missing groupIframe).
window.postToGroup = postToGroup;

/* ── Show group context in globalHeader ─────────────────────── */
function showGroupHeader(g) {
    if (!g) return;
    // Store for PARENT_GROUP_CALL dispatch
    window.__gcCurrentGroup = g;
    var hdr   = document.getElementById('globalHeader');
    var ctx   = document.getElementById('headerGroupCtx');
    var name  = document.getElementById('hdrGroupName');
    var meta  = document.getElementById('hdrGroupMeta');
    var av    = document.getElementById('hdrGroupAvatar');
    var acts  = document.getElementById('headerActions');
    var prof  = document.getElementById('profileTrigger');

    if (name) name.textContent = g.name || 'Group';
    if (meta) meta.textContent = ((g.stats && g.stats.totalMembers) || g.memberCount || 0) + ' members';
    if (av) {
        var ii = (g.name || 'G').split(' ').map(function (w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
        av.textContent = ii;
    }
    if (hdr)  hdr.classList.add('group-chat-active');
    hdr && hdr.classList.remove('chat-active');
    if (acts) acts.classList.add('hidden');
    if (prof) prof.style.visibility = 'hidden';
    window.__groupHeaderShown = true;
}

/* ── Restore default header ─────────────────────────────────── */
function hideGroupHeader() {
    var hdr  = document.getElementById('globalHeader');
    var menu = document.getElementById('hdrGroupMenu');
    var acts = document.getElementById('headerActions');
    var prof = document.getElementById('profileTrigger');

    if (hdr)  hdr.classList.remove('group-chat-active');
    if (menu) menu.style.display = 'none';
    if (prof) prof.style.visibility = '';
    window.__groupHeaderShown = false;

    var page = window.__currentPage || 'messages';

    if (typeof updateHeaderActions === 'function') try { updateHeaderActions(page); } catch (e) {}

/* ── Wire header buttons (called once after DOM ready) ──────── */
function wireButtons() {
    /* Back */
    var back = document.getElementById('hdrGroupBack');
    if (back && !back._ghw) { back._ghw = true;
        back.addEventListener('click', function () {
            postToGroup('PARENT_GROUP_CLOSE', {});
            hideGroupHeader();
        });
    }
    /* Three-dots — opens the local dropdown menu that already sits right next
       to this button in the markup (#hdrGroupMenu). This used to call
       postToGroup('OPEN_GROUP_MORE_MENU', {}), which — like the call buttons
       above — went into the group iframe, which has no listener for it. The
       menu it claimed to open lives in THIS document, not the iframe. */
    var more = document.getElementById('hdrGroupMore');
    if (more && !more._ghw) { more._ghw = true;
        more.addEventListener('click', function (e) {
            e.stopPropagation();
            var menu = document.getElementById('hdrGroupMenu');
            if (!menu) return;
            var opening = menu.style.display !== 'block';

                // #headerGroupCtx's overflow:hidden box, which used to

                    (window.apiCore && window.apiCore.groups ? window.apiCore.groups.delete(grp.id) : Promise.reject(new Error('API unavailable')))

                        .catch(function (e) { alert(e.message || 'Failed to delete group'); });
                } else {
                    alert('That option isn\'t available yet.');
                }

    var av = document.getElementById('hdrGroupAvatar');
    if (av && !av._ghw) { av._ghw = true;
        av.addEventListener('click', function () { postToGroup('PARENT_GROUP_ACTION', { action: 'info' }); });

if (document.readyState === 'loading')

_chatLog('[GroupHdr] v1.0 loaded');
// Expose for cross-script access
window.__groupHdrShow = showGroupHeader;
window.__groupHdrHide = hideGroupHeader;
})();

            }
        }
        // Don't fight the group header if a group panel happens to be active
        if (hdr && !hdr.classList.contains('group-chat-active')) hdr.classList.add('chat-active');
        // FIX: belt-and-suspenders — also clear any inline style that might
        // be forcing this bar hidden from an older/unrelated code path, so
        // the CSS rule above is never fought by a leftover inline override.
        if (hdr) { hdr.style.removeProperty('opacity'); hdr.style.removeProperty('visibility'); hdr.style.removeProperty('display'); hdr.style.removeProperty('pointer-events'); }
        if (acts) acts.classList.add('hidden');
        if (prof) prof.style.visibility = 'hidden';
        window.__chatHeaderShown = true;
    }

    /* ── Restore default header ───────────────────────────────────── */
    function hideChatHeader() {
        var hdr  = document.getElementById('globalHeader');
        var prof = document.getElementById('profileTrigger');
        if (hdr)  hdr.classList.remove('chat-active');
        if (prof) prof.style.visibility = '';
        window.__chatHeaderShown = false;

        var page = window.__currentPage || 'messages';
        if (typeof updateHeaderContext === 'function') try { updateHeaderContext(page); } catch (e) {}
        if (typeof updateHeaderActions === 'function') try { updateHeaderActions(page); } catch (e) {}
    }

    /* ── Wire header buttons (called once after DOM ready) ─────────── */
    function wireButtons() {
        var back = document.getElementById('hdrChatBack');
        if (back && !back._chw) { back._chw = true;
            back.addEventListener('click', function () {
                remoteClickMessage('backBtn');
                hideChatHeader();
            });
        }
        var more = document.getElementById('hdrChatMore');
        if (more && !more._chw) { more._chw = true;
            more.addEventListener('click', function (e) {
                e.stopPropagation();
                remoteClickMessage('chatMoreBtn');
            });
        }
        var info = document.getElementById('hdrChatInfo');
        if (info && !info._chw) { info._chw = true;
            info.addEventListener('click', function () { remoteClickMessage('chatHeaderName'); });
        }
    }

    /* ── Listen for state broadcasts from the message iframe ───────── */
    // FIX-HEADER-ICON-REVERT: CHAT_PANEL_CLOSED used to call hideChatHeader()
    // synchronously and unconditionally the instant the message arrived.
    // message.html's broadcastState() (mutation observer + 1.5s poll) can
    // fire once right around the moment a chat panel opens or re-renders —
    // e.g. sampling chatPanel's classList a beat before 'hidden' is actually
    // removed, or a debounce window that resolves mid-transition — and send
    // a stale CLOSED for a panel that is, in fact, open and already showing
    // its own header (back/call/video/menu icons). Accepting that at face
    // value snapped the header straight back to the default page icon set
    // (the messages-list "history" icons: multi-send/new-chat), even though
    // the user was still inside the chat panel. Debounce it: delay applying
    // a close, and cancel the pending close if a CHAT_HEADER_UPDATE (proof
    // the panel is genuinely open) arrives in the meantime.
    var _chatHeaderCloseTimer = null;
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object') return;
        if (d.source === 'message-iframe') {
            if (d.type === 'CHAT_HEADER_UPDATE') {
                if (_chatHeaderCloseTimer) { clearTimeout(_chatHeaderCloseTimer); _chatHeaderCloseTimer = null; }
                if (window.__currentPage === 'messages') {
                    // FIX (BACK-STACK-EXACT-RESTORE): this now also arrives
                    // from message.html's MODULE_FOCUSED re-announcement
                    // when an already-open chat becomes visible again after
                    // the user backs out of a different module. Re-apply
                    // chat-panel-active here too (previously only CHAT_OPENED
                    // did), or the mirrored header would show correctly
                    // while the body class — and everything CSS keys off it
                    // (mobile nav bar, iframe layout) — stayed stuck in the
                    // "no chat open" state.
                    document.body.classList.add('chat-panel-active');
                    showChatHeader(d.payload || {});
                }
                return;
            }
            if (d.type === 'CHAT_PANEL_CLOSED') {
                if (_chatHeaderCloseTimer) clearTimeout(_chatHeaderCloseTimer);
                _chatHeaderCloseTimer = setTimeout(function () {
                    _chatHeaderCloseTimer = null;
                    hideChatHeader();
                }, 400);
                return;
            }
        }
    });

    if (document.readyState === 'loading')
        document.addEventListener('DOMContentLoaded', wireButtons);
    else
        setTimeout(wireButtons, 100);

    window.__chatHdrShow = showChatHeader;
    window.__chatHdrHide = hideChatHeader;
    // FIX-HEADER-ICON-REVERT: let other listeners (e.g. the CHAT_OPENED
    // handler in setupPanelDetection, earlier in this document) cancel a
    // pending debounced close the instant they know the panel just opened,
    // instead of waiting for the 400ms timer to expire on its own.
    window.__cancelChatHeaderClose = function () {
        if (_chatHeaderCloseTimer) { clearTimeout(_chatHeaderCloseTimer); _chatHeaderCloseTimer = null; }
    };
    })();
    </script>
    <script>
  // FIX-KEEPALIVE: 14 minutes left almost no margin against Render's
  // 15-minute idle-sleep window — a single slow tick (network hiccup, tab
  // throttled in background, a missed timer due to heavy main-thread work)
  // was enough to let the dyno sleep mid-session. When it slept, the live
  // Socket.IO connection died from under the user (the "transport close" /
  // "xhr poll error" reconnect storms), which is what broke real-time
  // delivery for calls, messages, and status until the dyno cold-started
  // back up tens of seconds later.
  //
  // Pinging every 4 minutes gives roughly 4x margin, so a few missed/slow
  // ticks in a row are needed before the dyno could ever go idle — and a
  // background-tab/throttled-timer slip (common on mobile) won't single-
  // handedly cause it anymore.
  function keepBackendAwake() {
    // FIX-KEEPALIVE-STALE-HOST: this was hardcoded to noxopa.onrender.com,
    // an old renamed backend host — it kept pinging a backend that isn't
    // the one actually serving this session (see window.__getApiBase /
    // config.js's "Runtime configuration loaded. Backend: ..." log for the
    // real host), so the ping was silently keeping the wrong dyno awake
    // and doing nothing for the real one. Use the same runtime-resolved
    // base every other API call in this file uses.
    const base = (window.__getApiBase ? window.__getApiBase() : null) || 'https://noxopa.onrender.com/api';
    fetch(base.replace(/\/$/, '') + '/health', {
      method: 'GET',
      cache: 'no-cache'
    })
    .then(r => _chatLog('[KeepAlive] Ping sent, status:', r.status))
    .catch(e => console.warn('[KeepAlive] Ping failed:', e.message));
  }

  // Ping immediately on load, then every 4 minutes.
  keepBackendAwake();
  setInterval(keepBackendAwake, 4 * 60 * 1000);

  // FIX-KEEPALIVE-2: also ping immediately whenever the tab regains
  // visibility/focus after being backgrounded — this is exactly the
  // scenario (phone screen off, tab switched away) where setInterval
  // timers get throttled or paused by the browser, letting the dyno sleep
  // even with a short interval configured.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      keepBackendAwake();
    }
  });
  window.addEventListener('focus', keepBackendAwake);
</script>

    <!-- FIX (VERIFIED-DEAD-EVENT: notification deep-link never opened a chat):
         js/push-init.js parses ?chatId=/?messageId= off this page's own URL
         (the URL a push-notification click deep-links to — see
         pushNotificationService.js's `url: /chat.html?chatId=${data.chatId}`)
         and dispatches window.dispatchEvent(new CustomEvent('kyn:openChat',
         {detail:{chatId, scrollToMessageId}})) on THIS window. Repo-wide
         grep confirmed nothing ever listened for it — the messagesIframe
         never learned which chat to open, so a notification click only ever
         showed the general chat list. Relay it into the iframe using the
         same retry-until-ACK pattern already used by the DIRECT_CHAT_REQUEST
         handler above. The matching consumer
         (messages-ui.js's openChatByIdInUI, wired to 'OPEN_CHAT_BY_ID') is
         fixed in the same pass. -->
    <script>
    (function () {
        window.addEventListener('kyn:openChat', function (e) {
            const d = (e && e.detail) || {};
            if (!d.chatId) return;
            try { navigateToPage('messages'); } catch (_) {}
            try { document.body.classList.add('chat-panel-active'); } catch (_) {}
            let _attempts = 0;
            let _acked = false;
            const _post = function () {
                if (_acked) return;
                const msgIframe = document.getElementById('messagesIframe');
                if (msgIframe && msgIframe.contentWindow) {
                    msgIframe.contentWindow.postMessage({
                        type: 'OPEN_CHAT_BY_ID',
                        payload: { chatId: d.chatId, scrollToMessageId: d.scrollToMessageId || null },
                        source: 'parent-frame'
                    }, '*');
                }
                if (_attempts++ < 12) setTimeout(_post, 600);
            };
            // Stop retrying once the iframe confirms (reuses the existing
            // CHAT_OPENED ack every other open-chat path here already sends).
            window.addEventListener('message', function (ackEvt) {
                if (ackEvt.data && ackEvt.data.type === 'CHAT_OPENED' &&
                    String(ackEvt.data.payload && ackEvt.data.payload.chatId) === String(d.chatId)) {
                    _acked = true;
                }
            });
            _post();
        });
    })();
    </script>
    <!-- FIX (VERIFIED-MISSING-DEEP-LINK: group message notifications never
         opened a group): mirrors the 'kyn:openChat' relay above. Group
         message push notifications previously carried no url/deep-link data
         at all (see pushService.js's pushGroupMessage — fixed in this same
         pass to set data.url = /chat.html?groupId=...). Relays into
         groupIframe using postToGroup(), retrying a bounded number of times
         since group.html has no existing ack event to key off (unlike
         messagesIframe's CHAT_OPENED). -->
    <script>
    (function () {
        window.addEventListener('kyn:openGroup', function (e) {
            const d = (e && e.detail) || {};
            if (!d.groupId) return;
            try { navigateToPage('group'); } catch (_) {}
            let _attempts = 0;
            const _post = function () {
                postToGroup('OPEN_GROUP_BY_ID', { groupId: d.groupId, scrollToMessageId: d.scrollToMessageId || null });
                if (_attempts++ < 12) setTimeout(_post, 600);
            };
            _post();
        });
    })();
    </script>

  function bind(){var ws=window.wsService||window.KynectaRealtime||window.realtimeService;if(!ws||typeof ws.on!=='function')return false;['status:new','status:created','status:deleted','status:viewed','status:reaction','status:reply'].forEach(function(ev){try{ws.on(ev,function(payload){forward(ev,payload);});}catch(_){}});return true;}
  if(!bind()){var n=0,t=setInterval(function(){if(bind()||++n>20)clearInterval(t);},500);}
