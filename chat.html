            // ======================================================================
            // MAIN MESSAGE HANDLER - WITH WS-BRIDGE SOURCE DETECTION
            // ======================================================================
            window.addEventListener('message', async function(event) {
                if (!isTrustedOrigin(event.origin)) return;

                const data = event.data || {};
                if (!data || typeof data !== 'object') return;

                // ==================================================================
                // CALL ENDED HANDLER - ONLY POST TO API IF SOURCE IS NOT 'ws-bridge'
                // ==================================================================
                if (data.type === 'CALL_ENDED' && data.source !== 'ws-bridge') {
                    const callId = data.payload?.callId || data.callId;
                    if (callId) {
                        const baseUrl = window.__getApiBase();
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                        try {
                            await fetch(`${baseUrl}/calls/${callId}/end`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            console.log('[Parent] Call ended via API (non-ws source)');
                        } catch(e) { console.warn('[Parent] Failed to POST /calls/end:', e); }
                    }
                    // Dismiss banner on call termination
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }
                
                // Handle ws-bridge sourced events - dismiss banner but DON'T POST to /calls/:id/end
                if (data.type === 'CALL_ENDED' && data.source === 'ws-bridge') {
                    console.log('[Parent] CALL_ENDED from ws-bridge - banner dismissed, no API call');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }
                
                // ==================================================================
                // CALL ANSWERED HANDLER
                // ==================================================================
                if (data.type === 'CALL_ANSWERED' || data.type === 'CALL_ACCEPTED') {
                    console.log('[Parent] Call answered - dismissing banner');
                    hideGlobalBanner();
                    return;
                }
                
                // ==================================================================
                // CALL REJECTED HANDLER
                // ==================================================================
                if (data.type === 'CALL_REJECTED') {
                    console.log('[Parent] Call rejected - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    return;
                }
                
                // ==================================================================
                // CALL FORCE ENDED HANDLER - unified
                // ==================================================================
                function handleForceEnded(callData, source) {
                    console.log('[Parent] Force ended call - dismissing banner, source:', source);
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    refreshCallHistoryForUser(cachedUserId);
                }
                
                if (data.type === 'CALL_FORCE_ENDED') {
                    handleForceEnded(data.payload, data.source);
                    return;
                }
                
                if (data.type === 'call:force_end' || data.type === 'call_force_ended') {
                    console.log('[Parent] Force end alias received:', data.type);
                    handleForceEnded(data.payload, 'alias');
                    return;
                }
                
                // ==================================================================
                // CALL CANCELLED HANDLER
                // ==================================================================
                if (data.type === 'CALL_CANCELLED' || data.type === 'call:cancelled') {
                    console.log('[Parent] Call cancelled - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    return;
                }

                // ==================================================================
                // CALL INCOMING HANDLER - Show on ALL pages (including calls page)
                // ==================================================================
                if (data.type === 'call:incoming' || (data.type === 'CALL_INCOMING' && data.payload)) {
                    const callData = data.payload || data;
                    // Show banner on ALL pages (not just non-calls pages)
                    if (window.showIncomingCallBanner) {
                        window.showIncomingCallBanner(callData);
                    }
                    // Also dispatch to calls iframe
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({ type: 'CALL_INCOMING', payload: callData, source: data.source || 'parent' }, '*');
                    }
                    return;
                }

                // ==================================================================
                // CALL SCREEN ACTIVE - Control icon visibility
                // ==================================================================
                if (data.type === 'CALL_SCREEN_ACTIVE') {
                    if (data.payload && data.payload.active === true) {
                        window.__activeCallInProgress = true;
                        document.body.classList.add('call-screen-active');
                        console.log('[Parent] Call screen active - icons hidden');
                    } else {
                        window.__activeCallInProgress = false;
                        document.body.classList.remove('call-screen-active');
                        console.log('[Parent] Call screen inactive - icons restored');
                    }
                    return;
                }

                // ==================================================================
                // CALL ACCEPT HANDLER - POST /calls/:id/answer
                // ==================================================================
                if (data.type === 'CALL_ACCEPT') {
                    const callId = data.payload?.callId;
                    const baseUrl = window.__getApiBase();
                    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                    let success = false;
                    let resultData = null;
                    if (callId) {
                        try {
                            const res = await fetch(`${baseUrl}/calls/${callId}/answer`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({})
                            });
                            resultData = await res.json().catch(()=>({}));
                            success = res.ok;
                            console.log('[Parent] Call accept result:', success);
                        } catch(e) { console.warn('[Parent] CALL_ACCEPT error:', e); }
                    }
                    if (event.source) {
                        event.source.postMessage({
                            type: 'CALL_ACCEPT_RESULT',
                            payload: { success, callId, data: resultData, timestamp: Date.now() }
                        }, '*');
                    }
                    hideGlobalBanner();
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }

                // ==================================================================
                // CALL REJECT HANDLER - POST /calls/:id/reject
                // ==================================================================
                if (data.type === 'CALL_REJECT') {
                    const callId = data.payload?.callId;
                    const baseUrl = window.__getApiBase();
                    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                    let success = false;
                    if (callId) {
                        try {
                            const res = await fetch(`${baseUrl}/calls/${callId}/reject`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            success = res.ok;
                            console.log('[Parent] Call reject result:', success);
                        } catch(e) { console.warn('[Parent] CALL_REJECT error:', e); }
                    }
                    if (event.source) {
                        event.source.postMessage({
                            type: 'CALL_REJECT_RESULT',
                            payload: { success, callId, timestamp: Date.now() }
                        }, '*');
                    }
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }

                // ==================================================================
                // CALL DISPATCH LOGIC
                // ==================================================================
                if (!window.__callDispatchLock) window.__callDispatchLock = { ts: 0, userId: null };

                function __isCallDuplicate(userId) {
                    const lock = window.__callDispatchLock;
                    return lock.userId === String(userId) && (Date.now() - lock.ts) < 2000;
                }

                function __dispatchCallToIframe(userId, userName, callType, returnTo, chatUserId, source) {
                    if (__isCallDuplicate(userId)) {
                        console.log('[Parent] ⏭ Duplicate call dispatch suppressed');
                        return;
                    }
                    window.__callDispatchLock = { ts: Date.now(), userId: String(userId) };

                    if (returnTo === 'friends-page' || returnTo === 'friend') returnTo = 'friends';
                    else if (returnTo === 'chat' || returnTo === 'message') returnTo = 'messages';
                    else if (returnTo !== 'messages' && returnTo !== 'friends') returnTo = 'calls';

                    const ctx = { returnTo, chatUserId: chatUserId || userId, userName, source, ts: Date.now() };
                    window.__callReturnContext = ctx;
                    try { sessionStorage.setItem('call_return_ctx', JSON.stringify(ctx)); } catch(e) {}

                    console.log(`[Parent] 📞 Dispatching call → user=${userName}(${userId}) type=${callType} returnTo=${returnTo}`);

                    navigateToPage('calls');

                    const callsIframe = document.getElementById('callsIframe');
                    if (!callsIframe) return;

                    const payload = { userId, userName, callType, returnTo, chatUserId: chatUserId || userId, source, timestamp: Date.now() };

                    try { sessionStorage.setItem('pending_call', JSON.stringify(payload)); } catch(e) {}

                    setTimeout(() => {
                        if (callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'OPEN_CALL_WITH_USER',
                                payload,
                                source: 'parent-frame'
                            }, '*');
                        }
                    }, 400);
                }

                if (data.type === 'SWITCH_MODULE' && data.module === 'calls') {
                    const p = data.payload || {};
                    __dispatchCallToIframe(p.userId, p.userName || 'User', p.callType || 'voice', p.returnTo || 'messages', p.chatUserId || p.userId, 'messages-module');
                    return;
                }

                if (data.type === 'INITIATE_CALL') {
                    const p = data.payload || {};
                    __dispatchCallToIframe(p.userId, p.userName || 'User', p.callType || 'voice', 'messages', p.userId, 'messages-module');
                }

                if (data.type === 'CALL_ENDED_RETURN') {
                    let ctx = window.__callReturnContext;
                    if (!ctx) {
                        try { const s = sessionStorage.getItem('call_return_ctx'); if (s) ctx = JSON.parse(s); } catch(e) {}
                    }
                    window.__callReturnContext = null;
                    window.__callDispatchLock = { ts: 0, userId: null };
                    try { sessionStorage.removeItem('call_return_ctx'); } catch(e) {}

                    const returnTo = ctx?.returnTo || 'calls';
                    console.log(`[Parent] 📞 Call ended → returnTo=${returnTo}`);

                    if (returnTo === 'messages') {
                        navigateToPage('messages');
                        if (ctx?.chatUserId) {
                            const msgIframe = document.getElementById('messagesIframe');
                            if (msgIframe && msgIframe.contentWindow) {
                                setTimeout(() => {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: { userId: ctx.chatUserId, userName: ctx.userName || 'User', returnFromCall: true, timestamp: Date.now() },
                                        source: 'parent-frame'
                                    }, '*');
                                    if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                                }, 300);
                            }
                        }
                    } else if (returnTo === 'friends') {
                        navigateToPage('friends');
                        const friendsIframe = document.getElementById('friendsIframe');
                        if (friendsIframe && friendsIframe.contentWindow) {
                            setTimeout(() => {
                                friendsIframe.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                            }, 300);
                        }
                    } else {
                        navigateToPage('calls');
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) {
                            setTimeout(() => {
                                callsIframe.contentWindow.postMessage({ type: 'SHOW_CALLS_SIDEBAR', payload: { timestamp: Date.now() }, source: 'parent-frame' }, '*');
                            }, 200);
                        }
                    }
                }

                // VERIFY SESSION HANDLER
                if (data.type === 'VERIFY_SESSION') {
                    const requestId = data.payload?.requestId || data.requestId;
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage({
                            type: 'VERIFY_RESPONSE',
                            requestId: requestId,
                            payload: { valid: true, timestamp: Date.now(), module: data.source }
                        }, '*');
                    }
                    return;
                }

                // CHILD READY HANDLER
                if (data.type === 'CHILD_READY') {
                    const targetModule = data.module || data.source || data.payload?.module || null;
                    if (targetModule) registerModule(targetModule);
                    
                    if (targetModule && moduleToIframeId[targetModule]) {
                        const iframe = document.getElementById(moduleToIframeId[targetModule]);
                        if (iframe && iframe.contentWindow) {
                            if (cachedToken && cachedUserId) {
                                sendSessionToModule(iframe, targetModule);
                            } else {
                                updateSessionCache();
                                if (cachedToken && cachedUserId) sendSessionToModule(iframe, targetModule);
                            }
                            setTimeout(() => pushSettingsToModule(iframe, targetModule), 300);
                        }
                    } else {
                        sendToAllModulesIfNeeded(true);
                    }
                }

                // FRIEND EVENTS
                if (data.type === 'FRIEND_ACCEPTED' || data.type === 'FRIEND_REJECTED' || data.type === 'FRIEND_REMOVED') {
                    setTimeout(() => requestFriendsFromFriendIframe(), 500);
                    dispatchEventToModules({ type: data.type, payload: data.payload || data, originalSource: data.source || 'child-module' });
                }

                // SETTINGS HANDLERS
                if (data.type === 'SETTINGS_UPDATED') {
                    const settings = data.settings || data.payload?.settings || {};
                    try { localStorage.setItem('knecta_settings_cache', JSON.stringify(settings)); } catch(e) {}
                    try {
                        if (window.SettingsStore) {
                            Object.entries(settings || {}).forEach(([section, values]) => {
                                if (!values || typeof values !== 'object') return;
                                Object.entries(values).forEach(([key, value]) => window.SettingsStore.set(`${section}.${key}`, value));
                            });
                        }
                    } catch(e) {}
                    if (settings.appearance?.theme || settings.theme) {
                        const theme = settings.appearance?.theme || settings.theme;
                        document.documentElement.setAttribute('data-theme', theme);
                        document.body.setAttribute('data-theme', theme);
                        try { localStorage.setItem('app_theme', theme); } catch(e) {}
                    }
                    dispatchEventToModules({ type: 'SETTINGS_UPDATED', payload: { settings, timestamp: Date.now() }, originalSource: 'settings' });
                }

                if (data.type === 'SETTINGS_GLOBAL_UPDATE') {
                    const { section, key, value } = data;
                    if (window.SettingsStore) {
                        window.SettingsStore.set(`${section}.${key}`, value);
                    }
                    if (section === 'appearance') {
                        if (key === 'theme') {
                            const resolvedTheme = value === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : value;
                            document.documentElement.setAttribute('data-theme', resolvedTheme);
                            document.body.setAttribute('data-theme', resolvedTheme);
                            try { localStorage.setItem('app_theme', resolvedTheme); } catch(e) {}
                        }
                        if (key === 'fontSize') document.documentElement.style.fontSize = value + 'px';
                        if (key === 'accentColor') document.documentElement.style.setProperty('--accent-color', value);
                        if (key === 'language') { document.documentElement.setAttribute('lang', value); try { localStorage.setItem('app_language', value); } catch(e) {} }
                        if (key === 'compactMode') { document.documentElement.setAttribute('data-compact', value ? 'true' : 'false'); document.body.classList.toggle('compact-mode', !!value); }
                        if (key === 'animationsEnabled' || key === 'animations') { document.documentElement.setAttribute('data-animations', value ? 'true' : 'false'); document.body.classList.toggle('no-animations', !value); }
                    }
                    if (section === 'advanced') {
                        if (key === 'reduceMotion') { document.documentElement.setAttribute('data-reduce-motion', value ? 'true' : 'false'); document.body.classList.toggle('reduce-motion', !!value); }
                        if (key === 'performanceMode') document.documentElement.setAttribute('data-performance-mode', value ? 'true' : 'false');
                    }
                    if (section === 'mood' && key === 'currentMood') document.documentElement.setAttribute('data-mood', value);
                    try {
                        const existing = JSON.parse(localStorage.getItem('knecta_settings_cache') || '{}');
                        if (!existing[section]) existing[section] = {};
                        existing[section][key] = value;
                        localStorage.setItem('knecta_settings_cache', JSON.stringify(existing));
                    } catch(e) {}
                    dispatchEventToModules({ type: 'SETTING_CHANGED', payload: { section, key, value, timestamp: Date.now() }, originalSource: 'settings' });
                }

                // STORAGE PROXY HANDLERS
                if (data.type === 'STORAGE_GET') {
                    let storedValue = null;
                    try { storedValue = localStorage.getItem(data.key); } catch(e) {}
                    try {
                        event.source.postMessage({ type: 'STORAGE_RESULT', requestId: data.requestId, value: storedValue, error: null }, '*');
                    } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_SET') {
                    try { if (data.key && data.value !== undefined) localStorage.setItem(data.key, data.value); } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_REMOVE') {
                    try { if (data.key) localStorage.removeItem(data.key); } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_CLEAR') {
                    try {
                        const prefix = data.prefix || 'knecta_';
                        const keysToRemove = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const k = localStorage.key(i);
                            if (k && k.startsWith(prefix)) keysToRemove.push(k);
                        }
                        keysToRemove.forEach(k => localStorage.removeItem(k));
                    } catch(e) {}
                    return;
                }

                // FILE UPLOAD PROXY
                if (data.type === 'FILE_UPLOAD') {
                    const { requestId, fileName, fileType, fileSize, base64Data } = data;
                    const replySource = event.source;
                    const sendResult = (payload) => {
                        try { if (replySource && replySource.postMessage) replySource.postMessage({ type: 'FILE_UPLOAD_RESULT', requestId, ...payload }, '*'); } catch(e) {}
                    };
                    try {
                        const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                        let token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken');
                        const [meta, b64] = base64Data.split(',');
                        const mime = (meta.match(/:(.*?);/) || [])[1] || fileType || 'application/octet-stream';
                        const binary = atob(b64);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes], { type: mime });
                        const formData = new FormData();
                        formData.append('file', blob, fileName || 'upload');
                        formData.append('type', mime.split('/')[0]);
                        const headers = {};
                        if (token) headers['Authorization'] = 'Bearer ' + token;
                        const uploadRes = await fetch(baseUrl + '/upload', { method: 'POST', headers, body: formData, credentials: 'include' });
                        if (uploadRes.ok) {
                            const json = await uploadRes.json().catch(() => ({}));
                            const url = json.url || json.data?.url || json.fileUrl || json.mediaUrl;
                            if (url) { sendResult({ url, success: true }); return; }
                        }
                        sendResult({ error: 'Upload failed', success: false });
                    } catch(uploadErr) {
                        sendResult({ error: uploadErr.message || 'Upload failed', success: false });
                    }
                    return;
                }

                // API REQUEST HANDLER
                if (data.type === 'API_REQUEST') {
                    let endpoint = data.payload?.endpoint || data.endpoint;
                    if (!endpoint) return;
                    if (endpointMappings[endpoint]) endpoint = endpointMappings[endpoint];
                    if (endpoint.startsWith('/api/')) endpoint = endpoint.substring(4);
                    if (!endpoint.startsWith('/')) endpoint = '/' + endpoint;

                    const requestId = data.payload?.requestId || data.requestId;
                    const method = data.payload?.method || data.method || 'GET';
                    const body = data.payload?.body || data.payload?.data || data.body || data.data || null;
                    const params = data.payload?.params || data.params || null;
                    
                    let token = data.payload?.token || cachedToken;
                    if (!token) {
                        try {
                            const freshSession = getSessionData();
                            token = freshSession?.token || null;
                            if (token && !cachedToken) { cachedToken = token; cachedUserId = freshSession.userId; cachedUser = freshSession.user; }
                        } catch(e) {}
                    }
                    if (!token) {
                        try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken'); } catch(e) {}
                    }

                    try {
                        const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                        let url = baseUrl + endpoint;
                        const cachedApiFallback = getCachedApiFallback(endpoint);
                        if (cachedApiFallback) {
                            if (event.source && event.source.postMessage) {
                                event.source.postMessage({
                                    type: 'API_RESPONSE',
                                    requestId: requestId,
                                    payload: { success: true, data: cachedApiFallback, statusCode: 200, fallback: true, local: true },
                                    timestamp: new Date().toISOString()
                                }, '*');
                            }
                            return;
                        }
                        if (!navigator.onLine) {
                            const offlinePayload = {
                                success: false,
                                error: 'Offline - skipping API',
                                statusCode: 0,
                                offline: true,
                                data: endpoint.startsWith('/status') ? { statuses: [], highlights: [] } : null
                            };
                            if (event.source && event.source.postMessage) {
                                event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: offlinePayload, timestamp: new Date().toISOString() }, '*');
                            }
                            return;
                        }
                        if (method === 'GET' && params && typeof params === 'object') {
                            const queryString = new URLSearchParams(params).toString();
                            if (queryString) url += '?' + queryString;
                        }
                        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
                        if (token) headers['Authorization'] = `Bearer ${token}`;
                        const fetchOptions = { method: method, headers: headers, credentials: 'include' };
                        if (body && (method === 'POST' || method === 'PUT' || method === 'PATCH')) fetchOptions.body = JSON.stringify(body);
                        const response = await fetch(url, fetchOptions);
                        let responseData;
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) responseData = await response.json();
                        else responseData = { message: await response.text() || 'Request completed' };
                        const isStatusEndpoint = endpoint === '/status/my' || endpoint === '/status/highlights' || endpoint === '/auth/me';
                        const isSuccess = response.ok || (isStatusEndpoint && response.status === 401);
                        const responsePayload = isSuccess
                            ? {
                                success: true,
                                data: response.ok ? responseData : (endpoint === '/status/highlights' ? { highlights: [] } : endpoint === '/status/my' ? { statuses: [] } : { user: cachedUser, data: cachedUser }),
                                statusCode: response.status,
                                fallback: !response.ok
                            }
                            : { success: false, error: responseData?.message || responseData?.error || `HTTP ${response.status}`, statusCode: response.status, data: responseData };
                        if (event.source && event.source.postMessage) event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: responsePayload, timestamp: new Date().toISOString() }, '*');
                    } catch (error) {
                        if (event.source && event.source.postMessage) event.source.postMessage({ type: 'API_RESPONSE', requestId: requestId, payload: { success: false, error: error.message || 'Network request failed', statusCode: 0, data: null }, timestamp: new Date().toISOString() }, '*');
                    }
                }

                // MODULE SWITCHING
                if (data.type === 'SWITCH_MODULE' && data.module !== 'calls') {
                    navigateToPage(data.module);
                    if (data.payload?.returnFromCall) {
                        if (data.module === 'messages' && data.payload?.openChatWith) {
                            const msgIframe = document.getElementById('messagesIframe');
                            if (msgIframe && msgIframe.contentWindow) {
                                setTimeout(() => {
                                    msgIframe.contentWindow.postMessage({ type: 'OPEN_CHAT_WITH_USER', payload: { userId: data.payload.openChatWith, returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*');
                                    if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                                }, 300);
                            }
                        } else if (data.module === 'friends') {
                            const friendsIframe = document.getElementById('friendsIframe');
                            if (friendsIframe && friendsIframe.contentWindow) setTimeout(() => friendsIframe.contentWindow.postMessage({ type: 'RETURN_FROM_CALL', payload: { returnFromCall: true, timestamp: Date.now() }, source: 'parent-frame' }, '*'), 300);
                        }
                    }
                }

                if (data.type === 'DIRECT_CHAT_REQUEST') {
                    const chatPayload = { userId: data.payload.userId, userName: data.payload.userName || data.payload.name || 'User', timestamp: Date.now() };
                    sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                    navigateToPage('messages');
                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        messagesIframe.contentWindow.postMessage({ type: 'OPEN_CHAT_WITH_USER', payload: chatPayload, source: 'parent-frame', timestamp: Date.now() }, '*');
                        if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                    }
                }

                if (data.type === 'DIRECT_CALL_REQUEST') {
                    const p = data.payload || {};
                    const returnTo = (window.__currentPage && window.__currentPage !== 'calls') ? window.__currentPage : (window.__lastActivePage || 'friends');
                    sendFriendsToCallsIframe();
                    __dispatchCallToIframe(p.userId, p.userName || p.name || 'User', p.callType || 'voice', returnTo, p.userId, 'friends-module');
                }

                if (data.type === 'CHILD_CLOSING') {
                    const returnPage = data.returnTo || window.__lastActivePage || 'messages';
                    navigateToPage(returnPage);
                    if (returnPage === 'messages') {
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) setTimeout(() => messagesIframe.contentWindow.postMessage({ type: 'CALL_ENDED_RETURN', timestamp: Date.now() }, '*'), 200);
                    }
                }

                if (data.type === 'HIDE_SIDEBAR_ICONS') {
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = '0.3'; el.style.pointerEvents = 'none'; });
                }
                if (data.type === 'SHOW_SIDEBAR_ICONS') {
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(el => { el.style.opacity = ''; el.style.pointerEvents = ''; });
                }

                if (data.type === 'API_RESPONSE' && data.status === 401) await refreshAuthToken();

                if (data.type === 'REFRESH_CALL_HISTORY') {
                    const userId = data.payload?.userId || cachedUserId;
                    if (userId) await refreshCallHistoryForUser(userId);
                }

                if (data.type === 'CALL_INITIATE') {
                    const localCallId = data.payload?.callId;
                    const callType = data.payload?.callType || data.payload?.type || 'audio';
                    const calleeId = data.payload?.calleeId;
                    const participantIds = data.payload?.participantIds;
                    const isGroupCall = data.payload?.isGroupCall || false;
                    const callOriginPage = data.payload?.returnTo || window.__currentPage || window.__lastActivePage || 'calls';
                    window.__pendingCallOrigin = callOriginPage;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    try { if (!token) token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken'); } catch(e) {}
                    try {
                        const body = { callType: callType === 'voice' ? 'audio' : callType, isGroupCall: isGroupCall };
                        if (isGroupCall && participantIds) body.participantIds = participantIds;
                        else if (calleeId) body.participantIds = [parseInt(calleeId)];
                        const resp = await fetch(`${baseUrl}/calls`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(body) });
                        const respData = await resp.json();
                        if (resp.ok && (respData.data?.call?.id || respData.data?.callId)) {
                            const serverCallId = respData.data?.call?.id || respData.data?.callId;
                            window.__callIdMap = window.__callIdMap || {};
                            window.__callIdMap[localCallId] = serverCallId;
                            const callsIframe = document.getElementById('callsIframe');
                            if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { ...(respData.data?.call || respData.data), callId: serverCallId, localCallId: localCallId, callType: callType, returnTo: callOriginPage, receiverOnline: respData.data?.receiverOnline !== false, success: true } }, '*');
                        } else if ((respData?.error || respData?.message || '').includes('wsService.isUserOnline is not a function')) {
                            const fallbackCallId = localCallId || `call_fallback_${Date.now()}`;
                            window.__callIdMap = window.__callIdMap || {};
                            window.__callIdMap[localCallId] = fallbackCallId;
                            const callsIframe = document.getElementById('callsIframe');
                            if (callsIframe && callsIframe.contentWindow) {
                                callsIframe.contentWindow.postMessage({
                                    type: 'CALL_INITIATED',
                                    payload: {
                                        success: true,
                                        fallback: true,
                                        callId: fallbackCallId,
                                        localCallId,
                                        callType,
                                        returnTo: callOriginPage,
                                        receiverOnline: true,
                                        participants: body.participantIds || []
                                    }
                                }, '*');
                            }
                        } else {
                            const callsIframe = document.getElementById('callsIframe');
                            if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { success: false, error: respData?.message || 'Failed to start call', localCallId } }, '*');
                        }
                    } catch(err) {
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) callsIframe.contentWindow.postMessage({ type: 'CALL_INITIATED', payload: { success: false, error: err.message, localCallId } }, '*');
                    }
                }

                if (data.type === 'API_REQUEST' && window.__callIdMap) {
                    let ep = data.payload?.endpoint || '';
                    Object.entries(window.__callIdMap).forEach(([local, server]) => { if (ep.includes(local)) data.payload.endpoint = ep.replace(local, server); });
                }

                // WebRTC Signaling Bridge
                if (data.type === 'SIGNAL_OFFER' || data.type === 'SIGNAL_ANSWER' || data.type === 'ICE_CANDIDATE') {
                    if (window.wsService && typeof window.wsService.send === 'function') {
                        const wsEventMap = { 'SIGNAL_OFFER': 'call_offer', 'SIGNAL_ANSWER': 'call_answer', 'ICE_CANDIDATE': 'ice_candidate' };
                        try { window.wsService.send(wsEventMap[data.type], data.payload || {}); } catch(sigErr) { console.warn('[Parent] WebRTC signal forward failed:', sigErr.message); }
                    } else if (window.wsService && typeof window.wsService.emit === 'function') {
                        const wsEventMap = { 'SIGNAL_OFFER': 'call_offer', 'SIGNAL_ANSWER': 'call_answer', 'ICE_CANDIDATE': 'ice_candidate' };
                        window.wsService.emit(wsEventMap[data.type], data.payload || {});
                    }
                    return;
                }

                if (data.type === 'GET_FRIENDS_LIST') {
                    const src = event.source;
                    if (src && src.postMessage) src.postMessage({ type: 'FRIENDS_LIST_RESPONSE', payload: { friends: cachedFriendsList, timestamp: Date.now() } }, '*');
                    requestFriendsFromFriendIframe();
                }

                if (data.type === 'FRIENDS_DATA') {
                    const incoming = data.friends || data.payload?.friends || [];
                    if (Array.isArray(incoming) && incoming.length > 0) {
                        cachedFriendsList = incoming;
                        broadcastFriendsToAllModules(cachedFriendsList);
                    }
                }

                if (data.type === 'FETCH_LISTINGS') {
                    const requestId = data.payload?.requestId;
                    if (!requestId) return;
                    const page = data.payload?.page || 1;
                    const limit = data.payload?.limit || 20;
                    const baseUrl = window.__getApiBase();
                    let token = cachedToken;
                    if (!token) { try { token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken'); } catch(e) {} }
                    if (!token) { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*'); return; }
                    fetch(`${baseUrl}/marketplace/listings?page=${page}&limit=${limit}`, { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, credentials: 'include' })
                        .then(r => r.json())
                        .then(responseData => { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: responseData.data || { listings: [], total: 0 } } }, '*'); })
                        .catch(() => { if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*'); });
                }
            });

            // ======================================================================
            // WEBSOCKET CALL EVENT LISTENERS WITH SOURCE: 'ws-bridge'
            // ======================================================================
            if (window.wsService && typeof window.wsService.on === 'function') {
                // call:incoming - show banner on ALL pages
                window.wsService.on('call:incoming', function(callData) {
                    console.log('[WS] call:incoming received - showing banner');
                    if (window.showIncomingCallBanner) {
                        window.showIncomingCallBanner(callData);
                    }
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_INCOMING', payload: callData, source: 'ws-bridge' }, '*');
                    }
                });
                
                // call:answered
                window.wsService.on('call:answered', function(callData) {
                    console.log('[WS] call:answered - dismissing banner');
                    hideGlobalBanner();
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ACCEPTED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                
                // call:rejected
                window.wsService.on('call:rejected', function(callData) {
                    console.log('[WS] call:rejected - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_REJECTED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                
                // call:ended - with ws-bridge source
                window.wsService.on('call:ended', function(callData) {
                    console.log('[WS] call:ended - dismissing banner, no API call');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ENDED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
                
                // call_force_ended
                window.wsService.on('call_force_ended', function(callData) {
                    console.log('[WS] call_force_ended - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_FORCE_ENDED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
                
                // call:force_end alias
                window.wsService.on('call:force_end', function(callData) {
                    console.log('[WS] call:force_end alias - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_FORCE_ENDED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
                
                // call:cancelled
                window.wsService.on('call:cancelled', function(callData) {
                    console.log('[WS] call:cancelled - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_CANCELLED', payload: callData, source: 'ws-bridge' }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });

                // WebRTC Signaling Bridge inbound
                function _fwdToCallsIframe(type, payload) {
                    const f = document.getElementById('callsIframe');
                    if (f && f.contentWindow) f.contentWindow.postMessage({ type, payload, source: 'ws-bridge' }, '*');
                }
                window.wsService.on('call_offer', d => _fwdToCallsIframe('SIGNAL_OFFER', d));
                window.wsService.on('call_answer', d => _fwdToCallsIframe('SIGNAL_ANSWER', d));
                window.wsService.on('ice_candidate', d => _fwdToCallsIframe('ICE_CANDIDATE', d));
                window.wsService.on('call:offer', d => _fwdToCallsIframe('SIGNAL_OFFER', d));
                window.wsService.on('call:answer', d => _fwdToCallsIframe('SIGNAL_ANSWER', d));
                window.wsService.on('call:ice_candidate', d => _fwdToCallsIframe('ICE_CANDIDATE', d));
            }

            // Calls iframe load handler
            const callsIframe = document.getElementById('callsIframe');
            if (callsIframe) {
                callsIframe.addEventListener('load', function() {
                    if (cachedToken && cachedUserId) {
                        callsIframe.contentWindow.postMessage({ type: 'SESSION_DATA', payload: { token: cachedToken, userId: cachedUserId, user: cachedUser, authenticated: true }, timestamp: Date.now() }, '*');
                    }
                    setTimeout(() => sendFriendsToCallsIframe(), 500);
                    const pendingCall = sessionStorage.getItem('pending_call');
                    if (pendingCall) {
                        try {
                            const callData = JSON.parse(pendingCall);
                            callsIframe.contentWindow.postMessage({ type: 'OPEN_CALL_WITH_USER', payload: callData, source: 'parent-frame', timestamp: Date.now() }, '*');
                            sessionStorage.removeItem('pending_call');
                        } catch(e) {}
                    }
                });
            }

            setTimeout(() => {
                sendToAllModulesIfNeeded(true);
                requestFriendsFromFriendIframe();
                if (cachedUserId) setTimeout(() => refreshCallHistoryForUser(cachedUserId), 2000);
            }, 1000);
        })();

        // DOMContentLoaded handlers
        document.addEventListener('DOMContentLoaded', function() {
            updateHeaderContext(window.__currentPage || 'messages');
            loadUserProfileFromStorage();
            setupProfileModal();
            setupGlobalCallBanner();
            
            const pendingChat = sessionStorage.getItem('pending_chat');
            if (pendingChat) {
                try {
                    const chatData = JSON.parse(pendingChat);
                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        setTimeout(() => {
                            messagesIframe.contentWindow.postMessage({ type: 'OPEN_CHAT_WITH_USER', payload: chatData, source: 'parent-frame', timestamp: Date.now() }, '*');
                            sessionStorage.removeItem('pending_chat');
                            if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                        }, 1000);
                    }
                } catch(e) {}
            }
            const pendingCall = sessionStorage.getItem('pending_call');
            if (pendingCall) {
                try {
                    const callData = JSON.parse(pendingCall);
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        setTimeout(() => {
                            callsIframe.contentWindow.postMessage({ type: 'OPEN_CALL_WITH_USER', payload: callData, source: 'parent-frame', timestamp: Date.now() }, '*');
                            sessionStorage.removeItem('pending_call');
                        }, 1000);
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
