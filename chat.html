﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kynecta - Advanced Mood-Based Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        #permanentSidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
            font-size: 20px;
        }

        .nav-icon:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-icon.active {
            background: #7c3aed;
            color: white;
        }

        .iframe-container {
            position: fixed;
            top: 0;
            left: 60px;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 90;
        }

        .iframe-container.hidden {
            display: none;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .mobile-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            z-index: 1000;
            justify-content: space-around;
            align-items: center;
        }

        body.chat-panel-active .mobile-nav-bar {
            display: none !important;
        }

        body.chat-panel-active .iframe-container:not(.hidden) {
            bottom: 0 !important;
            height: 100% !important;
        }

        .mobile-nav-icon {
            flex: 1;
            text-align: center;
            padding: 12px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 20px;
        }

        .mobile-nav-icon.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        @media (max-width: 768px) {
            #permanentSidebar {
                display: none;
            }
            .iframe-container {
                left: 0;
            }
            .mobile-nav-bar {
                display: flex;
            }
        }

        @media (min-width: 769px) {
            .mobile-nav-bar {
                display: none;
            }
        }

        .kynecta-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-connected {
            background-color: #10b981;
        }

        .relative {
            position: relative;
        }

        .mt-auto {
            margin-top: auto;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(0.98);
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div style="text-align: center;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #a855f7, #10b981); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: pulse 1.5s infinite;">
                <span style="color: white; font-size: 32px;">🧠</span>
            </div>
            <h2 style="color: #374151;">Kynecta</h2>
            <p style="color: #6b7280;">Loading...</p>
        </div>
    </div>

    <!-- Permanent Sidebar (Desktop) -->
    <div id="permanentSidebar">
        <button class="nav-icon active" data-page="messages"><i class="fas fa-comments"></i></button>
        <button class="nav-icon" data-page="status"><i class="fas fa-circle"></i></button>
        <button class="nav-icon" data-page="group"><i class="fas fa-users"></i></button>
        <button class="nav-icon" data-page="friends"><i class="fas fa-user-friends"></i></button>
        <button class="nav-icon" data-page="calls"><i class="fas fa-phone"></i></button>
        <button class="nav-icon" data-page="settings"><i class="fas fa-cog"></i></button>
        <button class="nav-icon" data-page="tools"><i class="fas fa-tools"></i></button>
        <div class="mt-auto mb-4 relative">
            <div class="kynecta-status-dot status-connected" style="position: absolute; bottom: 2px; right: 2px;"></div>
        </div>
    </div>

    <!-- Mobile Navigation Bar -->
    <div id="mobileNavBar" class="mobile-nav-bar">
        <button class="mobile-nav-icon active" data-page="messages"><i class="fas fa-comments"></i></button>
        <button class="mobile-nav-icon" data-page="calls"><i class="fas fa-phone"></i></button>
        <button class="mobile-nav-icon" data-page="group"><i class="fas fa-users"></i></button>
        <button class="mobile-nav-icon" data-page="status"><i class="fas fa-circle"></i></button>
        <button class="mobile-nav-icon" data-page="friends"><i class="fas fa-user-friends"></i></button>
        <button class="mobile-nav-icon" data-page="settings"><i class="fas fa-cog"></i></button>
        <button class="mobile-nav-icon" data-page="tools"><i class="fas fa-tools"></i></button>
    </div>

    <!-- IFrame Containers for each module -->
    <div id="messagesContent" class="iframe-container">
        <iframe id="messagesIframe" class="content-iframe" src="message.html" data-module="messages" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="statusContent" class="iframe-container hidden">
        <iframe id="statusIframe" class="content-iframe" src="status.html" data-module="status" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="groupContent" class="iframe-container hidden">
        <iframe id="groupIframe" class="content-iframe" src="group.html" data-module="group" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="friendsContent" class="iframe-container hidden">
        <iframe id="friendsIframe" class="content-iframe" src="friend.html" data-module="friends" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox" allow="camera; microphone; geolocation"></iframe>
    </div>
    <div id="callsContent" class="iframe-container hidden">
        <iframe id="callsIframe" class="content-iframe" src="calls.html" data-module="calls" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="settingsContent" class="iframe-container hidden">
        <iframe id="settingsIframe" class="content-iframe" src="settings.html" data-module="settings" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="toolsContent" class="iframe-container hidden">
        <iframe id="toolsIframe" class="content-iframe" src="Tools.html" data-module="tools" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe>
    </div>

    <script>
        // ======================================================================
        // ENVIRONMENT DETECTION & SESSION PROTECTION
        // ======================================================================
        window.__getApiBase = function() {
            return 'http://localhost:4000/api';
        };

        // Session protection - prevent clearing critical auth keys
        (function() {
            const originalRemove = localStorage.removeItem;
            localStorage.removeItem = function(key) {
                if (key === 'kynecta_auth' || key === 'token' || key === 'moodchat_token' || key === 'accessToken') {
                    console.log('🛡️ Blocked clearing:', key);
                    return;
                }
                originalRemove.call(this, key);
            };
        })();

        // ======================================================================
        // CENTRALIZED EVENT DISPATCHER (CORE FEATURE)
        // ======================================================================
        
        function dispatchEventToModules(event) {
            const enrichedEvent = {
                ...event,
                source: 'parent',
                timestamp: event.timestamp || Date.now(),
                parentBroadcast: true,
                broadcastId: `${event.type}_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`
            };
            
            let modulesSent = [];
            
            Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                if (enrichedEvent.targetModule && enrichedEvent.targetModule !== moduleName) {
                    return;
                }
                
                const iframe = document.getElementById(iframeId);
                if (iframe && iframe.contentWindow) {
                    try {
                        iframe.contentWindow.postMessage(enrichedEvent, '*');
                        modulesSent.push(moduleName);
                        console.log(`📡 Event "${enrichedEvent.type}" dispatched to module: ${moduleName}`, enrichedEvent.payload);
                    } catch (error) {
                        console.error(`Failed to dispatch event to ${moduleName}:`, error);
                    }
                }
            });
            
            if (modulesSent.length > 0) {
                console.log(`✅ Event "${enrichedEvent.type}" broadcast to ${modulesSent.length} module(s):`, modulesSent);
            } else {
                console.warn(`⚠️ Event "${enrichedEvent.type}" had no targets (no iframes available)`);
            }
        }
        
        const moduleRegistry = new Set();
        
        function registerModule(moduleName) {
            if (moduleName && !moduleRegistry.has(moduleName)) {
                moduleRegistry.add(moduleName);
                console.log(`📝 Module registered: ${moduleName} (Total: ${moduleRegistry.size})`);
            }
        }
        
        // ======================================================================
        // NAVIGATION HANDLERS
        // ======================================================================
        document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const page = btn.dataset.page;
                if (page) {
                    document.querySelectorAll('.iframe-container').forEach(c => c.classList.add('hidden'));
                    const target = document.getElementById(`${page}Content`);
                    if (target) target.classList.remove('hidden');
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    if (window.innerWidth <= 768) {
                        if (page === 'messages') {
                            document.body.classList.add('chat-panel-active');
                        } else {
                            document.body.classList.remove('chat-panel-active');
                        }
                    }
                }
            });
        });

        setTimeout(() => {
            const loading = document.getElementById('loadingScreen');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => loading.classList.add('hidden'), 300);
            }
        }, 2000);
        
        function setupChatPanelDetection() {
            const messagesIframe = document.getElementById('messagesIframe');
            if (!messagesIframe) return;
            
            window.addEventListener('message', function(event) {
                if (event.origin !== window.location.origin && event.origin !== 'http://127.0.0.1:5500' && event.origin !== 'http://localhost:5500') {
                    return;
                }
                const data = event.data || {};
                if (data.type === 'CHAT_OPENED' || data.type === 'CONVERSATION_OPENED') {
                    if (window.innerWidth <= 768) {
                        document.body.classList.add('chat-panel-active');
                    }
                }
                if (data.type === 'CHAT_LIST_SHOWN' || data.type === 'CHAT_CLOSED') {
                    if (window.innerWidth <= 768) {
                        const messagesContainer = document.getElementById('messagesContent');
                        if (messagesContainer && !messagesContainer.classList.contains('hidden')) {
                            document.body.classList.remove('chat-panel-active');
                        }
                    }
                }
            });
            
            messagesIframe.addEventListener('load', function() {
                try {
                    const iframeDoc = messagesIframe.contentDocument || messagesIframe.contentWindow.document;
                    if (iframeDoc) {
                        const script = iframeDoc.createElement('script');
                        script.textContent = `
                            (function() {
                                function notifyChatState(state, data) {
                                    window.parent.postMessage({
                                        type: state === 'open' ? 'CHAT_OPENED' : 'CHAT_CLOSED',
                                        payload: data || {}
                                    }, '*');
                                }
                                let lastPath = window.location.pathname;
                                setInterval(function() {
                                    if (window.location.pathname !== lastPath) {
                                        lastPath = window.location.pathname;
                                        if (lastPath.includes('/chat/') || lastPath.includes('/conversation/')) {
                                            notifyChatState('open', { path: lastPath });
                                        } else {
                                            notifyChatState('closed', { path: lastPath });
                                        }
                                    }
                                }, 500);
                                document.addEventListener('click', function(e) {
                                    let target = e.target.closest('.chat-item, .conversation-item, [data-chat-id], [data-conversation-id]');
                                    if (target) {
                                        setTimeout(function() {
                                            if (window.location.pathname.includes('/chat/') || window.location.pathname.includes('/conversation/')) {
                                                notifyChatState('open', { chatId: target.dataset.chatId });
                                            }
                                        }, 100);
                                    }
                                });
                            })();
                        `;
                        iframeDoc.head.appendChild(script);
                    }
                } catch(e) {
                    console.warn('[Parent] Cannot inject into iframe due to cross-origin:', e);
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            setupChatPanelDetection();
            
            if (window.innerWidth <= 768) {
                const messagesContainer = document.getElementById('messagesContent');
                if (messagesContainer && !messagesContainer.classList.contains('hidden')) {
                    document.body.classList.remove('chat-panel-active');
                }
            }
        });
        
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.body.classList.remove('chat-panel-active');
            } else {
                const messagesContainer = document.getElementById('messagesContent');
                if (messagesContainer && !messagesContainer.classList.contains('hidden')) {
                } else {
                    document.body.classList.remove('chat-panel-active');
                }
            }
        });
    </script>

    <script>window.__parentHandlesApiRequests = true;</script>
    <script type="module" src="js/api.core.js"></script>

    <script>
        // ======================================================================
        // PARENT ORCHESTRATION - CORE FUNCTIONALITY
        // ======================================================================
        (function originalParentFormat() {
            console.log('📡 Parent broadcaster started');

            let cachedToken = null;
            let cachedUserId = null;
            let cachedUser = null;

            const requestThrottle = new Map();
            const THROTTLE_TIMES = {
                '/api/chats': 3000,
                '/api/friends': 3000,
                '/api/settings': 5000,
                '/api/groups': 3000,
                'default': 2000
            };

            function canMakeRequest(endpoint) {
                const now = Date.now();
                const lastRequest = requestThrottle.get(endpoint) || 0;
                const throttleTime = THROTTLE_TIMES[endpoint] || THROTTLE_TIMES.default;
                if (now - lastRequest < throttleTime) {
                    console.log(`[Throttle] Skipping ${endpoint} - ${now - lastRequest}ms since last request`);
                    return false;
                }
                requestThrottle.set(endpoint, now);
                return true;
            }

            const moduleToIframeId = {
                'messages': 'messagesIframe',
                'status': 'statusIframe',
                'group': 'groupIframe',
                'groups': 'groupIframe',
                'friends': 'friendsIframe',
                'calls': 'callsIframe',
                'settings': 'settingsIframe',
                'tools': 'toolsIframe'
            };

            const endpointMappings = {
                '/group/user': '/groups/user',
                '/group/user/': '/groups/user',
                '/group/invites': '/groups/invites',
                '/invites': '/groups/invites/user',
                '/group/moods': '/groups/moods',
                '/group/purposes': '/groups/purposes',
                '/group/notes': '/groups/notes',
                '/chats': '/chats',
                '/chats/': '/chats',
                '/messages': '/messages',
                '/messages/send': '/messages',
                '/friends': '/friends',
                '/friends/requests/incoming': '/friends/incoming',
                '/friends/requests/sent': '/friends/sent',
                '/friends/contacts/synced': '/friends/synced',
                '/friends/pinned': '/friends/pinned',
                '/friends/muted': '/friends/muted',
                '/friends/groups/user': '/groups/user',
                '/friends/requests/send': '/friends/send',
                '/friends/incoming': '/friends/incoming',
                '/friends/search': '/friends/search',
                '/friends/users/all': '/friends/users/all',
                '/friends/nearby': '/friends/nearby',
                '/settings': '/settings',
                '/profile': '/settings',
                '/users/settings': '/settings',
                '/users/profile': '/settings',
                '/users/blocked': '/settings/blocked-users',
                '/friends/contacts': '/friends',
                '/auth/me': '/auth/me',
                '/api/status': '/status',
                '/status': '/status',
                '/api/status/my': '/status/my',
                '/status/my': '/status/my',
                '/api/status/friends': '/status/friends',
                '/status/friends': '/status/friends',
                '/api/status/stats': '/status/stats',
                '/status/stats': '/status/stats',
                '/api/status/trending': '/status/trending',
                '/status/trending': '/status/trending',
                '/api/status/public': '/status/public',
                '/status/public': '/status/public',
                // Call history endpoint mapping
                '/calls': '/calls/history',
                '/calls/': '/calls/history'
            };

            function getSessionData() {
                const token = localStorage.getItem('token') || 
                              localStorage.getItem('moodchat_token') || 
                              localStorage.getItem('accessToken');
                if (!token) {
                    console.log('[Parent] No token found in localStorage');
                    return null;
                }

                let userId = null;
                let user = null;

                try {
                    const parts = token.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        userId = payload.userId || payload.id || payload.sub || payload.user_id || payload.uid;
                        if (userId) {
                            user = {
                                id: userId,
                                userId: userId,
                                username: payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                                email: payload.email || '',
                                displayName: payload.displayName || payload.username || payload.name || 'User',
                                firstName: payload.firstName || '',
                                lastName: payload.lastName || ''
                            };
                        }
                    }
                } catch (e) {
                    console.warn('[Parent] Failed to decode token:', e);
                }

                if (!userId) {
                    const authData = localStorage.getItem('kynecta_auth');
                    if (authData) {
                        try {
                            const parsed = JSON.parse(authData);
                            userId = parsed.userId || parsed.id || parsed.user?.id;
                            if (userId) user = parsed.user || parsed;
                        } catch(e) {}
                    }
                }

                if (!userId) return null;
                return { token, userId, user };
            }

            function updateSessionCache() {
                const session = getSessionData();
                if (session && session.userId) {
                    cachedToken = session.token;
                    cachedUserId = session.userId;
                    cachedUser = session.user || { id: session.userId, userId: session.userId, username: 'User' };
                    console.log('[Parent] ✅ Session cache updated:', { userId: cachedUserId });
                } else {
                    cachedToken = null;
                    cachedUserId = null;
                    cachedUser = null;
                }
            }

            function sendSessionToModule(iframe, moduleName) {
                if (!cachedToken || !cachedUserId) {
                    console.log(`[Parent] No session for ${moduleName}, skipping`);
                    return;
                }
                if (!iframe || !iframe.contentWindow) {
                    console.log(`[Parent] No iframe for ${moduleName}`);
                    return;
                }

                const userData = {
                    id: cachedUserId,
                    userId: cachedUserId,
                    username: cachedUser?.username || 'User',
                    displayName: cachedUser?.displayName || cachedUser?.username || 'User',
                    email: cachedUser?.email || '',
                    firstName: cachedUser?.firstName || '',
                    lastName: cachedUser?.lastName || ''
                };

                const sessionData = {
                    token: cachedToken,
                    user: userData,
                    authenticated: true,
                    expiresAt: Date.now() + 3600000,
                    ready: true,
                    userId: cachedUserId,
                    id: cachedUserId
                };

                iframe.contentWindow.postMessage({
                    type: 'SESSION_DATA',
                    id: `session_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: sessionData,
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'AUTH_READY',
                    id: `auth_ready_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        authenticated: true,
                        session: sessionData,
                        user: userData,
                        userId: cachedUserId,
                        timestamp: Date.now()
                    },
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'PARENT_READY',
                    id: `parent_ready_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        protocol: 'KYN-8.0',
                        state: 'READY',
                        message: 'Parent is ready',
                        session: sessionData,
                        userId: cachedUserId
                    },
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                console.log(`📡 Sent session to ${moduleName} (userId: ${cachedUserId})`);
            }

            let lastSessionSend = 0;
            const SESSION_SEND_INTERVAL = 30000;

            function sendToAllModulesIfNeeded(force = false) {
                const now = Date.now();
                if (!force && now - lastSessionSend < SESSION_SEND_INTERVAL) {
                    console.log('[Parent] Skipping session send - too soon');
                    return;
                }
                if (!cachedToken || !cachedUserId) {
                    console.log('[Parent] No session available');
                    return;
                }
                lastSessionSend = now;
                Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                    const iframe = document.getElementById(iframeId);
                    if (iframe && iframe.contentWindow) {
                        sendSessionToModule(iframe, moduleName);
                    }
                });
            }

            // ======================================================================
            // FIX: Add function to refresh call history
            // ======================================================================
            async function refreshCallHistoryForUser(userId) {
                try {
                    console.log('[Parent] Refreshing call history for user:', userId);
                    const response = await window.api.get('/calls/history', { limit: 50 });
                    if (response && (response.success || response.status === 'success')) {
                        const calls = response.data?.calls || response.calls || [];
                        console.log('[Parent] Call history refreshed, found:', calls.length, 'calls');
                        
                        // Broadcast updated history to calls iframe
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_HISTORY_UPDATE',
                                payload: { calls: calls, timestamp: Date.now() }
                            }, '*');
                        }
                        return calls;
                    }
                } catch (err) {
                    console.warn('[Parent] Failed to refresh call history:', err);
                }
                return [];
            }

            async function refreshAuthToken() {
                try {
                    const refreshToken = localStorage.getItem('refreshToken');
                    if (!refreshToken) return false;
                    const response = await fetch('http://localhost:4000/api/auth/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refreshToken }),
                        credentials: 'include'
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const newToken = data.token || data.accessToken;
                        if (newToken) {
                            localStorage.setItem('token', newToken);
                            localStorage.setItem('moodchat_token', newToken);
                            localStorage.setItem('accessToken', newToken);
                            const authData = localStorage.getItem('kynecta_auth');
                            if (authData) {
                                const parsed = JSON.parse(authData);
                                parsed.token = newToken;
                                localStorage.setItem('kynecta_auth', JSON.stringify(parsed));
                            }
                            console.log('[Parent] ✅ Token refreshed successfully');
                            setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                            return true;
                        }
                    }
                    return false;
                } catch (error) {
                    console.error('[Parent] Token refresh error:', error);
                    return false;
                }
            }

            updateSessionCache();
            setInterval(updateSessionCache, 10000);

            window.addEventListener('storage', function(e) {
                if (e.key === 'token' || e.key === 'moodchat_token' || e.key === 'kynecta_auth' || e.key === 'accessToken') {
                    updateSessionCache();
                    setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                }
            });

            window.addEventListener('message', async function(event) {
                if (event.origin !== window.location.origin && event.origin !== 'http://127.0.0.1:5500' && event.origin !== 'http://localhost:5500') {
                    return;
                }

                const data = event.data || {};
                if (!data || typeof data !== 'object') return;

                // ==================== HANDLE VERIFY_SESSION (CRITICAL FOR CALLS) ====================
                if (data.type === 'VERIFY_SESSION') {
                    console.log('[Parent] VERIFY_SESSION received from module:', data.source);
                    const requestId = data.payload?.requestId || data.requestId;
                    
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage({
                            type: 'VERIFY_RESPONSE',
                            requestId: requestId,
                            payload: {
                                valid: true,
                                timestamp: Date.now(),
                                module: data.source
                            }
                        }, '*');
                        console.log('[Parent] ✅ VERIFY_RESPONSE sent');
                    }
                    return;
                }

                if (data.type === 'CHILD_READY') {
                    const targetModule = data.module || data.source || data.payload?.module || null;
                    console.log(`📡 CHILD_READY from ${targetModule || 'unknown'}`);
                    
                    if (targetModule) {
                        registerModule(targetModule);
                    }
                    
                    if (targetModule && moduleToIframeId[targetModule]) {
                        const iframe = document.getElementById(moduleToIframeId[targetModule]);
                        if (iframe && iframe.contentWindow) {
                            if (cachedToken && cachedUserId) {
                                sendSessionToModule(iframe, targetModule);
                            } else {
                                updateSessionCache();
                                if (cachedToken && cachedUserId) {
                                    sendSessionToModule(iframe, targetModule);
                                }
                            }
                        }
                    } else {
                        sendToAllModulesIfNeeded(true);
                    }
                }

                if (data.type === 'FRIEND_ACCEPTED' || data.type === 'FRIEND_REJECTED' || data.type === 'FRIEND_REMOVED') {
                    console.log(`[Parent] Broadcasting ${data.type} event to all modules`, data.payload);
                    dispatchEventToModules({
                        type: data.type,
                        payload: data.payload || data,
                        originalSource: data.source || 'child-module'
                    });
                }

                if (data.type === 'API_REQUEST') {
                    let endpoint = data.payload?.endpoint || data.endpoint;
                    if (!endpoint) {
                        console.error('[Parent] API_REQUEST missing endpoint:', data);
                        return;
                    }
                    if (endpointMappings[endpoint]) {
                        endpoint = endpointMappings[endpoint];
                    }
                    if (endpoint.startsWith('/api/')) {
                        endpoint = endpoint.substring(4);
                    }
                    if (!endpoint.startsWith('/')) {
                        endpoint = '/' + endpoint;
                    }

                    const requestId = data.payload?.requestId || data.requestId;
                    const method = data.payload?.method || data.method || 'GET';
                    const body = data.payload?.body || data.body;
                    const params = data.payload?.params || data.params || null;

                    try {
                        if (window.api && window.api.core && window.api.core.waitFor) {
                            await window.api.core.waitFor();
                        }

                        let response;
                        if (method === 'GET') {
                            response = await window.api.get(endpoint, params || {});
                        } else if (method === 'POST') {
                            response = await window.api.post(endpoint, body);
                        } else if (method === 'PUT') {
                            response = await window.api.put(endpoint, body);
                        } else if (method === 'DELETE') {
                            response = await window.api.del(endpoint);
                        } else {
                            response = await window.api.request(endpoint, { method, body });
                        }

                        const isSuccess = response && (response.success === true || (response.status && response.status >= 200 && response.status < 300));
                        const responsePayload = isSuccess ? {
                            success: true,
                            data: response.data !== undefined ? response.data : response,
                            statusCode: response.status || 200
                        } : {
                            success: false,
                            error: response?.message || response?.error || 'Request failed',
                            statusCode: response?.status || 500,
                            data: response?.data || null
                        };

                        if (event.source && event.source.postMessage) {
                            event.source.postMessage({
                                type: 'API_RESPONSE',
                                requestId: requestId,
                                payload: responsePayload,
                                timestamp: new Date().toISOString()
                            }, '*');
                        }
                    } catch (error) {
                        console.error(`[Parent] API error: ${endpoint}`, error);
                        if (event.source && event.source.postMessage) {
                            event.source.postMessage({
                                type: 'API_RESPONSE',
                                requestId: requestId,
                                payload: {
                                    success: false,
                                    error: error.message || 'Request failed',
                                    statusCode: error.status || 500,
                                    data: null
                                },
                                timestamp: new Date().toISOString()
                            }, '*');
                        }
                    }
                }

                // ==================== SWITCH_MODULE WITH BOTH CHAT AND CALL SUPPORT ====================
                if (data.type === 'SWITCH_MODULE') {
                    console.log('[Parent] Switching to module:', data.module);
                    const targetModuleName = data.module;
                    let targetIframe = null;

                    for (const [moduleName, iframeId] of Object.entries(moduleToIframeId)) {
                        const iframe = document.getElementById(iframeId);
                        if (iframe && (moduleName === targetModuleName || iframe.src.includes(targetModuleName))) {
                            targetIframe = iframe;
                            break;
                        }
                    }

                    document.querySelectorAll('.iframe-container').forEach(container => {
                        container.classList.add('hidden');
                    });
                    if (targetIframe) {
                        const parentContainer = targetIframe.closest('.iframe-container');
                        if (parentContainer) parentContainer.classList.remove('hidden');
                    } else {
                        const targetContainer = document.getElementById(`${targetModuleName}Content`);
                        if (targetContainer) targetContainer.classList.remove('hidden');
                    }

                    document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(btn => {
                        if (btn.dataset.page === targetModuleName) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                    
                    if (window.innerWidth <= 768) {
                        if (targetModuleName === 'messages') {
                            document.body.classList.remove('chat-panel-active');
                        } else {
                            document.body.classList.remove('chat-panel-active');
                        }
                    }

                    if (targetModuleName === 'calls' && data.payload && data.payload.userId) {
                        console.log('[Parent] 🎯 Switching to CALLS module with user:', data.payload);
                        
                        const callPayload = {
                            userId: data.payload.userId,
                            userName: data.payload.userName || data.payload.name || data.payload.displayName || 'User',
                            callType: data.payload.callType || 'voice',
                            timestamp: Date.now(),
                            source: data.payload.source || 'friends-module'
                        };
                        
                        sessionStorage.setItem('pending_call', JSON.stringify(callPayload));
                        window.__pendingCall = callPayload;
                        
                        const callEvent = {
                            type: 'OPEN_CALL_WITH_USER',
                            payload: callPayload,
                            source: 'parent-frame',
                            timestamp: Date.now()
                        };
                        
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage(callEvent, '*');
                            console.log('📞 SENT OPEN_CALL_WITH_USER to calls module:', callPayload);
                            
                            setTimeout(() => {
                                callsIframe.contentWindow.postMessage(callEvent, '*');
                                console.log('📞 RE-SENT OPEN_CALL_WITH_USER to calls module (delayed)');
                            }, 500);
                            
                            setTimeout(() => {
                                callsIframe.contentWindow.postMessage(callEvent, '*');
                                console.log('📞 FINAL SEND OPEN_CALL_WITH_USER to calls module');
                            }, 1500);
                        } else {
                            console.warn('[Parent] Calls iframe not available for call initiation');
                            window.__pendingCallOnLoad = callPayload;
                        }
                    }

                    if (targetModuleName === 'messages' && data.payload && data.payload.userId) {
                        console.log('[Parent] 🎯 Switching to MESSAGES module with user:', data.payload);
                        
                        const chatPayload = {
                            userId: data.payload.userId,
                            userName: data.payload.userName || data.payload.name || data.payload.displayName || 'User',
                            timestamp: data.payload.timestamp || Date.now(),
                            source: data.payload.source || 'friends-module'
                        };
                        
                        sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                        window.__pendingChat = chatPayload;
                        
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            const chatEvent = {
                                type: 'OPEN_CHAT_WITH_USER',
                                payload: chatPayload,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            };
                            messagesIframe.contentWindow.postMessage(chatEvent, '*');
                            console.log('💬 SENT OPEN_CHAT_WITH_USER to messages module:', chatPayload);
                        }
                    }

                    if (data.payload && data.payload.userId && !targetModuleName) {
                        console.log('[Parent] Legacy payload, saving to pending_chat:', data.payload);
                        sessionStorage.setItem('pending_chat', JSON.stringify(data.payload));
                        window.__pendingChat = data.payload;
                    }
                }

                if (data.type === 'DIRECT_CHAT_REQUEST') {
                    console.log('[Parent] Direct chat request for user:', data.payload);
                    const chatPayload = {
                        userId: data.payload.userId,
                        userName: data.payload.userName || data.payload.name || 'User',
                        timestamp: Date.now()
                    };
                    sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                    window.__pendingChat = chatPayload;

                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        messagesIframe.contentWindow.postMessage({
                            type: 'OPEN_CHAT_WITH_USER',
                            payload: chatPayload,
                            source: 'parent-frame',
                            timestamp: Date.now()
                        }, '*');

                        document.querySelectorAll('.iframe-container').forEach(c => c.classList.add('hidden'));
                        const messagesContainer = document.getElementById('messagesContent');
                        if (messagesContainer) messagesContainer.classList.remove('hidden');

                        document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(btn => {
                            if (btn.dataset.page === 'messages') {
                                btn.classList.add('active');
                            } else {
                                btn.classList.remove('active');
                            }
                        });
                        
                        if (window.innerWidth <= 768) {
                            document.body.classList.add('chat-panel-active');
                        }
                    }
                }

                if (data.type === 'DIRECT_CALL_REQUEST') {
                    console.log('[Parent] Direct call request for user:', data.payload);
                    const callPayload = {
                        userId: data.payload.userId,
                        userName: data.payload.userName || data.payload.name || 'User',
                        callType: data.payload.callType || 'voice',
                        timestamp: Date.now()
                    };
                    
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'OPEN_CALL_WITH_USER',
                            payload: callPayload,
                            source: 'parent-frame',
                            timestamp: Date.now()
                        }, '*');

                        document.querySelectorAll('.iframe-container').forEach(c => c.classList.add('hidden'));
                        const callsContainer = document.getElementById('callsContent');
                        if (callsContainer) callsContainer.classList.remove('hidden');

                        document.querySelectorAll('.nav-icon, .mobile-nav-icon').forEach(btn => {
                            if (btn.dataset.page === 'calls') {
                                btn.classList.add('active');
                            } else {
                                btn.classList.remove('active');
                            }
                        });
                    }
                }

                if (data.type === 'API_RESPONSE' && data.status === 401) {
                    console.log('[Parent] Received 401, attempting token refresh');
                    await refreshAuthToken();
                }

                // ==================== REFRESH CALL HISTORY HANDLER ====================
                if (data.type === 'REFRESH_CALL_HISTORY') {
                    console.log('[Parent] Refreshing call history');
                    const userId = data.payload?.userId || cachedUserId;
                    if (userId) {
                        await refreshCallHistoryForUser(userId);
                    }
                    return;
                }

                // ==================== CALL SIGNALING HANDLERS (FIXED) ====================
                if (data.type === 'CALL_INITIATE') {
                    const payload = data.payload || {};
                    const { callId, callType } = payload;
                    const participants = payload.participants;
                    const participantIds = payload.participantIds;
                    const directCalleeId = payload.calleeId;
                    
                    let calleeId = directCalleeId 
                        || (Array.isArray(participantIds) && participantIds[0])
                        || (Array.isArray(participants) && participants[0])
                        || participants;
                    
                    if (typeof calleeId === 'object' && calleeId !== null) {
                        calleeId = calleeId.id || calleeId.userId;
                    }
                    
                    const src = event.source;
                    
                    try {
                        // FIX: Use correct endpoint /calls/start
                        const response = await window.api.post('/calls/start', {
                            participantIds: [parseInt(calleeId)],
                            callType: callType === 'video' ? 'video' : 'audio',
                            isGroupCall: false
                        });
                        
                        const ok = !!(response?.success || response?.status === 'success' || response?.data?.callId);
                        
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_INITIATED',
                                payload: {
                                    success: ok,
                                    callId: response?.data?.call?.id || response?.data?.callId || callId,
                                    data: response?.data || null,
                                    error: ok ? null : (response?.message || response?.data?.message || 'Failed to start call')
                                }
                            }, '*');
                        }
                        
                        // Refresh call history after initiating call
                        if (ok) {
                            setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                        }
                    } catch (err) {
                        console.error('[Parent] CALL_INITIATE error:', err);
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_INITIATED',
                                payload: { success: false, callId, error: err.message }
                            }, '*');
                        }
                    }
                }

                if (data.type === 'CALL_ACCEPT') {
                    const { callId } = data.payload || {};
                    const src = event.source;
                    try {
                        // FIX: Use correct endpoint /calls/${callId}/accept
                        const response = await window.api.post(`/calls/${callId}/accept`, {});
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_ACCEPTED',
                                payload: {
                                    success: !!(response?.success || response?.status === 'success'),
                                    callId,
                                    data: response?.data || null
                                }
                            }, '*');
                        }
                        
                        // Refresh call history after accepting call
                        setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                    } catch (err) {
                        console.error('[Parent] CALL_ACCEPT error:', err);
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_ACCEPTED',
                                payload: { success: false, callId, error: err.message }
                            }, '*');
                        }
                    }
                }

                if (data.type === 'CALL_REJECT') {
                    const { callId } = data.payload || {};
                    const src = event.source;
                    try {
                        await window.api.post(`/calls/${callId}/reject`, {});
                        if (src && src.postMessage) {
                            src.postMessage({ 
                                type: 'CALL_REJECTED', 
                                payload: { success: true, callId } 
                            }, '*');
                        }
                        
                        // Refresh call history after rejecting call (marks as missed)
                        setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                    } catch (err) {
                        console.warn('[Parent] CALL_REJECT error:', err);
                        if (src && src.postMessage) {
                            src.postMessage({ 
                                type: 'CALL_REJECTED', 
                                payload: { success: false, callId, error: err.message } 
                            }, '*');
                        }
                    }
                }

                if (data.type === 'CALL_ENDED') {
                    const { callId, duration } = data.payload || {};
                    try {
                        await window.api.post(`/calls/${callId}/end`, { duration: duration || 0 });
                        
                        // Refresh call history after ending call
                        setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                    } catch (err) {
                        console.warn('[Parent] CALL_ENDED error (non-critical):', err);
                    }
                }

                if (data.type === 'GET_CALL_HISTORY') {
                    const src = event.source;
                    try {
                        const response = await window.api.get('/calls/history', { limit: 100 });
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_HISTORY_RESPONSE',
                                payload: {
                                    success: true,
                                    calls: response?.data?.calls || response?.calls || []
                                }
                            }, '*');
                        }
                    } catch (err) {
                        console.warn('[Parent] GET_CALL_HISTORY error:', err);
                        if (src && src.postMessage) {
                            src.postMessage({
                                type: 'CALL_HISTORY_RESPONSE',
                                payload: { success: false, error: err.message, calls: [] }
                            }, '*');
                        }
                    }
                }

                if (data.type === 'SIGNAL_OFFER' || data.type === 'SIGNAL_ANSWER' || data.type === 'ICE_CANDIDATE') {
                    const { targetUserId } = data.payload || {};
                    if (targetUserId && window.wsService && window.wsService.sendToUser) {
                        window.wsService.sendToUser(targetUserId, data.type.toLowerCase(), data.payload);
                    }
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: data.type, payload: data.payload }, '*');
                    }
                }
            });

            if (window.wsService && typeof window.wsService.on === 'function') {
                window.wsService.on('call:incoming', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({
                            type: 'CALL_INCOMING',
                            payload: callData
                        }, '*');
                    }
                });
                window.wsService.on('call:answered', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ACCEPTED', payload: callData }, '*');
                    }
                    // Refresh call history
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                window.wsService.on('call:rejected', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_REJECTED', payload: callData }, '*');
                    }
                    // Refresh call history
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                window.wsService.on('call:ended', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ENDED', payload: callData }, '*');
                    }
                    // Refresh call history
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
                window.wsService.on('ice_candidate', function(data) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'ICE_CANDIDATE', payload: data }, '*');
                    }
                });
                window.wsService.on('call_offer', function(data) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'SIGNAL_OFFER', payload: data }, '*');
                    }
                });
                window.wsService.on('call_answer', function(data) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'SIGNAL_ANSWER', payload: data }, '*');
                    }
                });
            }

            setTimeout(() => {
                sendToAllModulesIfNeeded(true);
                // Initial call history refresh
                if (cachedUserId) {
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 2000);
                }
            }, 1000);
        })();

        // ======================================================================
        // PENDING CHAT & CALL INITIALIZATION ON PAGE LOAD
        // ======================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const pendingChat = sessionStorage.getItem('pending_chat');
            if (pendingChat) {
                console.log('[Parent] Found pending chat on load:', pendingChat);
                try {
                    const chatData = JSON.parse(pendingChat);
                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        setTimeout(() => {
                            messagesIframe.contentWindow.postMessage({
                                type: 'OPEN_CHAT_WITH_USER',
                                payload: chatData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            sessionStorage.removeItem('pending_chat');
                            window.__pendingChat = null;
                            
                            if (window.innerWidth <= 768) {
                                document.body.classList.add('chat-panel-active');
                            }
                        }, 1000);
                    }
                } catch(e) {
                    console.error('[Parent] Failed to parse pending chat:', e);
                }
            }
            
            const pendingCall = sessionStorage.getItem('pending_call');
            if (pendingCall) {
                console.log('[Parent] Found pending call on load:', pendingCall);
                try {
                    const callData = JSON.parse(pendingCall);
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        setTimeout(() => {
                            callsIframe.contentWindow.postMessage({
                                type: 'OPEN_CALL_WITH_USER',
                                payload: callData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            sessionStorage.removeItem('pending_call');
                            window.__pendingCall = null;
                        }, 1000);
                    }
                } catch(e) {
                    console.error('[Parent] Failed to parse pending call:', e);
                }
            }
            
            if (window.__pendingCallOnLoad) {
                setTimeout(() => {
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'OPEN_CALL_WITH_USER',
                            payload: window.__pendingCallOnLoad,
                            source: 'parent-frame',
                            timestamp: Date.now()
                        }, '*');
                        window.__pendingCallOnLoad = null;
                    }
                }, 1500);
            }
        });
    </script>
</body>
</html>
