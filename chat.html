    <script>
        // ======================================================================
        // PARENT ORCHESTRATION - CORE FUNCTIONALITY
        // ======================================================================
        (function originalParentFormat() {
            // console.log('📡 Parent broadcaster started');

            let cachedToken = null;
            let cachedUserId = null;
            let cachedUser = null;
            let cachedFriendsList = [];
            let apiReady = false;

            // FIX: Expose internal variables as live window getters so navigateToPage
            // (which lives outside this IIFE) can access them without a ReferenceError.
            Object.defineProperty(window, '__cachedToken',  { get: () => cachedToken,  configurable: true });
            Object.defineProperty(window, '__cachedUserId', { get: () => cachedUserId, configurable: true });
            window.__sendSessionToModule  = (iframe, mod) => { if (typeof sendSessionToModule  === 'function') sendSessionToModule(iframe, mod); };
            window.__pushSettingsToModule = (iframe, mod) => { if (typeof pushSettingsToModule === 'function') pushSettingsToModule(iframe, mod); };

            function waitForApi() {
                return new Promise((resolve) => {
                    if (window.api && window.api.get) {
                        apiReady = true;
                        resolve();
                        return;
                    }
                    const checkInterval = setInterval(() => {
                        if (window.api && window.api.get) {
                            apiReady = true;
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        console.warn('[Parent] API timeout, continuing without API');
                        resolve();
                    }, 5000);
                });
            }

            const requestThrottle = new Map();
            const THROTTLE_TIMES = {
                '/api/chats': 3000,
                '/api/friends': 3000,
                '/api/settings': 5000,
                '/api/groups': 3000,
                'default': 2000
            };

            function canMakeRequest(endpoint) {
                const now = Date.now();
                const lastRequest = requestThrottle.get(endpoint) || 0;
                const throttleTime = THROTTLE_TIMES[endpoint] || THROTTLE_TIMES.default;
                if (now - lastRequest < throttleTime) {
                    console.log(`[Throttle] Skipping ${endpoint} - ${now - lastRequest}ms since last request`);
                    return false;
                }
                requestThrottle.set(endpoint, now);
                return true;
            }

            const endpointMappings = {
                '/group/user': '/groups/user',
                '/group/user/': '/groups/user',
                '/group/invites': '/groups/invites',
                '/invites': '/groups/invites/user',
                '/group/moods': '/groups/moods',
                '/group/purposes': '/groups/purposes',
                '/group/notes': '/groups/notes',
                '/chats': '/chats',
                '/chats/': '/chats',
                '/messages': '/messages',
                '/messages/send': '/messages',
                '/friends': '/friends',
                '/friends/requests/incoming': '/friends/incoming',
                '/friends/requests/sent': '/friends/sent',
                '/friends/contacts/synced': '/friends/synced',
                '/friends/pinned': '/friends/pinned',
                '/friends/muted': '/friends/muted',
                '/friends/groups/user': '/groups/user',
                '/friends/requests/send': '/friends/send',
                '/friends/incoming': '/friends/incoming',
                '/friends/search': '/friends/search',
                '/friends/users/all': '/friends/users/all',
                '/friends/nearby': '/friends/nearby',
                '/settings': '/settings',
                '/profile': '/settings',
                '/users/settings': '/settings',
                '/users/profile': '/settings',
                '/users/blocked': '/settings/blocked-users',
                '/friends/contacts': '/friends',
                '/auth/me': '/auth/me',
                '/api/status': '/status',
                '/status': '/status',
                '/api/status/my': '/status/my',
                '/status/my': '/status/my',
                '/api/status/friends': '/status/friends',
                '/status/friends': '/status/friends',
                '/api/status/stats': '/status/stats',
                '/status/stats': '/status/stats',
                '/api/status/trending': '/status/trending',
                '/status/trending': '/status/trending',
                '/api/status/public': '/status/public',
                '/status/public': '/status/public',
                '/api/status/highlights': '/status/highlights',
                '/status/highlights': '/status/highlights',
                '/api/status/friends': '/status/friends',
                '/status/friends': '/status/friends',
                '/api/status/drafts': '/status/drafts',
                '/status/drafts': '/status/drafts',
                '/api/status/scheduled': '/status/scheduled',
                '/status/scheduled': '/status/scheduled',
                '/api/auth/me': '/auth/me',
                '/calls': '/calls/history',
                '/calls/': '/calls/history'
            };

            function getSessionData() {
                const token = localStorage.getItem('token') || 
                              localStorage.getItem('moodchat_token') || 
                              localStorage.getItem('accessToken');
                if (!token) {
                    // console.log('[Parent] No token found in localStorage');
                    return null;
                }

                let userId = null;
                let user = null;

                try {
                    const parts = token.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        userId = payload.userId || payload.id || payload.sub || payload.user_id || payload.uid;
                        if (userId) {
                            user = {
                                id: userId,
                                userId: userId,
                                username: payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                                email: payload.email || '',
                                displayName: payload.displayName || payload.username || payload.name || 'User',
                                firstName: payload.firstName || '',
                                lastName: payload.lastName || ''
                            };
                        }
                    }
                } catch (e) {
                    console.warn('[Parent] Failed to decode token:', e);
                }

                if (!userId) {
                    const authData = localStorage.getItem('kynecta_auth');
                    if (authData) {
                        try {
                            const parsed = JSON.parse(authData);
                            userId = parsed.userId || parsed.id || parsed.user?.id;
                            if (userId) user = parsed.user || parsed;
                        } catch(e) {}
                    }
                }

                if (!userId) return null;
                return { token, userId, user };
            }

            function updateSessionCache() {
                const session = getSessionData();
                if (session && session.userId) {
                    cachedToken = session.token;
                    cachedUserId = session.userId;
                    cachedUser = session.user || { id: session.userId, userId: session.userId, username: 'User' };
                    // console.log('[Parent] ✅ Session cache updated:', { userId: cachedUserId });
                    requestFriendsFromFriendIframe();
                } else {
                    cachedToken = null;
                    cachedUserId = null;
                    cachedUser = null;
                }
            }

            function requestFriendsFromFriendIframe() {
                const friendsIframe = document.getElementById('friendsIframe');
                if (friendsIframe && friendsIframe.contentWindow) {
                    friendsIframe.contentWindow.postMessage({ type: 'REQUEST_FRIENDS_LIST', source: 'parent' }, '*');
                }
            }

            function broadcastFriendsToAllModules(friends) {
                sendFriendsToCallsIframe(friends);
                sendFriendsToMessagesIframe(friends);
                sendFriendsToGroupIframe(friends);
                sendFriendsToStatusIframe(friends);
                sendFriendsToToolsIframe(friends);
                // // console.log('[Parent] Sent FRIENDS_LIST_UPDATE to all modules:', (friends || []).length, 'friends');
            }

            function sendSessionToModule(iframe, moduleName) {
                const isSettings = moduleName === 'settings';
                if (!cachedToken || !cachedUserId) {
                    if (isSettings) {
                        if (!iframe || !iframe.contentWindow) return;
                        iframe.contentWindow.postMessage({
                            type: 'PARENT_READY',
                            id: `parent_ready_${Date.now()}_${moduleName}`,
                            source: 'parent',
                            target: moduleName,
                            payload: { protocol: 'KYN-8.0', state: 'READY', message: 'Parent ready (no session)', session: null, userId: null },
                            timestamp: Date.now()
                        }, '*');
                        // [suppressed] sent PARENT_READY to settings (no session)
                    } else {
                        // [suppressed] no session for module
                    }
                    return;
                }
                if (!iframe || !iframe.contentWindow) {
                    // [suppressed] no iframe for module
                    return;
                }

                const userData = {
                    id: cachedUserId,
                    userId: cachedUserId,
                    username: cachedUser?.username || 'User',
                    displayName: cachedUser?.displayName || cachedUser?.username || 'User',
                    email: cachedUser?.email || '',
                    firstName: cachedUser?.firstName || '',
                    lastName: cachedUser?.lastName || ''
                };

                const sessionData = {
                    token: cachedToken,
                    user: userData,
                    authenticated: true,
                    expiresAt: Date.now() + 3600000,
                    ready: true,
                    userId: cachedUserId,
                    id: cachedUserId
                };

                iframe.contentWindow.postMessage({
                    type: 'SESSION_DATA',
                    id: `session_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: sessionData,
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'AUTH_READY',
                    id: `auth_ready_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        authenticated: true,
                        session: sessionData,
                        user: userData,
                        userId: cachedUserId,
                        timestamp: Date.now()
                    },
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'PARENT_READY',
                    id: `parent_ready_${Date.now()}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        protocol: 'KYN-8.0',
                        state: 'READY',
                        message: 'Parent is ready',
                        session: sessionData,
                        userId: cachedUserId
                    },
                    userId: cachedUserId,
                    timestamp: Date.now()
                }, '*');

                // console.log(`📡 Sent session to ${moduleName} (userId: ${cachedUserId})`);
                
                setTimeout(() => {
                    if (moduleName === 'calls') sendFriendsToCallsIframe();
                    if (moduleName === 'messages') sendFriendsToMessagesIframe();
                    if (moduleName === 'group') sendFriendsToGroupIframe();
                    if (moduleName === 'status') sendFriendsToStatusIframe();
                    if (moduleName === 'tools') sendFriendsToToolsIframe();
                }, 500);
            }

            let lastSessionSend = 0;
            const SESSION_SEND_INTERVAL = 30000;

            // ── Read cached settings from localStorage ──────────────────────
            function getCachedSettings() {
                try {
                    const raw = localStorage.getItem('knecta_settings_cache');
                    return raw ? JSON.parse(raw) : null;
                } catch(e) { return null; }
            }

            // ── Push the full cached settings object to one module iframe ───
            function pushSettingsToModule(iframe, moduleName) {
                if (!iframe || !iframe.contentWindow) return;
                const settings = getCachedSettings();
                if (!settings) return;
                iframe.contentWindow.postMessage({
                    type: 'SETTINGS_UPDATED',
                    source: 'parent',
                    target: moduleName,
                    payload: { settings, timestamp: Date.now() },
                    timestamp: Date.now()
                }, '*');
            }

            function sendToAllModulesIfNeeded(force = false) {
                const now = Date.now();
                if (!force && now - lastSessionSend < SESSION_SEND_INTERVAL) return;
                if (!cachedToken || !cachedUserId) return;
                lastSessionSend = now;
                Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                    const iframe = document.getElementById(iframeId);
                    if (iframe && iframe.contentWindow) {
                        sendSessionToModule(iframe, moduleName);
                        // Also push cached settings so every module has fresh preferences
                        setTimeout(() => pushSettingsToModule(iframe, moduleName), 200);
                    }
                });
                setTimeout(() => requestFriendsFromFriendIframe(), 1000);
            }

            async function refreshCallHistoryForUser(userId) {
                if (!cachedToken) return [];
                const callsIframe = document.getElementById('callsIframe');
                try {
                    console.log('[Parent] Refreshing call history for user:', userId);
                    const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';

                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'CALL_HISTORY_UPDATE',
                            payload: { calls: [], loading: true, timestamp: Date.now() }
                        }, '*');
                    }

                    let response = await fetch(`${baseUrl}/calls/history?limit=50`, {
                        headers: { 'Authorization': `Bearer ${cachedToken}` }
                    });
                    if (!response.ok && response.status === 404) {
                        response = await fetch(`${baseUrl}/calls?limit=50&page=1`, {
                            headers: { 'Authorization': `Bearer ${cachedToken}` }
                        });
                    }

                    if (response.ok) {
                        const data = await response.json();
                        const calls = data?.data?.calls || data?.calls || [];
                        console.log('[Parent] Loaded call history:', Array.isArray(calls) ? calls.length : 0, 'calls');
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_HISTORY_UPDATE',
                                payload: { calls: Array.isArray(calls) ? calls : [], loading: false, timestamp: Date.now() }
                            }, '*');
                        }
                        return Array.isArray(calls) ? calls : [];
                    } else {
                        console.warn('[Parent] Failed to load call history:', response.status, response.statusText);
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_HISTORY_UPDATE',
                                payload: { calls: [], loading: false, error: true, timestamp: Date.now() }
                            }, '*');
                        }
                    }
                } catch (err) {
                    console.warn('[Parent] Failed to refresh call history:', err);
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'CALL_HISTORY_UPDATE',
                            payload: { calls: [], loading: false, error: true, timestamp: Date.now() }
                        }, '*');
                    }
                }
                return [];
            }

            async function refreshAuthToken() {
                try {
                    const refreshToken = localStorage.getItem('refreshToken');
                    if (!refreshToken) return false;
                    const response = await fetch(`${window.__getApiBase()}/auth/refresh`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refreshToken }),
                        credentials: 'include'
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const newToken = data.token || data.accessToken;
                        if (newToken) {
                            localStorage.setItem('token', newToken);
                            localStorage.setItem('moodchat_token', newToken);
                            localStorage.setItem('accessToken', newToken);
                            const authData = localStorage.getItem('kynecta_auth');
                            if (authData) {
                                const parsed = JSON.parse(authData);
                                parsed.token = newToken;
                                localStorage.setItem('kynecta_auth', JSON.stringify(parsed));
                            }
                            console.log('[Parent] ✅ Token refreshed successfully');
                            updateSessionCache();
                            setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                            return true;
                        }
                    }
                    return false;
                } catch (error) {
                    console.error('[Parent] Token refresh error:', error);
                    return false;
                }
            }

            updateSessionCache();
            setInterval(updateSessionCache, 10000);

            window.addEventListener('storage', function(e) {
                if (e.key === 'token' || e.key === 'moodchat_token' || e.key === 'kynecta_auth' || e.key === 'accessToken') {
                    updateSessionCache();
                    setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                }
            });

            // ======================================================================
            // MAIN MESSAGE HANDLER - INCLUDING CALL HANDLING
            // ======================================================================
            window.addEventListener('message', async function(event) {
                if (!isTrustedOrigin(event.origin)) return;

                const data = event.data || {};
                if (!data || typeof data !== 'object') return;

                // ======================================================================
                // CALL HANDLING — UNIFIED, DEDUP-LOCKED, SOURCE-AWARE
                // ======================================================================
                //
                // Design rules:
                //  1. Only ONE code path sends OPEN_CALL_WITH_USER to the calls iframe.
                //     That path is __dispatchCallToIframe().
                //  2. A 2-second dedup lock prevents duplicate triggers from
                //     SWITCH_MODULE(calls) + INITIATE_CALL arriving simultaneously.
                //  3. Every call trigger stores __callReturnContext with:
                //       returnTo   : 'messages' | 'friends' | 'calls'
                //       chatUserId : the user to re-open (messages only)
                //       userName   : display name
                //       source     : the originating module string
                //  4. CALL_ENDED_RETURN reads __callReturnContext and navigates
                //     back to the correct module + re-opens the correct view.
                // ======================================================================

                if (!window.__callDispatchLock) window.__callDispatchLock = { ts: 0, userId: null };

                function __isCallDuplicate(userId) {
                    const lock = window.__callDispatchLock;
                    return lock.userId === String(userId) && (Date.now() - lock.ts) < 2000;
                }

                function __dispatchCallToIframe(userId, userName, callType, returnTo, chatUserId, source) {
                    if (__isCallDuplicate(userId)) {
                        console.log('[Parent] ⏭ Duplicate call dispatch suppressed for userId', userId);
                        return;
                    }
                    window.__callDispatchLock = { ts: Date.now(), userId: String(userId) };

                    // Normalise returnTo
                    if (returnTo === 'friends-page' || returnTo === 'friend') returnTo = 'friends';
                    else if (returnTo === 'chat' || returnTo === 'message') returnTo = 'messages';
                    else if (returnTo !== 'messages' && returnTo !== 'friends') returnTo = 'calls';

                    // Persist return context (used by CALL_ENDED_RETURN)
                    const ctx = { returnTo, chatUserId: chatUserId || userId, userName, source, ts: Date.now() };
                    window.__callReturnContext = ctx;
                    try { sessionStorage.setItem('call_return_ctx', JSON.stringify(ctx)); } catch(e) {}

                    console.log(`[Parent] 📞 Dispatching call → user=${userName}(${userId}) type=${callType} returnTo=${returnTo} source=${source}`);

                    navigateToPage('calls');

                    const callsIframe = document.getElementById('callsIframe');
                    if (!callsIframe) return;

                    const payload = {
                        userId, userName, callType,
                        returnTo, chatUserId: chatUserId || userId,
                        source, timestamp: Date.now()
                    };

                    // Send once after a short delay (lets the iframe activate).
                    // Do NOT also attach an onLoad listener — that caused the duplicate.
                    // If the iframe needs to reload it will pick up the pending_call from sessionStorage.
                    try { sessionStorage.setItem('pending_call', JSON.stringify(payload)); } catch(e) {}

                    setTimeout(() => {
                        if (callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'OPEN_CALL_WITH_USER',
                                payload,
                                source: 'parent-frame'
                            }, '*');
                        }
                    }, 400);
                }

                // ── Trigger 1: SWITCH_MODULE → calls (from messages chat header buttons)
                if (data.type === 'SWITCH_MODULE' && data.module === 'calls') {
                    const p = data.payload || {};
                    __dispatchCallToIframe(
                        p.userId, p.userName || 'User', p.callType || 'voice',
                        p.returnTo || 'messages', p.chatUserId || p.userId, 'messages-module'
                    );
                    return; // stop here — don't fall through to other SWITCH_MODULE handler
                }

                // ── Trigger 2: INITIATE_CALL (legacy path from some message components)
                if (data.type === 'INITIATE_CALL') {
                    const p = data.payload || {};
                    __dispatchCallToIframe(
                        p.userId, p.userName || 'User', p.callType || 'voice',
                        'messages', p.userId, 'messages-module'
                    );
                }

                // ── Handle CALL_ENDED_RETURN — navigate back to the correct module
                if (data.type === 'CALL_ENDED_RETURN') {
                    let ctx = window.__callReturnContext;
                    if (!ctx) {
                        try { const s = sessionStorage.getItem('call_return_ctx'); if (s) ctx = JSON.parse(s); } catch(e) {}
                    }
                    // Clean up
                    window.__callReturnContext = null;
                    window.__callDispatchLock = { ts: 0, userId: null };
                    try { sessionStorage.removeItem('call_return_ctx'); } catch(e) {}

                    const returnTo = ctx?.returnTo || 'calls';
                    console.log(`[Parent] 📞 Call ended → returnTo=${returnTo}`, ctx);

                    if (returnTo === 'messages') {
                        navigateToPage('messages');
                        if (ctx?.chatUserId) {
                            const msgIframe = document.getElementById('messagesIframe');
                            if (msgIframe && msgIframe.contentWindow) {
                                setTimeout(() => {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: {
                                            userId: ctx.chatUserId,
                                            userName: ctx.userName || 'User',
                                            returnFromCall: true,
                                            timestamp: Date.now()
                                        },
                                        source: 'parent-frame'
                                    }, '*');
                                    if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                                }, 300);
                            }
                        }
                    } else if (returnTo === 'friends') {
                        navigateToPage('friends');
                        const friendsIframe = document.getElementById('friendsIframe');
                        if (friendsIframe && friendsIframe.contentWindow) {
                            setTimeout(() => {
                                friendsIframe.contentWindow.postMessage({
                                    type: 'RETURN_FROM_CALL',
                                    payload: { returnFromCall: true, timestamp: Date.now() },
                                    source: 'parent-frame'
                                }, '*');
                            }, 300);
                        }
                    } else {
                        // returnTo === 'calls' — stay on calls, just show sidebar
                        navigateToPage('calls');
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) {
                            setTimeout(() => {
                                callsIframe.contentWindow.postMessage({
                                    type: 'SHOW_CALLS_SIDEBAR',
                                    payload: { timestamp: Date.now() },
                                    source: 'parent-frame'
                                }, '*');
                            }, 200);
                        }
                    }
                }

                // ======================================================================
                // VERIFY SESSION HANDLER
                // ======================================================================
                if (data.type === 'VERIFY_SESSION') {
                    console.log('[Parent] VERIFY_SESSION received from module:', data.source);
                    const requestId = data.payload?.requestId || data.requestId;
                    
                    if (event.source && event.source.postMessage) {
                        event.source.postMessage({
                            type: 'VERIFY_RESPONSE',
                            requestId: requestId,
                            payload: {
                                valid: true,
                                timestamp: Date.now(),
                                module: data.source
                            }
                        }, '*');
                        console.log('[Parent] ✅ VERIFY_RESPONSE sent');
                    }
                    return;
                }

                // ======================================================================
                // CHILD READY HANDLER
                // ======================================================================
                if (data.type === 'CHILD_READY') {
                    const targetModule = data.module || data.source || data.payload?.module || null;
                    if (targetModule) registerModule(targetModule);
                    
                    if (targetModule && moduleToIframeId[targetModule]) {
                        const iframe = document.getElementById(moduleToIframeId[targetModule]);
                        if (iframe && iframe.contentWindow) {
                            if (cachedToken && cachedUserId) {
                                sendSessionToModule(iframe, targetModule);
                            } else {
                                updateSessionCache();
                                if (cachedToken && cachedUserId) {
                                    sendSessionToModule(iframe, targetModule);
                                }
                            }
                            // Push cached settings 300ms after session so the module
                            // starts with the right theme/font/preferences immediately
                            setTimeout(() => pushSettingsToModule(iframe, targetModule), 300);
                        }
                    } else {
                        sendToAllModulesIfNeeded(true);
                    }
                }

                // ======================================================================
                // FRIEND EVENTS
                // ======================================================================
                if (data.type === 'FRIEND_ACCEPTED' || data.type === 'FRIEND_REJECTED' || data.type === 'FRIEND_REMOVED') {
                    console.log(`[Parent] Broadcasting ${data.type} event to all modules`, data.payload);
                    setTimeout(() => requestFriendsFromFriendIframe(), 500);
                    dispatchEventToModules({
                        type: data.type,
                        payload: data.payload || data,
                        originalSource: data.source || 'child-module'
                    });
                }

                // ======================================================================
                // SETTINGS HANDLERS
                // ======================================================================
                if (data.type === 'SETTINGS_UPDATED') {
                    const settings = data.settings || data.payload?.settings || {};
                    // 1. Persist to localStorage cache so tab switches restore correct values
                    try { localStorage.setItem('knecta_settings_cache', JSON.stringify(settings)); } catch(e) {}
                    // 2. Apply appearance changes to parent document immediately
                    if (settings.appearance?.theme || settings.theme) {
                        const theme = settings.appearance?.theme || settings.theme;
                        document.documentElement.setAttribute('data-theme', theme);
                        document.body.setAttribute('data-theme', theme);
                        try { localStorage.setItem('app_theme', theme); } catch(e) {}
                    }
                    // 3. Broadcast full SETTINGS_UPDATED to all modules
                    dispatchEventToModules({
                        type: 'SETTINGS_UPDATED',
                        payload: { settings, timestamp: Date.now() },
                        originalSource: 'settings'
                    });
                    // 4. Also fire individual SETTING_CHANGED for every section/key so
                    //    modules that only listen on that path also pick it up
                    Object.entries(settings).forEach(([section, secVal]) => {
                        if (secVal && typeof secVal === 'object') {
                            Object.entries(secVal).forEach(([key, value]) => {
                                dispatchEventToModules({
                                    type: 'SETTING_CHANGED',
                                    payload: { section, key, value, timestamp: Date.now() },
                                    originalSource: 'settings'
                                });
                            });
                        }
                    });
                }

                if (data.type === 'SETTINGS_GLOBAL_UPDATE') {
                    const { section, key, value } = data;
                    // 1. Apply to parent document
                    if (section === 'appearance') {
                        if (key === 'theme') {
                            const resolvedTheme = value === 'auto'
                                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                                : value;
                            document.documentElement.setAttribute('data-theme', resolvedTheme);
                            document.body.setAttribute('data-theme', resolvedTheme);
                            try { localStorage.setItem('app_theme', resolvedTheme); } catch(e) {}
                        }
                        if (key === 'fontSize') document.documentElement.style.fontSize = value + 'px';
                        if (key === 'accentColor') document.documentElement.style.setProperty('--accent-color', value);
                        if (key === 'language') { document.documentElement.setAttribute('lang', value); try { localStorage.setItem('app_language', value); } catch(e) {} }
                        if (key === 'compactMode') { document.documentElement.setAttribute('data-compact', value ? 'true' : 'false'); document.body.classList.toggle('compact-mode', !!value); }
                        if (key === 'animationsEnabled' || key === 'animations') { document.documentElement.setAttribute('data-animations', value ? 'true' : 'false'); document.body.classList.toggle('no-animations', !value); }
                    }
                    if (section === 'advanced') {
                        if (key === 'reduceMotion') { document.documentElement.setAttribute('data-reduce-motion', value ? 'true' : 'false'); document.body.classList.toggle('reduce-motion', !!value); }
                        if (key === 'performanceMode') document.documentElement.setAttribute('data-performance-mode', value ? 'true' : 'false');
                    }
                    if (section === 'mood' && key === 'currentMood') document.documentElement.setAttribute('data-mood', value);
                    // 2. Persist into the settings cache so tab switches restore it
                    try {
                        const existing = JSON.parse(localStorage.getItem('knecta_settings_cache') || '{}');
                        if (!existing[section]) existing[section] = {};
                        existing[section][key] = value;
                        localStorage.setItem('knecta_settings_cache', JSON.stringify(existing));
                    } catch(e) {}
                    // 3. Broadcast SETTING_CHANGED to all modules
                    dispatchEventToModules({
                        type: 'SETTING_CHANGED',
                        payload: { section, key, value, timestamp: Date.now() },
                        originalSource: 'settings'
                    });
                }

                // ======================================================================
                // STORAGE PROXY HANDLERS (for iframed modules using StorageProxy)
                // Modules postMessage STORAGE_GET/SET/REMOVE/CLEAR — parent handles
                // real localStorage access and sends back STORAGE_RESULT.
                // ======================================================================
                if (data.type === 'STORAGE_GET') {
                    let storedValue = null;
                    try { storedValue = localStorage.getItem(data.key); } catch(e) {}
                    try {
                        event.source.postMessage({
                            type: 'STORAGE_RESULT',
                            requestId: data.requestId,
                            value: storedValue,
                            error: null
                        }, '*');
                    } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_SET') {
                    try {
                        if (data.key && data.value !== undefined) {
                            localStorage.setItem(data.key, data.value);
                        }
                    } catch(e) {
                        console.warn('[Parent] STORAGE_SET failed:', data.key, e.message);
                    }
                    return;
                }

                if (data.type === 'STORAGE_REMOVE') {
                    try { if (data.key) localStorage.removeItem(data.key); } catch(e) {}
                    return;
                }

                if (data.type === 'STORAGE_CLEAR') {
                    // Only clear module-specific keys to avoid wiping auth tokens
                    try {
                        const prefix = data.prefix || 'knecta_';
                        const keysToRemove = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const k = localStorage.key(i);
                            if (k && k.startsWith(prefix)) keysToRemove.push(k);
                        }
                        keysToRemove.forEach(k => localStorage.removeItem(k));
                    } catch(e) {}
                    return;
                }

                // ======================================================================
                // FILE UPLOAD PROXY HANDLER
                // Modules can't do multipart POST directly (CORS, auth). They send
                // FILE_UPLOAD with base64 data; parent does the real fetch to /api/upload
                // and returns FILE_UPLOAD_RESULT with the hosted URL.
                // Falls back gracefully if /api/upload doesn't exist.
                // ======================================================================
                if (data.type === 'FILE_UPLOAD') {
                    const { requestId, fileName, fileType, fileSize, base64Data } = data;
                    const replySource = event.source;

                    const sendResult = (payload) => {
                        try {
                            if (replySource && replySource.postMessage) {
                                replySource.postMessage({ type: 'FILE_UPLOAD_RESULT', requestId, ...payload }, '*');
                            }
                        } catch(e) {}
                    };

                    try {
                        const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                        let token = null;
                        try {
                            token = localStorage.getItem('token') ||
                                    localStorage.getItem('moodchat_token') ||
                                    localStorage.getItem('accessToken');
                        } catch(e) {}

                        // Convert base64 dataURL back to Blob
                        const [meta, b64] = base64Data.split(',');
                        const mime = (meta.match(/:(.*?);/) || [])[1] || fileType || 'application/octet-stream';
                        const binary = atob(b64);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes], { type: mime });

                        const formData = new FormData();
                        formData.append('file', blob, fileName || 'upload');
                        formData.append('type', mime.split('/')[0]); // 'image' or 'video'

                        const headers = {};
                        if (token) headers['Authorization'] = 'Bearer ' + token;

                        const uploadRes = await fetch(baseUrl + '/upload', {
                            method: 'POST',
                            headers,
                            body: formData,
                            credentials: 'include'
                        });

                        if (uploadRes.ok) {
                            const json = await uploadRes.json().catch(() => ({}));
                            const url = json.url || json.data?.url || json.fileUrl || json.mediaUrl;
                            if (url) {
                                sendResult({ url, success: true });
                                return;
                            }
                        }
                        // Upload endpoint not available or returned no URL — signal failure so
                        // the module falls back to inline base64
                        sendResult({ error: 'Upload endpoint unavailable', success: false });
                    } catch(uploadErr) {
                        sendResult({ error: uploadErr.message || 'Upload failed', success: false });
                    }
                    return;
                }

                // ======================================================================
                // API REQUEST HANDLER
                // ======================================================================
                if (data.type === 'API_REQUEST') {
                    let endpoint = data.payload?.endpoint || data.endpoint;
                    if (!endpoint) {
                        console.error('[Parent] API_REQUEST missing endpoint:', data);
                        return;
                    }
                    if (endpointMappings[endpoint]) endpoint = endpointMappings[endpoint];
                    if (endpoint.startsWith('/api/')) endpoint = endpoint.substring(4);
                    if (!endpoint.startsWith('/')) endpoint = '/' + endpoint;

                    const requestId = data.payload?.requestId || data.requestId;
                    const method = data.payload?.method || data.method || 'GET';
                    const body = data.payload?.body || data.payload?.data || data.body || data.data || null;
                    const params = data.payload?.params || data.params || null;
                    const sourceModule = data.source || data.payload?.source || 'unknown';
                    
                    let token = data.payload?.token || cachedToken;
                    if (!token) {
                        try {
                            token = localStorage.getItem('token') || 
                                    localStorage.getItem('moodchat_token') || 
                                    localStorage.getItem('accessToken');
                        } catch(e) {}
                    }
                    
                    // // [suppressed] API_REQUEST log

                    try {
                        const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                        let url = baseUrl + endpoint;
                        
                        if (method === 'GET' && params && typeof params === 'object') {
                            const queryString = new URLSearchParams(params).toString();
                            if (queryString) url += '?' + queryString;
                        }
                        
                        const headers = {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        };
                        
                        if (token) headers['Authorization'] = `Bearer ${token}`;
                        
                        const fetchOptions = {
                            method: method,
                            headers: headers,
                            credentials: 'include'
                        };
                        
                        if (body && (method === 'POST' || method === 'PUT' || method === 'PATCH')) {
                            fetchOptions.body = JSON.stringify(body);
                        }
                        
                        const response = await fetch(url, fetchOptions);
                        let responseData;
                        
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            responseData = await response.json();
                        } else {
                            responseData = { message: await response.text() || 'Request completed' };
                        }
                        
                        const isSuccess = response.ok;
                        
                        const responsePayload = isSuccess ? {
                            success: true,
                            data: responseData,
                            statusCode: response.status
                        } : {
                            success: false,
                            error: responseData?.message || responseData?.error || `HTTP ${response.status}`,
                            statusCode: response.status,
                            data: responseData
                        };
                        
                        if (event.source && event.source.postMessage) {
                            event.source.postMessage({
                                type: 'API_RESPONSE',
                                requestId: requestId,
                                payload: responsePayload,
                                timestamp: new Date().toISOString()
                            }, '*');
                        }
                        
                    } catch (error) {
                        console.error(`[Parent] API error for ${sourceModule}: ${endpoint}`, error);
                        if (event.source && event.source.postMessage) {
                            event.source.postMessage({
                                type: 'API_RESPONSE',
                                requestId: requestId,
                                payload: {
                                    success: false,
                                    error: error.message || 'Network request failed',
                                    statusCode: 0,
                                    data: null
                                },
                                timestamp: new Date().toISOString()
                            }, '*');
                        }
                    }
                }

                // ======================================================================
                // MODULE SWITCHING
                // ======================================================================
                if (data.type === 'SWITCH_MODULE' && data.module !== 'calls') {
                    const targetModule = data.module;
                    console.log('[Parent] Switching to module:', targetModule, data.payload);
                    navigateToPage(targetModule);

                    // After returning from a call → re-open the correct chat/friend view
                    if (data.payload?.returnFromCall) {
                        if (targetModule === 'messages' && data.payload?.openChatWith) {
                            const msgIframe = document.getElementById('messagesIframe');
                            if (msgIframe && msgIframe.contentWindow) {
                                setTimeout(() => {
                                    msgIframe.contentWindow.postMessage({
                                        type: 'OPEN_CHAT_WITH_USER',
                                        payload: {
                                            userId: data.payload.openChatWith,
                                            returnFromCall: true,
                                            timestamp: Date.now()
                                        },
                                        source: 'parent-frame'
                                    }, '*');
                                    if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                                }, 300);
                            }
                        } else if (targetModule === 'friends') {
                            const friendsIframe = document.getElementById('friendsIframe');
                            if (friendsIframe && friendsIframe.contentWindow) {
                                setTimeout(() => {
                                    friendsIframe.contentWindow.postMessage({
                                        type: 'RETURN_FROM_CALL',
                                        payload: { returnFromCall: true, timestamp: Date.now() },
                                        source: 'parent-frame'
                                    }, '*');
                                }, 300);
                            }
                        }
                    }
                }

                if (data.type === 'DIRECT_CHAT_REQUEST') {
                    const chatPayload = {
                        userId: data.payload.userId,
                        userName: data.payload.userName || data.payload.name || 'User',
                        timestamp: Date.now()
                    };
                    sessionStorage.setItem('pending_chat', JSON.stringify(chatPayload));
                    window.__pendingChat = chatPayload;
                    navigateToPage('messages');
                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        messagesIframe.contentWindow.postMessage({
                            type: 'OPEN_CHAT_WITH_USER',
                            payload: chatPayload,
                            source: 'parent-frame',
                            timestamp: Date.now()
                        }, '*');
                        if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                    }
                }

                if (data.type === 'DIRECT_CALL_REQUEST') {
                    const p = data.payload || {};
                    // Capture the page user came FROM (before navigating to calls)
                    const returnTo = (window.__currentPage && window.__currentPage !== 'calls')
                        ? window.__currentPage
                        : (window.__lastActivePage || 'friends');
                    sendFriendsToCallsIframe();
                    __dispatchCallToIframe(
                        p.userId, p.userName || p.name || 'User', p.callType || 'voice',
                        returnTo, p.userId, 'friends-module'
                    );
                }

                if (data.type === 'CHILD_CLOSING') {
                    const returnPage = data.returnTo || window.__lastActivePage || 'messages';
                    console.log(`[Parent] CHILD_CLOSING from ${data.module || data.childId || 'unknown'}, returning to: ${returnPage}`);
                    navigateToPage(returnPage);
                    if (returnPage === 'messages') {
                        const messagesIframe = document.getElementById('messagesIframe');
                        if (messagesIframe && messagesIframe.contentWindow) {
                            setTimeout(() => {
                                messagesIframe.contentWindow.postMessage({ type: 'CALL_ENDED_RETURN', timestamp: Date.now() }, '*');
                            }, 200);
                        }
                    }
                }

                // ======================================================================
                // SIDEBAR CONTROL
                // ======================================================================
                if (data.type === 'HIDE_SIDEBAR_ICONS') {
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(function(el) {
                        el.style.opacity = '0.3';
                        el.style.pointerEvents = 'none';
                    });
                }
                if (data.type === 'SHOW_SIDEBAR_ICONS') {
                    document.querySelectorAll('.nav-icon, .mobile-nav-icon, .sidebar-nav .nav-item').forEach(function(el) {
                        el.style.opacity = '';
                        el.style.pointerEvents = '';
                    });
                }

                if (data.type === 'API_RESPONSE' && data.status === 401) {
                    console.log('[Parent] Received 401, attempting token refresh');
                    await refreshAuthToken();
                }

                if (data.type === 'REFRESH_CALL_HISTORY') {
                    const userId = data.payload?.userId || cachedUserId;
                    if (userId) await refreshCallHistoryForUser(userId);
                }

                // ======================================================================
                // CALL INITIATE - POST to /calls
                // ======================================================================
                if (data.type === 'CALL_INITIATE') {
                    const localCallId = data.payload?.callId;
                    const callType = data.payload?.callType || data.payload?.type || 'audio';
                    const calleeId = data.payload?.calleeId;
                    const participantIds = data.payload?.participantIds;
                    const isGroupCall = data.payload?.isGroupCall || false;
                    const callOriginPage = data.payload?.returnTo || window.__currentPage || window.__lastActivePage || 'calls';
                    window.__pendingCallOrigin = callOriginPage;
                    const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                    let token = cachedToken;
                    try {
                        if (!token) token = localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken');
                    } catch(e) {}

                    try {
                        const body = {
                            callType: callType === 'voice' ? 'audio' : callType,
                            isGroupCall: isGroupCall,
                        };
                        if (isGroupCall && participantIds) {
                            body.participantIds = participantIds;
                        } else if (calleeId) {
                            body.participantIds = [parseInt(calleeId)];
                        }

                        const resp = await fetch(`${baseUrl}/calls`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify(body)
                        });
                        const respData = await resp.json();

                        if (resp.ok && (respData.data?.call?.id || respData.data?.callId)) {
                            const serverCallId = respData.data?.call?.id || respData.data?.callId;
                            window.__callIdMap = window.__callIdMap || {};
                            window.__callIdMap[localCallId] = serverCallId;

                            const callsIframe = document.getElementById('callsIframe');
                            if (callsIframe && callsIframe.contentWindow) {
                                callsIframe.contentWindow.postMessage({
                                    type: 'CALL_INITIATED',
                                    payload: {
                                        ...(respData.data?.call || respData.data),
                                        callId: serverCallId,
                                        localCallId: localCallId,
                                        callType: callType,
                                        returnTo: callOriginPage,
                                        receiverOnline: respData.data?.receiverOnline !== false,
                                        success: true
                                    }
                                }, '*');
                            }
                        } else {
                            console.warn('[Parent] CALL_INITIATE failed:', respData);
                            const callsIframe = document.getElementById('callsIframe');
                            if (callsIframe && callsIframe.contentWindow) {
                                callsIframe.contentWindow.postMessage({
                                    type: 'CALL_INITIATED',
                                    payload: { success: false, error: respData?.message || 'Failed to start call', localCallId }
                                }, '*');
                            }
                        }
                    } catch(err) {
                        console.error('[Parent] CALL_INITIATE error:', err);
                        const callsIframe = document.getElementById('callsIframe');
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_INITIATED',
                                payload: { success: false, error: err.message, localCallId }
                            }, '*');
                        }
                    }
                }

                // Translate local callId to server UUID for API requests
                if (data.type === 'API_REQUEST' && window.__callIdMap) {
                    let ep = data.payload?.endpoint || '';
                    Object.entries(window.__callIdMap).forEach(([local, server]) => {
                        if (ep.includes(local)) {
                            data.payload.endpoint = ep.replace(local, server);
                        }
                    });
                }

                if (data.type === 'GET_FRIENDS_LIST') {
                    const src = event.source;
                    if (src && src.postMessage) {
                        src.postMessage({
                            type: 'FRIENDS_LIST_RESPONSE',
                            payload: { friends: cachedFriendsList, timestamp: Date.now() }
                        }, '*');
                    }
                    requestFriendsFromFriendIframe();
                }

                if (data.type === 'FRIENDS_DATA') {
                    const incoming = data.friends || data.payload?.friends || [];
                    if (Array.isArray(incoming) && incoming.length > 0) {
                        cachedFriendsList = incoming;
                        broadcastFriendsToAllModules(cachedFriendsList);
                    }
                }

                if (data.type === 'FETCH_LISTINGS') {
                    const requestId = data.payload?.requestId;
                    if (!requestId) return;
                    const page = data.payload?.page || 1;
                    const limit = data.payload?.limit || 20;
                    const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:4000/api';
                    let token = cachedToken;
                    if (!token) {
                        try { token = localStorage.getItem('token') || localStorage.getItem('moodchat_token') || localStorage.getItem('accessToken'); } catch(e) {}
                    }
                    if (!token) {
                        if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*');
                        return;
                    }
                    fetch(`${baseUrl}/marketplace/listings?page=${page}&limit=${limit}`, {
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        credentials: 'include'
                    }).then(r => r.json()).then(responseData => {
                        if (event.source) event.source.postMessage({
                            type: 'FETCH_LISTINGS_RESPONSE',
                            requestId,
                            payload: { data: responseData.data || { listings: [], total: 0 } }
                        }, '*');
                    }).catch(() => {
                        if (event.source) event.source.postMessage({ type: 'FETCH_LISTINGS_RESPONSE', requestId, payload: { data: { listings: [], total: 0 } } }, '*');
                    });
                }
            });

            // WebSocket call event listeners
            if (window.wsService && typeof window.wsService.on === 'function') {
                window.wsService.on('call:incoming', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_INCOMING', payload: callData }, '*');
                    }
                });
                window.wsService.on('call:answered', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ACCEPTED', payload: callData }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                window.wsService.on('call:rejected', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_REJECTED', payload: callData }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 1000);
                });
                window.wsService.on('call:ended', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_ENDED', payload: callData }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
                // Forward backend stale-cleanup events so frontend state fully resets
                window.wsService.on('call_force_ended', function(callData) {
                    const callsFrame = document.getElementById('callsIframe');
                    if (callsFrame && callsFrame.contentWindow) {
                        callsFrame.contentWindow.postMessage({ type: 'CALL_FORCE_ENDED', payload: callData }, '*');
                    }
                    setTimeout(() => refreshCallHistoryForUser(cachedUserId), 500);
                });
            }

            // Calls iframe load handler
            const callsIframe = document.getElementById('callsIframe');
            if (callsIframe) {
                callsIframe.addEventListener('load', function() {
                    console.log('[Parent] Calls iframe loaded, sending initial data');
                    
                    if (cachedToken && cachedUserId) {
                        const sessionData = {
                            token: cachedToken,
                            userId: cachedUserId,
                            user: cachedUser,
                            authenticated: true
                        };
                        callsIframe.contentWindow.postMessage({
                            type: 'SESSION_DATA',
                            payload: sessionData,
                            timestamp: Date.now()
                        }, '*');
                    }
                    
                    setTimeout(() => sendFriendsToCallsIframe(), 500);
                    
                    const pendingCall = sessionStorage.getItem('pending_call');
                    if (pendingCall) {
                        try {
                            const callData = JSON.parse(pendingCall);
                            callsIframe.contentWindow.postMessage({
                                type: 'OPEN_CALL_WITH_USER',
                                payload: callData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            sessionStorage.removeItem('pending_call');
                        } catch(e) {}
                    }
                });
            }

            setTimeout(() => {
                sendToAllModulesIfNeeded(true);
                requestFriendsFromFriendIframe();
                if (cachedUserId) setTimeout(() => refreshCallHistoryForUser(cachedUserId), 2000);
            }, 1000);
        })();

        // Pending chat and call handlers on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            const pendingChat = sessionStorage.getItem('pending_chat');
            if (pendingChat) {
                try {
                    const chatData = JSON.parse(pendingChat);
                    const messagesIframe = document.getElementById('messagesIframe');
                    if (messagesIframe && messagesIframe.contentWindow) {
                        setTimeout(() => {
                            messagesIframe.contentWindow.postMessage({
                                type: 'OPEN_CHAT_WITH_USER',
                                payload: chatData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            sessionStorage.removeItem('pending_chat');
                            if (window.innerWidth <= 768) document.body.classList.add('chat-panel-active');
                        }, 1000);
                    }
                } catch(e) {}
            }
            const pendingCall = sessionStorage.getItem('pending_call');
            if (pendingCall) {
                try {
                    const callData = JSON.parse(pendingCall);
                    const callsIframe = document.getElementById('callsIframe');
                    if (callsIframe && callsIframe.contentWindow) {
                        setTimeout(() => {
                            callsIframe.contentWindow.postMessage({
                                type: 'OPEN_CALL_WITH_USER',
                                payload: callData,
                                source: 'parent-frame',
                                timestamp: Date.now()
                            }, '*');
                            sessionStorage.removeItem('pending_call');
                        }, 1000);
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
