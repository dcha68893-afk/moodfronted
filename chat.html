<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kynecta - Advanced Mood-Based Chat</title>
    <style>
        :root {
            --app-primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 62%, #06b6d4 100%);
            --app-primary-color: #2563eb;
            --app-primary-dark: #1d4ed8;
            --app-primary-light: #dbeafe;
            --app-secondary-surface: #f8fafc;
            --app-secondary-muted: #e5e7eb;
            --app-accent-color: #8b5cf6;
            --app-accent-soft: #cffafe;
            --app-text-color: #0f172a;
            --app-text-secondary: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--app-secondary-surface);
            overflow: hidden;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        /* GLOBAL HEADER WITH PROFILE */
        #globalHeader {
            position: fixed;
            top: 0;
            left: 60px;
            right: 0;
            height: 56px;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.97), rgba(244,247,251,0.94)),
                linear-gradient(90deg, rgba(17,24,39,0.03), rgba(14,165,233,0.04));
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(15,23,42,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 95;
            box-shadow: 0 8px 24px rgba(15,23,42,0.06);
        }

        .header-context {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-module-badge {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--app-primary-gradient);
            color: #fff;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.18);
            flex: 0 0 auto;
        }

        .header-module-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header-module-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-module-subtitle {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.72);
            border: 2px solid rgba(124, 58, 237, 0.35);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .profile-trigger:hover {
            background: rgba(255,255,255,0.95);
            border-color: rgba(124, 58, 237, 0.65);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        
        /* Header module icons/actions (single source of truth in parent) */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-actions.hidden {
            display: none !important;
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(255,255,255,0.70);
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .header-action-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.95);
        }

        .header-action-btn i {
            font-size: 16px;
        }

        .profile-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7c3aed;
        }
        .profile-name-sm {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        /* PROFILE MODAL */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .profile-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-card {
            width: 90%;
            max-width: 480px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.3);
        }
        .cover-area {
            height: 160px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            cursor: pointer;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: -50px auto 12px;
            display: block;
            cursor: pointer;
            object-fit: cover;
            background: #f3f4f6;
        }
        .profile-info {
            text-align: center;
            padding: 0 20px 20px;
        }
        .profile-username {
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .profile-bio {
            color: #6b7280;
            font-size: 14px;
            margin: 8px 0;
        }
        .edit-profile-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
        }
        .profile-action-row {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-link-btn {
            background: #1f2937;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .profile-action-row .edit-profile-btn,
        .profile-action-row .settings-link-btn {
            margin-top: 0;
        }
        .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        #permanentSidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 60px;
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
            font-size: 20px;
            position: relative;
        }

        .nav-icon:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-icon.active {
            background: #7c3aed;
            color: white;
        }

        /* Call button animations */
        .nav-icon[data-page="calls"].call-incoming {
            animation: callPulse 1s ease infinite;
            background: rgba(124, 58, 237, 0.3);
        }

        @keyframes callPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); background: rgba(124, 58, 237, 0.5); }
        }

        /* Call active indicator */
        .call-active-indicator {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            animation: callActivePulse 1.5s infinite;
        }

        @keyframes callActivePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* INCOMING CALL BANNER - GLOBAL */
        #kyn-call-banner {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1f2937, #111827);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            display: none;
            align-items: center;
            gap: 20px;
            z-index: 10001;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .call-banner-actions button {
            background: white;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
        }
        .call-banner-actions .accept-call {
            background: #10b981;
            color: white;
        }
        .call-banner-actions .decline-call {
            background: #ef4444;
            color: white;
        }

        .incoming-call-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        .incoming-call-toast button {
            background: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .incoming-call-toast button.accept {
            background: #10b981;
            color: white;
        }

        .incoming-call-toast button.decline {
            background: #ef4444;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .iframe-container {
            position: fixed;
            top: 56px;
            left: 60px;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 90;
        }

        .iframe-container.hidden {
            display: none;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================================
           CENTER ACTION POPUP MENU
           ============================================================ */
        #centerActionMenu {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: linear-gradient(160deg, #1e2535, #141926);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
        }
        #centerActionMenu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .center-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            transition: background 0.18s, transform 0.15s;
            min-width: 90px;
        }
        .center-menu-item:active { transform: scale(0.94); }
        .center-menu-item:hover { background: rgba(255,255,255,0.12); }
        .center-menu-item i {
            font-size: 22px;
        }
        .center-menu-item span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .center-menu-calls i { color: #34d399; }
        .center-menu-group i { color: #60a5fa; }
        #centerMenuOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1099;
        }
        #centerMenuOverlay.open { display: block; }

        /* ============================================================
           PROFILE EDIT PANEL (full-screen, slides up from bottom)
           ============================================================ */
        #profileEditPanel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 10001;
            display: flex;
            align-items: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        #profileEditPanel.active {
            visibility: visible;
            opacity: 1;
        }
        .profile-edit-sheet {
            width: 100%;
            max-height: 90vh;
            background: #fff;
            border-radius: 28px 28px 0 0;
            overflow-y: auto;
            transform: translateY(40px);
            transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
        }
        #profileEditPanel.active .profile-edit-sheet {
            transform: translateY(0);
        }
        .profile-edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 12px;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 2;
        }
        .profile-edit-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
        }
        .profile-edit-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-edit-body {
            padding: 20px;
        }
        .profile-edit-cover {
            width: 100%; height: 130px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .profile-edit-cover img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .profile-edit-cover-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 13px; font-weight: 600; gap: 6px;
            opacity: 0; transition: opacity 0.2s;
        }
        .profile-edit-cover:hover .profile-edit-cover-overlay { opacity: 1; }
        .profile-edit-avatar-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .profile-edit-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 3px solid #7c3aed;
            object-fit: cover;
            cursor: pointer;
            flex-shrink: 0;
        }
        .profile-edit-avatar-hint {
            font-size: 13px; color: #64748b; line-height: 1.5;
        }
        .profile-edit-avatar-hint strong { color: #7c3aed; display: block; font-size: 14px; margin-bottom: 2px; }
        .profile-edit-field {
            margin-bottom: 16px;
        }
        .profile-edit-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .profile-edit-field input,
        .profile-edit-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.18s;
            font-family: inherit;
            resize: none;
        }
        .profile-edit-field input:focus,
        .profile-edit-field textarea:focus {
            border-color: #7c3aed;
            background: #fff;
        }
        .profile-edit-save {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .profile-edit-save:active { opacity: 0.85; }

        /* ============================================================
           ============================================================ */

        /* ---- Notch / pill shape cut-out behind center button ---- */
        .mobile-nav-bar::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: transparent;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 20px 0 0 rgba(13,17,26,0.97);
            pointer-events: none;
        }

        .mobile-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background: linear-gradient(180deg, rgba(10,13,22,0.98) 0%, rgba(13,17,28,0.99) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 1000;
            justify-content: space-around;
            align-items: center;
            padding: 0 6px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-shadow:
                0 -12px 40px rgba(0,0,0,0.55),
                0 -1px 0 rgba(255,255,255,0.05),
                inset 0 1px 0 rgba(255,255,255,0.04);
            transform: translateY(0);
            transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }

        /* Hide with smooth slide animation on chat/call screens */
        body.chat-panel-active .mobile-nav-bar,
        body.call-screen-active .mobile-nav-bar {
            transform: translateY(100%) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Ensure flex display persists on mobile */
        @media (max-width: 768px) {
            .mobile-nav-bar {
                display: flex !important;
            }
            body.chat-panel-active .mobile-nav-bar,
            body.call-screen-active .mobile-nav-bar {
                display: flex !important;
                transform: translateY(100%) !important;
                opacity: 0 !important;
            }
        }

        /* ---- Nav item wrapper ---- */
        .mobile-nav-icon {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 4px 8px;
            color: rgba(148, 163, 184, 0.55);
            cursor: pointer;
            font-size: 21px;
            position: relative;
            border: none;
            background: transparent;
            transition:
                color 0.25s ease,
                transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 16px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            min-height: 56px;
        }

        .mobile-nav-icon:active {
            transform: scale(0.84);
        }

        /* Icon label text */
        .mobile-nav-icon .nav-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
            transition: color 0.25s ease, opacity 0.25s ease;
            color: inherit;
            white-space: nowrap;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .mobile-nav-icon.active .nav-label {
            opacity: 1;
        }

        /* Active pill indicator above icon */
        .mobile-nav-icon::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 28px;
            height: 3px;
            border-radius: 3px;
            background: #3b82f6;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mobile-nav-icon.active::before {
            transform: translateX(-50%) scaleX(1);
        }

        /* Active glow dot indicator */
        .mobile-nav-icon::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #3b82f6;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mobile-nav-icon.active::after {
            transform: translateX(-50%) scale(1);
        }

        /* Active state — blue glow for navigation icons */
        .mobile-nav-icon.active {
            color: #60a5fa;
        }

        .mobile-nav-icon.active i {
            filter: drop-shadow(0 0 10px rgba(96,165,250,0.85));
        }

        /* Green tint for messaging/communication tabs */
        .mobile-nav-icon[data-page="messages"].active,
        .mobile-nav-icon[data-page="status"].active {
            color: #34d399;
        }

        .mobile-nav-icon[data-page="messages"].active i,
        .mobile-nav-icon[data-page="status"].active i {
            filter: drop-shadow(0 0 10px rgba(52,211,153,0.9));
        }

        .mobile-nav-icon[data-page="messages"].active::before,
        .mobile-nav-icon[data-page="status"].active::before {
            background: #34d399;
        }

        .mobile-nav-icon[data-page="messages"].active::after,
        .mobile-nav-icon[data-page="status"].active::after {
            background: #34d399;
        }

        /* ---- Marketplace/Tools icon gets accent color ---- */
        .mobile-nav-icon[data-page="tools"].active {
            color: #a78bfa;
        }
        .mobile-nav-icon[data-page="tools"].active i {
            filter: drop-shadow(0 0 10px rgba(167,139,250,0.9));
        }
        .mobile-nav-icon[data-page="tools"].active::before {
            background: #a78bfa;
        }

        // ======================================================================
        // ENVIRONMENT DETECTION & SESSION PROTECTION
        // ======================================================================
        window.__isLocalEnvironment = window.__isLocalEnvironment || function(hostname) {
            const host = String(hostname || window.location.hostname || '').toLowerCase();
            if (!host) return true;
            if (host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0') return true;
            if (host.endsWith('.local')) return true;
            if (host.startsWith('192.168.') || host.startsWith('10.')) return true;
            return /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
        };
        window.__getApiOrigin = window.__getApiOrigin || function() {
            return window.__isLocalEnvironment() ? 'http://localhost:3000' : 'https://moodchat-fy56.onrender.com';
        };
        window.__getApiBase = window.__getApiBase || function() {
            return `${window.__getApiOrigin()}/api`;
        };

        // Session protection - prevent clearing critical auth keys
        (function() {
            const originalRemove = localStorage.removeItem;
            window.__allowAuthStorageMutation__ = window.__allowAuthStorageMutation__ === true;
            window.__withAuthStorageMutation = function(callback) {
                const previous = window.__allowAuthStorageMutation__ === true;
                window.__allowAuthStorageMutation__ = true;
                try {
                    return typeof callback === 'function' ? callback() : undefined;
                } finally {
                    window.__allowAuthStorageMutation__ = previous;
                }
            };
            localStorage.removeItem = function(key) {
                originalRemove.call(this, key);
            };
        })();

        // ======================================================================
        // TRUSTED ORIGIN HELPER

        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            try {
                const url = new URL(origin);
                if (url.hostname === 'localhost' || url.hostname === '127.0.0.1') return true;
                if (url.protocol === 'https:' && url.hostname.endsWith('.onrender.com')) return true;
                if (url.origin === window.location.origin) return true;
            } catch(e) {}
            return false;
        }

            avatar: null, 
            cover: null, 
            bio: 'Hey there! I\'m using Kynecta.' 
        };

        function createInlineAvatar(name, bgColor = '#2563eb', fgColor = '#ffffff') {
            const safeName = String(name || 'User').trim() || 'User';
            const initials = safeName
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(part => part.charAt(0).toUpperCase())
                .join('') || 'U';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="${bgColor}"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="${fgColor}">${initials}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function normalizeAvatarUrl(url, name, bgColor = '#2563eb') {
            const fallback = createInlineAvatar(name, bgColor);
            if (!url) return fallback;
            const value = String(url);
            if (!navigator.onLine && /ui-avatars\.com|placehold\.co/i.test(value)) {
                return fallback;
            }
            return value;
        }

        function readCachedStatusArray(key) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function getCachedApiFallback(endpoint) {
            if (endpoint === '/auth/me') {
                return { user: cachedUser, data: cachedUser };
            }
            if (endpoint === '/status/my') {
                return { statuses: readCachedStatusArray('knecta_my_statuses_cache') };
            }
            if (endpoint === '/status/highlights') {
                return { statuses: readCachedStatusArray('knecta_status_highlights'), highlights: readCachedStatusArray('knecta_status_highlights') };
            }
            return null;
        }

        function loadCachedFriendsListFromStorage() {
            const candidates = [
                'friends',
                'kynecta_friends_cache',
                'knecta_friends_cache',
                'knecta_contacts_cache'
            ];
            for (const key of candidates) {
                try {
                    const parsed = JSON.parse(localStorage.getItem(key) || 'null');
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                    if (parsed && Array.isArray(parsed.friends) && parsed.friends.length > 0) {
                        return parsed.friends;
                    }
                } catch (_) {}
            }
            return [];
        }

        function loadCachedCallHistoryFromStorage() {
            try {
                const parsed = JSON.parse(localStorage.getItem('cached_call_history') || 'null');
                if (parsed && Array.isArray(parsed.calls)) {
                    return parsed.calls;
                }
            } catch (_) {}
            return [];
        }

        function loadUserProfileFromStorage() {
            try {
                const auth = localStorage.getItem('kynecta_auth');
                if (auth) {
                    const parsed = JSON.parse(auth);
                    const user = parsed.user || parsed;
                    currentUserProfile.id = user.id || user.userId || parsed.userId || parsed.id;
                    currentUserProfile.username = user.displayName || user.username || user.name || parsed.displayName || parsed.username || 'User';
                    currentUserProfile.avatar = user.avatar || user.photoURL || parsed.avatar || parsed.photoURL;
                    currentUserProfile.cover = user.cover || parsed.cover;
                    currentUserProfile.bio = user.bio || parsed.bio || 'Hey there! I\'m using Kynecta.';
                }
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                if (token && !currentUserProfile.id) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        currentUserProfile.id = payload.userId || payload.id;
                        currentUserProfile.username = payload.displayName || payload.username || payload.name || 'User';
                    } catch(e) {}
                }
                const savedAvatar = localStorage.getItem('user_avatar');
                if (savedAvatar) currentUserProfile.avatar = savedAvatar;
                const savedCover = localStorage.getItem('user_cover');
                if (savedCover) currentUserProfile.cover = savedCover;
                const savedBio = localStorage.getItem('user_bio');
                if (savedBio) currentUserProfile.bio = savedBio;
                updateProfileUI();
            } catch(e) {}
        }

            const avatarUrl = normalizeAvatarUrl(currentUserProfile.avatar, currentUserProfile.username, '#2563eb');
            document.getElementById('headerAvatar').src = avatarUrl;

            document.getElementById('modalCoverImg').src = currentUserProfile.cover || 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 200%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 x2=%221%22 y1=%220%22 y2=%221%22%3E%3Cstop stop-color=%22%23667eea%22/%3E%3Cstop offset=%221%22 stop-color=%22%23764ba2%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22600%22 height=%22200%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2250%25%22 y=%2252%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2230%22 font-weight=%22700%22 fill=%22white%22%3ECover Photo%3C/text%3E%3C/svg%3E';

        async function saveProfileUpdates(avatarFile, coverFile, bioText) {
            const baseUrl = window.__getApiBase();
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            if (!token) return;
            
            if (avatarFile) {
                const formData = new FormData();
                formData.append('avatar', avatarFile);
                try {
                    const res = await fetch(`${baseUrl}/users/avatar`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.avatarUrl) {
                            currentUserProfile.avatar = data.avatarUrl;
                            localStorage.setItem('user_avatar', data.avatarUrl);
                        }
                    }
                } catch(e) { console.warn('Avatar upload failed:', e); }
            }
            
            if (coverFile) {
                const formData = new FormData();
                formData.append('cover', coverFile);
                try {
                    const res = await fetch(`${baseUrl}/users/cover`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.coverUrl) {
                            currentUserProfile.cover = data.coverUrl;
                            localStorage.setItem('user_cover', data.coverUrl);
                        }
                    }
                } catch(e) { console.warn('Cover upload failed:', e); }
            }
            
            if (bioText !== undefined) {
                try {
                    await fetch(`${baseUrl}/users/profile`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bio: bioText })
                    });
                    currentUserProfile.bio = bioText;
                    localStorage.setItem('user_bio', bioText);
                } catch(e) { console.warn('Bio update failed:', e); }
            }
            updateProfileUI();
            
            // Broadcast to all modules
            dispatchEventToModules({
                type: 'UPDATE_PROFILE_DATA',
                payload: { avatar: currentUserProfile.avatar, cover: currentUserProfile.cover, bio: currentUserProfile.bio }
            });
        }

        // ======================================================================

        // ======================================================================
        function dispatchEventToModules(event) {
            const enrichedEvent = {
                ...event,
                source: 'parent',
                timestamp: event.timestamp || Date.now(),
                parentBroadcast: true,
                broadcastId: `${event.type}_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`
            };
            
            Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                if (enrichedEvent.targetModule && enrichedEvent.targetModule !== moduleName) {
                    return;
                }
                const iframe = document.getElementById(iframeId);
                if (iframe && iframe.contentWindow) {
                    try {
                        iframe.contentWindow.postMessage(enrichedEvent, '*');
                    } catch (error) {
                        console.error(`Failed to dispatch event to ${moduleName}:`, error);
                    }
                }
            });
        }

            if (moduleName && !moduleRegistry.has(moduleName)) {
                moduleRegistry.add(moduleName);

            }
        }

        function applyParentShellToIframe(iframe, page) {
            try {
                if (!iframe || !iframe.contentWindow) return;
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc || !doc.body) return;
                const shellVars = {
                    '--primary-color': '#22c55e',
                    '--primary-dark': '#16a34a',
                    '--primary-light': '#166534',
                    '--secondary-color': '#1e293b',
                    '--background-color': '#0f172a',

                    '--accent-soft': '#1e293b',
                    '--header-gradient': 'linear-gradient(135deg, #0f172a 0%, #1e293b 62%, #0f172a 100%)'
                };
                doc.body.setAttribute('data-parent-shell', 'true');
                doc.body.setAttribute('data-parent-module', page || iframe.dataset.module || '');
                if (doc.documentElement) {
                    doc.documentElement.setAttribute('data-parent-shell', 'true');
                    doc.documentElement.setAttribute('data-parent-module', page || iframe.dataset.module || '');
                }
                Object.entries(shellVars).forEach(([key, value]) => {
                    doc.documentElement?.style?.setProperty(key, value);
                    doc.body?.style?.setProperty(key, value);
                });

                // Inject global dark theme into this iframe
                injectDarkThemeIntoIframe(iframe);
            } catch (_error) {}
        }

        // ======================================================================
        // DARK THEME INJECTION INTO IFRAMES
        // Injects theme.colors.css + a <style> block into every child iframe
        // so ALL modules render consistently in dark mode.
        // ======================================================================
        function injectDarkThemeIntoIframe(iframe) {
            try {
                if (!iframe || !iframe.contentDocument) return;
                const doc = iframe.contentDocument;
                if (!doc || !doc.head) return;

                // Avoid double-injection
                if (doc.getElementById('kyn-dark-theme-link')) return;

                // 1) Inject theme.colors.css link
                const link = doc.createElement('link');
                link.id = 'kyn-dark-theme-link';
                link.rel = 'stylesheet';

                const cacheKey = `${status}:${networkState}:${detail || ''}`;
                if (window.__processLogCache.get(processKey) === cacheKey) return;
                window.__processLogCache.set(processKey, cacheKey);
                const writer = isSuccess ? console.info : console.warn;
                writer(`[${processKey}] ${status}${detail ? `: ${detail}` : ''}`);

        function notifyMessagesBackToList() {

        function getReturnPage() {
            if (window.__lastActivePage && window.__lastActivePage !== window.__currentPage) return window.__lastActivePage;
            if (window.__currentPage && window.__currentPage !== 'messages') return 'messages';
            return 'messages';
        }

        function handleAppBackNavigation() {
            const profileModal = document.getElementById('profileModal');
            if (profileModal && profileModal.classList.contains('active')) {
                profileModal.classList.remove('active');
                logProcessStatus('back-navigation', true, 'closed-profile-modal');
                return true;
            }

            const profilePanel = document.getElementById('profileEditPanel');
            if (profilePanel && profilePanel.classList.contains('active')) {
                profilePanel.classList.remove('active');
                logProcessStatus('back-navigation', true, 'closed-profile-editor');
                return true;
            }

            if (document.body.classList.contains('chat-panel-active')) {
                notifyMessagesBackToList();
                document.body.classList.remove('chat-panel-active');
                logProcessStatus('back-navigation', true, 'returned-chat-list');
                return true;
            }

            if (document.body.classList.contains('call-screen-active') || window.__activeCallInProgress) {
                notifyCallsCloseScreen();
                document.body.classList.remove('call-screen-active');
                window.__activeCallInProgress = false;
                const returnPage = getReturnPage();
                if (window.__currentPage !== returnPage) {
                    navigateToPage(returnPage);
                }
                logProcessStatus('back-navigation', true, 'closed-call-screen');
                return true;
            }

            if (window.__currentPage !== 'messages') {
                navigateToPage(getReturnPage());
                logProcessStatus('back-navigation', true, 'returned-previous-page');
                return true;

            logProcessStatus('back-navigation', false, 'no-previous-page');

        function syncBrowserHistoryState(page, replaceOnly) {

        function navigateToPage(page, options = {}) {

            if (!page) {

            const fromHistory = !!options.fromHistory;
            if (window.__currentPage !== page) {

                window.__currentPage = page;
                console.log('[Navigation] Page changed from', window.__lastActivePage, 'to', page);

            updateHeaderContext(page);
            updateHeaderActions(page);
            document.querySelectorAll('.iframe-container').forEach(c => c.classList.add('hidden'));

                if (!window.__activeCallInProgress) {

            if (page === 'calls')    setTimeout(() => sendFriendsToCallsIframe(), 300);
            if (page === 'messages') setTimeout(() => sendFriendsToMessagesIframe(), 300);
            if (page === 'group')    setTimeout(() => sendFriendsToGroupIframe(), 300);
            if (page === 'status')   setTimeout(() => sendFriendsToStatusIframe(), 300);
            if (page === 'tools')    setTimeout(() => sendFriendsToToolsIframe(), 300);

            const iframeId = moduleToIframeId[page];

                applyParentShellToIframe(iframe, page);

            const navElements = document.querySelectorAll('.nav-icon, .mobile-nav-icon');
            console.log('[Navigation] Found navigation elements:', navElements.length);
            
            navElements.forEach((btn, index) => {

                btn.addEventListener('click', (e) => {

        let loadingDismissed = false;
        function dismissLoadingScreen(delay = 250) {
            if (loadingDismissed) return;
            loadingDismissed = true;
            setTimeout(() => {
                const loading = document.getElementById('loadingScreen');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.classList.add('hidden'), 180);
                }

        }

        dismissLoadingScreen(350);
        
        // ======================================================================
        // CHAT AND CALL PANEL DETECTION FOR MOBILE
        // ======================================================================
        function setupPanelDetection() {
            const messagesIframe = document.getElementById('messagesIframe');
            if (!messagesIframe) return;
            
            window.addEventListener('message', function(event) {
                if (!isTrustedOrigin(event.origin)) return;
                const data = event.data || {};
                
                // Handle chat panel state
                if (data.type === 'CHAT_OPENED' || data.type === 'CONVERSATION_OPENED') {
                    // Apply on all widths — CSS only shows effect on mobile
                    document.body.classList.add('chat-panel-active');
                    // Clear pending_chat so all retry loops stop
                    try { sessionStorage.removeItem('pending_chat'); } catch (_) {}
                }
                if (data.type === 'CHAT_LIST_SHOWN' || data.type === 'CHAT_CLOSED' || data.type === 'GO_BACK_TO_CHAT_LIST') {
                    if (window.innerWidth <= 768) {
                        const messagesContainer = document.getElementById('messagesContent');
                        if (messagesContainer && !messagesContainer.classList.contains('hidden')) {
                            document.body.classList.remove('chat-panel-active');
                        }
                    }
                }
                
                // Handle call screen active state - CRITICAL FOR ICON HIDING
                if (data.type === 'CALL_SCREEN_ACTIVE') {
                    if (data.payload && data.payload.active === true) {
                        window.__activeCallInProgress = true;
                        document.body.classList.add('call-screen-active');
                        logProcessStatus('call-screen', true, 'active');
                    } else {
                        window.__activeCallInProgress = false;
                        document.body.classList.remove('call-screen-active');
                        logProcessStatus('call-screen', true, 'inactive');
                    }
                }
                
                // Handle call termination events from child
                if (data.type === 'CALL_ENDED' || data.type === 'CALL_FORCE_ENDED' || data.type === 'CALL_REJECTED') {
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            setupPanelDetection();
            dismissLoadingScreen(0);
            if (window.innerWidth <= 768) {
                document.body.classList.remove('chat-panel-active', 'call-screen-active');
            }
        });
        
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.body.classList.remove('chat-panel-active', 'call-screen-active');
            }
        });
    </script>

    <script>
        (function() {
            function afterShellRender(callback) {
                if (document.documentElement.classList.contains('kynecta-booted')) {
                    setTimeout(callback, 0);
                    return;
                }
                window.addEventListener('KYNECTA_UI_RENDERED', function onRendered() {
                    window.removeEventListener('KYNECTA_UI_RENDERED', onRendered);
                    setTimeout(callback, 0);
                });
            }

            function hasOfflineBootCache() {
                try {
                    const chatCache = JSON.parse(localStorage.getItem('kynecta_chats_cache_v8') || localStorage.getItem('knecta_chats_cache_v8') || 'null');
                    const callCache = JSON.parse(localStorage.getItem('cached_call_history') || 'null');
                    const friends = JSON.parse(localStorage.getItem('friends') || '[]');
                    return !!(
                        (chatCache && Array.isArray(chatCache.conversations) && chatCache.conversations.length > 0) ||
                        (callCache && Array.isArray(callCache.calls) && callCache.calls.length > 0) ||
                        (Array.isArray(friends) && friends.length > 0)
                    );
                } catch (_) {
                    return false;
                }
            }

            function validateChatSession() {
                const runtimeSession = window.AppRuntimeAuthority?.getSessionSnapshot?.();
                const stableSession = runtimeSession || (window.__getStableSessionData ? window.__getStableSessionData() : null);
                const token = stableSession?.token || null;
                const user = stableSession?.user || (() => {
                    try {
                        return JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('user') || 'null');
                    } catch (_) {
                        return null;
                    }
                })() || (() => {
                    if (!token) return null;
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        const derivedId = payload.userId || payload.id || payload.sub || null;
                        if (!derivedId) return null;
                        return {
                            id: derivedId,
                            userId: derivedId,
                            username: payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                            displayName: payload.displayName || payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                            email: payload.email || ''
                        };
                    } catch (_) {
                        return null;
                    }
                })();

                if (!token || !user) {
                    if (hasOfflineBootCache()) {
                        console.warn('[chat.html] Using offline cache while session validation is pending');
                        dismissLoadingScreen(0);
                        return;
                    }
                    // Offline-first shell: do not block render. Runtime authority can redirect later.
                    dismissLoadingScreen(0);
                    return;
                }

                window.AppRuntimeAuthority?.persistSession?.({
                    token,
                    refreshToken: stableSession?.refreshToken || null,
                    user,
                    expiresAt: stableSession?.expiresAt || null
                }, { emit: false });
                window.currentUser = user;

                if (window.Session?.setSession) {
                    window.Session.setSession({
                        token,
                        user,
                        refreshToken: stableSession?.refreshToken || null,
                        expiresAt: stableSession?.expiresAt || null
                    });
                }

                if (window.SessionManager?.updateActivity) {
                    window.SessionManager.updateActivity();
                }

                if (!navigator.onLine) {
                    console.warn('Offline mode');
                    return;
                }

                // Non-blocking validation. UI remains rendered even if token fails.
                if (window.AppRuntimeAuthority?.validateSessionInBackground) {
                    afterShellRender(() => {
                        window.AppRuntimeAuthority.validateSessionInBackground({ token, user }).catch(() => {});
                    });
                }
            }
            validateChatSession();
        })();
    </script>

            async function directApiRequest(endpoint, method, body, params, token) {

                if (body && !(body instanceof FormData)) headers['Content-Type'] = 'application/json';

                if (responseData && typeof responseData === 'object' && 'success' in responseData) {

                              localStorage.getItem('authToken') ||
                              localStorage.getItem('token') ||
                              localStorage.getItem('moodchat_token') ||
                              localStorage.getItem('accessToken');
                if (!token) return null;

                let user = session?.user || auth?.user || window.Session?.getUser?.() || null;
                let userId = user?.id || user?.userId || session?.userId || auth?.userId || auth?.id || null;

                if (!userId) {
                    try {
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            const payload = JSON.parse(atob(parts[1]));
                            userId = payload.userId || payload.id || payload.sub || payload.user_id || payload.uid || null;
                            if (!user && userId) {
                                user = {
                                    id: userId,
                                    userId: userId,
                                    username: payload.username || payload.name || payload.email?.split('@')[0] || 'User',
                                    email: payload.email || '',
                                    displayName: payload.displayName || payload.username || payload.name || 'User',
                                    firstName: payload.firstName || '',
                                    lastName: payload.lastName || ''
                                };
                            }
                        }
                    } catch (e) {
                        console.warn('[Parent] Failed to decode token:', e);
                    }
                }

                if (!userId) return null;
                return { token, userId: String(userId), user };
            }

            function updateSessionCache() {
                const session = getSessionData();
                const localFriends = loadCachedFriendsListFromStorage();
                if (localFriends.length > 0) {
                    cachedFriendsList = localFriends;
                    broadcastFriendsToAllModules(cachedFriendsList);
                }
                if (session && session.userId) {
                    cachedToken = session.token;
                    const normalizedUserId = Number(session.userId);
                    cachedUserId = Number.isFinite(normalizedUserId) ? normalizedUserId : session.userId;
                    cachedUser = session.user || { id: cachedUserId, userId: cachedUserId, username: 'User' };
                    if (cachedUser && (cachedUser.id == null || cachedUser.userId == null)) {
                        cachedUser.id = cachedUser.id ?? cachedUserId;
                        cachedUser.userId = cachedUser.userId ?? cachedUserId;
                    }
                    requestFriendsFromFriendIframe();
                } else {
                    cachedToken = null;
                    cachedUserId = null;
                    cachedUser = null;
                }
            }

            function requestFriendsFromFriendIframe() {
                const friendsIframe = document.getElementById('friendsIframe');
                if (friendsIframe && friendsIframe.contentWindow) {
                    friendsIframe.contentWindow.postMessage({ type: 'REQUEST_FRIENDS_LIST', source: 'parent' }, '*');
                }
            }

            function broadcastFriendsToAllModules(friends) {
                sendFriendsToCallsIframe(friends);
                sendFriendsToMessagesIframe(friends);
                sendFriendsToGroupIframe(friends);
                sendFriendsToStatusIframe(friends);
                sendFriendsToToolsIframe(friends);
            }

            function sendSessionToModule(iframe, moduleName) {
                window.__moduleSessionDispatchCache = window.__moduleSessionDispatchCache || {};
                const isSettings = moduleName === 'settings';
                if (!cachedToken || !cachedUserId) {
                    if (isSettings) {
                        if (!iframe || !iframe.contentWindow) return;
                        iframe.contentWindow.postMessage({
                            type: 'PARENT_READY',
                            id: `parent_ready_${Date.now()}_${moduleName}`,
                            source: 'parent',
                            target: moduleName,
                            payload: { protocol: 'KYN-8.0', state: 'READY', message: 'Parent ready (no session)', session: null, userId: null },
                            timestamp: Date.now()
                        }, '*');
                    }
                    return;
                }
                if (!iframe || !iframe.contentWindow) return;

                const now = Date.now();
                const sessionFingerprint = `${cachedUserId}:${String(cachedToken).slice(-24)}`;
                const lastDispatch = window.__moduleSessionDispatchCache[moduleName];
                if (lastDispatch &&
                    lastDispatch.fingerprint === sessionFingerprint &&
                    now - lastDispatch.timestamp < 1500) {
                    return;
                }
                window.__moduleSessionDispatchCache[moduleName] = {
                    fingerprint: sessionFingerprint,
                    timestamp: now
                };

                const numericUserId = Number(cachedUserId);
                const normalizedUserId = Number.isFinite(numericUserId) ? numericUserId : cachedUserId;
                const userData = {
                    id: normalizedUserId,
                    userId: normalizedUserId,
                    username: cachedUser?.username || 'User',
                    displayName: cachedUser?.displayName || cachedUser?.username || 'User',
                    email: cachedUser?.email || '',
                    firstName: cachedUser?.firstName || '',
                    lastName: cachedUser?.lastName || ''
                };

                const sessionData = {
                    token: cachedToken,
                    user: userData,
                    authenticated: true,
                    expiresAt: Date.now() + 3600000,
                    ready: true,
                    userId: normalizedUserId,
                    id: normalizedUserId
                };

                // ── patch v1: expose session on window so same-origin iframes
                // and services (services_friend.js, friendqueue_manager.js etc.)
                // can find the token without relying solely on postMessage ──
                window.__PARENT_SESSION__ = sessionData;
                window.AUTH_SESSION       = sessionData;

                iframe.contentWindow.postMessage({
                    type: 'SESSION_DATA',
                    id: `session_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: sessionData,
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'AUTH_READY',
                    id: `auth_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        authenticated: true,
                        session: sessionData,
                        user: userData,
                        userId: normalizedUserId,
                        timestamp: now
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');

                iframe.contentWindow.postMessage({
                    type: 'PARENT_READY',
                    id: `parent_ready_${now}_${moduleName}`,
                    source: 'parent',
                    target: moduleName,
                    payload: {
                        protocol: 'KYN-8.0',
                        state: 'READY',
                        message: 'Parent is ready',
                        session: sessionData,
                        userId: normalizedUserId
                    },
                    userId: normalizedUserId,
                    timestamp: now
                }, '*');
                
                setTimeout(() => {
                    if (moduleName === 'calls') sendFriendsToCallsIframe();
                    if (moduleName === 'messages') sendFriendsToMessagesIframe();
                    if (moduleName === 'group') sendFriendsToGroupIframe();
                    if (moduleName === 'status') sendFriendsToStatusIframe();
                    if (moduleName === 'tools') sendFriendsToToolsIframe();
                }, 500);
            }

            let lastSessionSend = 0;
            const SESSION_SEND_INTERVAL = 30000;

            (function earlyTokenInit() {
                try {
                    const t = localStorage.getItem('authToken') ||
                              localStorage.getItem('token') ||
                              localStorage.getItem('moodchat_token') ||
                              localStorage.getItem('accessToken');
                    if (t && !cachedToken) {
                        cachedToken = t;
                        const parts = t.split('.');
                        if (parts.length === 3) {
                            const p = JSON.parse(atob(parts[1]));
                            cachedUserId = p.userId || p.id || p.sub || null;
                        }
                    }
                } catch(e) {}
            })();

            function getCachedSettings() {
                try {
                    const raw = localStorage.getItem('knecta_settings_cache');
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    return parsed?.data || parsed;
                } catch(e) { return null; }
            }

            function persistCachedSettings(settings) {
                try {
                    localStorage.setItem('knecta_settings_cache', JSON.stringify({
                        data: settings || {},
                        timestamp: Date.now(),
                        version: '1.0.0'
                    }));
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function updateCachedSettingsPath(section, key, value) {
                const existing = getCachedSettings() || {};
                if (!existing[section] || typeof existing[section] !== 'object') existing[section] = {};
                existing[section][key] = value;
                persistCachedSettings(existing);
                return existing;
            }

            function pushSettingsToModule(iframe, moduleName) {
                if (!iframe || !iframe.contentWindow) return;
                const settings = getCachedSettings();
                if (!settings) return;
                iframe.contentWindow.postMessage({
                    type: 'SETTINGS_UPDATED',
                    source: 'parent',
                    target: moduleName,
                    payload: { settings, timestamp: Date.now() },
                    timestamp: Date.now()
                }, '*');
            }

            function emitGlobalAppEvent(type, payload, options = {}) {
                if (window.appEvents && typeof window.appEvents.emit === 'function') {
                    window.appEvents.emit(type, payload, options);
                    return;
                }
                if (window.KynectaEventBus && typeof window.KynectaEventBus.emit === 'function') {
                    window.KynectaEventBus.emit(type, payload, options);
                }
            }

            function sendToAllModulesIfNeeded(force = false) {
                const now = Date.now();
                if (!force && now - lastSessionSend < SESSION_SEND_INTERVAL) return;
                if (!cachedToken || !cachedUserId) updateSessionCache();
                if (!cachedToken || !cachedUserId) return;
                lastSessionSend = now;
                Object.entries(moduleToIframeId).forEach(([moduleName, iframeId]) => {
                    const iframe = document.getElementById(iframeId);
                    if (iframe && iframe.contentWindow) {
                        sendSessionToModule(iframe, moduleName);
                        setTimeout(() => pushSettingsToModule(iframe, moduleName), 200);
                    }
                });
                setTimeout(() => requestFriendsFromFriendIframe(), 1000);
            }

            async function refreshCallHistoryForUser(userId) {
                const cachedCalls = loadCachedCallHistoryFromStorage();
                const callsIframe = document.getElementById('callsIframe');
                if (callsIframe && callsIframe.contentWindow && cachedCalls.length > 0) {
                    callsIframe.contentWindow.postMessage({
                        type: 'CALL_HISTORY_UPDATE',
                        payload: { calls: cachedCalls, loading: false, cached: true, timestamp: Date.now() }
                    }, '*');
                }
                if (!cachedToken) {
                    return cachedCalls;
                }
                try {
                    console.log('[Parent] Refreshing call history for user:', userId);
                    const baseUrl = window.__getApiBase ? window.__getApiBase() : 'http://localhost:3000/api';

                    if (callsIframe && callsIframe.contentWindow && navigator.onLine) {
                        callsIframe.contentWindow.postMessage({
                            type: 'CALL_HISTORY_UPDATE',
                            payload: { calls: cachedCalls, loading: true, cached: cachedCalls.length > 0, timestamp: Date.now() }
                        }, '*');
                    }

                    if (!navigator.onLine) {
                        return cachedCalls;
                    }

                    let response = await fetch(`${baseUrl}/calls/history?limit=50`, {
                        headers: { 'Authorization': `Bearer ${cachedToken}` }
                    });
                    if (!response.ok && response.status === 404) {
                        response = await fetch(`${baseUrl}/calls?limit=50&page=1`, {
                            headers: { 'Authorization': `Bearer ${cachedToken}` }
                        });
                    }

                    if (response.ok) {
                        const data = await response.json();
                        const calls = data?.data?.calls || data?.calls || [];
                        console.log('[Parent] Loaded call history:', Array.isArray(calls) ? calls.length : 0, 'calls');
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_HISTORY_UPDATE',
                                payload: { calls: Array.isArray(calls) ? calls : [], loading: false, timestamp: Date.now() }
                            }, '*');
                        }
                        return Array.isArray(calls) ? calls : [];
                    } else {
                        console.warn('[Parent] Failed to load call history:', response.status);
                        if (callsIframe && callsIframe.contentWindow) {
                            callsIframe.contentWindow.postMessage({
                                type: 'CALL_HISTORY_UPDATE',
                                payload: { calls: cachedCalls, loading: false, error: true, cached: cachedCalls.length > 0, timestamp: Date.now() }
                            }, '*');
                        }
                    }
                } catch (err) {
                    console.warn('[Parent] Failed to refresh call history:', err);
                    if (callsIframe && callsIframe.contentWindow) {
                        callsIframe.contentWindow.postMessage({
                            type: 'CALL_HISTORY_UPDATE',
                            payload: { calls: cachedCalls, loading: false, error: true, cached: cachedCalls.length > 0, timestamp: Date.now() }
                        }, '*');
                    }
                }
                return cachedCalls;
            }

            async function refreshAuthToken() {
                try {
                    const refreshToken = localStorage.getItem('refreshToken');
                    if (!refreshToken) return false;
                    const response = await fetch(`${window.__getApiBase()}/auth/refresh`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refreshToken }),
                        credentials: 'include'
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const newToken = data.token || data.accessToken;
                        if (newToken) {
                            localStorage.setItem('authToken', newToken);
                            localStorage.setItem('token', newToken);
                            localStorage.setItem('moodchat_token', newToken);
                            localStorage.setItem('accessToken', newToken);
                            const authData = localStorage.getItem('kynecta_auth');
                            if (authData) {
                                const parsed = JSON.parse(authData);
                                parsed.token = newToken;
                                localStorage.setItem('kynecta_auth', JSON.stringify(parsed));
                            }
                            console.log('[Parent] ✅ Token refreshed successfully');
                            updateSessionCache();
                            setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                            return true;
                        }
                    }
                    return false;
                } catch (error) {
                    console.error('[Parent] Token refresh error:', error);
                    return false;
                }
            }

            function scheduleSessionCacheUpdate() {
                if (window.safeTimeout) {
                    window.safeTimeout(updateSessionCache, 150);
                } else {
                    setTimeout(updateSessionCache, 150);
                }
            }

            updateSessionCache();
            setInterval(scheduleSessionCacheUpdate, 30000);

            window.addEventListener('storage', function(e) {
                if (e.key === 'authToken' || e.key === 'token' || e.key === 'moodchat_token' || e.key === 'kynecta_auth' || e.key === 'accessToken') {
                    scheduleSessionCacheUpdate();
                    if (window.safeTimeout) {
                        window.safeTimeout(() => sendToAllModulesIfNeeded(true), 100);
                    } else {
                        setTimeout(() => sendToAllModulesIfNeeded(true), 100);
                    }
                }
            });

            // ======================================================================
            // MAIN MESSAGE HANDLER - WITH WS-BRIDGE SOURCE DETECTION
            // ======================================================================
            window.addEventListener('message', async function(event) {
                if (!isTrustedOrigin(event.origin)) return;

                const data = event.data || {};
                if (!data || typeof data !== 'object') return;
                if (data.type === 'SW_UPDATE_AVAILABLE' || data.type === 'SW_ACTIVATED') {
                    if (!window.__swReloadPending) {
                        window.__swReloadPending = true;
                        setTimeout(() => window.location.reload(), 500);
                    }
                    return;
                }
                if (data.type) {
                    emitGlobalAppEvent('MODULE_MESSAGE', {
                        type: data.type,
                        source: data.source || 'child-module',
                        module: data.module || data.source || null,
                        timestamp: Date.now()
                    }, { async: true });
                }

                // ==================================================================
                // CALL ENDED HANDLER - ONLY POST TO API IF SOURCE IS NOT 'ws-bridge'
                // ==================================================================
                if (data.type === 'CALL_ENDED' && data.source !== 'ws-bridge') {
                    const callId = data.payload?.callId || data.callId;
                    if (callId) {
                        const baseUrl = window.__getApiBase();
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token') || cachedToken;
                        try {
                            await fetch(`${baseUrl}/calls/${callId}/end`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            console.log('[Parent] Call ended via API (non-ws source)');
                        } catch(e) { console.warn('[Parent] Failed to POST /calls/end:', e); }
                    }
                    // Dismiss banner on call termination
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }
                
                // Handle ws-bridge sourced events - dismiss banner but DON'T POST to /calls/:id/end
                if (data.type === 'CALL_ENDED' && data.source === 'ws-bridge') {
                    console.log('[Parent] CALL_ENDED from ws-bridge - banner dismissed, no API call');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    await refreshCallHistoryForUser(cachedUserId);
                    return;
                }
                
                // ==================================================================
                // CALL ANSWERED HANDLER
                // ==================================================================
                if (data.type === 'CALL_ANSWERED' || data.type === 'CALL_ACCEPTED') {
                    console.log('[Parent] Call answered - dismissing banner');
                    hideGlobalBanner();
                    return;
                }
                
                // ==================================================================
                // CALL REJECTED HANDLER
                // ==================================================================
                if (data.type === 'CALL_REJECTED') {
                    console.log('[Parent] Call rejected - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    return;
                }
                
                // ==================================================================
                // CALL FORCE ENDED HANDLER - unified
                // ==================================================================
                function handleForceEnded(callData, source) {
                    console.log('[Parent] Force ended call - dismissing banner, source:', source);
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    refreshCallHistoryForUser(cachedUserId);
                }
                
                if (data.type === 'CALL_FORCE_ENDED') {
                    handleForceEnded(data.payload, data.source);
                    return;
                }
                
                if (data.type === 'call:force_end' || data.type === 'call_force_ended') {
                    console.log('[Parent] Force end alias received:', data.type);
                    handleForceEnded(data.payload, 'alias');
                    return;
                }
                
                // ==================================================================
                // CALL CANCELLED HANDLER
                // ==================================================================
                if (data.type === 'CALL_CANCELLED' || data.type === 'call:cancelled') {
                    console.log('[Parent] Call cancelled - dismissing banner');
                    hideGlobalBanner();
                    document.body.classList.remove('call-screen-active');
                    window.__activeCallInProgress = false;
                    return;
                }

                // ==================================================================
                // CALL INCOMING HANDLER - Show on ALL pages (including calls page)
                // ==================================================================
                if (data.type === 'call:incoming' || (data.type === 'CALL_INCOMING' && data.payload)) {
                    const callData = data.payload || data;
                    // Show banner on ALL pages (not just non-calls pages)
                    if (window.showIncomingCallBanner) {
                        window.showIncomingCallBanner(callData);
