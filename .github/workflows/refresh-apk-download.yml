name: Refresh Necpra APK on website

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  refresh-static-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Trigger Render static-site rebuild
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" > download/latest-release.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/latest-release.txt
          git commit -m "Refresh website APK for $RELEASE_TAG"
          git push origin HEAD:main
