name: Deploy Nexipa to Firebase Hosting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend from .env
      run: node scripts/build-config.js

    - name: Verify generated runtime configuration
      run: |
        test -f dist/js/runtime-config.js
        grep -q 'BACKEND_URL' dist/js/runtime-config.js
        echo "✓ Runtime backend configuration generated from .env"

    - name: Deploy to Firebase
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNICONNECT }}'
        channelId: live
        projectId: 'uniconnect-ee95c'
        entryPoint: './dist'

    - name: Deploy to Preview Channel
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNICONNECT }}'
        channelId: preview-${{ github.head_ref || github.ref_name }}
        projectId: 'uniconnect-ee95c'
        entryPoint: './dist'
