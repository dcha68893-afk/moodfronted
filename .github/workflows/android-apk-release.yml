name: Build and publish Necpra Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://nexorah-xnv6.onrender.com
      FRONTEND_URL: https://necpra.co.ke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build live frontend
        run: npm run build

      - name: Restore release keystore
        env:
          NECPA_KEYSTORE_BASE64: ${{ secrets.NECPA_KEYSTORE_BASE64 }}
        run: |
          test -n "$NECPA_KEYSTORE_BASE64"
          printf '%s' "$NECPA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/necpa-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/android/app/necpa-release.jks"

      - name: Configure Gradle signing
        env:
          NECPA_STORE_PASSWORD: ${{ secrets.NECPA_STORE_PASSWORD }}
          NECPA_KEY_ALIAS: ${{ secrets.NECPA_KEY_ALIAS }}
          NECPA_KEY_PASSWORD: ${{ secrets.NECPA_KEY_PASSWORD }}
        run: |
          test -n "$NECPA_STORE_PASSWORD"
          test -n "$NECPA_KEY_ALIAS"
          test -n "$NECPA_KEY_PASSWORD"
          mkdir -p "$HOME/.gradle"
          {
            echo "NECPA_STORE_FILE=$GITHUB_WORKSPACE/android/app/necpa-release.jks"
            echo "NECPA_KEY_ALIAS=$NECPA_KEY_ALIAS"
            echo "NECPA_STORE_PASSWORD=$NECPA_STORE_PASSWORD"
            echo "NECPA_KEY_PASSWORD=$NECPA_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Publish APK into website output
        run: |
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/necpra-android.apk
          test -s dist/downloads/necpra-android.apk

      - name: Deploy website and APK
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNICONNECT }}'
          channelId: live
          projectId: uniconnect-ee95c
          entryPoint: './dist'

      - name: Verify published artifact
        run: |
          ls -lh dist/downloads/necpra-android.apk
          echo "Necpra APK prepared at /downloads/necpra-android.apk"
