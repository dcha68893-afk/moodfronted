<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Noise Filter Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .test-section { margin: 20px 0; padding: 15px; background: white; border-radius: 8px; }
        button { padding: 8px 16px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .results { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; font-size: 12px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-item { padding: 10px; background: white; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>
    <h1>🔇 Console Noise Filter Test</h1>
    
    <div class="stats">
        <div class="stat-item">
            <div>Tracked Messages</div>
            <div id="trackedCount">0</div>
        </div>
        <div class="stat-item">
            <div>Environment</div>
            <div id="environment">-</div>
        </div>
        <div class="stat-item">
            <div>Filter Status</div>
            <div id="filterStatus">-</div>
        </div>
    </div>

    <div class="test-section">
        <h3>WebSocket Reconnection Tests</h3>
        <button onclick="testWebSocketMessages()">Test WebSocket Messages</button>
        <div class="results" id="wsResults"></div>
    </div>

    <div class="test-section">
        <h3>FriendSync Tests</h3>
        <button onclick="testFriendSyncMessages()">Test FriendSync Messages</button>
        <div class="results" id="fsResults"></div>
    </div>

    <div class="test-section">
        <h3>Cache Tests</h3>
        <button onclick="testCacheMessages()">Test Cache Messages</button>
        <div class="results" id="cacheResults"></div>
    </div>

    <div class="test-section">
        <h3>Critical Messages (Should Always Show)</h3>
        <button onclick="testCriticalMessages()">Test Critical Messages</button>
        <div class="results" id="criticalResults"></div>
    </div>

    <div class="test-section">
        <h3>Filter Controls</h3>
        <button onclick="toggleFilter()">Toggle Filter</button>
        <button onclick="clearHistory()">Clear History</button>
        <button onclick="showStats()">Show Stats</button>
        <div class="results" id="controlResults"></div>
    </div>

    <!-- Load the console noise filter -->
    <script src="js/console-noise-filter.js"></script>
    
    <script>
        let testCounter = 0;
        
        function updateStats() {
            if (window.ConsoleNoiseFilter) {
                const stats = window.ConsoleNoiseFilter.getStats();
                document.getElementById('trackedCount').textContent = stats.trackedMessages;
                document.getElementById('environment').textContent = stats.environment;
                document.getElementById('filterStatus').textContent = stats.isInitialized ? 'Active' : 'Inactive';
            }
        }

        function logResult(containerId, message) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function testWebSocketMessages() {
            logResult('wsResults', 'Testing WebSocket reconnection messages...');
            
            // These should be throttled
            for (let i = 0; i < 10; i++) {
                console.log(`[Realtime] Enhanced reconnect in ${2000 + i * 100}ms (attempt ${i + 1})`);
                console.log(`[Realtime] Opening raw WebSocket ws://localhost:3000/ws?token=***`);
                console.log(`[Realtime] Reconnect attempt #${i + 1}`);
            }
            
            logResult('wsResults', 'WebSocket messages sent - check console for throttling');
            updateStats();
        }

        function testFriendSyncMessages() {
            logResult('fsResults', 'Testing FriendSync messages...');
            
            // These should be throttled
            for (let i = 0; i < 8; i++) {
                console.log('[FriendSync] friends sync error: API request timeout');
                console.log('[FriendSync] incoming requests sync error: API request timeout');
                console.log('[FriendSync] Starting full sync…');
            }
            
            logResult('fsResults', 'FriendSync messages sent - check console for throttling');
            updateStats();
        }

        function testCacheMessages() {
            logResult('cacheResults', 'Testing Cache messages...');
            
            // These should be throttled
            for (let i = 0; i < 6; i++) {
                console.log('[CACHE] DB initialized');
                console.log('[AppCache] ✅ Cache ready, kyn:cacheReady dispatched');
                console.log('[STORE] ✅ Initialized (offline-first v2.2)');
            }
            
            logResult('cacheResults', 'Cache messages sent - check console for throttling');
            updateStats();
        }

        function testCriticalMessages() {
            logResult('criticalResults', 'Testing critical messages (should always show)...');
            
            // These should NOT be throttled
            console.error('[Realtime] ❌ CRITICAL: Connection failed permanently');
            console.warn('[FriendSync] ⚠️ WARNING: Duplicate session update ignored');
            console.log('[API] 🔴 ERROR: Authentication failed');
            console.error('[Calls] Critical error in WebRTC connection');
            
            logResult('criticalResults', 'Critical messages sent - should all be visible');
            updateStats();
        }

        function toggleFilter() {
            if (window.ConsoleNoiseFilter) {
                if (window.ConsoleNoiseFilter.getStats().isInitialized) {
                    window.ConsoleNoiseFilter.uninstall();
                    logResult('controlResults', 'Console noise filter uninstalled');
                } else {
                    window.ConsoleNoiseFilter.install();
                    logResult('controlResults', 'Console noise filter installed');
                }
                updateStats();
            }
        }

        function clearHistory() {
            if (window.ConsoleNoiseFilter) {
                window.ConsoleNoiseFilter.clearHistory();
                logResult('controlResults', 'Message history cleared');
                updateStats();
            }
        }

        function showStats() {
            if (window.ConsoleNoiseFilter) {
                const stats = window.ConsoleNoiseFilter.getStats();
                logResult('controlResults', `Stats: ${JSON.stringify(stats, null, 2)}`);
            }
        }

        // Update stats every 2 seconds
        setInterval(updateStats, 2000);
        
        // Initial update
        setTimeout(updateStats, 500);
    </script>
</body>
</html>
