apply plugin: 'com.android.application'

android {
    namespace = "com.necpa"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.necpa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def keystoreFile = project.findProperty("NECPA_STORE_FILE")
            def keyAliasValue = project.findProperty("NECPA_KEY_ALIAS")
            def storePasswordValue = project.findProperty("NECPA_STORE_PASSWORD")
            def keyPasswordValue = project.findProperty("NECPA_KEY_PASSWORD")
            def haveAll = keystoreFile && keyAliasValue && storePasswordValue && keyPasswordValue

            // This block runs at *configuration* time, so throwing here (as before)
            // broke even `assembleDebug` on any machine/CI without the release
            // keystore. Only insist on the properties when a release/bundle task
            // is actually requested.
            def releaseRequested = gradle.startParameter.taskNames.any {
                def t = it.toLowerCase()
                t.contains("release") || t.contains("bundle")
            }

            if (haveAll) {
                storeFile file(keystoreFile)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else if (releaseRequested) {
                throw new GradleException(
                    "Missing Necpra release signing properties. Configure " +
                    "NECPA_STORE_FILE, NECPA_KEY_ALIAS, NECPA_STORE_PASSWORD and NECPA_KEY_PASSWORD in your user Gradle properties."
                )
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.work:work-runtime:2.10.1"
    // Native realtime (typing, presence, live messages) - Socket.IO client matching the server's socket.io 4.x.
    implementation('io.socket:socket.io-client:2.1.0') { exclude group: 'org.json', module: 'json' }
    // Native Messages (Phase 2/3): local database + list rendering.
    implementation "androidx.room:room-runtime:2.7.2"
    annotationProcessor "androidx.room:room-compiler:2.7.2"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    // The native FCM service extends FirebaseMessagingService directly. The Capacitor push plugin
    // declares this as a private (implementation) dependency, so the app must declare it itself.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
