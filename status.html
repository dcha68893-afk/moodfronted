<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Necpa — Status</title>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/config.js"></script>
  <script>
    // The Status module uses the same authenticated session and API origin
    // as the main Necpa shell. Keep this iframe visually independent from
    // the legacy status.css/status-ui stack.
    (function () {
      try {
        if (typeof window.__getApiOrigin === 'function') {
          window.API_BASE_URL = window.__getApiOrigin();
        }
      } catch (_) {}
    })();
  </script>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    body { background:var(--app-secondary-surface, transparent); color:var(--app-text-color, inherit); }
    /* ProfessionalStatus is the complete Status surface in this iframe.
       Do not show its floating launcher: the parent chat shell already owns
       navigation and opens this page through the Status module button. */
    #necpa-status-launcher { display:none !important; }
    #necpa-status-root { position:fixed !important; inset:0 !important; padding:0 !important; }
    #necpa-status-root.open { display:flex !important; }
    .ns-shell { width:100% !important; height:100% !important; max-width:none !important; max-height:none !important; border-radius:0 !important; }
@media (max-width:768px){html,body,#necpa-status-root,#necpa-status-root.open,.ns-shell{width:100vw!important;height:100dvh!important;min-width:100%!important;min-height:100%!important;margin:0!important;padding:0!important}.ns-main{width:100%!important;height:100%!important;min-width:0!important;min-height:0!important}}
    .ns-main { min-width:0; min-height:0; }
  
#necpa-status-root,#necpa-status-root *{box-sizing:border-box}
@media(max-width:768px){html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}.ns-main{width:100%!important;min-width:0!important;height:100%!important}.ns-compose-box{width:100%!important;max-width:none!important}.ns-compose-tabs{grid-template-columns:repeat(4,minmax(0,1fr))!important}.ns-pane{min-width:0!important}.ns-textarea{width:100%!important;max-width:100%!important}.ns-compose-foot{position:sticky!important;bottom:0!important;z-index:10}}
</style>
</head>
<body>
  <script src="/js/core/status/ProfessionalStatus.js"></script>
  <script>
    (function () {
      'use strict';

      function openProfessionalStatus() {
        if (window.__NecpaProfessionalStatus &&
            typeof window.__NecpaProfessionalStatus.open === 'function') {
          window.__NecpaProfessionalStatus.open();
          return true;
        }
        return false;
      }

      function boot() {
        if (openProfessionalStatus()) {
          return;
        }
        setTimeout(boot, 50);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once:true });
      } else {
        boot();
      }

      // Back navigation is owned by ProfessionalStatus itself: it handles
      // GO_BACK_TO_LIST (reset to the status list, keeping the surface open)
      // and CLOSE_LOCAL_PANEL (unwind one screen), and it reports its current
      // screen to the parent via STATUS_PANEL_OPENED / STATUS_LIST_SHOWN /
      // SCREEN_STATE_CHANGED. Nothing here may close the surface, otherwise
      // the iframe is left blank.
    })();
  </script>
  <script id="STATUS_REALTIME_BRIDGE">
    window.addEventListener('message', function(event) {
      const d=event&&event.data;
      if(!d||typeof d!=='object') return;
      if(d.type==='status:new'||d.type==='STATUS_NEW'||d.type==='FRIEND_STATUS_NEW'||d.type==='status:deleted'||d.type==='STATUS_DELETED'){
        window.__NecpaProfessionalStatus?.loadFeed?.();
      }
    });
  </script>
</body>
</html>
