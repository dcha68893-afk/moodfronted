<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Groups</title><script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--kyn-bg-root,#f8fafc);color:var(--kyn-text-primary,#0f172a);font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial}*{box-sizing:border-box}button,input,textarea{font:inherit}.layout{height:100%;display:grid;grid-template-columns:minmax(250px,32%) 1fr}.sidebar{border-right:1px solid var(--kyn-border,#e2e8f0);background:var(--kyn-bg-panel,#fff);display:flex;flex-direction:column;min-width:0}.side-head{padding:12px 14px;border-bottom:1px solid var(--kyn-border,#e2e8f0);font-weight:800}.toolbar{display:flex;gap:7px;padding:10px}.search{flex:1;min-width:0;padding:9px;border:1px solid var(--kyn-border,#e2e8f0);border-radius:11px;background:var(--kyn-bg-input,#f1f5f9);color:inherit}.refresh{width:38px;border:1px solid var(--kyn-border,#e2e8f0);border-radius:10px;background:var(--kyn-bg-input,#f1f5f9);color:inherit}.groups{flex:1;overflow:auto;padding:0 10px}.group{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:13px;background:transparent;color:inherit;text-align:left;margin-bottom:5px}.group:hover,.group.active{background:var(--kyn-bg-input,#f1f5f9);border-color:var(--kyn-border,#e2e8f0)}.avatar{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#c4b5fd);display:grid;place-items:center;font-weight:800;color:#1e40af;flex:0 0 auto;background-size:cover;background-position:center}.groupmain{min-width:0;flex:1}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--kyn-text-muted,#64748b);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:var(--kyn-text-muted,#64748b);padding:40px 18px}.panel{min-width:0;height:100%;display:flex;flex-direction:column;background:var(--kyn-bg-root,#f8fafc)}.messages{flex:1;overflow:auto;padding:14px}.row{display:flex;margin:6px 0}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:9px 11px;border:1px solid var(--kyn-border,#e2e8f0);border-radius:15px;background:var(--kyn-bg-panel,#fff);overflow-wrap:anywhere}.mine .bubble{background:var(--kyn-accent-secondary,#2563eb);color:#fff;border-color:var(--kyn-accent-secondary,#2563eb)}.sender{font-size:10px;font-weight:700;color:var(--kyn-accent-secondary,#2563eb);margin-bottom:3px}.time{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.composer{display:flex;gap:7px;padding:8px;background:var(--kyn-bg-panel,#fff);border-top:1px solid var(--kyn-border,#e2e8f0)}textarea{flex:1;resize:none;min-height:42px;max-height:120px;padding:10px;border:1px solid var(--kyn-border,#e2e8f0);border-radius:13px;background:var(--kyn-bg-input,#f1f5f9);color:inherit}.send{width:43px;border:0;border-radius:13px;background:var(--kyn-accent-secondary,#2563eb);color:#fff}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .panel{display:flex}}</style></head><body><div id="layout" class="layout"><aside class="sidebar"><div class="side-head">Groups</div><div class="toolbar"><input id="search" class="search" placeholder="Search groups…"><button id="refresh" class="refresh" type="button">↻</button></div><div id="groups" class="groups"><div class="empty">Loading groups…</div></div></aside><section class="panel"><div id="messages" class="messages"><div class="empty">Select a group to start chatting.</div></div><div class="composer"><textarea id="input" rows="1" placeholder="Message the group…"></textarea><button id="send" class="send" type="button">➤</button></div></section></div><div id="create" hidden></div><script>(()=>{'use strict';const S={groups:[],loading:false,q:''};const byId=id=>document.getElementById(id);const getGroupsBox=()=>byId('groups');const base=()=>String(window.__getApiBase?.()||window.API_BASE_URL||'').replace(/\/$/,'');const token=()=>window.__kynToken||window.__accessToken||window.AuthSessionManager?.getToken?.()||window.authToken||localStorage.getItem('authToken')||localStorage.getItem('accessToken')||localStorage.getItem('token')||'';async function api(path,opt={}){const h={...(opt.headers||{})},t=token();if(t)h.Authorization='Bearer '+t;const r=await fetch(base()+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||`Request failed (${r.status})`);return d}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderGroups(){const box=getGroupsBox();if(!box)return;box.replaceChildren();const q=S.q.toLowerCase(),rows=S.groups.filter(g=>!q||String(g.name||g.groupName||'').toLowerCase().includes(q));if(!rows.length){box.innerHTML='<div class="empty">No groups yet.</div>';return}for(const g of rows){const b=document.createElement('button');b.type='button';b.className='group';b.innerHTML=`<div class="avatar">${esc(String(g.name||g.groupName||'G').slice(0,1).toUpperCase())}</div><div class="groupmain"><div class="name">${esc(g.name||g.groupName||'Unnamed group')}</div><div class="meta">${Number(g.participantCount??g.participants?.length??0)} members</div></div>`;b.onclick=()=>openGroup(g.id);box.append(b)}}async function loadGroups(){if(S.loading)return;S.loading=true;try{const r=await api('/chats?limit=100');const rows=r?.data?.chats||r?.data||[];S.groups=Array.isArray(rows)?rows.filter(x=>(x?.type||x?.chatType)==='group').map(x=>x?.chat||x?.group||x):[];renderGroups()}catch(e){const box=getGroupsBox();if(box)box.innerHTML=`<div class="empty">Unable to load groups.<br>${esc(e.message)}</div>`}finally{S.loading=false}}function openGroup(id){window.__GROUP_CHAT_ID=String(id);byId('layout')?.classList.add('chat-open');window.dispatchEvent(new CustomEvent('kyn:group:open',{detail:{groupId:String(id)}}))}byId('search')?.addEventListener('input',e=>{S.q=e.target.value;renderGroups()});byId('refresh')?.addEventListener('click',loadGroups);window.__GROUP_LOAD_GROUPS=loadGroups;loadGroups();})();</script></body></html>
