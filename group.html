<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Group conversation</title>
<script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg,#f8fafc);color:var(--text,#0f172a);font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial}.chat{height:100%;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:14px}.row{display:flex;margin:6px 0}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:9px 11px;border:1px solid var(--border,#e2e8f0);border-radius:15px;background:var(--surface,#fff);overflow-wrap:anywhere}.mine .bubble{background:var(--primary,#2563eb);color:#fff;border-color:var(--primary,#2563eb)}.sender{font-size:10px;font-weight:700;color:var(--primary,#2563eb);margin-bottom:3px}.mine .sender{color:#dbeafe}.time{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.empty{text-align:center;color:var(--muted,#64748b);padding:50px 20px}.composer{display:flex;gap:7px;padding:8px;background:var(--surface,#fff);border-top:1px solid var(--border,#e2e8f0);position:relative}textarea{flex:1;resize:none;min-height:42px;max-height:120px;padding:10px;border:1px solid var(--border,#e2e8f0);border-radius:13px;background:var(--surface2,#f1f5f9);color:var(--text,#0f172a);outline:0}.send{width:43px;border:0;border-radius:13px;background:var(--primary,#2563eb);color:#fff}
</style></head>
<body><section id="chat" class="chat"><div id="messages" class="messages"><div class="empty">Loading group messages…</div></div><div class="composer"><textarea id="input" rows="1" placeholder="Message the group…"></textarea><button id="send" class="send" type="button" aria-label="Send">➤</button></div></section>
<script>
(function(){'use strict';const state={chatId:null,group:null,messages:[],loaded:false,sending:false};const $=id=>document.getElementById(id);const base=()=>String(window.__getApiBase?.()||'').replace(/\/$/,'');
function token(){try{return window.__kynToken||window.__accessToken||window.AuthSessionManager?.getToken?.()||window.authToken||localStorage.getItem('authToken')||localStorage.getItem('accessToken')||localStorage.getItem('token')||''}catch(_){return''}}
async function api(path,opt={}){const headers={...(opt.headers||{})};const t=token();if(t)headers.Authorization='Bearer '+t;const fd=typeof FormData!=='undefined'&&opt.body instanceof FormData;if(fd)delete headers['Content-Type'];else if(opt.body!=null&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(base()+path,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||`Request failed (${r.status})`);return d}
function id(){return state.chatId||window.__GROUP_CHAT_ID||null}function group(x){return x?.chat||x?.group||x}
function render(){const box=$('messages');box.innerHTML='';if(!state.messages.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}const me=String(window._kynCurrentUserId||localStorage.getItem('userId')||'');state.messages.forEach(m=>{const mine=String(m.senderId||m.userId)===me;const row=document.createElement('div');row.className='row'+(mine?' mine':'');row.dataset.messageId=String(m.id||'');const b=document.createElement('div');b.className='bubble';if(!mine){const s=document.createElement('div');s.className='sender';s.textContent=m.sender?.displayName||m.senderUsername||m.sender?.username||'Member';b.appendChild(s)}const media=m.metadata?.media;if(media?.url){const mime=String(media.mimeType||'');if(mime.startsWith('image/')){const x=document.createElement('img');x.src=media.url;x.alt=media.name||'Image';x.loading='lazy';x.style.cssText='display:block;max-width:min(420px,100%);max-height:360px;border-radius:12px;object-fit:contain';b.appendChild(x)}else if(mime.startsWith('video/')){const x=document.createElement('video');x.src=media.url;x.controls=true;x.playsInline=true;x.style.cssText='display:block;max-width:min(420px,100%);max-height:360px;border-radius:12px';b.appendChild(x)}else if(mime.startsWith('audio/')){const x=document.createElement('audio');x.src=media.url;x.controls=true;b.appendChild(x)}else{const x=document.createElement('a');x.href=media.url;x.target='_blank';x.rel='noopener noreferrer';x.textContent=media.name||m.content||'Open attachment';x.style.color='inherit';b.appendChild(x)}}else{const x=document.createElement('div');x.textContent=m.content||'';b.appendChild(x)}const t=document.createElement('div');t.className='time';t.textContent=new Date(m.createdAt||m.sentAt||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.appendChild(t);row.appendChild(b);box.appendChild(row)});box.scrollTop=box.scrollHeight;window.__GROUP_MESSAGES_CACHE=state.messages.slice();window.__GROUP_REFRESH_MESSAGES=loadMessages}
function merge(rows){const map=new Map(state.messages.map(m=>[String(m.id),m]));(rows||[]).forEach(m=>{if(m?.id)map.set(String(m.id),m)});state.messages=[...map.values()].sort((a,b)=>Number(a.id)-Number(b.id))}
async function loadGroup(){const chatId=id();if(!chatId)return;try{const r=await api('/chats/'+encodeURIComponent(chatId));state.group=group(r?.data?.chat||r?.data);const participants=Array.isArray(state.group?.participants)?state.group.participants:[];const count=state.group?.participantCount??participants.length;window.__GROUP_CHAT_ID=String(chatId);window.parent?.postMessage({type:'GROUP_PANEL_OPEN',source:'groups',payload:{...state.group,id:Number(chatId),chatId:Number(chatId),participantCount:count,participants}},'*')}catch(e){console.error('[Groups] metadata',e)}}
async function loadMessages(){const chatId=id();if(!chatId)return;try{const r=await api('/messages/'+encodeURIComponent(chatId)+'?limit=100');const rows=r?.data?.messages||r?.data||r?.messages||[];if(Array.isArray(rows)){merge(rows);state.loaded=true;render()}}catch(e){console.error('[Groups] messages',e);if(!state.loaded)$('messages').innerHTML='<div class="empty">Unable to load group messages. Retrying…</div>'}}
async function sendMessage(){const input=$('input'),text=input.value.trim(),chatId=id();if(!text||!chatId||state.sending)return;state.sending=true;input.value='';try{const r=await api('/messages',{method:'POST',body:JSON.stringify({chatId:Number(chatId),content:text,type:'text',clientMessageId:`grp_${Date.now()}_${Math.random().toString(36).slice(2,8)}`})});const m=r?.data?.message||r?.data;if(m){merge([m]);render()}await loadMessages()}catch(e){input.value=text;alert(e.message)}finally{state.sending=false}}
function parentMessage(e){const d=e?.data;if(!d||typeof d!=='object')return;const p=d.payload||{};if(d.type==='SESSION_DATA'||d.type==='AUTH_READY'||d.type==='PARENT_READY'){window.__GROUP_CALL_USER_ID=p.userId||p.user?.id||window.__GROUP_CALL_USER_ID;return}if(d.type==='OPEN_GROUP_BY_ID'){const chatId=p.groupId??p.chatId??p.id;if(chatId){state.chatId=String(chatId);window.__GROUP_CHAT_ID=String(chatId);loadGroup().then(loadMessages)}}if(['GROUP_MESSAGE','GROUP_MESSAGE_NEW','group:message:new','message:new'].includes(d.type)){const m=p.message||p;const chatId=p.groupId??p.chatId??p.conversationId??m.chatId;if(chatId&&String(chatId)===String(state.chatId)&&((p.isGroup===true)||(p.chatType==='group')||d.type!=='message:new')){if(m?.id){merge([m]);render()}}}}
window.addEventListener('message',parentMessage);$('send').onclick=sendMessage;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
function boot(){const q=new URLSearchParams(location.search);const chatId=q.get('groupId')||q.get('chatId')||window.__GROUP_CHAT_ID;if(chatId){state.chatId=String(chatId);loadGroup().then(loadMessages)}else $('messages').innerHTML='<div class="empty">Select a group to start chatting.</div>';setInterval(()=>{if(id()&&!document.hidden)loadMessages()},1800)}boot();
})();
</script></body></html>
