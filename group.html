<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Groups</title><script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script><style>
:root{--bg:var(--kyn-bg-root,#f8fafc);--surface:var(--kyn-bg-panel,#fff);--surface2:var(--kyn-bg-input,#f1f5f9);--border:var(--kyn-border,#e2e8f0);--text:var(--kyn-text-primary,#0f172a);--muted:var(--kyn-text-muted,#64748b);--primary:var(--kyn-accent-secondary,#2563eb)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial}button,input,textarea{font:inherit}button{cursor:pointer}.layout{height:100%;display:grid;grid-template-columns:minmax(250px,32%) 1fr}.sidebar,.panel{min-width:0;min-height:0}.sidebar{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}.side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800}.toolbar{display:flex;gap:7px;padding:10px}.search{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:inherit}.refresh,.back{border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:inherit;padding:8px 11px}.groups{flex:1;overflow:auto;padding:0 10px}.group{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:13px;background:transparent;color:inherit;text-align:left;margin-bottom:5px}.group:hover,.group.active{background:var(--surface2);border-color:var(--border)}.avatar{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#c4b5fd);display:grid;place-items:center;font-weight:800;color:#1e40af;flex:0 0 auto;background-size:cover;background-position:center}.groupmain{min-width:0;flex:1}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:var(--muted);padding:40px 18px}.panel{height:100%;display:flex;flex-direction:column;background:var(--bg)}.chat-head{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);min-height:52px}.chat-title{min-width:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{display:none}.messages{flex:1;min-height:0;overflow:auto;padding:14px}.row{display:flex;margin:6px 0}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:9px 11px;border:1px solid var(--border);border-radius:15px;background:var(--surface);overflow-wrap:anywhere}.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary)}.sender{font-size:10px;font-weight:700;color:var(--primary);margin-bottom:3px}.time{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.composer{display:flex;gap:7px;padding:8px;background:var(--surface);border-top:1px solid var(--border)}textarea{flex:1;resize:none;min-height:42px;max-height:120px;padding:10px;border:1px solid var(--border);border-radius:13px;background:var(--surface2);color:inherit}.send{width:43px;border:0;border-radius:13px;background:var(--primary);color:#fff}.send:disabled{opacity:.55;cursor:not-allowed}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:20}.modal.hidden{display:none}.card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px}.head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}.section{padding:14px 16px;border-bottom:1px solid var(--border)}.member{display:flex;align-items:center;gap:8px;padding:7px 0}.who{flex:1}.who b{display:block}.who small{color:var(--muted);font-size:10px}.smallbtn{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:inherit}.section input,.section textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:inherit}.section textarea{min-height:80px;margin-top:8px}@media(max-width:700px){.layout{display:block;position:relative}.sidebar,.panel{position:absolute;inset:0;width:100%;height:100%}.panel{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .panel{display:flex}.back{display:block}.messages{padding:10px}.bubble{max-width:88%}}
</style></head><body><div id="layout" class="layout"><aside class="sidebar"><div class="side-head"><span>Groups</span><button id="createOpen" class="smallbtn" type="button">＋</button></div><div class="toolbar"><input id="search" class="search" placeholder="Search groups…"><button id="refresh" class="refresh" type="button">↻</button></div><div id="groups" class="groups"><div class="empty">Loading groups…</div></div></aside><section class="panel"><div class="chat-head"><button id="back" class="back" type="button">← Groups</button><div id="chatTitle" class="chat-title">Select a group</div></div><div id="messages" class="messages"><div class="empty">Select a group to start chatting.</div></div><div class="composer"><textarea id="input" rows="1" placeholder="Message the group…" disabled></textarea><button id="send" class="send" type="button" disabled>➤</button></div></section></div><div id="create" class="modal hidden"><div class="card"><div class="head"><b>Create group</b><button id="createClose" class="smallbtn" type="button">×</button></div><form id="createForm"><div class="section"><input id="gname" required maxlength="100" placeholder="Group name"><textarea id="gdesc" maxlength="1000" placeholder="Description"></textarea></div><div class="section"><b>Choose members</b><div id="friends"></div></div><div class="section" style="text-align:right"><button type="submit" class="smallbtn">Create group</button></div></form></div></div><script>
(()=>{'use strict';
const S={groups:[],friends:[],current:null,messages:[],q:'',loading:false,sending:false,poll:null};
const $=id=>document.getElementById(id);const base=()=>String(window.__getApiBase?.()||window.API_BASE_URL||'').replace(/\/$/,'');
const token=()=>window.__kynToken||window.__accessToken||window.AuthSessionManager?.getToken?.()||window.authToken||localStorage.getItem('authToken')||localStorage.getItem('accessToken')||localStorage.getItem('token')||'';
const uid=()=>String(window._kynCurrentUserId||localStorage.getItem('userId')||localStorage.getItem('currentUserId')||'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unwrap=x=>x?.chat||x?.group||x;
async function api(path,opt={}){const h={...(opt.headers||{})},t=token();if(t)h.Authorization='Bearer '+t;if(opt.body&&!(opt.body instanceof FormData)&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(base()+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||`Request failed (${r.status})`);return d}
function setMobileChat(open){$('layout')?.classList.toggle('chat-open',!!open)}
function renderGroups(){const box=$('groups');if(!box)return;box.replaceChildren();const q=S.q.trim().toLowerCase();const rows=S.groups.filter(g=>!q||String(g.name||g.groupName||'').toLowerCase().includes(q));if(!rows.length){box.innerHTML='<div class="empty">No groups yet.</div>';return}for(const g of rows){const b=document.createElement('button');b.type='button';b.className='group'+(S.current&&String(S.current.id)===String(g.id)?' active':'');const a=document.createElement('div');a.className='avatar';a.textContent=String(g.name||g.groupName||'G').slice(0,1).toUpperCase();const m=document.createElement('div');m.className='groupmain';m.innerHTML=`<div class="name">${esc(g.name||g.groupName||'Unnamed group')}</div><div class="meta">${Number(g.participantCount??g.participants?.length??0)} members</div>`;b.append(a,m);b.onclick=()=>openGroup(g.id);box.append(b)}}
async function loadGroups(){if(S.loading)return;S.loading=true;try{const r=await api('/chats?limit=100');const rows=r?.data?.chats||r?.data||[];S.groups=Array.isArray(rows)?rows.filter(x=>(x?.type||x?.chatType)==='group').map(unwrap):[];renderGroups()}catch(e){const box=$('groups');if(box)box.innerHTML=`<div class="empty">Unable to load groups.<br>${esc(e.message)}</div>`}finally{S.loading=false}}
function normalizeMessages(r){const rows=r?.data?.messages||r?.data||r?.messages||[];return Array.isArray(rows)?rows:[]}
function buildRow(m){const row=document.createElement('div');const mine=String(m.senderId||m.userId)===uid();row.className='row'+(mine?' mine':'');row.dataset.messageId=String(m.id||m.messageId||'');const b=document.createElement('div');b.className='bubble';if(!mine){const s=document.createElement('div');s.className='sender';s.textContent=m.sender?.displayName||m.sender?.username||m.senderUsername||'Member';b.append(s)}const media=m.metadata?.media;if(media?.url){const mime=String(media.mimeType||'');if(mime.startsWith('image/')){const x=document.createElement('img');x.src=media.url;x.loading='lazy';x.style.cssText='max-width:420px;max-height:360px;border-radius:12px';b.append(x)}else if(mime.startsWith('video/')){const x=document.createElement('video');x.src=media.url;x.controls=true;x.style.cssText='max-width:420px;max-height:360px';b.append(x)}else if(mime.startsWith('audio/')){const x=document.createElement('audio');x.src=media.url;x.controls=true;b.append(x)}else{const x=document.createElement('a');x.href=media.url;x.target='_blank';x.rel='noopener';x.textContent=media.name||m.content||'Open attachment';b.append(x)}}else{const x=document.createElement('div');x.textContent=m.content||'';b.append(x)}const t=document.createElement('div');t.className='time';t.textContent=new Date(m.createdAt||m.sentAt||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.append(t);row.append(b);return row}
function renderMessages(scroll=true){const box=$('messages');if(!box)return;box.replaceChildren();if(!S.messages.length){box.innerHTML='<div class="empty">No messages yet.</div>'}else{for(const m of S.messages)box.append(buildRow(m));if(scroll)box.scrollTop=box.scrollHeight}window.__GROUP_MESSAGES_CACHE=S.messages.slice();window.__GROUP_REFRESH_MESSAGES=loadMessages}
function reconcile(list){const map=new Map();for(const m of S.messages)map.set(String(m.id||m.messageId),m);for(const m of list)map.set(String(m.id||m.messageId),m);const merged=[...map.values()].sort((a,b)=>Number(a.id||0)-Number(b.id||0));const changed=merged.length!==S.messages.length||merged.some((m,i)=>String(m.id||m.messageId)!==String(S.messages[i]?.id||S.messages[i]?.messageId));if(changed){const box=$('messages'),near=box&&box.scrollHeight-box.scrollTop-box.clientHeight<80;S.messages=merged;renderMessages(near)}}
async function loadMessages(){if(!S.current?.id)return;const id=String(S.current.id);try{const r=await api(`/messages/${encodeURIComponent(id)}?limit=100`);if(!S.current||String(S.current.id)!==id)return;reconcile(normalizeMessages(r))}catch(e){if(!S.messages.length){const box=$('messages');if(box)box.innerHTML=`<div class="empty">Unable to load messages.<br>${esc(e.message)}</div>`}}}
function openGroup(id){const g=S.groups.find(x=>String(x.id)===String(id))||{id};S.current=g;window.__GROUP_CHAT_ID=String(id);window.__GROUP_CHAT_TYPE='group';$('chatTitle').textContent=g.name||g.groupName||'Group';$('input').disabled=false;$('send').disabled=false;S.messages=[];renderMessages(false);renderGroups();setMobileChat(true);window.dispatchEvent(new CustomEvent('kyn:group:open',{detail:{groupId:String(id)}}));loadMessages();clearInterval(S.poll);S.poll=setInterval(loadMessages,5000)}
function closeGroup(){S.current=null;window.__GROUP_CHAT_ID=null;window.__GROUP_CHAT_TYPE=null;clearInterval(S.poll);S.poll=null;$('chatTitle').textContent='Select a group';$('input').value='';$('input').disabled=true;$('send').disabled=true;S.messages=[];renderMessages(false);setMobileChat(false);renderGroups();window.dispatchEvent(new CustomEvent('kyn:group:close'))}
async function sendMessage(){if(S.sending||!S.current?.id)return;const input=$('input'),content=input.value.trim();if(!content)return;S.sending=true;$('send').disabled=true;try{const r=await api('/messages',{method:'POST',body:JSON.stringify({chatId:Number(S.current.id),content,type:'text',clientMessageId:`group-${Date.now()}-${Math.random().toString(36).slice(2)}`})});const message=r?.data?.message||r?.data;if(message&&String(message.chatId||S.current.id)===String(S.current.id)){const exists=S.messages.some(m=>String(m.id||m.messageId)===String(message.id||message.messageId));if(!exists){S.messages.push(message);renderMessages(true)}}input.value='';await loadMessages()}catch(e){alert(`Unable to send message: ${e.message}`)}finally{S.sending=false;$('send').disabled=!S.current}}
async function loadFriends(){try{const r=await api('/friends?status=accepted');const rows=r?.data?.friends||r?.friends||r?.data||[];S.friends=Array.isArray(rows)?rows.map(x=>x.friend||x.user||x):[];const box=$('friends');box.replaceChildren();for(const f of S.friends){const id=f.id||f.userId;if(String(id)===uid())continue;const row=document.createElement('label');row.className='member';row.innerHTML=`<input type="checkbox" value="${esc(id)}"><div class="who"><b>${esc(f.displayName||f.name||f.username||'User')}</b><small>@${esc(f.username||'user')}</small></div>`;box.append(row)}}catch(e){$('friends').innerHTML='<div class="empty">No friends available.</div>'}}
function showCreate(){loadFriends();$('create').classList.remove('hidden')}function hideCreate(){$('create').classList.add('hidden')}
async function createGroup(e){e.preventDefault();const ids=[...document.querySelectorAll('#friends input:checked')].map(x=>Number(x.value)).filter(Number.isInteger);if(!ids.length)return alert('Select at least one member.');try{const r=await api('/chats',{method:'POST',body:JSON.stringify({type:'group',name:$('gname').value.trim(),description:$('gdesc').value.trim(),participantIds:ids})});const g=unwrap(r?.data?.chat||r?.data);hideCreate();$('createForm').reset();await loadGroups();if(g?.id)openGroup(g.id)}catch(e){alert(e.message)}}
function handleRealtime(ev){const d=ev?.detail||ev||{};const groupId=d.groupId??d.message?.groupId??d.payload?.groupId;const message=d.message??d.payload?.message??d.payload;if(!S.current||String(groupId)!==String(S.current.id)||!message?.id)return;const exists=S.messages.some(m=>String(m.id||m.messageId)===String(message.id));if(!exists){S.messages.push(message);S.messages.sort((a,b)=>Number(a.id||0)-Number(b.id||0));renderMessages(true)}}
$('search')?.addEventListener('input',e=>{S.q=e.target.value;renderGroups()});$('refresh')?.addEventListener('click',loadGroups);$('back')?.addEventListener('click',closeGroup);$('send')?.addEventListener('click',sendMessage);$('input')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('createOpen')?.addEventListener('click',showCreate);$('createClose')?.addEventListener('click',hideCreate);$('createForm')?.addEventListener('submit',createGroup);window.addEventListener('kyn:group:message',handleRealtime);window.addEventListener('message',e=>{if(e.data?.type==='group:message')handleRealtime({detail:e.data})});window.__GROUP_LOAD_GROUPS=loadGroups;window.__GROUP_REFRESH_MESSAGES=loadMessages;loadGroups();
})();</script></body></html>
