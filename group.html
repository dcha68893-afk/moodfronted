<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Groups</title>
<script src="/js/runtime-config.js"></script>
<script src="/js/config.js"></script>
<script src="/js/theme.engine.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--success:#16a34a;}
html[data-theme="dark"]{--bg:#0f172a;--surface:#111827;--surface2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;--primary:#60a5fa;--primary2:#3b82f6;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;height:100vh;overflow:hidden}.hidden{display:none!important}button,input,textarea{font:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto}.title{display:flex;align-items:center;gap:10px}.titleIcon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center}.title h1{font-size:17px;margin:0}.title p{font-size:11px;color:var(--muted);margin:2px 0 0}.top button{border:1px solid var(--border);background:var(--surface2);color:var(--text);width:38px;height:38px;border-radius:11px}
main{flex:1;min-height:0;position:relative;overflow:hidden}.view{height:100%;overflow:auto;padding:14px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}.primary{border:0;background:var(--primary);color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;padding:10px 13px}.danger{border:0;background:var(--danger);color:#fff;border-radius:11px;padding:10px 13px}.group-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);background:var(--surface);border-radius:15px;margin-bottom:9px;transition:.15s}.group-card:hover{transform:translateY(-1px);border-color:var(--primary)}.avatar{width:48px;height:48px;border-radius:15px;object-fit:cover;background:linear-gradient(135deg,#dbeafe,#c4b5fd);display:grid;place-items:center;color:#1e40af;font-weight:800;flex:0 0 auto}.group-main{min-width:0;flex:1}.group-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:var(--muted);padding:50px 20px}.empty i{font-size:42px;margin-bottom:12px;opacity:.55}.empty h3{margin:0 0 6px;color:var(--text)}
#conversation{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}.chatbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--border)}.chatbar .back{width:36px;height:36px;border:0;background:transparent;color:var(--text);font-size:19px}.chatbar .ginfo{display:flex;align-items:center;gap:9px;min-width:0;flex:1}.chatbar .ginfo .avatar{width:40px;height:40px;border-radius:12px}.chatbar .name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatbar .sub{font-size:11px;color:var(--muted)}.chat-actions{display:flex;gap:5px}.chat-actions button{width:35px;height:35px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px}.messages{flex:1;min-height:0;overflow:auto;padding:16px 12px}.day{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 14px}.bubble-row{display:flex;margin:6px 0}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:9px 11px;border-radius:15px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 1px rgba(0,0,0,.03)}.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary)}.sender{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:3px}.mine .sender{color:rgba(255,255,255,.85)}.body{white-space:pre-wrap;overflow-wrap:anywhere}.time{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.system{text-align:center;color:var(--muted);font-size:11px;margin:9px 0}.composer{display:flex;align-items:flex-end;gap:7px;padding:9px;background:var(--surface);border-top:1px solid var(--border)}.composer textarea{flex:1;resize:none;min-height:42px;max-height:120px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;padding:10px 12px;outline:none}.send{width:43px;height:43px;border:0;border-radius:13px;background:var(--primary);color:#fff}.reply{font-size:10px;border-left:3px solid currentColor;padding-left:6px;opacity:.8;margin-bottom:5px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px}.card{width:min(560px,100%);max-height:min(90vh,760px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.cardHead{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--border);z-index:1}.cardHead h2{font-size:17px;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:20px}.form{padding:16px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:11px;padding:10px 11px;outline:none}.field textarea{min-height:78px;resize:vertical}.members{display:grid;gap:7px;max-height:250px;overflow:auto}.memberPick{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--border);border-radius:11px}.memberPick input{width:17px;height:17px}.memberPick .avatar{width:34px;height:34px;border-radius:10px}.memberPick small{display:block;color:var(--muted)}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.section{padding:15px 16px;border-bottom:1px solid var(--border)}.section h3{font-size:13px;margin:0 0 10px}.memberRow{display:flex;align-items:center;gap:9px;padding:8px 0}.memberRow .avatar{width:36px;height:36px;border-radius:10px}.memberRow .who{flex:1;min-width:0}.memberRow .who b{display:block;font-size:13px}.memberRow .who span{font-size:10px;color:var(--muted)}.pill{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}.setting span{font-size:12px}.switch{width:42px;height:24px;border-radius:99px;border:0;background:#94a3b8;position:relative}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}.switch.on{background:var(--primary)}.switch.on:after{left:21px}.notice{padding:10px 12px;border-radius:11px;background:rgba(37,99,235,.09);color:var(--primary);font-size:11px;margin-bottom:12px}
@media(max-width:600px){.top{height:56px;padding:8px 11px}.view{padding:10px}.bubble{max-width:88%}.chatbar{padding:7px}.toolbar{gap:6px}.primary{padding:9px 10px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title"><div class="titleIcon"><i class="fas fa-users"></i></div><div><h1>Groups</h1><p>Private conversations with people you choose</p></div></div>
    <button id="createGroupBtn" title="Create group"><i class="fas fa-plus"></i></button>
  </header>
  <main>
    <section id="listView" class="view">
      <div class="toolbar"><input id="groupSearch" class="search" placeholder="Search groups…"><button id="refreshBtn" class="secondary" title="Refresh"><i class="fas fa-sync-alt"></i></button></div>
      <div id="groupList"></div>
    </section>
    <section id="conversation" class="hidden">
      <div class="chatbar">
        <button class="back" id="chatBack"><i class="fas fa-arrow-left"></i></button>
        <div class="ginfo"><div id="chatAvatar" class="avatar">G</div><div style="min-width:0"><div id="chatName" class="name">Group</div><div id="chatSub" class="sub">0 members</div></div></div>
        <div class="chat-actions"><button id="callBtn" title="Voice call"><i class="fas fa-phone"></i></button><button id="videoBtn" title="Video call"><i class="fas fa-video"></i></button><button id="infoBtn" title="Group info"><i class="fas fa-info"></i></button></div>
      </div>
      <div id="messageList" class="messages"></div>
      <div class="composer"><textarea id="composer" rows="1" placeholder="Message the group…"></textarea><button id="sendBtn" class="send"><i class="fas fa-paper-plane"></i></button></div>
    </section>
  </main>
</div>

<div id="createModal" class="modal hidden"><div class="card"><div class="cardHead"><h2>Create group</h2><button class="close" data-close="createModal">×</button></div><form id="createForm" class="form"><div class="notice">Choose at least one other person. The creator becomes the group owner.</div><div class="field"><label>Group name</label><input id="groupName" maxlength="100" required placeholder="e.g. Campus Fellowship"></div><div class="field"><label>Description</label><textarea id="groupDescription" maxlength="1000" placeholder="What is this group about?"></textarea></div><div class="field"><label>Avatar URL (optional)</label><input id="groupAvatar" type="url" placeholder="https://…"></div><div class="field"><label>Members</label><div id="friendPicker" class="members"></div></div><div class="formActions"><button type="button" class="secondary" data-close="createModal">Cancel</button><button class="primary" type="submit">Create group</button></div></form></div></div>

<div id="infoModal" class="modal hidden"><div class="card"><div class="cardHead"><h2 id="infoTitle">Group info</h2><button class="close" data-close="infoModal">×</button></div><div id="infoBody"></div></div></div>

<div id="moreModal" class="modal hidden"><div class="card"><div class="cardHead"><h2>Group options</h2><button class="close" data-close="moreModal">×</button></div><div class="section"><div class="setting"><span>Media and attachments</span><button class="switch" data-setting="allowMedia"></button></div><div class="setting"><span>Calls</span><button class="switch" data-setting="allowCalls"></button></div><div class="setting"><span>Reactions</span><button class="switch" data-setting="allowReactions"></button></div><div class="setting"><span>Replies</span><button class="switch" data-setting="allowReplies"></button></div></div><div class="section"><button id="leaveBtn" class="danger" style="width:100%">Leave group</button><button id="deleteBtn" class="danger" style="width:100%;margin-top:8px">Delete group for everyone</button></div></div></div>

<script>
(function(){
'use strict';
const state={session:null,friends:[],groups:[],current:null,messages:[],query:'',loading:false};
const $=id=>document.getElementById(id);
const apiBase=()=>{try{return typeof window.__getApiBase==='function'?window.__getApiBase():(window.API_BASE_URL||'') .replace(/\/$/,'')+'/api'}catch(_){return (window.API_BASE_URL||'').replace(/\/$/,'')+'/api'}};
function token(){return state.session?.token||localStorage.getItem('accessToken')||localStorage.getItem('token')||localStorage.getItem('authToken')||''}
function myId(){return String(state.session?.userId||state.session?.user?.id||localStorage.getItem('userId')||'')}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};const t=token();if(t)headers.Authorization='Bearer '+t;const r=await fetch(apiBase()+path,{...opts,headers});let d=null;try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d?.message||('Request failed ('+r.status+')'));return d}
function avatarText(x){return String(x?.name||x?.displayName||x?.username||x?.chatName||'G').trim().slice(0,1).toUpperCase()||'G'}
function avatarEl(x,cls='avatar'){const a=document.createElement('div');a.className=cls;if(x?.avatar){a.style.backgroundImage=`url(${JSON.stringify(x.avatar)})`;a.style.backgroundSize='cover';a.style.backgroundPosition='center';a.textContent=''}else a.textContent=avatarText(x);return a}
function send(type,payload={}){try{window.parent.postMessage({type,payload,source:'groups',timestamp:Date.now()},'*')}catch(_){} }
function show(id){$(id)?.classList.remove('hidden')}function hide(id){$(id)?.classList.add('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizeFriend(f){return {...f,id:f.id||f.userId,displayName:f.displayName||f.name||[f.firstName,f.lastName].filter(Boolean).join(' ')||f.username||('User '+(f.id||''))}}
function normalizeGroup(g){return g?.chat||g?.group||g}
function settings(g){return {allowMedia:true,allowCalls:true,allowReactions:true,allowReplies:true,allowEditing:true,allowDeleting:true,slowMode:0,requireAdminApproval:false,...(g?.settings||{})}}
function canManage(g){return String(g?.createdBy)===myId() || state.membershipRole==='admin'}
function currentRole(g){if(String(g?.createdBy)===myId())return 'owner';const p=(g?.participants||[]).find(x=>String(x.id||x.userId)===myId());return p?.role||'member'}
function renderGroups(){const box=$('groupList');box.innerHTML='';const q=state.query.trim().toLowerCase();const rows=state.groups.filter(g=>!q||String(g.name||'').toLowerCase().includes(q)||String(g.description||'').toLowerCase().includes(q));if(!rows.length){box.innerHTML='<div class="empty"><i class="fas fa-users"></i><h3>'+ (q?'No matching groups':'No groups yet') +'</h3><div>'+ (q?'Try another search.':'Create a group and start a private conversation with your people.') +'</div></div>';return}rows.forEach(g=>{const card=document.createElement('button');card.type='button';card.className='group-card';card.style.textAlign='left';card.style.width='100%';const av=avatarEl(g);const main=document.createElement('div');main.className='group-main';const n=document.createElement('div');n.className='group-name';n.textContent=g.name||'Unnamed group';const m=document.createElement('div');m.className='group-meta';m.textContent=(g.participantCount||g.participants?.length||0)+' members'+(g.description?' · '+g.description:'');main.append(n,m);card.append(av,main);card.addEventListener('click',()=>openGroup(g.id));box.append(card)})}
async function loadGroups(){if(state.loading)return;state.loading=true;try{const r=await api('/chats?limit=100');const rows=r?.data?.chats||r?.data||[];state.groups=rows.filter(g=>g.type==='group').map(normalizeGroup);renderGroups()}catch(e){console.error('[Groups] load failed',e);$('groupList').innerHTML='<div class="empty"><h3>Could not load groups</h3><div>'+esc(e.message)+'</div></div>'}finally{state.loading=false}}
function renderFriendPicker(){const box=$('friendPicker');box.innerHTML='';const list=state.friends.filter(f=>String(f.id)!==myId());if(!list.length){box.innerHTML='<div class="empty" style="padding:20px">Your friends list is not available yet. Refresh the page or add friends first.</div>';return}list.forEach(f=>{const row=document.createElement('label');row.className='memberPick';const cb=document.createElement('input');cb.type='checkbox';cb.value=f.id;const av=avatarEl(f);av.className='avatar';av.style.width='34px';av.style.height='34px';av.style.borderRadius='10px';const text=document.createElement('div');text.innerHTML='<b>'+esc(f.displayName)+'</b><small>@'+esc(f.username||'user')+'</small>';row.append(cb,av,text);box.append(row)})}
async function createGroup(e){e.preventDefault();const ids=[...document.querySelectorAll('#friendPicker input:checked')].map(x=>Number(x.value)).filter(Boolean);if(!ids.length){alert('Select at least one member.');return}const name=$('groupName').value.trim();if(!name)return;const btn=e.submitter;btn.disabled=true;try{const r=await api('/chats',{method:'POST',body:JSON.stringify({name,participantIds:ids,description:$('groupDescription').value.trim()||undefined,avatar:$('groupAvatar').value.trim()||undefined})});const g=normalizeGroup(r?.data?.chat||r?.data);if(g?.id){state.groups.unshift(g);renderGroups();hide('createModal');$('createForm').reset();await openGroup(g.id)}else throw new Error('Server did not return the created group')}catch(err){alert(err.message)}finally{btn.disabled=false}}
async function openGroup(id,scrollTo){try{const r=await api('/chats/'+encodeURIComponent(id));const g=normalizeGroup(r?.data?.chat||r?.data);if(!g)throw new Error('Group not found');state.current=g;state.membershipRole=currentRole(g);const mr=await api('/messages/'+encodeURIComponent(id)+'?limit=100');state.messages=mr?.data?.messages||mr?.data||[];show('conversation');$('chatName').textContent=g.name||'Group';$('chatSub').textContent=(g.participantCount||g.participants?.length||0)+' members';const av=$('chatAvatar');av.textContent=avatarText(g);av.style.backgroundImage=g.avatar?`url(${JSON.stringify(g.avatar)})`:'';renderMessages(scrollTo);send('GROUP_PANEL_OPEN',{...g,participantCount:g.participantCount||g.participants?.length||0})}catch(e){console.error('[Groups] open failed',e);alert(e.message)}}
function renderMessages(scrollTo){const box=$('messageList');box.innerHTML='';if(!state.messages.length){box.innerHTML='<div class="empty"><i class="fas fa-comments"></i><h3>No messages yet</h3><div>Start the conversation.</div></div>';return}state.messages.forEach(m=>{const row=document.createElement('div');const mine=String(m.senderId)===myId();row.className='bubble-row'+(mine?' mine':'');const b=document.createElement('div');b.className='bubble';if(!mine&&m.senderUsername){const s=document.createElement('div');s.className='sender';s.textContent=m.senderUsername;b.append(s)}const body=document.createElement('div');body.className='body';body.textContent=m.content||'';b.append(body);const t=document.createElement('div');t.className='time';t.textContent=new Date(m.createdAt||m.sentAt||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});b.append(t);row.append(b);box.append(row)});if(scrollTo){const el=[...box.querySelectorAll('.bubble')].find(x=>x.dataset.messageId===String(scrollTo));if(el)el.scrollIntoView({block:'center'})}box.scrollTop=box.scrollHeight}
async function sendMessage(){const input=$('composer');const content=input.value.trim();if(!content||!state.current)return;const localId='grp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);input.value='';try{const r=await api('/messages',{method:'POST',body:JSON.stringify({chatId:state.current.id,content,type:'text',clientMessageId:localId})});const m=r?.data?.message||r?.data;if(m){state.messages.push(m);renderMessages()}}catch(e){input.value=content;alert(e.message)}}
function memberRows(g){return (g.participants||[]).map(p=>{const row=document.createElement('div');row.className='memberRow';const av=avatarEl(p);av.className='avatar';av.style.width='36px';av.style.height='36px';av.style.borderRadius='10px';const who=document.createElement('div');who.className='who';const role=String(p.id)===String(g.createdBy)?'Owner':(p.role==='admin'?'Admin':'Member');who.innerHTML='<b>'+esc(p.displayName||p.username||'User')+'</b><span>@'+esc(p.username||'user')+' · '+role+'</span>';row.append(av,who);const pill=document.createElement('span');pill.className='pill';pill.textContent=role;row.append(pill);return row})}
function openInfo(){const g=state.current;if(!g)return;$('infoTitle').textContent=g.name||'Group info';const body=$('infoBody');body.innerHTML='';const s=document.createElement('div');s.className='section';s.innerHTML='<h3>About</h3><div style="font-size:13px">'+esc(g.description||'No description')+'</div><div style="font-size:11px;color:var(--muted);margin-top:7px">'+(g.participantCount||g.participants?.length||0)+' members · '+(canManage(g)?'You can manage this group':'Member')+'</div>';body.append(s);const ms=document.createElement('div');ms.className='section';const h=document.createElement('h3');h.textContent='Members';ms.append(h);memberRows(g).forEach(x=>ms.append(x));body.append(ms);if(canManage(g)){const act=document.createElement('div');act.className='section';act.innerHTML='<h3>Admin controls</h3><button id="editGroupBtn" class="secondary" style="width:100%">Edit group details</button>';body.append(act);setTimeout(()=>$('editGroupBtn')?.addEventListener('click',editGroup),0)}show('infoModal')}
async function editGroup(){const g=state.current;if(!g)return;const name=prompt('Group name',g.name||'');if(name===null)return;const description=prompt('Description',g.description||'');if(description===null)return;try{const r=await api('/chats/'+g.id,{method:'PATCH',body:JSON.stringify({name:name.trim(),description:description.trim()})});state.current=normalizeGroup(r?.data?.chat||r?.data)||{...g,name,description};hide('infoModal');await openGroup(g.id);await loadGroups()}catch(e){alert(e.message)}}
function openMore(){const g=state.current;if(!g)return;const s=settings(g);document.querySelectorAll('[data-setting]').forEach(btn=>{btn.classList.toggle('on',!!s[btn.dataset.setting]);btn.disabled=!canManage(g)});show('moreModal')}
async function updateSetting(key,value){const g=state.current;if(!g||!canManage(g))return;const next=settings(g);next[key]=value;try{await api('/chats/'+g.id,{method:'PATCH',body:JSON.stringify({settings:next})});state.current.settings=next;document.querySelector(`[data-setting="${key}"]`)?.classList.toggle('on',value)}catch(e){alert(e.message)}}
async function leaveGroup(){const g=state.current;if(!g)return;if(!confirm('Leave this group?'))return;try{await api('/chats/'+g.id+'/leave',{method:'POST'});send('GROUP_PANEL_CLOSE',{groupId:g.id});hide('moreModal');hide('conversation');await loadGroups()}catch(e){alert(e.message)}}
async function deleteGroup(){const g=state.current;if(!g||String(g.createdBy)!==myId()){alert('Only the group owner can delete the group.');return}if(!confirm('Delete this group for everyone? This cannot be undone.'))return;try{await api('/chats/'+g.id,{method:'DELETE'});send('GROUP_DELETED',{groupId:g.id});hide('moreModal');hide('conversation');await loadGroups()}catch(e){alert(e.message)}}
function closeConversation(){const id=state.current?.id;state.current=null;hide('conversation');send('GROUP_PANEL_CLOSE',{groupId:id||null})}
function requestCall(type){if(!state.current)return;send('INITIATE_CALL',{callType:type,groupId:state.current.id,group:state.current})}
function handleParentMessage(e){const d=e.data;if(!d||typeof d!=='object')return;const type=d.type;const p=d.payload||{};if(type==='SESSION_DATA'||type==='AUTH_READY'||type==='PARENT_READY'){state.session=p||state.session;return}if(type==='FRIENDS_LIST_UPDATE'||type==='FRIENDS_SYNC'||type==='FRIENDS_DATA'){const list=p.friends||d.friends||payloadFriends(d)||[];state.friends=list.map(normalizeFriend);renderFriendPicker();return}if(type==='OPEN_GROUP_BY_ID'){openGroup(p.groupId,p.scrollToMessageId);return}if(type==='OPEN_GROUP_MORE_MENU'){openMore();return}if(type==='PARENT_GROUP_CLOSE'){closeConversation();return}if(type==='PARENT_REFRESH_GROUPS'){loadGroups();return}if(type==='PARENT_GROUP_ACTION'&&p.action==='info'){openInfo();return}if(type==='PARENT_GROUP_CALL'){requestCall(p.type||'voice');return}if(type==='GROUP_CREATED'||type==='group:created'){const g=normalizeGroup(p);if(g?.id){state.groups=[g,...state.groups.filter(x=>String(x.id)!==String(g.id))];renderGroups()}return}if(type==='GROUP_MESSAGE'){if(String(p.groupId||p.chatId)!==String(state.current?.id))return;const m=p.message||p;if(m?.id&&!state.messages.some(x=>String(x.id)===String(m.id))){state.messages.push(m);renderMessages()}return}if(type==='GROUP_MEMBER_ADDED'||type==='GROUP_MEMBER_REMOVED'||type==='group:refresh_needed'||type==='group:localSync'){if(state.current?.id){openGroup(state.current.id)}else loadGroups();return}if(type==='GROUP_TYPING'){if(String(p.groupId)===String(state.current?.id))$('chatSub').textContent='Someone is typing…';}}
function payloadFriends(d){return d.payload?.friends||d.friends||[]}
function announceReady(){send('CHILD_READY',{module:'groups'});send('GROUP_READY',{module:'groups'})}
$('createGroupBtn').onclick=()=>{renderFriendPicker();show('createModal')};$('refreshBtn').onclick=loadGroups;$('groupSearch').oninput=e=>{state.query=e.target.value;renderGroups()};$('createForm').onsubmit=createGroup;$('chatBack').onclick=closeConversation;$('sendBtn').onclick=sendMessage;$('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('infoBtn').onclick=openInfo;$('callBtn').onclick=()=>requestCall('voice');$('videoBtn').onclick=()=>requestCall('video');$('leaveBtn').onclick=leaveGroup;$('deleteBtn').onclick=deleteGroup;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>updateSetting(b.dataset.setting,!b.classList.contains('on')));window.addEventListener('message',handleParentMessage);window.addEventListener('load',()=>{announceReady();setTimeout(loadGroups,250);setTimeout(()=>send('REQUEST_SESSION',{module:'groups'}),500)});window.addEventListener('beforeunload',()=>{if(state.current)send('GROUP_PANEL_CLOSE',{groupId:state.current.id})});
})();
</script>
</body>
