<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Groups</title>
<script src="/js/runtime-config.js"></script>
<script src="/js/config.js"></script>
<script src="/js/theme.engine.js"></script>
<script src="/js/group-call.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#2563eb;--danger:#dc2626}html[data-theme=dark]{--bg:#0f172a;--surface:#111827;--surface2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--border:#334155}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial}.hidden{display:none!important}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border)}.title{display:flex;gap:10px;align-items:center}.icon{width:38px;height:38px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center}.title h1{font-size:17px;margin:0}.title p{font-size:11px;color:var(--muted);margin:2px 0 0}.top button,.chatbar button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;width:38px;height:38px}.main{height:calc(100vh - 60px);position:relative}.list{height:100%;overflow:auto;padding:12px}.toolbar{display:flex;gap:7px;margin-bottom:10px}.search{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);outline:0}.group{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);text-align:left;margin-bottom:8px}.avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#dbeafe,#c4b5fd);display:grid;place-items:center;font-weight:800;color:#1e40af;flex:0 0 auto;background-size:cover;background-position:center}.groupmain{min-width:0;flex:1}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:var(--muted);padding:50px 20px}.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}.chatbar{display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface);border-bottom:1px solid var(--border)}.chatbar .back{background:transparent;border:0}.chatid{flex:1;min-width:0;display:flex;align-items:center;gap:8px}.chatid .avatar{width:40px;height:40px;border-radius:11px}.actions{display:flex;gap:5px}.actions button{width:35px;height:35px}.messages{flex:1;overflow:auto;padding:14px}.row{display:flex;margin:6px 0}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:9px 11px;border:1px solid var(--border);border-radius:15px;background:var(--surface);overflow-wrap:anywhere}.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary)}.sender{font-size:10px;font-weight:700;color:var(--primary);margin-bottom:3px}.mine .sender{color:#dbeafe}.time{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.composer{display:flex;gap:7px;padding:8px;background:var(--surface);border-top:1px solid var(--border)}textarea{flex:1;resize:none;min-height:42px;max-height:120px;padding:10px;border:1px solid var(--border);border-radius:13px;background:var(--surface2);color:var(--text);outline:0}.send{width:43px;border:0;border-radius:13px;background:var(--primary);color:#fff}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:10}.card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px}.head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:1}.head h2{margin:0;font-size:17px}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.section{padding:14px 16px;border-bottom:1px solid var(--border)}.section h3{font-size:13px;margin:0 0 9px}.member{display:flex;align-items:center;gap:8px;padding:7px 0}.member .avatar{width:35px;height:35px;border-radius:10px}.who{flex:1;min-width:0}.who b{display:block;font-size:13px}.who small{color:var(--muted);font-size:10px}.pill{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}.controls{display:flex;gap:5px;flex-wrap:wrap}.smallbtn{padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);font-size:11px}.danger{background:var(--danger);border-color:var(--danger);color:#fff}.setting{display:flex;align-items:center;justify-content:space-between;padding:7px 0}.switch{width:42px;height:24px;border:0;border-radius:20px;background:#94a3b8;position:relative}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.switch.on{background:var(--primary)}.switch.on:after{left:21px}.formrow{display:flex;gap:7px}.formrow input{flex:1;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text)}
</style>
</head>
<body>
<div class="top"><div class="title"><div class="icon">👥</div><div><h1>Groups</h1><p>Private group conversations</p></div></div><button id="newBtn">＋</button></div>
<div class="main"><section id="list" class="list"><div class="toolbar"><input id="search" class="search" placeholder="Search groups…"><button id="refresh">↻</button></div><div id="groups"></div></section>
<section id="chat" class="chat hidden"><div class="chatbar"><button id="back" class="back">←</button><div class="chatid"><div id="chatAvatar" class="avatar">G</div><div style="min-width:0"><div id="chatName" class="name">Group</div><div id="chatMeta" class="meta">0 members</div></div></div><div class="actions"><button id="voice">☎</button><button id="video">▣</button><button id="info">ⓘ</button></div></div><div id="messages" class="messages"></div><div class="composer"><textarea id="input" rows="1" placeholder="Message the group…"></textarea><button id="send" class="send">➤</button></div></section></div>
<div id="create" class="modal hidden"><div class="card"><div class="head"><h2>Create group</h2><button class="close" data-close="create">×</button></div><form id="createForm"><div class="section"><input id="gname" required maxlength="100" placeholder="Group name" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text)"><textarea id="gdesc" maxlength="1000" placeholder="Description" style="width:100%;margin-top:8px"></textarea></div><div class="section"><h3>Choose members</h3><div id="friends"></div></div><div class="section" style="text-align:right"><button type="submit" class="smallbtn">Create group</button></div></form></div></div>
<div id="infoModal" class="modal hidden"><div class="card"><div class="head"><h2 id="infoTitle">Group info</h2><button class="close" data-close="infoModal">×</button></div><div id="info"></div></div></div>
<div id="more" class="modal hidden"><div class="card"><div class="head"><h2>Group settings</h2><button class="close" data-close="more">×</button></div><div id="settings" class="section"></div><div class="section"><button id="leave" class="smallbtn danger" style="width:100%">Leave group</button><button id="del" class="smallbtn danger" style="width:100%;margin-top:7px">Delete group</button></div></div></div>
<script>
(()=>{
'use strict';
const S={session:null,friends:[],groups:[],current:null,messages:[],members:[],role:'member',loading:false,query:''};
const $=id=>document.getElementById(id);
// __getApiBase() already returns BACKEND_URL + /api. Do not append /api again;
// config.js also patches fetch/XHR for runtime backend routing.
const base=()=>{const b=typeof window.__getApiBase==='function'?window.__getApiBase():(window.API_BASE_URL||'');return String(b).replace(/\/$/,'')};
const token=()=>S.session?.token||S.session?.accessToken||localStorage.getItem('accessToken')||localStorage.getItem('token')||localStorage.getItem('authToken')||'';
const uid=()=>String(S.session?.userId||S.session?.user?.id||localStorage.getItem('userId')||'');
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};const t=token();if(t)h.Authorization='Bearer '+t;const r=await fetch(base()+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||`Request failed (${r.status})`);return d}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=(x,cls='avatar')=>{const a=document.createElement('div');a.className=cls;a.textContent=String(x?.name||x?.displayName||x?.username||'G').trim().slice(0,1).toUpperCase()||'G';if(x?.avatar){a.style.backgroundImage=`url(${JSON.stringify(x.avatar)})`;a.textContent=''}return a};
const group=x=>x?.chat||x?.group||x;
const send=(type,payload={})=>{try{parent.postMessage({type,payload,source:'groups',timestamp:Date.now()},'*')}catch{}};
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function role(){if(!S.current)return'member';if(String(S.current.createdBy)===uid())return'owner';return S.members.find(m=>String(m.id)===uid())?.role||S.role||'member'}
function manager(){return ['owner','admin'].includes(role())}
async function loadGroups(){if(S.loading)return;S.loading=true;try{const r=await api('/chats?limit=100');const rows=r?.data?.chats||r?.data||[];S.groups=rows.filter(x=>x.type==='group').map(group);renderGroups()}catch(e){console.error('[Groups]',e);$('groups').innerHTML=`<div class="empty">${esc(e.message)}</div>`}finally{S.loading=false}}
function renderGroups(){const box=$('groups');box.innerHTML='';const q=S.query.toLowerCase().trim();const rows=S.groups.filter(g=>!q||String(g.name||'').toLowerCase().includes(q)||String(g.description||'').toLowerCase().includes(q));if(!rows.length){box.innerHTML='<div class="empty">No groups found.</div>';return}rows.forEach(g=>{const b=document.createElement('button');b.className='group';const a=avatar(g);const m=document.createElement('div');m.className='groupmain';m.innerHTML=`<div class="name">${esc(g.name||'Unnamed group')}</div><div class="meta">${g.participantCount||g.participants?.length||0} members${g.description?' · '+esc(g.description):''}</div>`;b.append(a,m);b.onclick=()=>openGroup(g.id);box.append(b)})}
async function loadFriends(){if(S.friends.length){renderFriends();return}try{const r=await api('/friends?status=accepted');const rows=r?.data?.friends||r?.friends||r?.data||[];S.friends=rows.map(x=>x.friend||x.user||x);renderFriends()}catch(e){console.warn('[Groups] friend API unavailable',e.message);renderFriends()}}
function renderFriends(){const box=$('friends');box.innerHTML='';const list=S.friends.filter(f=>String(f.id||f.userId)!==uid());if(!list.length){box.innerHTML='<div class="empty" style="padding:20px">No friends available. You can add members later from group info.</div>';return}list.forEach(f=>{const id=f.id||f.userId;const row=document.createElement('label');row.className='member';row.innerHTML=`<input type="checkbox" value="${esc(id)}"><div style="display:flex;align-items:center;gap:8px;flex:1"><div class="avatar" style="width:35px;height:35px;border-radius:10px">${esc(String(f.displayName||f.name||f.username||'U').slice(0,1).toUpperCase())}</div><div class="who"><b>${esc(f.displayName||f.name||f.username||'User')}</b><small>@${esc(f.username||'user')}</small></div></div>`;box.append(row)})}
async function createGroup(e){e.preventDefault();const ids=[...document.querySelectorAll('#friends input:checked')].map(x=>Number(x.value)).filter(Number.isInteger);if(!ids.length)return alert('Select at least one member.');try{const r=await api('/chats',{method:'POST',body:JSON.stringify({type:'group',name:$('gname').value.trim(),description:$('gdesc').value.trim(),participantIds:ids})});const g=group(r?.data?.chat||r?.data);hide('create');if(g?.id){await loadGroups();await openGroup(g.id)}}catch(e){alert(e.message)}}
async function loadMembers(){if(!S.current)return;try{const r=await api(`/group-admin/${encodeURIComponent(S.current.id)}/members`);S.members=r?.data||[];S.role=role();}catch(e){console.error('[Groups] members',e);throw e}}
async function openGroup(id){try{const r=await api('/chats/'+encodeURIComponent(id));S.current=group(r?.data?.chat||r?.data);await loadMembers();const mr=await api('/messages/'+encodeURIComponent(id)+'?limit=100');S.messages=mr?.data?.messages||mr?.data||[];show('chat');$('chatName').textContent=S.current.name||'Group';$('chatMeta').textContent=`${S.members.length||S.current.participantCount||0} members`;const a=$('chatAvatar');a.textContent=String(S.current.name||'G').slice(0,1).toUpperCase();a.style.backgroundImage=S.current.avatar?`url(${JSON.stringify(S.current.avatar)})`:'';renderMessages();send('GROUP_PANEL_OPEN',{...S.current,participantCount:S.members.length})}catch(e){console.error('[Groups] open',e);alert(e.message)}}
function renderMessages(){const box=$('messages');box.innerHTML='';if(!S.messages.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}S.messages.forEach(m=>{const row=document.createElement('div');const mine=String(m.senderId||m.userId)===uid();row.className='row'+(mine?' mine':'');const b=document.createElement('div');b.className='bubble';if(!mine)b.innerHTML=`<div class="sender">${esc(m.senderUsername||m.sender?.username||m.sender?.displayName||'Member')}</div>`;let callMarker=null;try{callMarker=JSON.parse(m.content||'')}catch(_){}if(callMarker?.__groupCall&&callMarker.callId){const body=document.createElement('div');body.textContent='📞 Group call started';const join=document.createElement('button');join.className='smallbtn';join.style.marginTop='7px';join.textContent='Join call';join.onclick=()=>window.GroupCall?.join(callMarker.callId,callMarker.type);b.append(body,join)}else{const body=document.createElement('div');body.textContent=m.content||'';b.append(body)}const t=document.createElement('div');t.className='time';t.textContent=new Date(m.createdAt||m.sentAt||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});b.append(t);row.append(b);box.append(row)});box.scrollTop=box.scrollHeight}
async function sendMessage(){const text=$('input').value.trim();if(!text||!S.current)return;$('input').value='';try{const r=await api('/messages',{method:'POST',body:JSON.stringify({chatId:S.current.id,content:text,type:'text',clientMessageId:`grp_${Date.now()}`})});const m=r?.data?.message||r?.data;if(m){S.messages.push(m);renderMessages()}}catch(e){$('input').value=text;alert(e.message)}}
function memberView(m){const user=m.user||{};const row=document.createElement('div');row.className='member';const a=avatar({...user,displayName:user.displayName||[user.firstName,user.lastName].filter(Boolean).join(' ')||user.username});const who=document.createElement('div');who.className='who';who.innerHTML=`<b>${esc(user.displayName||[user.firstName,user.lastName].filter(Boolean).join(' ')||user.username||'User')}</b><small>@${esc(user.username||'user')}</small>`;const pill=document.createElement('span');pill.className='pill';pill.textContent=m.role;row.append(a,who,pill);if(manager()&&m.role!=='owner'&&String(m.id)!==uid()){const c=document.createElement('div');c.className='controls';const roleBtn=document.createElement('button');roleBtn.className='smallbtn';roleBtn.textContent=m.role==='admin'?'Demote':'Make admin';roleBtn.onclick=()=>changeRole(m.id,m.role==='admin'?'member':'admin');const mute=document.createElement('button');mute.className='smallbtn';mute.textContent=m.isMuted?'Unmute':'Mute';mute.onclick=()=>setMute(m.id,!m.isMuted);const rm=document.createElement('button');rm.className='smallbtn danger';rm.textContent='Remove';rm.onclick=()=>removeMember(m.id);c.append(roleBtn,mute,rm);row.append(c)}return row}
async function openInfo(){try{await loadMembers();const body=$('info');body.innerHTML='';const about=document.createElement('div');about.className='section';about.innerHTML=`<h3>About</h3><div>${esc(S.current.description||'No description')}</div><div class="meta" style="margin-top:6px">${S.members.length} members · ${esc(role())}</div>`;body.append(about);if(manager()){const add=document.createElement('div');add.className='section';add.innerHTML='<h3>Add member</h3><div class="formrow"><input id="addUserId" type="number" min="1" placeholder="User ID"><button id="addMember" class="smallbtn">Add</button></div>';body.append(add);setTimeout(()=>$('addMember').onclick=()=>addMember(Number($('addUserId').value)),0)}const ms=document.createElement('div');ms.className='section';const h=document.createElement('h3');h.textContent='Members';ms.append(h);S.members.forEach(m=>ms.append(memberView(m)));body.append(ms);if(manager()){const actions=document.createElement('div');actions.className='section';actions.innerHTML='<button id="settingsBtn" class="smallbtn" style="width:100%">Group settings</button>';body.append(actions);setTimeout(()=>$('settingsBtn').onclick=()=>{hide('infoModal');openMore()},0)}show('infoModal')}catch(e){alert(e.message)}}
async function addMember(id){if(!id)return alert('Enter a valid user ID.');try{await api(`/group-admin/${S.current.id}/members`,{method:'POST',body:JSON.stringify({userId:id})});await openInfo();await loadGroups()}catch(e){alert(e.message)}}
async function removeMember(id){if(!confirm('Remove this member?'))return;try{await api(`/group-admin/${S.current.id}/members/${id}`,{method:'DELETE'});await openInfo();await openGroup(S.current.id)}catch(e){alert(e.message)}}
async function changeRole(id,role){try{await api(`/group-admin/${S.current.id}/members/${id}/role`,{method:'PATCH',body:JSON.stringify({role})});await openInfo();await openGroup(S.current.id)}catch(e){alert(e.message)}}
async function setMute(id,muted){try{await api(`/group-admin/${S.current.id}/members/${id}/mute`,{method:'PATCH',body:JSON.stringify({muted})});await openInfo()}catch(e){alert(e.message)}}
const defaultSettings={allowMedia:true,allowCalls:true,allowReactions:true,allowReplies:true,allowEditing:true,allowDeleting:true,slowMode:0,requireAdminApproval:false};
function openMore(){if(!S.current)return;const cur={...defaultSettings,...(S.current.settings||{})};const box=$('settings');box.innerHTML='<h3>Permissions</h3>';['allowMedia','allowCalls','allowReactions','allowReplies','allowEditing','allowDeleting','requireAdminApproval'].forEach(k=>{const r=document.createElement('div');r.className='setting';const label=document.createElement('span');label.textContent=k.replace(/^allow/,'Allow ').replace(/([A-Z])/g,' $1').trim();const b=document.createElement('button');b.className='switch'+(cur[k]?' on':'');b.onclick=()=>saveSetting(k,!b.classList.contains('on'));r.append(label,b);box.append(r)});const slow=document.createElement('div');slow.className='setting';slow.innerHTML='<span>Slow mode (seconds)</span><input id="slowMode" type="number" min="0" max="3600" value="'+Number(cur.slowMode||0)+'" style="width:90px;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text)">';box.append(slow);if(!manager())box.innerHTML+='<div class="meta">Only owners and administrators can change group permissions.</div>';show('more')}
async function saveSetting(key,value){if(!manager())return;const next={...defaultSettings,...(S.current.settings||{}),[key]:value};if(key==='slowMode')next.slowMode=Number(value)||0;try{const r=await api(`/group-admin/${S.current.id}/settings`,{method:'PATCH',body:JSON.stringify({settings:next})});S.current.settings=r?.data?.settings||next;openMore()}catch(e){alert(e.message)}}
async function leave(){if(!S.current||!confirm('Leave this group?'))return;try{await api(`/chats/${S.current.id}/leave`,{method:'POST'});closeChat();loadGroups()}catch(e){alert(e.message)}}
async function del(){if(String(S.current?.createdBy)!==uid())return alert('Only the owner can delete the group.');if(!confirm('Delete this group for everyone?'))return;try{await api(`/chats/${S.current.id}`,{method:'DELETE'});closeChat();loadGroups()}catch(e){alert(e.message)}}
function closeChat(){const id=S.current?.id;S.current=null;hide('chat');send('GROUP_PANEL_CLOSE',{groupId:id||null})}
function call(type){if(!S.current)return;window.__GROUP_CALL_USER_ID=uid();if(window.GroupCall?.start){window.GroupCall.start(type,S.current).catch(e=>alert(e.message));return}send('INITIATE_CALL',{callType:type,groupId:S.current.id,group:S.current})}
function parentMessage(e){const d=e.data;if(!d||typeof d!=='object')return;const p=d.payload||{};if(['SESSION_DATA','AUTH_READY','PARENT_READY'].includes(d.type)){S.session=p||S.session;window.__GROUP_CALL_USER_ID=uid();return}if(['FRIENDS_LIST_UPDATE','FRIENDS_SYNC','FRIENDS_DATA'].includes(d.type)){S.friends=(p.friends||d.friends||[]);renderFriends();return}if(d.type==='OPEN_GROUP_BY_ID'){openGroup(p.groupId);return}if(d.type==='OPEN_GROUP_MORE_MENU'){openMore();return}if(d.type==='PARENT_GROUP_CLOSE'){closeChat();return}if(d.type==='PARENT_REFRESH_GROUPS'){loadGroups();return}if(d.type==='PARENT_GROUP_ACTION'&&p.action==='info'){openInfo();return}if(d.type==='PARENT_GROUP_CALL'){call(p.type||'voice');return}if(d.type==='GROUP_MESSAGE'){if(String(p.groupId||p.chatId)!==String(S.current?.id))return;const m=p.message||p;if(m?.id&&!S.messages.some(x=>String(x.id)===String(m.id))){S.messages.push(m);renderMessages()}}if(['GROUP_MEMBER_ADDED','GROUP_MEMBER_REMOVED','GROUP_ROLE_UPDATED','GROUP_MEMBER_MUTE_UPDATED','GROUP_SETTINGS_UPDATED','group:member:added','group:member:removed','group:role_update','group:mute','group:settings:updated'].includes(d.type)){if(S.current)openGroup(S.current.id);else loadGroups()}}
$('newBtn').onclick=async()=>{await loadFriends();show('create')};$('refresh').onclick=loadGroups;$('search').oninput=e=>{S.query=e.target.value;renderGroups()};$('createForm').onsubmit=createGroup;$('back').onclick=closeChat;$('send').onclick=sendMessage;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('info').onclick=openInfo;$('voice').onclick=()=>call('voice');$('video').onclick=()=>call('video');$('leave').onclick=leave;$('del').onclick=del;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));window.addEventListener('message',parentMessage);window.addEventListener('load',()=>{send('CHILD_READY',{module:'groups'});send('GROUP_READY',{module:'groups'});setTimeout(loadGroups,250);setTimeout(()=>send('REQUEST_SESSION',{module:'groups'}),500)});window.addEventListener('beforeunload',()=>{if(S.current)send('GROUP_PANEL_CLOSE',{groupId:S.current.id})});
})();
</script>
</body>
</html>
