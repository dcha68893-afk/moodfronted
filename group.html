// ── Parent-shell integration ────────────────────────────────────────────
// chat.html already has a fully working group header (name, back arrow,

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// FIX-ROOT-CAUSE (GROUP-SEND-STUCK-"SECURE MESSAGING IS STILL UNLOCKING"):
// this used to hand-roll its OWN copy of E2E bootstrap — reading the unlock
// password out of sessionStorage itself, calling KynectaE2E.init() itself,
// and polling `.enabled` on its own home-grown timer (bailing out after as
// little as ~3s if it happened to check before the password was written).
// js/e2e-session-init.js is the canonical bootstrap that message.html and
// chat.html already load for exactly this — it owns the password lookup,
// the init() call, and de-duping against a second load — and it explicitly
// documents group.html as one of the pages meant to load it. This page
// just never had the <script> tag for it, so every group send was racing
// this duplicate, weaker copy instead of the real thing, and lost more
// often than not. Now this only waits on the single shared readiness gate
// KynectaE2E already exposes for every caller (group, DM, anything else) —
// no separate init logic lives here anymore.
let e2eReadyPromise=null;
function e2eNotReadyMessage(){let pw=null;try{pw=sessionStorage.getItem('kyn_e2e_pw_session')}catch(_){}return pw?'Secure messaging is still unlocking. Please try again in a moment.':'Secure messaging is locked. Please sign in again to unlock it.'}

  if(window.KynectaE2E?.enabled)return true;
  if(e2eReadyPromise)return e2eReadyPromise;
  e2eReadyPromise=(async()=>{
    try{
      if(typeof window.KynectaE2E?.waitForEnabledBounded==='function')return await window.KynectaE2E.waitForEnabledBounded(8000);
      // js/e2e-session-init.js hasn't finished attaching the core yet (very
      // first tick of the page) — give it a moment to appear, then use the
      // same bounded gate everyone else uses. No password handling here:
      // that's e2e-session-init.js's job, and only its job.
      const until=Date.now()+3000;
      while(Date.now()<until&&typeof window.KynectaE2E?.waitForEnabledBounded!=='function')await sleep(150);
      if(typeof window.KynectaE2E?.waitForEnabledBounded==='function')return await window.KynectaE2E.waitForEnabledBounded(5000);

function groupMemberIds(g){const list=Array.isArray(g?.participants)?g.participants:[];return[...new Set(list.map(p=>Number((p.user||p).id??p.userId)).filter(n=>Number.isInteger(n)&&n>0))]}

async function decryptGroupContent(message){
  if(!message||typeof message.content!=='string'||!message.content)return message;
  const id=String(message.id||message.messageId||''); const cipher=message.content;

    if(!(await ensureE2EReady())||!window.KynectaGroupE2E?.decryptForGroup)throw new Error('Secure group messaging is not ready yet');
    const plain=await window.KynectaGroupE2E.decryptForGroup(Number(S.current?.id??message.chatId),cipher,groupMemberIds(S.current));

// FIX (LIVE GROUP MESSAGES NEVER APPEARED UNTIL THE 5s POLL): handleRealtime() below has been calling
// decryptGroupContent(message), but only decryptRows()/decryptGroupContent() exist — the group rebuild renamed
// it and missed this call site, so every live 'GROUP_MESSAGE' threw a ReferenceError and the message
// only showed up when the next poll happened to fetch it.

function mergeGroupMessages(incoming){
  const byId=new Map();
  // A local (optimistic) echo is replaced by the real server message carrying the same clientMessageId.
  const doneCids=new Set(incoming.map(m=>m&&(m.clientMessageId||m.metadata?.localId)).filter(Boolean).map(String));

function renderGroups(){const box=$('groups');if(!box)return;box.replaceChildren();const q=S.q.trim().toLowerCase();const rows=S.groups.filter(g=>!q||String(g.name||g.groupName||'').toLowerCase().includes(q));if(!rows.length){box.innerHTML='<div class="empty">No groups yet.</div>';return}for(const g of rows){const b=document.createElement('button');b.type='button';b.className='group'+(S.current&&String(S.current.id)===String(g.id)?' active':'');const a=document.createElement('div');a.className='avatar';a.textContent=String(g.name||g.groupName||'G').slice(0,1).toUpperCase();const m=document.createElement('div');m.className='groupmain';m.innerHTML=`<div class="name">${esc(g.name||g.groupName||'Unnamed group')}</div><div class="meta">${Number(g.participantCount??g.participants?.length??0)} members</div>`;b.append(a,m);const unread=Number(S.unread?.[String(g.id)]||0);if(unread>0){const badge=document.createElement('span');badge.className='unread-badge';badge.textContent=unread>99?'99+':String(unread);b.append(badge)}b.onclick=()=>openGroup(g.id);box.append(b)}}
// FIX (GROUPS-NO-OFFLINE-CACHE): js/core/groups/group-cache-first.js already
// existed in the repo (built for exactly this) but was never loaded on any
// page — a failed request used to always replace the whole list with a raw

// FIX (MSG-MENU-CLIPPED-AT-EDGES): this menu used to rely purely on CSS

// POST /messages is idempotent on clientMessageId server-side (the same route the 1:1 chat uses), so a
// transient failure (Render cold start / 502 / dropped connection) can be retried safely.
const isTransientErr=e=>/Failed to fetch|NetworkError|Load failed|network|timeout|timed out|\b50[234]\b|Bad Gateway|Service Unavailable|Gateway/i.test(String(e?.message||e));
async function apiRetry(path,opt,attempts=3){

    catch(e){last=e;if(!isTransientErr(e))throw e;if(i<attempts-1)await sleep(1500*(i+1))}

// Best-effort: top up any stragglers' key copies (if we hold the key) and
// reflect the result. Safe to call often — it's a no-op once everyone has

function groupObjectFor(groupId){return (S.current&&String(S.current.id)===String(groupId))?S.current:S.groups.find(g=>String(g.id)===String(groupId))||null}

// FIX (MEMBER'S MESSAGE APPEARS LATE / NOT AT ALL): sending used to do everything — E2E unlock, group-key
// lookup (network), encryption, POST /messages (network) — BEFORE the message showed anywhere, so on a
// slow backend the sender stared at an empty panel for seconds. Now the message is shown the instant
// it's sent (grey clock), then confirmed when the server answers, or marked "Not sent — Retry" if it
// really can't be delivered.
function makeOptimisticMessage(cid,plain,groupId){
  const me=Number(uid())||uid();
  return {id:'local:'+cid,localId:cid,clientMessageId:cid,chatId:groupId,senderId:me,userId:me,content:plain,type:'text',metadata:null,createdAt:new Date().toISOString(),status:'sending',_optimistic:true};
}
async function deliverOptimistic(cid,groupId,plain){
  try{
    if(!(await ensureE2EReady())||!window.KynectaGroupE2E?.encryptForGroup)throw new Error(e2eNotReadyMessage());
    const encrypted=await window.KynectaGroupE2E.encryptForGroup(groupId,plain,groupMemberIds(groupObjectFor(groupId)));
    const r=await apiRetry('/group-messages/'+encodeURIComponent(groupId)+'/messages',{method:'POST',body:JSON.stringify({chatId:groupId,content:encrypted,type:'text',clientMessageId:cid,metadata:{groupId}})});
    const serverMessage=r?.data?.message||r?.data;
    if(!serverMessage?.id)throw new Error('Server did not return the saved group message');
    // We know our own plaintext — remember it so this row never needs a decrypt round trip.
    groupMessageState.plaintext.set(String(serverMessage.id),plain);groupMessageState.lastCiphertext.set(String(serverMessage.id),encrypted);
    if(S.current&&String(S.current.id)===String(groupId)){
      S.messages=S.messages.filter(m=>!(m._optimistic&&m.localId===cid));
      mergeGroupMessages([{...serverMessage,clientMessageId:cid,content:plain,displayContent:plain}]);
      renderMessages(true);
      loadMessages(); // background reconcile, never blocks the UI
      checkKeyGap(groupId); // background: top up any stragglers now that we know we hold the key
    }
  }catch(error){
    const msg=String(error?.message||error);
    const provisioning=error?.code==='GROUP_KEY_PROVISIONING_PENDING'||
      error?.code==='GROUP_KEY_PROVISIONING_TIMEOUT'||
      /group encryption.*(waiting|synchronizing)|secure messaging is still unlocking|member key/i.test(msg);
    console.warn('[GroupMessage] send deferred',msg);
    const row=S.messages.find(m=>m._optimistic&&m.localId===cid);
    if(row){
      // FIX (group messages not going through): this used to show a fixed
      // "Waiting for group encryption keys…" label no matter what actually
      // went wrong, and re-queued every 5s forever with no way out except
      // leaving the tab open indefinitely. Now the real reason from the
      // server/E2E layer is shown, retries are capped, and once capped the
      // row becomes a normal "Not sent" with Retry/Discard like any other
      // failure — same UI, just reachable from this state too.
      row._error=msg;
      if(provisioning){
        row._waitingKeyTries=(row._waitingKeyTries||0)+1;
        if(row._waitingKeyTries>=6){
          row.status='failed';renderMessages(false);
        }else{
          row.status='waiting-key';renderMessages(false);
          clearTimeout(row._retryTimer);
          row._retryTimer=setTimeout(()=>{row._retryTimer=null;queueOptimisticSend(cid,groupId,plain)},5000);
        }
      }else{
        row.status='failed';renderMessages(false);
      }
    }
  }
}
function queueOptimisticSend(cid,groupId,plain){
  S._sendQueue=(S._sendQueue||Promise.resolve()).then(()=>deliverOptimistic(cid,groupId,plain)).catch(()=>{});
}
function retryOptimistic(cid){
  const row=S.messages.find(m=>m._optimistic&&m.localId===cid);if(!row||!S.current?.id)return;
  row.status='sending';row._waitingKeyTries=0;renderMessages(false);queueOptimisticSend(cid,Number(S.current.id),row.content);
}
async function sendMessage(){
  if(!S.current?.id)return;const input=$('input'),plain=input.value.trim();if(!plain)return;
  const groupId=Number(S.current.id),cid=makeGroupClientId();
  input.value='';$('mentionSuggest')?.classList.remove('open');
  S.messages.push(makeOptimisticMessage(cid,plain,groupId));renderMessages(true);

// FIX (GROUP-SEND-STALE-MEMBERS): S.current.participants is a one-time
// snapshot taken when the group panel was opened (loadGroups()/openGroup()),
// and nothing in this file ever refreshes it afterwards — there is no
// socket listener for GROUP_MEMBER_ADDED/REMOVED and the 5s poll interval
// (S.poll) only calls loadMessages(), never re-fetches the group's member
// list. So groupMemberIds(S.current), used to build the sender-key
// distribution, silently drifts out of sync the moment anyone joins or
// leaves the group after it was opened. The backend's rotateSenderKey()
// (src/services/groupMessagingService.js) checks the *live* membership on
// every request and rejects the key rotation as incomplete if any current
// member is missing a distribution — which is exactly the "Every current
// group member must receive this sender key before it can be used" error.
// Refetching the chat right before encrypting keeps the member list the
// client encrypts for in sync with what the backend will actually enforce.
async function refreshCurrentGroupMembers(gid){
  try{
    const r=await api('/chats/'+encodeURIComponent(gid));
    const fresh=unwrap(r?.data?.chat||r?.data);
    if(fresh&&Array.isArray(fresh.participants)&&S.current&&String(S.current.id)===String(gid)){
      S.current.participants=fresh.participants;
      S.current.participantCount=fresh.participantCount??fresh.participants.length;
      const idx=S.groups.findIndex(g=>String(g.id)===String(gid));
      if(idx!==-1)S.groups[idx]={...S.groups[idx],participants:fresh.participants,participantCount:S.current.participantCount};
    }
  }catch(_){/* offline or request failed — fall back to the cached member list */}
}
async function sendGroupPayload(plain,type='text',metadata=null){
  if(!S.current?.id)throw new Error('No group is open');const text=String(plain||'').trim();if(type==='text'&&!text)throw new Error('Message cannot be empty');
  if(!(await ensureE2EReady())||!window.KynectaGroupE2E?.encryptForGroup)throw new Error(e2eNotReadyMessage());
  const gid=Number(S.current.id),cid=makeGroupClientId();
  await refreshCurrentGroupMembers(gid);
  const encrypted=text?await window.KynectaGroupE2E.encryptForGroup(gid,text,groupMemberIds(S.current)):'';
  const r=await apiRetry('/group-messages/'+encodeURIComponent(groupId)+'/messages',{method:'POST',body:JSON.stringify({chatId:gid,content:encrypted,type,clientMessageId:cid,metadata:{...(metadata||{}),groupId:gid}})});
  const message=r?.data?.message||r?.data;if(!message?.id)throw new Error('Server did not return the saved group message');
  if(text){groupMessageState.plaintext.set(String(message.id),text);groupMessageState.lastCiphertext.set(String(message.id),encrypted)}
  mergeGroupMessages([{...message,clientMessageId:cid,content:text,displayContent:text}]);loadMessages();return message;
}
window.__NECPRA_GROUP_SEND=sendGroupPayload;

async function loadFriends(){try{const r=await api('/friends?status=accepted');const rows=r?.data?.friends||r?.friends||r?.data||[];S.friends=Array.isArray(rows)?rows.map(x=>x.friend||x.user||x):[];const box=$('friends');box.replaceChildren();for(const f of S.friends){const id=f.id||f.userId;if(String(id)===uid())continue;const row=document.createElement('label');row.className='member';row.innerHTML=`<input type="checkbox" value="${esc(id)}"><div class="who"><b>${esc(f.displayName||f.name||f.username||'User')}</b><small>@${esc(f.username||'user')}</small></div>`;box.append(row)}}catch(e){$('friends').innerHTML='<div class="empty">No friends available.</div>'}}
function showCreate(){loadFriends();$('create').classList.remove('hidden')}function hideCreate(){$('create').classList.add('hidden')}
async function createGroup(e){e.preventDefault();const ids=[...document.querySelectorAll('#friends input:checked')].map(x=>Number(x.value)).filter(Number.isInteger);if(!ids.length)return alert('Select at least one member.');try{const r=await api('/chats',{method:'POST',body:JSON.stringify({type:'group',name:$('gname').value.trim(),description:$('gdesc').value.trim(),participantIds:ids})});const g=unwrap(r?.data?.chat||r?.data);hideCreate();$('createForm').reset();await loadGroups();if(g?.id)openGroup(g.id)}catch(e){alert(e.message)}}

// ── Members / Info modal — wired to the parent header's Members/Info menu
// items, which previously called postToGroup('PARENT_GROUP_ACTION',
// {action:'members'|'info'}) into this iframe with nothing listening. ──
function showMembers(){const g=S.current;if(!g)return;$('membersTitle').textContent=(g.name||g.groupName||'Group')+' · Members';const list=Array.isArray(g.participants)?g.participants:[];const box=$('membersList');box.replaceChildren();if(!list.length){box.innerHTML=`<div class="empty">${Number(g.participantCount??0)} member(s).</div>`}else{for(const p of list){const u=p.user||p;const row=document.createElement('div');row.className='member';row.innerHTML=`<div class="who"><b>${esc(u.displayName||[u.firstName,u.lastName].filter(Boolean).join(' ')||u.username||'Member')}</b><small>@${esc(u.username||'member')}</small></div>`;box.append(row)}}$('membersModal').classList.remove('hidden')}
function hideMembers(){$('membersModal').classList.add('hidden')}

// ── Settings / Purpose modals — wired to the parent header's Settings and
// Purpose menu items, which previously just alerted "not available yet"
// because nothing in this iframe (or the parent) ever called the real
// backend for either. Both endpoints already exist and work:
//   PATCH /api/group-admin/:chatId/settings  { settings:{...} }  (admin/owner)
//   PATCH /api/chats/:chatId                 { description }    (owner only)
// "Theme" has no equivalent field anywhere in the Chat model or any group
// route — there is nothing real to wire it to, so it was removed from the
// parent's menu instead of being left as a second fake button. ──
const SETTINGS_TOGGLES=[['allowMedia','Allow photos/videos/files'],['allowReactions','Allow message reactions'],['allowReplies','Allow replying to messages'],['allowEditing','Allow editing sent messages'],['allowDeleting','Allow deleting sent messages'],['requireAdminApproval','New members need admin approval']];
function showSettings(){const g=S.current;if(!g)return;const s=g.settings||{};const box=$('settingsBody');box.replaceChildren();for(const[key,label]of SETTINGS_TOGGLES){const row=document.createElement('label');row.className='member';row.innerHTML=`<input type="checkbox" data-setting="${key}" ${s[key]!==false?'checked':''}><div class="who"><b>${esc(label)}</b></div>`;box.append(row)}
  const slow=document.createElement('div');slow.className='member';slow.innerHTML=`<div class="who"><b>Slow mode (seconds between messages, 0 = off)</b><input type="number" id="settingSlowMode" min="0" max="3600" value="${Number(s.slowMode||0)}" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:inherit"></div>`;box.append(slow);
  $('settingsModal').classList.remove('hidden')}
function hideSettings(){$('settingsModal').classList.add('hidden')}
async function saveSettings(){const g=S.current;if(!g?.id)return;const settings={};for(const[key]of SETTINGS_TOGGLES){const cb=document.querySelector(`#settingsBody input[data-setting="${key}"]`);settings[key]=!!cb?.checked}const slowEl=$('settingSlowMode');settings.slowMode=Math.max(0,Number(slowEl?.value||0)||0);try{const r=await api(`/group-admin/${encodeURIComponent(g.id)}/settings`,{method:'PATCH',body:JSON.stringify({settings})});g.settings=r?.data?.settings||settings;hideSettings()}catch(e){alert(e.message||'Could not update group settings')}}
function showPurpose(){const g=S.current;if(!g)return;$('purposeInput').value=g.description||'';$('purposeModal').classList.remove('hidden')}
function hidePurpose(){$('purposeModal').classList.add('hidden')}
async function savePurpose(){const g=S.current;if(!g?.id)return;const description=$('purposeInput').value.trim();try{const r=await api(`/chats/${encodeURIComponent(g.id)}`,{method:'PATCH',body:JSON.stringify({description})});g.description=r?.data?.chat?.description??description;hidePurpose()}catch(e){alert(e.message||'Could not update group purpose')}}
$('settingsClose')?.addEventListener('click',hideSettings);
$('settingsSave')?.addEventListener('click',saveSettings);
$('purposeClose')?.addEventListener('click',hidePurpose);
$('purposeSave')?.addEventListener('click',savePurpose);

// ── Unread tracking ──────────────────────────────────────────────────────
// Persisted so a badge still shows after a reload/relaunch, not just for
// the lifetime of this tab. Kept keyed by group id, count only (no message
// bodies) — enough to render "N new" without duplicating message storage.
const UNREAD_KEY='kyn_group_unread_v1';
function loadUnread(){try{S.unread=JSON.parse(localStorage.getItem(UNREAD_KEY)||'{}')||{}}catch(_){S.unread={}}}
function saveUnread(){try{localStorage.setItem(UNREAD_KEY,JSON.stringify(S.unread))}catch(_){}}
function bumpUnread(groupId){const k=String(groupId);S.unread[k]=(Number(S.unread[k])||0)+1;saveUnread();renderGroups()}
function markRead(groupId){const k=String(groupId);if(!S.unread[k])return;delete S.unread[k];saveUnread();renderGroups()}

// FIX (MESSAGE-LOST-WHEN-GROUP-CLOSED): this used to bail out entirely
// (`if(!S.current||...)return`) unless the incoming message belonged to
// whichever group happened to be open right now — so a message that
// arrived while the recipient was anywhere else (the group list, another
// tab, no group open at all) was thrown away outright: not shown when
// they later opened that group (nothing here ever re-fetched or cached
// it) and never surfaced as a badge either. It also only recognised the
// legacy 'group:message' postMessage type — the parent shell's real-time
// bridge (chat.html's "GROUP REAL-TIME BRIDGE") actually forwards the
// server's socket event as 'GROUP_MESSAGE', which nothing here listened
// for, so live delivery silently never fired at all, in OR out of the
// conversation; the only thing making messages ever show up was the
// 5-second poll while a group happened to be open. Now: a message for
// the OPEN group still renders immediately (unchanged); a message for
// ANY OTHER group increments that group's unread badge instead of being
// discarded, and loadMessages() (already called by openGroup()) picks up
// the real content the next time that group is opened.
function handleRealtime(ev){
    const early=ev?.detail||ev||{};
    if(early.message?.pending){if(!S.messages.some(m=>String(m.localId||'')===String(early.message.localId||''))){S.messages.push(early.message);renderMessages(true);}return;}
    const d=ev?.detail||ev||{};
    const groupId=d.groupId??d.message?.groupId??d.payload?.groupId??d.payload?.message?.groupId;
    const message=d.message??d.payload?.message??d.payload;
    if(groupId==null||!message?.id)return;
    if(S.current&&String(groupId)===String(S.current.id)){
        const exists=S.messages.some(m=>String(m.id||m.messageId)===String(message.id));
        if(!exists){decryptGroupContent(message).then(dm=>{
            if(!S.current||String(groupId)!==String(S.current.id))return;
            // mergeGroupMessages de-duplicates by id / clientMessageId, replaces our own local echo and keeps
            // a consistent order (a bare sort by Number(id) breaks once local rows are present).
            mergeGroupMessages([dm]);const box=$('messages');if(box)box.scrollTop=box.scrollHeight;
        })}
        markRead(groupId);
        return;
    }
    // Don't badge your own message back at you just because this tab
    // happens to be looking at a different group right now.
    if(String(message.senderId||message.userId||'')===uid())return;
    bumpUnread(groupId);
}

function toggleSubbar(id,onOpen){const box=$(id);const willOpen=box.classList.contains('hidden');closeSubbars();if(willOpen){box.classList.remove('hidden');onOpen&&onOpen()}}
$('searchToggle')?.addEventListener('click',()=>toggleSubbar('searchBar',()=>$('searchInput').focus()));

$('mediaToggle')?.addEventListener('click',()=>toggleSubbar('mediaBar',renderMedia));
window.addEventListener('kyn:group:message',handleRealtime);
window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='group:message'||d.type==='GROUP_MESSAGE'){handleRealtime({detail:d});return}
  // Parent's own back arrow (#hdrGroupBack) posts this instead of touching
  // our DOM directly — same contract message.html's compose panel already
  // answers to for 1:1 chats.
  if(d.type==='PARENT_GROUP_CLOSE'||d.type==='GO_BACK_TO_LIST'){closeGroup();return}
  if(d.type==='PARENT_REFRESH_GROUPS'){loadGroups();return}
  if(d.type==='OPEN_GROUP_BY_ID'){const gid=d.payload&&d.payload.groupId;if(!gid)return;if(S.groups.length)openGroup(gid);else loadGroups().then(()=>openGroup(gid));return}
  if(d.type==='PARENT_GROUP_ACTION'){const action=d.payload&&d.payload.action;if(action==='members'||action==='info')showMembers();else if(action==='settings')showSettings();else if(action==='purpose')showPurpose();return}
});
window.__GROUP_LOAD_GROUPS=loadGroups;window.__GROUP_REFRESH_MESSAGES=loadMessages;loadUnread();loadGroups();
})();
