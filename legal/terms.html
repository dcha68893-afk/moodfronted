<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms of Service — Necpa</title>
<meta name="description" content="Necpa Terms of Service — the rules for using Necpa.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --bg:#0f1115; --card:#171a21; --text:#e8eaed; --text-light:#9aa0a6; --accent:#6c8cff; --border:#262a33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  a { color: var(--accent); }
  .top-link { display:inline-flex; align-items:center; gap:8px; color:var(--text-light); text-decoration:none; font-size:14px; margin-bottom:24px; }
  .top-link:hover { color:var(--text); }
  h1 { font-size: 28px; display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .updated { color: var(--text-light); font-size: 14px; margin-bottom: 32px; }
  h4 { margin-top: 28px; margin-bottom: 8px; font-size: 16px; }
  p, li { color: var(--text); }
  ul { padding-left: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="top-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Necpa</a>
    <h1><i class="fas fa-file-contract"></i> Terms of Service</h1>
    <div class="updated">Effective: January 2026</div>
    <div class="card" id="legalBody">Loading…</div>
  </div>

  <script src="../js/legal-content.js"></script>
  <script>
    document.getElementById('legalBody').innerHTML = window.LegalContent.terms.html();
    document.getElementById('legalBody').addEventListener('change', function (e) {
      if (e.target && e.target.type === 'checkbox' && e.target.id) {
        try { localStorage.setItem(e.target.id, e.target.checked); } catch (err) {}
      }
    });
  </script>
</body>
</html>
