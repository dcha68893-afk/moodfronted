<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Call</title>
<!--
  FIX-CALL-LINK-SECURITY (landing page): this is the page a real call link
  (POST /api/calls/link's joinPath) points to. Its only job is: figure out if
  the person is logged in, then hand the link's token off to chat.html, which
  already owns the real socket connection and the calls module. It does not
  try to run its own WebRTC/socket stack — duplicating that here would be
  exactly the kind of parallel implementation this codebase already has too
  much of (see calls-core.part*.js vs js/core/calls/*.js).
-->
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f0f1a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .box { text-align:center; padding:32px; }
  .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.2); border-top-color:#667eea;
             border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { color:#9ca3af; font-size:14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="status">Checking your call link…</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var statusEl = document.getElementById('status');

      if (!token) {
        statusEl.textContent = 'This call link is missing or invalid.';
        return;
      }

      var authToken = localStorage.getItem('authToken') || localStorage.getItem('token');
      if (!authToken) {
        // Not logged in — remember the token, send them to sign in first,
        // then chat.html will pick it up from here after login.
        try { localStorage.setItem('pendingJoinCallToken', token); } catch (_) {}
        statusEl.textContent = 'Please sign in to join this call…';
        setTimeout(function () { window.location.href = 'auth.html'; }, 600);
        return;
      }

      statusEl.textContent = 'Opening call…';
      window.location.href = 'chat.html?joinCallToken=' + encodeURIComponent(token);
    })();
  </script>
</body>
</html>
