<!doctype html><html lang="en"><head><script src="/session-restore.js"></script><script src="/app-protect.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Necpra Games</title><script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--kyn-bg-root);color:var(--kyn-text-primary)}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="games" src="game-v3.html" title="Necpra Games"></iframe><script>
// FIX (NAV BAR STILL VISIBLE INSIDE A GAME, cont'd): relay the arcade's own
// GAMES_PANEL_OPENED/CLOSED notice (see game-v3.html's notifyGamesPanel()) up
// to chat.html. This file sits between them (chat.html -> this file's iframe
// -> game-v3.html's iframe), and postMessage only ever reaches the immediate
// parent, so without this relay chat.html never saw the message at all.
window.addEventListener('message',function(ev){
  var d=ev.data;
  if(d&&(d.type==='GAMES_PANEL_OPENED'||d.type==='GAMES_PANEL_CLOSED'||d.type==='mood:close-games'||d.action==='close-game')){
    try{parent.postMessage(d,'*')}catch(e){}
    return;
  }
  // Downward leg of the same relay: chat.html's hardware-back handler sends
  // GO_BACK_TO_LIST to #gamesIframe (this window); forward it into the actual
  // arcade iframe, which knows how to return to its home screen.
  if(d&&d.type==='GO_BACK_TO_LIST'){
    var f=document.getElementById('games');
    try{f&&f.contentWindow&&f.contentWindow.postMessage(d,'*')}catch(e){}
  }
});
</script><script>
// FIX (GAMES-HARDCODED-THEME, cont'd): this used to manually read computed
// --kyn-* values off the PARENT page on every load and push them into the
// nested game-v3.html iframe as inline styles — a "foreground/background"
// bridge that only ran once at load, plus a second bridge script
// (games-theme-bridge.js) injected into that iframe to apply them. game-
// v3.html now loads theme.engine.js and settings-broadcast-listener.js
// directly and tracks the live saved theme itself the same way every other
// module does, so neither bridge is needed any more — this file now only
// does the one thing left that has to happen from here: injecting the
// gameplay-enhancement scripts once the arcade document exists.
(function(){'use strict';var f=document.getElementById('games');f.addEventListener('load',function(){var d=f.contentDocument;if(!d)return;var files=[['mood-v4-loader','/games-v4-enhancements.js?v=4.4'],['mood-crossword-v4','/games-crossword-v4.js?v=8.2'],['mood-arcade-v5','/games-commercial-v5.js?v=5.4']];files.forEach(function(x){if(!d.getElementById(x[0])){var s=d.createElement('script');s.id=x[0];s.src=x[1];s.async=false;d.body.appendChild(s)}})})})();
</script><div id="gamesFallback" hidden style="position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--kyn-bg-root,#0b1220);color:var(--kyn-text-primary,#e5e7eb);font-family:system-ui,sans-serif"><div><div style="font-size:42px">&#127918;</div><h2 style="margin:8px 0">Games are not ready yet</h2><p style="opacity:.8;max-width:20rem;margin:0 auto 16px;line-height:1.5">Connect to the internet once so the games can be saved on your device. After that they open offline.</p><button id="gamesRetry" style="padding:12px 28px;border:0;border-radius:999px;background:#2563eb;color:#fff;font-size:16px">Try again</button></div></div>
<script>
// FIX (GAMES SCREEN EMPTY): if the arcade document (game-v3.html) does not come up - not cached yet, a script failed, or
// the frame was answered with an offline/fallback page - the user used to be left on a blank screen. This watchdog
// checks that the arcade home really rendered, retries the frame twice, then shows a clear message with a Retry button.
// It also retries automatically the moment the device comes back online.
(function(){'use strict';
var f=document.getElementById('games'),fb=document.getElementById('gamesFallback'),btn=document.getElementById('gamesRetry'),tries=0,timer=null;
function rendered(){try{var d=f.contentDocument;if(!d)return true;return !!(d.getElementById('home')&&d.querySelectorAll('#home .card').length);}catch(e){return true;}}
function show(on){if(on){fb.hidden=false;fb.style.display='flex';}else{fb.hidden=true;fb.style.display='none';}}
function reload(){show(false);try{f.contentWindow.location.reload();}catch(e){f.src='game-v3.html';}}
function check(){clearTimeout(timer);if(rendered()){show(false);return;}if(tries<2){tries++;reload();timer=setTimeout(check,4000);}else{show(true);}}
f.addEventListener('load',function(){clearTimeout(timer);timer=setTimeout(check,1500);});
timer=setTimeout(check,8000);
window.addEventListener('online',function(){if(!rendered()){tries=0;reload();clearTimeout(timer);timer=setTimeout(check,4000);}});
btn.addEventListener('click',function(){tries=0;reload();clearTimeout(timer);timer=setTimeout(check,4000);});
})();
</script>
<script src="/js/voice/necpra-voice-engine.js"></script><script src="/js/voice/necpra-voice-ui.js"></script><script src="/js/voice/necpra-voice-intents.js"></script><script src="/js/voice/necpra-voice-bridge.js"></script><script src="/js/voice/necpra-voice-remote.js"></script><script src="/js/voice/necpra-voice-init.js"></script><script src="/js/voice/necpra-voice-games.js"></script><script>try{NecpraVoiceInit.start({fab:false});NecpraVoiceGames.init()}catch(e){console.error('[voice]',e)}</script><script src="back-nav.js"></script><script src="report-problem.js" defer></script></body></html>
