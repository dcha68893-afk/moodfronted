<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Necpra Games</title><script src="/js/runtime-config.js"></script><script src="/js/config.js"></script><script src="/js/theme.engine.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--kyn-bg-root,#fff);color:var(--kyn-text-primary,#111)}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="games" src="game-v3.html" title="Necpra Games"></iframe><script>
// FIX (GAMES-HARDCODED-THEME, cont'd): this used to manually read computed
// --kyn-* values off the PARENT page on every load and push them into the
// nested game-v3.html iframe as inline styles — a "foreground/background"
// bridge that only ran once at load, plus a second bridge script
// (games-theme-bridge.js) injected into that iframe to apply them. game-
// v3.html now loads theme.engine.js and settings-broadcast-listener.js
// directly and tracks the live saved theme itself the same way every other
// module does, so neither bridge is needed any more — this file now only
// does the one thing left that has to happen from here: injecting the
// gameplay-enhancement scripts once the arcade document exists.
(function(){'use strict';var f=document.getElementById('games');f.addEventListener('load',function(){var d=f.contentDocument;if(!d)return;var files=[['mood-v4-loader','/games-v4-enhancements.js?v=4.3'],['mood-gameplay-fix','/games-v4-gameplay-fix.js?v=4.3'],['mood-crossword-v4','/games-crossword-v4.js?v=4.3'],['mood-arcade-v5','/games-commercial-v5.js?v=5.1']];files.forEach(function(x){if(!d.getElementById(x[0])){var s=d.createElement('script');s.id=x[0];s.src=x[1];s.async=false;d.body.appendChild(s)}})})})();
</script></body></html>
